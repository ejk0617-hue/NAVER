/* =========================================================================
   라이브 현황 — 라이브 매출 데이터를 엑셀로 불러와서, 브랜드별로
   날짜별·요일별·시간별·쇼호스트별 매출 추이를 그래프로 보여준다.
   ========================================================================= */
let liveImportModalOpen = false;
let liveImportRows = null; // [{date, weekday, time, brand, host, content, sales}]
let liveImportMapping = {}; // { 원본브랜드명: 우리브랜드명 }
function openLiveImportModal(){ liveImportModalOpen = true; liveImportRows = null; liveImportMapping = {}; render(); }
function closeLiveImportModal(){ liveImportModalOpen = false; render(); }
/* 엑셀에서 읽은 행이든, 구글시트에서 읽은 행이든(둘 다 "헤더이름: 값" 형태의 객체 배열) 똑같은 방식으로
   열을 자동 인식하고 정리한다. 채널이 "네이버"가 아닌 행은 걸러낸다. */
function parseLiveRows(rows){
  if(!rows || rows.length===0) return [];
  const headers = Object.keys(rows[0]);
  const dateCol = headers.find(h=>/날짜/.test(h)) || headers[0];
  const weekdayCol = headers.find(h=>/요일/.test(h)) || '';
  const timeCol = headers.find(h=>/시간/.test(h)) || '';
  const channelCol = headers.find(h=>/채널/.test(h)) || '';
  const brandCol = headers.find(h=>/브랜드/.test(h)) || '';
  const hostCol = headers.find(h=>/쇼호스트|호스트/.test(h)) || '';
  const contentCol = headers.find(h=>/행사내용|내용/.test(h)) || '';
  const salesCol = headers.find(h=>h==='라이브매출') || headers.find(h=>/라이브\s*매출/.test(h)) || headers.find(h=>/매출/.test(h)) || '';

  return rows.map(r=>{
    if(channelCol){
      const channel = String(r[channelCol]||'').trim();
      if(channel && !channel.includes('네이버')) return null;
    }
    const date = normalizeExcelDateToYMD(r[dateCol]) || String(r[dateCol]||'').trim();
    const brand = String(r[brandCol]||'').trim();
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date) || !brand) return null;
    return {
      date,
      weekday: weekdayCol ? String(r[weekdayCol]||'').trim() : '',
      time: timeCol ? String(r[timeCol]||'').trim() : '',
      brand,
      host: hostCol ? String(r[hostCol]||'').trim() : '',
      content: contentCol ? String(r[contentCol]||'').trim() : '',
      sales: Number(sanitizePromoNumber(String(r[salesCol]||'0')))||0,
    };
  }).filter(Boolean);
}
function applyParsedLiveRows(parsed){
  if(parsed.length===0){ alert('"날짜 · 브랜드 · 라이브매출" 형태의 데이터를 찾지 못했어요. 시트/파일 구조를 확인해주세요.'); return; }
  liveImportRows = parsed;
  const promo = ensurePromotion();
  const uniqueBrands = Array.from(new Set(parsed.map(r=>r.brand)));
  liveImportMapping = {};
  uniqueBrands.forEach(b=>{ liveImportMapping[b] = guessBrandMatch(b, promo.brands); });
  liveImportModalOpen = true;
  render();
}
async function handleLiveImportFile(){
  const fileInput = document.getElementById('liveImportFile');
  const file = fileInput && fileInput.files[0];
  if(!file) return;
  if(typeof XLSX === 'undefined'){ alert('엑셀 처리 기능을 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침 후 다시 시도해주세요.'); return; }
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array', cellDates:false});
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rawRows = XLSX.utils.sheet_to_json(ws, {defval:''});
    if(rawRows.length===0){ alert('엑셀에서 데이터를 찾지 못했어요.'); return; }
    applyParsedLiveRows(parseLiveRows(rawRows));
  }catch(e){
    console.error(e);
    alert('엑셀 파일을 읽는 중 문제가 생겼어요. 파일 형식을 확인해주세요.');
  }
}
function updateLiveImportMapping(brandName, mapped){
  liveImportMapping[brandName] = mapped;
  render();
}
function runLiveImport(){
  if(!liveImportRows) return;
  const unmapped = Object.keys(liveImportMapping).filter(b=>!liveImportMapping[b]);
  if(unmapped.length>0){
    if(!confirm(`"${unmapped.join('", "')}" 브랜드는 매칭이 안 됐어요.\n이 브랜드들은 건너뛰고 나머지만 가져올까요?`)) return;
  }
  const live = ensureLive();
  let importedCount = 0, skippedCount = 0;
  liveImportRows.forEach(r=>{
    const brand = liveImportMapping[r.brand];
    if(!brand){ skippedCount++; return; }
    // 같은 날짜·시간·브랜드·호스트면 같은 라이브로 보고 다시 불러올 때 덮어쓴다(중복 방지)
    const key = `${r.date}_${r.time}_${brand}_${r.host}`;
    let entry = live.performance.find(p=>p._importKey===key);
    if(!entry){
      live.performance.push({id:uid(), _importKey:key, date:r.date, weekday:r.weekday, time:r.time, brand, host:r.host, content:r.content, sales:r.sales, products:[{name:'',price:''},{name:'',price:''},{name:'',price:''}]});
    } else {
      entry.weekday = r.weekday; entry.time = r.time; entry.host = r.host; entry.content = r.content; entry.sales = r.sales;
    }
    importedCount++;
  });
  saveState();
  liveImportModalOpen = false;
  liveImportRows = null;
  render();
  alert(`${importedCount.toLocaleString('ko-KR')}건을 라이브 현황에 반영했어요.${skippedCount>0 ? `\n(브랜드 매칭이 안 된 ${skippedCount}건은 건너뛰었어요)` : ''}`);
}
function updateLivePerfTopProduct(id, idx, field, value){
  const live = ensureLive();
  const row = live.performance.find(p=>p.id===id);
  if(!row) return;
  if(!Array.isArray(row.products) || row.products.length!==3) row.products = [{name:'',price:''},{name:'',price:''},{name:'',price:''}];
  row.products[idx][field] = field==='price' ? sanitizePromoNumber(value) : value;
  saveState(); render();
}
function updateLiveSalesSheetUrl(value){
  ensureLive().liveSalesSheetUrl = value.trim();
  saveState();
}
async function fetchFromLiveSheet(btnEl){
  const url = (ensureLive().liveSalesSheetUrl||'').trim();
  if(!url){ alert('먼저 구글시트 웹앱 주소를 입력해주세요.'); return; }
  const label = btnEl ? btnEl.textContent : '';
  if(btnEl){ btnEl.textContent = '불러오는 중...'; btnEl.disabled = true; }
  try{
    const res = await fetch(url, {method:'GET'});
    const text = await res.text();
    let parsed = null;
    try{ parsed = JSON.parse(text); }catch(e){}
    if(!parsed || !parsed.ok){
      alert('시트에서 데이터를 가져오지 못했어요.\n' + (parsed && parsed.error ? parsed.error : ('응답 이상: ' + text.slice(0,200))));
      return;
    }
    const rawRows = parsed.rows || [];
    if(rawRows.length===0){ alert('시트에서 데이터를 찾지 못했어요.'); return; }
    applyParsedLiveRows(parseLiveRows(rawRows));
  }catch(e){
    console.error('구글시트 불러오기 실패:', e);
    alert('구글시트에 연결하지 못했어요. 웹앱 주소가 맞는지, 배포가 되어있는지 확인해주세요.');
  }finally{
    if(btnEl){ btnEl.textContent = label; btnEl.disabled = false; }
  }
}

  try {
    var ss = SpreadsheetApp.openById('1Efl0QQrprZf6oq9ZpYTDUdWggdmQnuIKMynFGisEFks');
    var targetGid = 1441717827; // "네이버만" 탭의 gid — 실제로 보시는 탭과 다르면 이 숫자만 바꿔주세요

    var headerRowIdx = -1;

      var rowHasDate = values[i].some(function(c){ return String(c).trim() === '날짜'; });
      var rowHasBrand = values[i].some(function(c){ return String(c).trim() === '브랜드'; });
      if (rowHasDate || rowHasBrand) { headerRowIdx = i; break; }
    }
    if (headerRowIdx === -1) headerRowIdx = 0; // 못 찾으면 예전처럼 1행을 그대로 사용

    var headers = values[headerRowIdx];
    var tz = ss.getSpreadsheetTimeZone(); // 날짜를 "그 시트가 쓰는 시간대" 기준으로 정확히 변환하기 위함
    var rows = values.slice(headerRowIdx + 1).map(function(row){
      var obj = {};
      headers.forEach(function(h, i){
        if (!h) return;
        var v = row[i];
        // 날짜 칸을 getFullYear()/getMonth()/getDate()로 직접 꺼내면, 이 스크립트가 실행되는 시간대와
        // 시트의 시간대가 다를 때 하루가 밀리는 문제가 생긴다. 그래서 시트 자체의 시간대를 명시해서 변환한다.
        if (v instanceof Date) {
          v = Utilities.formatDate(v, tz, 'yyyy-MM-dd');
        }
        obj[h] = v;
      });
      return obj;
    }).filter(function(obj){ return Object.keys(obj).length > 0; });
    return ContentService.createTextOutput(JSON.stringify({ok:true, rows:rows}))
      .setMimeType(ContentService.MimeType.JSON);
  } catch (err) {
    return ContentService.createTextOutput(JSON.stringify({ok:false, error:String(err)}))
      .setMimeType(ContentService.MimeType.JSON);
  }
}</pre>

      </details>
    </div>
  `;
}

    start: liveImportRows.reduce((m,r)=>r.date<m?r.date:m, liveImportRows[0].date),

function liveProductPriceChart(rows){
  const sorted = rows.slice().sort((a,b)=> a.date.localeCompare(b.date) || (a.time||'').localeCompare(b.time||''));
  const labels = sorted.map(r=> r.date.slice(5) + (r.time?(' '+r.time):''));
  const colors = ['#FF6B9D','#2F6FED','#F0932B'];
  const series = [0,1,2].map(idx=>({
    color: colors[idx],
    name: `대표상품 ${idx+1}`,
    points: sorted.map((r,i)=>({
      i, label:labels[i],
      value: Number((r.products && r.products[idx] && r.products[idx].price) || 0),
      name: (r.products && r.products[idx] && r.products[idx].name) || '',
    })).filter(p=>p.value>0),
  }));
  const allVals = series.flatMap(s=>s.points.map(p=>p.value));
  if(allVals.length===0) return `<div class="empty">입력된 대표 상품 판매가가 없어요. 아래 표에서 회차별로 입력해보세요.</div>`;

  const W = 900, H = 200, padL = 56, padR = 20, padT = 16, padB = 34;
  const maxVal = Math.max(1, ...allVals);
  const ticks = niceAxisTicks(0, maxVal, 4);
  const niceMax = ticks[ticks.length-1] || maxVal;
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const n = sorted.length;
  const stepX = n>1 ? innerW/(n-1) : 0;
  const xOf = i => padL + i*stepX;
  const yOf = v => padT + innerH - (v/niceMax)*innerH;
  const showEveryN = Math.ceil(n/12) || 1;
  return `
    <div style="display:flex;gap:14px;margin-bottom:6px;flex-wrap:wrap">
      ${series.map(s=>`<div style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-secondary)"><span style="width:10px;height:10px;border-radius:50%;background:${s.color};display:inline-block"></span>${s.name}</div>`).join('')}
    </div>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px">
      ${ticks.map(t=>`
        <line x1="${padL}" y1="${yOf(t)}" x2="${W-padR}" y2="${yOf(t)}" stroke="#EEF1EE" stroke-width="1"/>
        <text x="${padL-8}" y="${yOf(t)+3}" font-size="9" fill="#9AA69C" text-anchor="end">${formatMiniAxisNumber(t)}</text>
      `).join('')}
      ${series.map(s=>{
        if(s.points.length===0) return '';
        const linePts = s.points.map(p=>`${xOf(p.i)},${yOf(p.value)}`).join(' ');
        return `
          <polyline points="${linePts}" fill="none" stroke="${s.color}" stroke-width="2"/>
          ${s.points.map(p=>`
            <circle cx="${xOf(p.i)}" cy="${yOf(p.value)}" r="2.6" fill="${s.color}"/>
            <circle cx="${xOf(p.i)}" cy="${yOf(p.value)}" r="10" fill="transparent" style="cursor:pointer"
              onmousemove="showChartTooltip(event,'${s.name}${p.name?(' · '+String(p.name).replace(/'/g,"\\'")):''}: ${formatWon(p.value)}')" onmouseleave="hideChartTooltip()"/>
          `).join('')}
        `;
      }).join('')}
      ${labels.map((l,i)=> i%showEveryN===0 ? `<text x="${xOf(i)}" y="${H-10}" font-size="8.5" fill="#9AA69C" text-anchor="middle">${l}</text>` : '').join('')}
    </svg>
  `;
}
function liveSalesBarChart(items, opts){
  // items: [{label, total, count}]  opts: {height, barColor, valueFmt}
  const height = opts.height || 150;
  const barColor = opts.barColor || '#7C4DFF';
  const maxVal = Math.max(1, ...items.map(x=>x.value));
  const barW = 100 / Math.max(1, items.length);
  return `
    <div class="live-bar-chart" style="height:${height}px">
      ${items.map(it=>{
        const h = Math.max(2, Math.round((it.value/maxVal)*100));
        return `
        <div class="live-bar-col" style="width:${barW}%">
          <div class="live-bar-value">${it.value>0 ? formatWon(it.value) : ''}</div>
          <div class="live-bar" style="height:${h}%;background:${barColor}"></div>
          <div class="live-bar-label">${it.label}${it.count!==undefined?`<span>(${it.count}회)</span>`:''}</div>
        </div>`;
      }).join('')}
    </div>
  `;
}
/* 차트의 점 위에 마우스를 올리면 값이 뜨는 작은 말풍선. SVG 기본 title은 뜨는 게 느리고 잘 안 보여서,
   직접 마우스 위치를 따라다니는 말풍선을 하나 만들어서 여러 차트가 공용으로 쓴다. */
function showChartTooltip(evt, text){
  let tip = document.getElementById('chartTooltip');
  if(!tip){
    tip = document.createElement('div');
    tip.id = 'chartTooltip';
    document.body.appendChild(tip);
  }
  tip.textContent = text;
  tip.style.display = 'block';
  tip.style.left = (evt.clientX + 12) + 'px';
  tip.style.top = (evt.clientY - 12) + 'px';
}
function hideChartTooltip(){
  const tip = document.getElementById('chartTooltip');
  if(tip) tip.style.display = 'none';
}
function liveDateLineChart(points){
  if(points.length===0) return `<div class="empty">데이터가 없습니다.</div>`;
  const W = 900, H = 200, padL = 56, padR = 20, padT = 16, padB = 34;
  const maxVal = Math.max(1, ...points.map(p=>p.value));
  const ticks = niceAxisTicks(0, maxVal, 4);
  const niceMax = ticks[ticks.length-1] || maxVal;
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const stepX = points.length>1 ? innerW/(points.length-1) : 0;
  const xOf = i => padL + i*stepX;
  const yOf = v => padT + innerH - (v/niceMax)*innerH;
  const linePoints = points.map((p,i)=>`${xOf(i)},${yOf(p.value)}`).join(' ');
  const showEveryN = Math.ceil(points.length/12) || 1;
  return `
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px">
      ${ticks.map(t=>`
        <line x1="${padL}" y1="${yOf(t)}" x2="${W-padR}" y2="${yOf(t)}" stroke="#EEF1EE" stroke-width="1"/>
        <text x="${padL-8}" y="${yOf(t)+3}" font-size="9" fill="#9AA69C" text-anchor="end">${formatMiniAxisNumber(t)}</text>
      `).join('')}
      <polyline points="${linePoints}" fill="none" stroke="#7C4DFF" stroke-width="2"/>
      ${points.map((p,i)=>`
        <circle cx="${xOf(i)}" cy="${yOf(p.value)}" r="2.6" fill="#7C4DFF"/>
        <circle cx="${xOf(i)}" cy="${yOf(p.value)}" r="10" fill="transparent" style="cursor:pointer"
          onmousemove="showChartTooltip(event,'${p.label}: ${formatWon(p.value)}')" onmouseleave="hideChartTooltip()"/>
      `).join('')}
      ${points.map((p,i)=> i%showEveryN===0 ? `<text x="${xOf(i)}" y="${H-10}" font-size="8.5" fill="#9AA69C" text-anchor="middle">${p.label}</text>` : '').join('')}
    </svg>
  `;
}

  const weekdayItems = WEEKDAY_ORDER.map(w=>({

let liveCalView = null;
function ensureLiveCalView(){
  if(!liveCalView){ const t=new Date(); liveCalView={y:t.getFullYear(), m:t.getMonth()+1}; }
  return liveCalView;
}
function liveCalPrev(){ const v=ensureLiveCalView(); v.m--; if(v.m<1){v.m=12; v.y--;} render(); }
function liveCalNext(){ const v=ensureLiveCalView(); v.m++; if(v.m>12){v.m=1; v.y++;} render(); }
function liveCalToday(){ liveCalView=null; render(); }

function renderLiveCalendar(){
  const promo = ensurePromotion();
  const live = ensureLive();
  const view = ensureLiveCalView();
  const y = view.y, m = view.m;
  const firstWeekday = new Date(y, m-1, 1).getDay();
  const daysInMonth = new Date(y, m, 0).getDate();
  const pad2 = n => String(n).padStart(2,'0');
  const allBrandsInUse = brandsInUseFor(live.schedule);

  const cells = [];
  for(let i=0;i<firstWeekday;i++) cells.push(null);
  for(let d=1; d<=daysInMonth; d++) cells.push(d);
  while(cells.length % 7 !== 0) cells.push(null);

  const todayStr2 = todayStr();

  function eventsOnDay(dateStr){
    return live.schedule.filter(s=>{
      if(s.date !== dateStr) return false;
      if(s.brand && !isLiveBrandVisible(s.brand)) return false;
      return true;
    }).sort((a,b)=> (a.time||'').localeCompare(b.time||''));
  }

  let weekRows = '';
  for(let w=0; w<cells.length/7; w++){
    weekRows += '<tr>';
    for(let c=0; c<7; c++){
      const day = cells[w*7+c];
      if(day===null){ weekRows += `<td class="promo-cal-cell empty-cell"></td>`; continue; }
      const dateStr = `${y}-${pad2(m)}-${pad2(day)}`;
      const evs = eventsOnDay(dateStr);
      const isToday = dateStr===todayStr2;
      const wd = new Date(y,m-1,day).getDay();
      weekRows += `
        <td class="promo-cal-cell ${isToday?'is-today':''}">
          <div class="promo-cal-daynum ${wd===0?'sun':''} ${wd===6?'sat':''}">${day}</div>
          <div class="promo-cal-events">
            ${evs.map(ev=>{
              const label = `${ev.brand||'(브랜드 미정)'}(${ev.time||'-'})`;
              const chipColor = promoBrandColor(ev.brand||'');
              const heart = ev.content ? ' <span style="color:#2F6FED">💙</span>' : '';
              return `
              <div class="promo-cal-chip" style="background:${chipColor}22;color:${chipColor}" title="${label}${ev.content?' · '+ev.content:''}">
                <span class="promo-cal-chip-dot" style="background:${chipColor}"></span>${label}${heart}
              </div>
            `;}).join('')}
          </div>
        </td>`;
    }
    weekRows += '</tr>';
  }

  return `
    <div class="page-header">
      <div>
        <span class="eyebrow" style="background:#00B8A922;color:#00B8A9">라이브</span>
        <h1>캘린더</h1>
        <div class="sub">라이브 일정에 등록한 내용이 "브랜드(시간)" 형태로 자동 표시돼요 · 행사내용을 채우면 💙 표시가 붙어요</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <button class="btn ghost" onclick="liveCalPrev()" style="color:var(--text-primary)">◀</button>
        <div style="font-weight:800;font-size:15px;min-width:96px;text-align:center">${y}년 ${m}월</div>
        <button class="btn ghost" onclick="liveCalNext()" style="color:var(--text-primary)">▶</button>
        <button class="btn ghost" onclick="liveCalToday()" style="color:var(--text-primary)">오늘</button>
      </div>
    </div>

    ${renderLiveBrandFilterBar(allBrandsInUse)}

    <div class="card">
      <table class="promo-cal-table">
        <thead><tr>${PROMO_WEEKDAY_KR.map((w,i)=>`<th class="${i===0?'sun':''} ${i===6?'sat':''}">${w}</th>`).join('')}</tr></thead>
        <tbody>${weekRows}</tbody>
      </table>
    </div>
  `;
}

function renderDashboard(){
  const tm = todayMonth();

  // 쇼검 (계정별 이번 달 행 데이터도 함께 수집)
  let shogeomBudget=0, shogeomCharged=0, shogeomBalance=0;
  const shogeomRows = shogeomAccounts().map(a=>{
    const rows = computeMonthlyBudget('shogeom', a.id, state.shogeom.charges, 'account');
    const r = rows[tm-1];
    shogeomBudget += r.budget; shogeomCharged += r.charged; shogeomBalance += r.balance;
    return {name:a.id, ...r};
  });
  // GFA (브랜드별 이번 달 행 데이터도 함께 수집)
  let gfaBudget=0, gfaCharged=0, gfaBalance=0;
  const gfaRows = gfaBrandsList().map(b=>{
    const rows = computeMonthlyBudget('gfa', b.id, state.gfa.charges, 'brand');
    const r = rows[tm-1];
    gfaBudget += r.budget; gfaCharged += r.charged; gfaBalance += r.balance;
    return {name:b.id, ...r};
  });
  // 스스광고
  let seoseaCharged=0;
  seoseaBrandsList().forEach(b=>{
    const sums = monthlyCharged(state.seosea.charges,'brand',b);
    seoseaCharged += sums[tm]||0;
  });
  // 브검 - 이번달 시작된 일정의 충전액 합계
  let brgeomCharged=0;
  const brgCurrentForDash = ensureBrgeomCurrentAll();
  brgeomBrandsList().forEach(item=>{
    const c = brgCurrentForDash[item.id];
    if(!c) return;
    if(monthOf(c.pcStart)===tm) brgeomCharged += Number(c.pcAmount||0);
    if(monthOf(c.mobileStart)===tm) brgeomCharged += Number(c.mobileAmount||0);
  });
  // 브검 - 종료 임박(7일 이내, 만료 포함) 목록
  const brgToday = new Date(); brgToday.setHours(0,0,0,0);
  const brgeomImminent = [];
  brgeomBrandsList().forEach(item=>{
    const c = brgCurrentForDash[item.id];
    if(!c) return;
    [['PC', c.pcEnd], ['모바일', c.mobileEnd]].forEach(([type,endStr])=>{
      if(!endStr) return;
      const end = new Date(endStr); end.setHours(0,0,0,0);
      const days = Math.round((end-brgToday)/86400000);
      if(days<=7) brgeomImminent.push({brand:item.id, type, end:endStr, days});
    });
  });
  brgeomImminent.sort((a,b)=>a.days-b.days);
  // 프로모션 제안 마감 임박 (영업일 기준 -3일 이내, 아직 제안완료 안 된 것만)
  const promoDeadlineImminent = [];
  ensurePromotion().proposals.forEach(p=>{

/* 쇼검/GFA 공용: 충전 비용 계산기 — 계정(브랜드)별로 입력값을 기억해둔다 */
function ensureCalcInputs(sectionKey){
  if(!state[sectionKey].calcInputs || typeof state[sectionKey].calcInputs!=='object') state[sectionKey].calcInputs = {};
  return state[sectionKey].calcInputs;
}
function getCalcInput(sectionKey, key){
  const all = ensureCalcInputs(sectionKey);
  if(!all[key]) all[key] = {avgDaily:'', nextDate:''};
  return all[key];
}
function updateCalcInput(sectionKey, key, field, value){
  const rec = getCalcInput(sectionKey, key);
  rec[field] = value;
  saveState(); render();
}
/* 오늘 00시부터 다음 충전일까지(당일 포함) 며칠인지 계산해서 그만큼의 금액을 구한다.
   예) 오늘 7/1, 다음 충전일 7/5 → 5일치(7/1,2,3,4,5) */
function calcChargeNeeded(avgDaily, nextDateStr){
  if(!nextDateStr) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const next = new Date(nextDateStr+'T00:00:00');
  if(isNaN(next.getTime())) return null;
  const days = Math.round((next - today)/86400000) + 1;
  if(days<=0) return {days, amount:0};
  return {days, amount: Math.round(Number(avgDaily||0) * days)};
}
function renderShogeomOrGfa(sectionKey){

          <input type="date" onpaste="handleDatePaste(event)" value="${calcInput.nextDate||''}" onchange="updateCalcInput('${sectionKey}','${item.id}','nextDate',this.value)">

      </div>
      ${calcResult ? `
      <div class="stat-grid" style="margin-top:14px">
        <div class="stat-box"><div class="label">오늘부터 ${calcResult.days}일치 필요 금액</div><div class="value mono">${formatWon(calcResult.amount)}</div></div>
      </div>
      <div class="helptext">오늘(${todayStr()}) 00시부터 <b>${calcInput.nextDate}</b>까지 총 <b>${calcResult.days}일</b> 기준으로, 일평균 소진액 × 일수로 계산했어요.</div>

function budgetInputVal(sectionKey,key,m){
  const md = (state[sectionKey].months[key]||{})[m];
  return md && md.budget ? md.budget : '';
}
function rolloverInputVal(sectionKey,key,row){
  // 사용자가 직접 입력한 값이 있으면 그 값을, 없으면 자동계산된 값을 표시(수정 시 수기 입력으로 전환)
  return row.rollover ? row.rollover : '';
}
function updateBudget(sectionKey,key,m,val){
  const entry = ensureMonthEntry(sectionKey,key,m);
  entry.budget = Number(val)||0;
  saveState(); render();
}
function updateRollover(sectionKey,key,m,val){
  const entry = ensureMonthEntry(sectionKey,key,m);
  entry.rolloverManual = (val==='' ? null : Number(val));
  saveState(); render();
}
function pickItem(sectionKey,val){
  currentPick[sectionKey]=val;
  render();
}
function todayStr(){
  // new Date().toISOString()은 UTC(세계표준시) 기준이라, 한국 시간 새벽~아침 시간대(UTC로는 아직 전날)에는
  // "오늘"이 하루 전으로 잘못 계산되는 문제가 있었다. 그래서 브라우저의 로컬 시간(한국 시간) 그대로 계산한다.
  const d = new Date();
  const pad2 = n => String(n).padStart(2,'0');

/* =========================================================================

function brgeomDdayInfo(endStr){
  const today = new Date(); today.setHours(0,0,0,0);
  if(!endStr) return {days:null, badge:'<span class="badge muted">종료일 미입력</span>'};
  const end = new Date(endStr); end.setHours(0,0,0,0);
  const days = Math.round((end-today)/86400000);
  let badge;
  if(days < 0) badge = `<span class="badge danger">만료 ${Math.abs(days)}일 경과</span>`;
  else if(days <= 7) badge = `<span class="badge warn">진행중 D-${days}</span>`;
  else badge = `<span class="badge ok">진행중 D-${days}</span>`;
  return {days, badge};
}
/* 예전에는 사이클을 계속 "추가"하는 방식이었는데, 브랜드당 현재 값 1세트만 직접 고쳐 쓰는 방식으로 변경.
   기존에 쌓여있던 사이클 이력(state.brgeom.cycles)은 지우지 않고 그대로 두고(데이터 보존),
   그중 가장 최근 것을 꺼내와 새 구조(state.brgeom.current)의 초기값으로 딱 한 번만 옮겨 쓴다. */
function ensureBrgeomCurrentAll(){
  if(!state.brgeom.current || typeof state.brgeom.current!=='object') state.brgeom.current = {};
  brgeomBrandsList().forEach(item=>{
    if(!state.brgeom.current[item.id]){
      const brandCycles = (state.brgeom.cycles||[]).filter(c=>c.brand===item.id)
        .slice()
        .sort((a,b)=> (b.pcStart||b.start||'').localeCompare(a.pcStart||a.start||''));
      const latest = brandCycles[0];
      state.brgeom.current[item.id] = latest ? {
        pcStart: latest.pcStart || latest.start || '',
        pcEnd: latest.pcEnd || latest.end || '',
        pcAmount: latest.pcAmount!=null ? latest.pcAmount : (latest.amount || ''),
        mobileStart: latest.mobileStart || '',
        mobileEnd: latest.mobileEnd || '',
        mobileAmount: latest.mobileAmount || '',
      } : {pcStart:'', pcEnd:'', pcAmount:'', mobileStart:'', mobileEnd:'', mobileAmount:''};
    }
  });
  return state.brgeom.current;
}
function updateBrgeomCurrentField(brand, field, value){
  const current = ensureBrgeomCurrentAll();
  if(!current[brand]) current[brand] = {pcStart:'', pcEnd:'', pcAmount:'', mobileStart:'', mobileEnd:'', mobileAmount:''};
  if(field==='pcAmount' || field==='mobileAmount') value = sanitizePromoNumber(value);
  current[brand][field] = value;
  saveState(); render();
}

function copyToClipboard(text, btnEl){
  function fallback(){
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.left = '-9999px';
    document.body.appendChild(ta); ta.focus(); ta.select();
    try{ document.execCommand('copy'); }catch(e){}
    document.body.removeChild(ta);
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).catch(fallback);
  } else {
    fallback();
  }
  if(btnEl){
    const orig = btnEl.textContent;
    btnEl.textContent = '복사됨 ✓';
    setTimeout(()=>{ btnEl.textContent = orig; }, 1400);
  }
}
/* 셀 자체를 클릭해서 복사할 때 쓴다. copyToClipboard()는 버튼용이라 복사 후 글자를 "복사됨"으로
   바꿔치기하는데, 데이터가 그대로 보여야 하는 표 안 칸에 그렇게 하면 값이 사라져 보이니까,
   대신 살짝 색이 반짝하는 것으로만 복사됐다는 걸 알려준다. */
function copyCellValue(text, cellEl){
  if(!text || text==='-') return;
  copyToClipboard(text, null);
  if(cellEl){
    cellEl.classList.add('ss-copy-cell-flash');
    setTimeout(()=>{ cellEl.classList.remove('ss-copy-cell-flash'); }, 500);
  }
}

/* 오늘 날짜 기준으로 해당 항목의 충전 내역(들)을 합산해서 반환. 없으면 null */
function getTodayChargeSum(entry){
  const cfg = getAdTypeConfig(entry.adType);
  const today = todayStr();
  if(cfg.isCycle){
    const c = ensureBrgeomCurrentAll()[entry.accountKey];
    let amount = 0, count = 0;
    if(c){
      if(c.pcStart && c.pcStart===today){ amount += Number(c.pcAmount||0); count++; }
      if(c.mobileStart && c.mobileStart===today){ amount += Number(c.mobileAmount||0); count++; }
    }
    if(count===0) return null;
    return {amount, count};
  }
  const matches = state[cfg.chargeSection].charges.filter(c=>c[cfg.keyField]===entry.accountKey && c.date===today);
  if(matches.length===0) return null;
  const amount = matches.reduce((s,c)=>s+Number(c.amount||0),0);
  return {amount, count:matches.length};
}

function ensureDraftEntries(){
  if(!Array.isArray(state.draftEntries)) state.draftEntries = [];
  return state.draftEntries;
}

function addDraftEntry(){
  const adType = document.getElementById('draftAdType').value;
  const accountKey = document.getElementById('draftAccountKey').value.trim();
  const biz = document.getElementById('draftBiz').value.trim();
  const store = document.getElementById('draftStore').value.trim();
  const bank = document.getElementById('draftBank').value.trim();
  if(!accountKey){ alert('계정(브랜드)명을 입력해주세요. 충전 내역 등록 시 사용하는 이름과 정확히 같아야 금액이 자동으로 매칭됩니다.'); return; }
  ensureDraftEntries().push({id:uid(), adType, accountKey, biz, store, bank});
  saveState(); render();
}
function deleteDraftEntry(id){
  if(!confirm('이 등록 정보를 삭제할까요?')) return;
  state.draftEntries = ensureDraftEntries().filter(e=>e.id!==id);
  saveState(); render();
}
function updateDraftEntryField(id, field, val){
  const entry = ensureDraftEntries().find(e=>e.id===id);
  if(!entry) return;
  entry[field] = val;
  saveState(); render();
}

function buildEntryDraftText(entry, todayInfo){
  const cfg = getAdTypeConfig(entry.adType);
  const amountText = `${formatWon(todayInfo.amount)} (VAT 포함)`;
  return `[${cfg.label}]\n계정: ${entry.accountKey}\n사업자: ${entry.biz||''}\n스토어: ${entry.store||''}\n계좌: ${entry.bank||'(계좌 미입력)'}\n금액: ${amountText}`;
}
function copyEntryCard(id, btnEl){
  const entry = ensureDraftEntries().find(e=>e.id===id);
  if(!entry) return;
  const todayInfo = getTodayChargeSum(entry);
  if(!todayInfo) return;
  copyToClipboard(buildEntryDraftText(entry, todayInfo), btnEl);
}
function copyAllToday(btnEl){
  const ready = ensureDraftEntries().map(e=>({entry:e, today:getTodayChargeSum(e)})).filter(x=>x.today);
  const text = ready.map(x=>buildEntryDraftText(x.entry, x.today)).join('\n\n');
  copyToClipboard(text || '오늘 등록된 충전 내역이 없습니다.', btnEl);
}

/* ---- 충전기안: 바로 복사해서 쓰는 문구(제목/본문/슬랙) ---- */
const DRAFT_TEMPLATE_DEFAULTS = {
  title: '[네이버] 광고 운영을 위한 비즈월렛(머니) 충전 요청의 건_{날짜}',
  body: '안녕하세요, \n네이버 광고 집행을 위한 비즈머니 충전 요청드리오니 검토 후 재가 바랍니다.',
  slack: '안녕하세요, \n네이버 광고 운영을 위한 충전 기안 상신드렸습니다.\n검토 후 결재 부탁드립니다. 감사합니다.',
};
function ensureDraftTemplates(){
  if(!state.draftTemplates || typeof state.draftTemplates!=='object') state.draftTemplates = Object.assign({}, DRAFT_TEMPLATE_DEFAULTS);
  Object.keys(DRAFT_TEMPLATE_DEFAULTS).forEach(k=>{ if(state.draftTemplates[k]===undefined) state.draftTemplates[k] = DRAFT_TEMPLATE_DEFAULTS[k]; });
  return state.draftTemplates;
}
function updateDraftTemplate(field, value){
  const t = ensureDraftTemplates();
  t[field] = value;
  saveState(); render();
}
function resetDraftTemplate(field){
  const t = ensureDraftTemplates();
  t[field] = DRAFT_TEMPLATE_DEFAULTS[field];
  saveState(); render();
}
function todayYYMMDD(){
  const d = new Date();
  return String(d.getFullYear()).slice(-2) + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
}
/* 문구 안의 {날짜} 자리에 오늘 날짜(YYMMDD)를 넣어서 실제로 복사될 최종 텍스트를 만든다 */
function resolveDraftTemplate(text){
  return String(text||'').split('{날짜}').join(todayYYMMDD());
}
function copyDraftTemplate(field, btnEl){
  const t = ensureDraftTemplates();
  copyToClipboard(resolveDraftTemplate(t[field]), btnEl);
}

function renderDraft(){
  const today = todayStr();
  const entries = ensureDraftEntries();
  const ready = entries.map(e=>({entry:e, today:getTodayChargeSum(e)})).filter(x=>x.today);

  return `
    <div class="page-header">
      <div>
        <h1>충전기안</h1>
        <div class="sub">아래에 등록해둔 계정/브랜드 중 <b>오늘(${today}) 충전 내역이 있는 항목만</b> 자동으로 표시되어 바로 복사할 수 있습니다</div>
      </div>
      ${ready.length>0 ? `<button class="copy-btn-main" onclick="copyAllToday(this)">오늘 항목 전체 복사 (${ready.length}건)</button>` : ''}
    </div>

    <div class="card">
      <h2>📋 바로 복사해서 쓰는 문구</h2>
      <div class="helptext" style="margin-top:0">문구는 직접 자유롭게 수정할 수 있어요. 제목의 <span class="mono">{날짜}</span> 자리는 복사할 때 자동으로 오늘 날짜(예: 260730)로 바뀌어요.</div>
      ${['title','body','slack'].map(field=>{
        const t = ensureDraftTemplates();
        const labelMap = {title:'제목', body:'본문', slack:'슬랙'};
        const resolved = resolveDraftTemplate(t[field]);
        const isMultiline = field!=='title';
        return `
        <div class="draft-template-block">
          <div class="dt-head">
            <b>${labelMap[field]}</b>
            <div style="display:flex;gap:6px">
              <button class="copy-btn" onclick="resetDraftTemplate('${field}')" title="기본 문구로 되돌리기" style="background:none;border:none;color:var(--text-secondary);text-decoration:underline;padding:5px 4px">기본값</button>
              <button class="copy-btn" onclick="copyDraftTemplate('${field}', this)">복사</button>
            </div>
          </div>
          ${isMultiline
            ? `<textarea class="sheet-input" style="text-align:left;width:100%;min-height:64px;resize:vertical;padding:8px 10px" onchange="updateDraftTemplate('${field}',this.value)">${t[field]}</textarea>`
            : `<input class="sheet-input" style="text-align:left;width:100%;padding:8px 10px" value="${t[field]}" onchange="updateDraftTemplate('${field}',this.value)">`
          }
          ${field==='title' ? `<div class="dt-preview">미리보기: ${resolved}</div>` : ''}
        </div>`;
      }).join('')}
    </div>

    <div class="card">
      <h2>오늘 충전 내역 — 바로 복사</h2>
      ${ready.length===0
        ? `<div class="empty">오늘 날짜로 등록된 충전 내역이 아직 없습니다.<br>쇼검·GFA·스스광고·브검·비즈월렛 탭에서 오늘 날짜로 충전 내역을 추가하면 여기에 자동으로 나타납니다.</div>`
        : `<div class="draft-grid">
            ${ready.map(({entry,today:t})=>{
              const cfg = getAdTypeConfig(entry.adType);
              return `
              <div class="draft-card">
                <div class="dc-head" style="background:${DRAFT_HEAD_COLOR[entry.adType]||'#EEF0F3'}">
                  <span>${cfg.label} · ${entry.accountKey}</span>
                  <button class="copy-btn" onclick="copyEntryCard('${entry.id}', this)">복사</button>
                </div>
                <div class="draft-row"><div class="lbl">사업자</div><div class="val">${entry.biz||''}</div></div>
                <div class="draft-row"><div class="lbl">스토어</div><div class="val">${entry.store||''}</div></div>
                <div class="draft-row"><div class="lbl">계좌</div><div class="val">${entry.bank||'(계좌 미입력)'}</div></div>
                <div class="draft-row"><div class="lbl">금액</div><div class="val amount">${formatWon(t.amount)} (VAT 포함)${t.count>1?`<span class="dt">(오늘 ${t.count}건 합계)</span>`:''}</div></div>
              </div>`;
            }).join('')}
          </div>`
      }
    </div>

    <div class="card">
      <h2>계정 · 브랜드 등록 관리</h2>
      <div class="helptext">광고 종류 / 계정(브랜드) / 사업자 / 스토어 / 계좌정보를 한 번 등록해두면, 해당 계정·브랜드로 오늘 충전 내역을 추가할 때마다 금액이 자동으로 매칭됩니다. <b>계정(브랜드)명은 각 광고 탭에서 충전 내역을 등록할 때 쓰는 이름과 정확히 같아야</b> 합니다. 브랜드가 추가/삭제될 때는 아래에서 직접 관리하세요.</div>
      ${entries.length===0 ? `<div class="empty">등록된 계정·브랜드가 없습니다. 아래에서 추가해주세요.</div>` : `
      <table>
        <thead><tr><th>광고 종류</th><th>계정(브랜드)</th><th>사업자</th><th>스토어</th><th>계좌정보</th><th></th></tr></thead>
        <tbody>
          ${entries.map(e=>`
            <tr>
              <td style="min-width:170px">
                <select class="row-input" style="text-align:left" onchange="updateDraftEntryField('${e.id}','adType',this.value)">
                  ${AD_TYPE_OPTIONS.map(o=>`<option value="${o.key}" ${o.key===e.adType?'selected':''}>${o.label}</option>`).join('')}
                </select>
              </td>
              <td><input class="row-input" style="text-align:left" value="${e.accountKey}" onchange="updateDraftEntryField('${e.id}','accountKey',this.value)"></td>
              <td><input class="row-input" style="text-align:left" value="${e.biz||''}" onchange="updateDraftEntryField('${e.id}','biz',this.value)"></td>
              <td><input class="row-input" style="text-align:left" value="${e.store||''}" onchange="updateDraftEntryField('${e.id}','store',this.value)"></td>
              <td><input class="row-input" style="text-align:left" placeholder="은행명 계좌번호" value="${e.bank||''}" onchange="updateDraftEntryField('${e.id}','bank',this.value)"></td>
              <td><button class="btn-del" onclick="deleteDraftEntry('${e.id}')" title="삭제">✕</button></td>
            </tr>
          `).join('')}
        </tbody>
      </table>`}
      <div class="add-form">
        <div class="field"><label>광고 종류</label>
          <select id="draftAdType">${AD_TYPE_OPTIONS.map(o=>`<option value="${o.key}">${o.label}</option>`).join('')}</select>
        </div>
        <div class="field"><label>계정(브랜드)</label><input type="text" id="draftAccountKey" placeholder="예: best3327"></div>
        <div class="field"><label>사업자</label><input type="text" id="draftBiz" placeholder="예: 서정커머스"></div>
        <div class="field"><label>스토어</label><input type="text" id="draftStore" placeholder="예: VSL3, 갸스비"></div>
        <div class="field"><label>계좌정보</label><input type="text" id="draftBank" placeholder="예: 기업은행 48101707597258"></div>
        <button class="btn" onclick="addDraftEntry()">+ 등록</button>
      </div>
    </div>
  `;
}

/* =========================================================================
   초기화
   ========================================================================= */
try{
  render();
  updateSyncBadge();
  if(getAccessCode()){
    // 새로고침 직전에 저장이 서버까지 못 갔을 수 있으니, 서버에서 받아오기 전에
    // 지금 이 브라우저에 있는 내용을 한 번 먼저 밀어넣어 둔다(그래야 그다음 받아올 때 안전하게 합쳐짐).
    pushToServer().catch(()=>{}).finally(()=>{ loadFromServer(false); });
  }
  // 60초마다 서버 데이터를 자동으로 확인 (입력 중일 때는 건너뜀)
  setInterval(()=>{
    const active = document.activeElement;
    const isEditing = active && (active.tagName==='INPUT' || active.tagName==='SELECT' || active.tagName==='TEXTAREA');
    if(!isEditing) loadFromServer(false);
  }, 60000);
}catch(e){
  console.error('초기 렌더링 실패:', e);
  document.getElementById('main').innerHTML = `
    <div class="card" style="border-color:#F3B3B3;margin:24px">
      <h2 style="color:var(--negative)">⚠ 앱을 불러오는 중 오류가 발생했습니다</h2>
      <pre style="background:#FAFAFB;border:1px solid var(--border);border-radius:8px;padding:12px;font-size:12px;white-space:pre-wrap;color:var(--negative)">${(e && e.message ? e.message : String(e)).replace(/</g,'&lt;')}</pre>
      <button class="btn ghost" style="margin-top:10px" onclick="if(confirm('저장된 모든 데이터를 초기화할까요? 이 작업은 되돌릴 수 없습니다.')){ localStorage.removeItem('naver_ad_budget_v1'); location.reload(); }">데이터 초기화 후 새로고침</button>
    </div>`;
}
</script>
