<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>네이버 업무</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&family=Roboto+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F5F8;
    --sidebar-bg:#151A26;
    --sidebar-text:#8A93AA;
    --sidebar-text-active:#FFFFFF;
    --card-bg:#FFFFFF;
    --border:#E4E7EC;
    --text-primary:#1A1F2B;
    --text-secondary:#6B7280;
    --accent:#2F6FED;
    --positive:#12805C;
    --negative:#D64545;
    --warning:#B4790A;

    --c-shogeom:#2F6FED;
    --c-gfa:#7C4DFF;
    --c-seosea:#12805C;
    --c-brgeom:#C9820A;
    --c-bizwallet:#DB5A9E;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text-primary);}
  .mono{font-family:'Roboto Mono',monospace;font-variant-numeric:tabular-nums;}
  #app{display:flex;min-height:100vh;}
  /* 숫자 입력칸의 증가/감소 화살표(스피너) 전체 제거 — 수기 입력만 사용 */
  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
  input[type=number]{-moz-appearance:textfield;appearance:textfield;}

  /* ---------- Sidebar ---------- */
  #sidebar{
    width:204px;flex-shrink:0;background:var(--sidebar-bg);color:var(--sidebar-text);
    display:flex;flex-direction:column;padding:20px 0;position:sticky;top:0;height:100vh;overflow-y:auto;
  }
  .brand-title{padding:0 20px 18px 20px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:10px;}
  .brand-title .t1{font-size:11px;letter-spacing:.14em;color:#5D6577;text-transform:uppercase;font-weight:600;}
  .brand-title .t2{font-size:17px;font-weight:700;color:#fff;margin-top:4px;}
  nav{flex:1;padding:6px 10px;}
  .nav-item{
    display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:8px;cursor:pointer;
    font-size:14.5px;font-weight:500;color:var(--sidebar-text);margin-bottom:2px;transition:background .12s,color .12s;
    user-select:none;
  }
  .nav-item:hover{background:rgba(255,255,255,.06);color:#fff;}
  .nav-item.active{background:rgba(255,255,255,.1);color:var(--sidebar-text-active);}
  .nav-item.dragging{opacity:.35;}
  .nav-item.drag-over{outline:2px dashed rgba(255,255,255,.45);outline-offset:-2px;}
  .nav-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .drag-handle{cursor:grab;color:#4B5566;font-size:12px;flex-shrink:0;}
  .drag-handle:active{cursor:grabbing;}
  .nav-group{margin-bottom:2px;}
  .nav-group-header{cursor:pointer;}
  .nav-group-header.active-parent{color:#fff;}
  .nav-chevron{background:rgba(255,255,255,.06);border:none;color:#C4CADA;font-size:15px;cursor:pointer;padding:4px 9px;margin-left:2px;flex-shrink:0;border-radius:6px;line-height:1;}
  .nav-chevron:hover{background:rgba(255,255,255,.16);color:#fff;}
  .nav-chevron:hover{color:#fff;}
  .nav-children{padding-left:13px;margin-left:15px;border-left:1px solid rgba(255,255,255,.08);margin-top:2px;margin-bottom:6px;}
  .nav-child{font-size:13.5px;padding:9px 10px;}
  .nav-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .nav-item.active .nav-dot{box-shadow:0 0 0 3px rgba(255,255,255,.12);}
  .sidebar-footer{padding:14px 18px 4px 18px;border-top:1px solid rgba(255,255,255,.08);margin-top:8px;}
  .sidebar-footer button{
    width:100%;background:rgba(255,255,255,.05);color:#B7BECF;border:1px solid rgba(255,255,255,.1);
    padding:9px 10px;border-radius:7px;font-size:12.5px;cursor:pointer;margin-top:6px;font-family:inherit;
  }
  .sidebar-footer button:hover{background:rgba(255,255,255,.1);color:#fff;}
  .sync-badge{font-size:11px;color:#8A93AA;padding:6px 2px;line-height:1.5;}
  #importFile{display:none;}

  /* ---------- Main ---------- */
  #main{flex:1;padding:28px 20px 60px 20px;max-width:2000px;}
  .page-layout{display:flex;gap:24px;align-items:flex-start;}
  .page-main{flex:1;min-width:0;}
  .page-side{
    width:216px;flex-shrink:0;background:#fff;border:1px solid var(--border);border-radius:12px;
    padding:14px;position:sticky;top:32px;max-height:calc(100vh - 64px);overflow-y:auto;
  }
  .page-side h3{font-size:11px;font-weight:700;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.05em;margin:0 0 10px 2px;}
  .side-item{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:8px;cursor:pointer;font-size:13.5px;margin-bottom:2px;transition:background .12s;}
  .side-item:hover{background:#F4F5F8;}
  .side-item.active{background:#EFF4FF;font-weight:700;color:var(--accent);}
  .side-item input[type=checkbox]{width:15px;height:15px;accent-color:var(--accent);cursor:pointer;flex-shrink:0;margin:0;}
  .side-item .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .side-item-row{display:flex;align-items:center;gap:2px;}
  .side-item-row:hover .side-item-del{opacity:1;}
  .side-item-del{opacity:0;flex-shrink:0;background:none;border:none;color:var(--text-secondary);cursor:pointer;font-size:11px;padding:6px 5px;border-radius:6px;transition:opacity .12s;}
  .side-item-del:hover{background:#FCE9E9;color:var(--negative);}
  .low-balance-strip{display:flex;align-items:center;flex-wrap:wrap;gap:6px;background:#FDF1DC;border:1px solid #F0D9A8;border-radius:10px;padding:8px 10px;margin-bottom:16px;}
  .low-balance-label{font-size:11.5px;font-weight:800;color:#9A6B0A;flex-shrink:0;}
  .low-balance-chip{display:flex;align-items:center;gap:5px;background:#fff;border:1px solid #F0D9A8;border-radius:20px;padding:4px 10px;font-size:11.5px;font-weight:700;color:#7A5308;cursor:pointer;font-family:inherit;}
  .low-balance-chip:hover{background:#FFF7E8;}
  .low-balance-chip .mono{font-weight:800;}
  .goal-row{padding:12px 0;border-bottom:1px solid var(--border);}
  .goal-row:last-child{border-bottom:none;padding-bottom:0;}
  .goal-row:first-child{padding-top:4px;}
  .goal-row-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;}
  .goal-store{font-size:13.5px;font-weight:700;}
  .goal-target-input{display:flex;align-items:center;gap:6px;}
  .goal-target-input label{font-size:11px;color:var(--text-secondary);font-weight:700;flex-shrink:0;}
  .goal-bar-track{background:#EEF0F3;border-radius:20px;height:10px;overflow:hidden;}
  .goal-bar-fill{background:linear-gradient(90deg,#8B5CF6,#B49BFA);height:100%;border-radius:20px;transition:width .2s;}
  .goal-bar-fill.over{background:linear-gradient(90deg,#12805C,#22A67A);}
  .goal-row-foot{display:flex;align-items:center;justify-content:space-between;margin-top:6px;font-size:12px;color:var(--text-secondary);}

  /* ---------- 스마트스토어 매출 대시보드 ---------- */
  .ss-filter-box{background:#fff;border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:16px;display:flex;flex-direction:column;gap:6px;}
  .ss-filter-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;}
  .ss-filter-label{font-size:11px;font-weight:800;color:#8B5CF6;flex-shrink:0;min-width:78px;}
  .ss-filter-row:last-of-type .ss-filter-label{color:var(--text-secondary);}
  .ss-filter-chip{display:flex;align-items:center;gap:5px;cursor:pointer;font-size:12px;}
  .ss-filter-chip input{width:13px;height:13px;accent-color:var(--accent);cursor:pointer;margin:0;}
  .ss-filter-actions{display:flex;justify-content:flex-end;gap:6px;margin-top:2px;}

  .ss-row2col{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;align-items:start;}
  @media (max-width:900px){ .ss-row2col{grid-template-columns:1fr;} }
  .ss-compact-card{padding:16px 18px;}

  .ss-cal-nav{padding:4px 8px;font-size:11px;}
  .ss-mini-cal .promo-cal-table{font-size:12.5px;}
  .ss-mini-cal .promo-cal-cell{height:80px;padding:5px;}
  .ss-mini-cal .promo-cal-daynum{font-size:12px;margin-bottom:3px;}
  .ss-mini-cal .promo-cal-chip{font-size:10.5px;padding:2px 4px;gap:2px;}
  .ss-mini-cal th{padding:7px;font-size:11.5px;}

  .ss-notepad{width:100%;min-height:200px;border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:13px;font-family:inherit;resize:vertical;color:var(--text-primary);line-height:1.6;}
  .ss-notepad:focus{outline:none;border-color:var(--accent);}

  .ss-gauge-list{display:flex;flex-direction:column;gap:10px;}
  .ss-gauge-row{display:grid;grid-template-columns:44px 1fr 44px auto;align-items:center;gap:10px;}
  .ss-gauge-label{font-size:12.5px;font-weight:800;color:#8B5CF6;}
  .ss-gauge-track{background:#EEF0F3;border-radius:20px;height:14px;overflow:hidden;}
  .ss-gauge-fill{background:linear-gradient(90deg,#8B5CF6,#B49BFA);height:100%;border-radius:20px;transition:width .2s;}
  .ss-gauge-fill.over{background:linear-gradient(90deg,#12805C,#22A67A);}
  .ss-gauge-pct{font-size:13px;font-weight:800;text-align:right;}
  .ss-gauge-detail{font-size:11px;color:var(--text-secondary);white-space:nowrap;}

  .ss-input-cal-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;}
  .ss-input-cal-card{border:1px solid var(--border);border-radius:10px;padding:12px;}
  .ss-input-cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .ss-input-cal-store{font-size:13px;font-weight:800;}
  .ss-input-cal-total{font-size:12px;color:#8B5CF6;font-weight:700;}
  .ss-input-cal-table{width:100%;border-collapse:collapse;table-layout:fixed;}
  .ss-input-cal-table th{font-size:9.5px;padding:3px 0;color:var(--text-secondary);font-weight:700;text-align:center;}
  .ss-input-cal-table th.sun{color:var(--negative);} .ss-input-cal-table th.sat{color:var(--accent);}
  .ss-input-cal-cell{padding:1.5px;vertical-align:top;}
  .ss-input-cal-cell.empty-cell{background:transparent;}
  .ss-input-cal-cell.is-today .ss-input-cal-daynum{color:var(--accent);}
  .ss-input-cal-daynum{font-size:9.5px;color:var(--text-secondary);text-align:center;margin-bottom:1px;}
  .ss-input-cal-daynum.sun{color:var(--negative);} .ss-input-cal-daynum.sat{color:var(--accent);}
  .ss-input-cal-input{width:100%;min-width:0;border:1px solid var(--border);border-radius:4px;background:#FAFBFC;padding:3px 2px;font-size:9.5px;text-align:center;font-family:'Roboto Mono',monospace;}
  .ss-input-cal-input:focus{outline:none;border-color:var(--accent);background:#fff;}
  .ss-input-cal-target{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;padding-top:8px;border-top:1px dashed var(--border);}
  .ss-input-cal-target label{font-size:11px;color:var(--text-secondary);font-weight:700;}
  .ss-input-cal-target input{width:110px;padding:5px 7px !important;font-size:12px !important;}

  .ss-checklist{display:flex;flex-direction:column;gap:2px;max-height:260px;overflow-y:auto;}
  .ss-checklist-item{display:flex;align-items:center;gap:8px;padding:5px 4px;border-radius:6px;}
  .ss-checklist-item:hover{background:var(--bg);}
  .ss-checklist-item input[type=checkbox]{width:15px;height:15px;accent-color:#8B5CF6;cursor:pointer;flex-shrink:0;}
  .ss-checklist-text{flex:1;min-width:0;border:1px solid transparent;background:transparent;padding:5px 6px;border-radius:6px;font-size:13px;font-family:inherit;}
  .ss-checklist-text:hover, .ss-checklist-text:focus{border-color:var(--border);background:#fff;}
  .ss-checklist-text:focus{outline:none;}
  .ss-checklist-text.done{text-decoration:line-through;color:var(--text-secondary);}
  .ss-checklist-item .btn-del{opacity:0;flex-shrink:0;}
  .ss-checklist-item:hover .btn-del{opacity:1;}
  .ss-checklist-blank .btn-del{visibility:hidden;}

  .ss-row2col-narrow{grid-template-columns:400px 1fr;}
  @media (max-width:1000px){ .ss-row2col-narrow{grid-template-columns:1fr;} }
  .ss-row2col-cal-first{grid-template-columns:1.3fr 1fr;}
  @media (max-width:900px){ .ss-row2col-cal-first{grid-template-columns:1fr;} }
  .ss-goal-target-line{font-size:12.5px;color:var(--text-secondary);margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--border);}
  .ss-goal-target-line b{color:#8B5CF6;font-size:14px;margin:0 4px;white-space:nowrap;}
  .ss-goal-target-sub{font-size:11px;}
  .ss-gauge-detail{font-size:11px;color:var(--text-secondary);white-space:nowrap;overflow:visible;}
  .ss-input-cal-grid-narrow{grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;}
  .ss-input-cal-grid-narrow .ss-input-cal-card{padding:10px;}
  .ss-input-cal-grid-narrow .ss-input-cal-store{font-size:13px;}
  .ss-input-cal-grid-narrow .ss-input-cal-total{font-size:12px;}
  .ss-input-cal-grid-narrow .ss-input-cal-input{font-size:12.5px;padding:5px 2px;}
  .ss-input-cal-grid-narrow .ss-input-cal-daynum{font-size:11px;}
  .ss-input-cal-grid-narrow .ss-input-cal-table th{font-size:10.5px;padding:4px 0;}
  .ss-input-cal-grid-narrow .ss-input-cal-cell{padding:2px;}
  .ss-input-cal-grid-narrow .ss-input-cal-target label{font-size:11px;}
  .ss-input-cal-grid-narrow .ss-input-cal-target input{width:90px;padding:5px 6px !important;font-size:12px !important;}

  .ss-store-notes-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px;}
  .ss-store-notes-card{border:1px solid var(--border);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;}
  .ss-store-notes-head{font-size:12.5px;font-weight:800;color:#8B5CF6;padding-bottom:6px;border-bottom:1px solid var(--border);}
  .ss-store-notes-body{display:flex;gap:10px;align-items:stretch;}
  .ss-store-notes-body .ss-checklist{flex:1;min-width:0;max-height:150px;}
  .ss-store-notes-body .ss-notepad-compact{flex:1;min-width:0;}
  .ss-notepad-compact{min-height:150px;font-size:12px;}

  .ss-event-sales-table{width:100%;border-collapse:collapse;}
  .ss-event-sales-table th{font-size:10.5px;text-align:left;color:var(--text-secondary);padding:5px 3px;border-bottom:1px solid var(--border);}
  .ss-event-sales-table th.num{text-align:right;}
  .ss-event-sales-table td{padding:3px;}
  .ss-event-sales-table td.num{text-align:right;}
  .ss-event-sales-table input{font-size:11.5px !important;padding:4px 6px !important;}

  .ss-manual-event-form{margin-top:12px;padding-top:12px;border-top:1px solid var(--border);}
  .ss-manual-event-add{display:grid;grid-template-columns:1fr 1fr 1.4fr auto;gap:6px;}
  @media (max-width:700px){ .ss-manual-event-add{grid-template-columns:1fr 1fr; } }
  .ss-manual-event-add select, .ss-manual-event-add input{font-size:12px !important;padding:6px 8px !important;}
  .ss-manual-event-add .btn{padding:6px 12px;font-size:12px;white-space:nowrap;}
  .ss-manual-event-list{display:flex;flex-direction:column;gap:2px;margin-top:10px;max-height:140px;overflow-y:auto;}
  .ss-manual-event-row{display:flex;align-items:center;gap:10px;padding:5px 4px;border-radius:6px;font-size:12px;}
  .ss-manual-event-row:hover{background:var(--bg);}
  .ss-manual-event-row .mono{color:var(--text-secondary);flex-shrink:0;}
  .ss-manual-event-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ss-manual-event-row .btn-del{opacity:0;flex-shrink:0;}
  .ss-manual-event-row:hover .btn-del{opacity:1;}

  /* ---------- 주간미팅 비교표 ---------- */
  .wm-table{border-collapse:collapse;width:100%;min-width:640px;}
  .wm-table th{font-size:12px;font-weight:800;color:var(--text-secondary);padding:8px 10px;border-bottom:2px solid var(--border);text-align:center;white-space:nowrap;}
  .wm-table td{padding:5px 8px;border-bottom:1px solid var(--border);}
  .wm-metric-col{font-size:12.5px;font-weight:700;white-space:nowrap;text-align:left !important;color:var(--text-primary);}
  .wm-unit{font-weight:400;color:var(--text-secondary);font-size:11px;}
  .wm-input{width:100px;text-align:right;}
  .wm-input-readonly{background:#F5F1FC;border:1px solid #E4D9F7;border-radius:6px;padding:7px 9px;color:#6B3FB8;font-weight:700;}
  .wm-auto-badge{display:inline-block;background:#8B5CF622;color:#8B5CF6;font-size:9.5px;font-weight:800;padding:1px 6px;border-radius:8px;margin-left:2px;}
  .wm-delta{font-size:10px;font-weight:800;text-align:right;margin-top:2px;padding-right:2px;}
  .wm-delta.up{color:#D64545;}
  .wm-delta.down{color:#2F6FED;}
  .wm-metric-tabs{display:flex;flex-wrap:wrap;gap:4px;background:#EEF0F3;border-radius:10px;padding:4px;}
  .wm-metric-tab{border:none;background:transparent;padding:6px 12px;border-radius:8px;font-size:12px;font-weight:700;color:var(--text-secondary);cursor:pointer;font-family:inherit;white-space:nowrap;}
  .wm-metric-tab.active{background:#fff;color:var(--text-primary);box-shadow:0 1px 3px rgba(0,0,0,.08);}
  .wm-chart-svg{width:100%;height:auto;display:block;}
  .wm-chart-legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px;justify-content:center;}
  .wm-chart-legend-item{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--text-secondary);font-weight:600;}
  .wm-chart-legend-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
  .page-header{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:16px;margin-bottom:24px;}
  .page-header h1{font-size:22px;font-weight:800;margin:0 0 4px 0;}
  .page-header .sub{font-size:13px;color:var(--text-secondary);}
  .eyebrow{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;letter-spacing:.06em;padding:3px 9px;border-radius:20px;margin-bottom:8px;}

  select.picker{
    appearance:none;background:#fff url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6"><path d="M0 0l5 6 5-6z" fill="%236B7280"/></svg>') no-repeat right 14px center;
    border:1px solid var(--border);padding:10px 34px 10px 14px;border-radius:9px;font-size:14px;font-weight:600;
    color:var(--text-primary);font-family:inherit;cursor:pointer;min-width:220px;
  }
  select.picker:focus{outline:2px solid var(--accent);outline-offset:1px;}

  .card{background:var(--card-bg);border:1px solid var(--border);border-radius:12px;padding:20px 22px;margin-bottom:20px;}
  .card h2{font-size:14.5px;font-weight:700;margin:0 0 14px 0;}
  .meta-line{font-size:12.5px;color:var(--text-secondary);margin-bottom:2px;}

  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:20px;}
  .stat-box{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px 18px;}
  .stat-box .label{font-size:12px;color:var(--text-secondary);font-weight:600;margin-bottom:8px;}
  .stat-box .value{font-size:21px;font-weight:700;}
  .value.positive{color:var(--positive);}
  .value.negative{color:var(--negative);}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;font-size:11.5px;color:var(--text-secondary);font-weight:700;text-transform:uppercase;letter-spacing:.03em;
     padding:9px 10px;border-bottom:1px solid var(--border);white-space:nowrap;}
  td{padding:9px 10px;border-bottom:1px solid #EEF0F3;vertical-align:middle;overflow:hidden;}
  tr:last-child td{border-bottom:none;}
  td.num, th.num{text-align:right;}
  tr.current-month td{background:#EFF4FF;}
  tr.brg-warn td{background:#FDF1DC;}
  tr.brg-expired td{background:#FCE9E9;}
  .row-input{width:100%;min-width:0;border:1px solid transparent;background:transparent;padding:5px 7px;border-radius:6px;font-size:13.5px;text-align:right;font-family:'Roboto Mono',monospace;color:var(--text-primary);}
  .row-input:hover{border-color:var(--border);}

/* =========================================================================

   Firebase 콘솔에서 무료로 프로젝트를 만들고 설정을 붙여넣으면 자동으로 동기화됩니다.
   설정이 없으면 자동으로 "로컬 전용 모드"로 동작합니다.

const FIREBASE_CONFIG_KEY = 'naver_ad_firebase_config';
let syncStatus = {state:'idle', lastSync:null, message:''}; // idle|syncing|ok|offline|error
let pushTimer = null;

let firebaseListenerAttached = false;

function getFirebaseConfig(){
  try{

}
function setFirebaseConfig(configObj){

}
function clearFirebaseConfig(){

// 예전 코드 곳곳에서 "서버 연결이 설정되어 있는지"를 이 이름으로 확인하고 있어서, 뜻만 Firebase 설정 여부로 바꿔 그대로 둔다
function getAccessCode(){

}
/* Firebase 콘솔의 "SDK 설정 및 구성"에서 복사한 코드(순수 JSON이 아니어도 됨)를 그대로 붙여넣을 수 있게,
   텍스트 안에서 { ... } 객체 부분만 찾아 안전하게 값으로 변환한다 */
function parseFirebaseConfigText(text){
  try{ return JSON.parse(text); }catch(e){}
  try{
    const match = text.match(/\{[\s\S]*\}/);
    if(!match) return null;
    const obj = new Function('return (' + match[0] + ');')();
    if(obj && typeof obj==='object' && obj.databaseURL) return obj;
    return null;
  }catch(e){ return null; }
}
function openAccessCodeDialog(){
  const current = getFirebaseConfig();

  const pasted = window.prompt(

    '(Firebase 콘솔 → 프로젝트 설정 → 일반 탭 → "내 앱"의 SDK 설정 및 구성에서 나오는 코드를 그대로 복사해서 붙여넣으시면 돼요)\n\n' +
    '비워두고 확인을 누르면 로컬 전용 모드로 전환됩니다.',
    currentText
  );
  if(pasted===null) return; // 취소
  const trimmed = pasted.trim();
  if(!trimmed){
    clearFirebaseConfig();
    detachFirebaseListener();
    syncStatus = {state:'idle', lastSync:null, message:''};
    updateSyncBadge();
    alert('로컬 전용 모드로 전환했습니다.');
    return;
  }
  const parsed = parseFirebaseConfigText(trimmed);
  if(!parsed){
    alert('Firebase 설정을 인식하지 못했어요. Firebase 콘솔에서 복사한 구성 코드 전체를 그대로 붙여넣어주세요 (databaseURL 항목이 포함되어 있어야 해요).');
    return;
  }
  setFirebaseConfig(parsed);
  initFirebaseSync(true);
}
function initFirebaseSync(showAlert){
  const config = getFirebaseConfig();
  if(!config){ syncStatus = {state:'idle', lastSync:null, message:''}; updateSyncBadge(); return; }
  if(typeof firebase === 'undefined'){
    syncStatus = {state:'offline', lastSync:syncStatus.lastSync, message:'Firebase 라이브러리를 아직 불러오지 못했어요.'};
    updateSyncBadge();
    if(showAlert) alert('Firebase 라이브러리를 아직 불러오는 중이에요. 잠시 후 다시 시도해주세요 (인터넷 연결을 확인해주세요).');
    return;
  }
  try{
    firebaseApp = (firebase.apps && firebase.apps.length) ? firebase.apps[0] : firebase.initializeApp(config);
    firebaseDb = firebase.database();
    syncStatus.state = 'syncing'; updateSyncBadge();
    attachFirebaseListener();
  }catch(e){
    console.error('Firebase 초기화 실패:', e);
    syncStatus = {state:'error', lastSync:syncStatus.lastSync, message:e.message};
    updateSyncBadge();
    if(showAlert) alert('Firebase 연결에 실패했어요: ' + e.message + '\n\n붙여넣으신 설정이 정확한지 다시 확인해주세요.');
  }
}
function detachFirebaseListener(){
  try{ if(firebaseDb && firebaseListenerAttached) firebaseDb.ref('appData').off('value'); }catch(e){}
  firebaseListenerAttached = false;
  firebaseApp = null;
  firebaseDb = null;
}
let pendingLocalPush = false; // 방금 로컬에서 바뀐 게 있는데 아직 서버 저장이 안 끝난 상태인지
/* 항목(레코드) 하나를 고칠 때마다 "이 항목을 마지막으로 언제 고쳤는지"를 같이 기록해둔다.
   여러 명이 동시에 서로 다른 항목을 고쳐도, 나중에 서버와 합칠 때 항목 단위로 "누가 더 최근에 고쳤는지"
   비교해서 서로의 변경사항이 사라지지 않게 하기 위함 (전체를 통째로 덮어쓰지 않음). */
function touch(record){ if(record) record._ts = Date.now(); return record; }
/* 여러 명이 동시에 같은 프로모션/셋팅/라이브/풀필먼트 데이터를 만질 수 있기 때문에,
   "서버 데이터로 통째로 덮어쓰기"는 누군가 방금 고친 걸 다른 사람이 지워버리는 문제가 생긴다.
   그래서 자주 같이 만지는 배열들은 항목(id) 단위로 합치고, 같은 항목이 양쪽에 다 있으면
   touch()로 기록해둔 "_ts"(마지막으로 고친 시각)가 더 최근인 쪽을 그대로 살린다. */
function mergeById(localArr, serverArr){
  if(!Array.isArray(serverArr)) serverArr = [];
  if(!Array.isArray(localArr)) localArr = [];
  const byId = new Map();
  serverArr.forEach(r=>{ if(r && r.id) byId.set(r.id, r); });
  localArr.forEach(r=>{
    if(!r || !r.id) return;
    const existing = byId.get(r.id);
    if(!existing || Number(r._ts||0) >= Number(existing._ts||0)) byId.set(r.id, r);
  });
  return Array.from(byId.values());
}
/* 제안리스트는 한 줄 안에 여러 칸(담당자·등급·선정완료 등)이 있는데, 전체 줄 단위로만 "더 최신"을
   비교하면 — 누가 담당자만 살짝 고쳐도 그게 더 최신이 되어서, 내가 방금 체크한 선정완료가
   같이 덮어써져 사라지는 문제가 있었다. 그래서 선정완료(selectedBrands)만은 줄 전체와 별개로,
   브랜드 하나하나마다 각자 기록해둔 시각(selectedBrandsTs)을 비교해서 병합한다. */
function mergeProposals(localArr, serverArr){
  const merged = mergeById(localArr, serverArr);
  const localById = new Map((localArr||[]).filter(p=>p&&p.id).map(p=>[p.id,p]));
  const serverById = new Map((serverArr||[]).filter(p=>p&&p.id).map(p=>[p.id,p]));
  return merged.map(p=>{
    const localP = localById.get(p.id);
    const serverP = serverById.get(p.id);
    if(!localP || !serverP) return p; // 한쪽에만 있는 새 항목은 그대로 사용
    const brands = new Set([
      ...Object.keys(localP.selectedBrands||{}),
      ...Object.keys(serverP.selectedBrands||{}),
    ]);
    const mergedSelected = {};
    brands.forEach(b=>{
      const lTs = Number((localP.selectedBrandsTs||{})[b] || 0);
      const sTs = Number((serverP.selectedBrandsTs||{})[b] || 0);
      const lVal = !!(localP.selectedBrands||{})[b];
      const sVal = !!(serverP.selectedBrands||{})[b];
      const winner = (lTs >= sTs) ? lVal : sVal;
      mergedSelected[b] = winner;
      if(lVal !== sVal){
        console.log(`[선정완료 병합] "${p.promoName||p.id}" / ${b}: 로컬=${lVal}(${lTs}) 서버=${sVal}(${sTs}) → 결과=${winner}`);
      }
    });
    return Object.assign({}, p, {
      selectedBrands: mergedSelected,
      selectedBrandsTs: Object.assign({}, serverP.selectedBrandsTs, localP.selectedBrandsTs),
    });
  });
}
/* Firebase에서 실시간으로(또는 수동 새로고침으로) 새 데이터가 도착했을 때 로컬과 합치는 공통 로직 */
/* Firebase Realtime Database는 객체의 "키"에 . # $ / [ ] 문자를 쓸 수 없다(브랜드명에 "/"가 들어가는
   경우 등에서 저장이 거부됨). 그래서 Firebase로 보내기 직전에 키에 있는 이 문자들만 안전한 문자로
   바꿔서 보내고, 받아올 때 다시 원래대로 되돌린다. 값(문자열/숫자 등) 자체는 건드리지 않는다. */
const FIREBASE_KEY_ENCODE_MAP = {'.':'%2E', '#':'%23', '$':'%24', '/':'%2F', '[':'%5B', ']':'%5D'};
function encodeFirebaseKeys(obj){
  if(Array.isArray(obj)) return obj.map(encodeFirebaseKeys);
  if(obj && typeof obj==='object'){
    const out = {};
    Object.keys(obj).forEach(k=>{
      const safeKey = k.replace(/[.#$\/\[\]]/g, ch=>FIREBASE_KEY_ENCODE_MAP[ch]);
      out[safeKey] = encodeFirebaseKeys(obj[k]);
    });
    return out;
  }
  return obj;
}
function decodeFirebaseKeys(obj){
  if(Array.isArray(obj)) return obj.map(decodeFirebaseKeys);
  if(obj && typeof obj==='object'){
    const out = {};
    Object.keys(obj).forEach(k=>{
      const originalKey = k.replace(/%2E/g,'.').replace(/%23/g,'#').replace(/%24/g,'$').replace(/%2F/g,'/').replace(/%5B/g,'[').replace(/%5D/g,']');
      out[originalKey] = decodeFirebaseKeys(obj[k]);
    });
    return out;
  }
  return obj;
}
function handleRemoteStateUpdate(rawRemoteState){
  const remoteState = rawRemoteState ? decodeFirebaseKeys(rawRemoteState) : rawRemoteState;
  if(pendingLocalPush){ updateSyncBadge(); return; } // 아직 못 올린 로컬 변경사항이 있으면 섣불리 덮어쓰지 않는다
  if(!remoteState){
    // Firebase에 아직 아무 데이터도 없는 최초 상태 → 지금 로컬 내용을 그대로 올려보낸다
    scheduleServerPush();
    syncStatus = {state:'ok', lastSync: new Date().toISOString(), message:''};
    updateSyncBadge();
    return;
  }
  const localEdit = Number(state.__lastLocalEdit || 0);
  const serverEdit = Number(remoteState.__lastLocalEdit || 0);
  const serverPromo = remoteState.promotion || {};
  const serverLive = remoteState.live || {};
  const serverFulfillment = remoteState.fulfillment || {};

  if(localEdit > serverEdit){
    // 로컬이 서버보다 최신이면 절대로 로컬을 통째로 서버 걸로 바꾸지 않는다. 제안·선정·셋팅·라이브·풀필먼트만
    // 항목 단위로 합치고, 나머지(광고비 충전 내역, 스마트스토어 매출 등)는 전부 로컬 그대로 유지한다.
    if(state.promotion){
      state.promotion.proposals = mergeProposals(state.promotion.proposals, serverPromo.proposals||[]);
      state.promotion.selections = mergeById(state.promotion.selections, serverPromo.selections||[]);
      state.promotion.checklist = mergeById(state.promotion.checklist, serverPromo.checklist||[]);
    }
    if(state.live) state.live.schedule = mergeById(state.live.schedule, serverLive.schedule||[]);
    if(state.fulfillment) state.fulfillment.items = mergeById(state.fulfillment.items, serverFulfillment.items||[]);
    scheduleServerPush(); // 이렇게 합친 최신 내용을 다시 서버로 밀어올린다
  } else {
    // 서버가 로컬과 같거나 더 최신이면(다른 사람이 더 나중에 저장한 경우) 서버 내용을 기본으로 받아들이되,
    // 제안·선정·셋팅·라이브·풀필먼트는 그래도 항목 단위로 합쳐서 서로 다른 항목을 동시에 고쳐도 안 사라지게 한다.
    const localProposals = (state.promotion && state.promotion.proposals) || [];
    const localSelections = (state.promotion && state.promotion.selections) || [];
    const localChecklist = (state.promotion && state.promotion.checklist) || [];
    const localLiveSchedule = (state.live && state.live.schedule) || [];
    const localFulfillItems = (state.fulfillment && state.fulfillment.items) || [];

    state = Object.assign(defaultState(), remoteState);

    if(state.promotion){
      state.promotion.proposals = mergeProposals(localProposals, state.promotion.proposals);
      state.promotion.selections = mergeById(localSelections, state.promotion.selections);
      state.promotion.checklist = mergeById(localChecklist, state.promotion.checklist);
    }
    if(state.live) state.live.schedule = mergeById(localLiveSchedule, state.live.schedule);
    if(state.fulfillment) state.fulfillment.items = mergeById(localFulfillItems, state.fulfillment.items);
  }
  sanitizeStateArrays();
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  syncStatus = {state:'ok', lastSync: new Date().toISOString(), message:''};
  render();
}
/* 한 번 연결해두면, 이후로는 60초마다 물어보러 가는 게 아니라 Firebase가 변경사항이 생기는 즉시
   실시간으로 알려준다(웹소켓 방식). 그래서 다른 팀원이 저장하면 몇 초 안에 바로 반영된다. */
function attachFirebaseListener(){
  if(!firebaseDb || firebaseListenerAttached) return;
  firebaseListenerAttached = true;
  firebaseDb.ref('appData').on('value', (snapshot)=>{
    handleRemoteStateUpdate(snapshot.val());
  }, (err)=>{
    console.error('Firebase 실시간 동기화 오류:', err);
    syncStatus = {state:'offline', lastSync:syncStatus.lastSync, message:err.message};
    updateSyncBadge();
  });
}
async function loadFromServer(showAlertOnFail){
  const config = getFirebaseConfig();
  if(!config){ syncStatus = {state:'idle', lastSync:null, message:''}; updateSyncBadge(); return; }
  if(pendingLocalPush){ updateSyncBadge(); return; }
  if(!firebaseDb){ initFirebaseSync(showAlertOnFail); return; }
  syncStatus.state = 'syncing'; updateSyncBadge();
  try{
    const snapshot = await firebaseDb.ref('appData').get();
    handleRemoteStateUpdate(snapshot.val());
  }catch(e){
    console.error('Firebase 불러오기 실패:', e);
    syncStatus = {state:'offline', lastSync:syncStatus.lastSync, message:e.message};
    updateSyncBadge();
    if(showAlertOnFail) alert('Firebase 서버에 연결할 수 없습니다.\n' + e.message + '\n\n(연결 전까지는 이 기기에만 데이터가 저장되는 로컬 모드로 계속 사용할 수 있어요)');
  }
}
function scheduleServerPush(){
  if(!getFirebaseConfig()) return;
  pendingLocalPush = true;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(pushToServer, 250);
}
async function pushToServer(){
  if(!getFirebaseConfig()) return;
  if(!firebaseDb){ initFirebaseSync(false); if(!firebaseDb) return; }
  syncStatus.state = 'syncing'; updateSyncBadge();
  try{
    await firebaseDb.ref('appData').set(encodeFirebaseKeys(state));
    syncStatus = {state:'ok', lastSync: new Date().toISOString(), message:''};
    pendingLocalPush = false;
  }catch(e){
    console.error('Firebase 저장 실패:', e);
    syncStatus = {state:'error', lastSync:syncStatus.lastSync, message:e.message};
    // 저장 실패했으면 로컬 변경사항이 여전히 서버에 반영 안 된 상태이므로 pendingLocalPush를 유지하고 잠시 후 재시도
    setTimeout(()=>{ if(pendingLocalPush) scheduleServerPush(); }, 5000);
  }
  updateSyncBadge();
}
function manualRefresh(){
  loadFromServer(true);
}

  const el = document.getElementById('syncBadge');

/* 월별 충전 합계 계산 */
function monthlyCharged(charges, keyField, keyValue){
  const sums = {};
  MONTHS.forEach(m=> sums[m]=0);
  charges.filter(c=>c[keyField]===keyValue).forEach(c=>{
    const m = monthOf(c.date);
    if(m) sums[m] = (sums[m]||0) + Number(c.amount||0);
  });
  return sums;
}

/* 쇼검/GFA 공용: 월별 예산/이월/충전/잔액 계산 */
function computeMonthlyBudget(sectionKey, key, charges, keyField){
  const monthsData = state[sectionKey].months[key] || {};
  const charged = monthlyCharged(charges, keyField, key);
  const rows = [];
  let prevBalance = 0;
  MONTHS.forEach(m=>{
    const md = monthsData[m] || {};
    const budget = Number(md.budget||0);
    let rollover;
    if(md.rolloverManual !== undefined && md.rolloverManual !== null && md.rolloverManual !== ''){
      // 사용자가 직접 입력한 이월잔액 (자동계산 값을 덮어씀 — 시트 사용 시작 전 실제 잔액 반영용)
      rollover = Number(md.rolloverManual);
    } else if(m===1){
      rollover = 0;
    } else {
      rollover = Math.max(prevBalance,0);
    }
    const chargedAmt = charged[m]||0;
    const balance = budget - rollover - chargedAmt;
    rows.push({m, budget, rollover, charged:chargedAmt, balance});
    prevBalance = balance;
  });
  return rows;
}

function ensureMonthEntry(sectionKey, key, m){
  const months = state[sectionKey].months;
  if(!months[key]) months[key] = {};
  if(!months[key][m]) months[key][m] = {budget:0, rolloverManual:null};
  return months[key][m];
}

/* ---- 사이드바 메뉴 순서 (대카테고리/중카테고리 각각 드래그 또는 화살표 버튼으로 변경, localStorage에 저장) ---- */
function ensureNavOrder(){
  const defaultTop = NAV_GROUPS.map(g=>g.key);
  const defaultChildren = {};
  NAV_GROUPS.forEach(g=>{ if(g.type==='group') defaultChildren[g.key] = g.children.map(c=>c.sectionKey); });

  if(!state.navOrder || typeof state.navOrder!=='object' || Array.isArray(state.navOrder)){
    state.navOrder = {top:defaultTop.slice(), children:JSON.parse(JSON.stringify(defaultChildren))};
    return state.navOrder;
  }
  if(!Array.isArray(state.navOrder.top) || state.navOrder.top.length!==defaultTop.length || !defaultTop.every(k=>state.navOrder.top.includes(k))){
    state.navOrder.top = defaultTop.slice();
  }
  if(!state.navOrder.children || typeof state.navOrder.children!=='object') state.navOrder.children = {};
  Object.keys(defaultChildren).forEach(gk=>{
    const def = defaultChildren[gk];
    const cur = state.navOrder.children[gk];
    if(!Array.isArray(cur) || cur.length!==def.length || !def.every(k=>cur.includes(k))){
      state.navOrder.children[gk] = def.slice();
    }
  });
  return state.navOrder;
}
function ensureNavExpanded(){
  if(!state.navExpanded || typeof state.navExpanded!=='object') state.navExpanded = {};
  NAV_GROUPS.forEach(g=>{ if(g.type==='group' && !(g.key in state.navExpanded)) state.navExpanded[g.key]=true; });
  return state.navExpanded;
}
function toggleGroup(key){
  ensureNavExpanded();
  state.navExpanded[key] = !state.navExpanded[key];
  saveState(); render();
}

let dragCtx = null; // {scope:'top'|'child', groupKey, key}
function navDragStart(e, scope, groupKey){
  const el = e.currentTarget;
  const key = scope==='top' ? el.dataset.toplevel : el.dataset.child;
  dragCtx = {scope, groupKey, key};
  e.dataTransfer.effectAllowed = 'move';
  el.classList.add('dragging');
}
function navDragOver(e){
  e.preventDefault();
  e.currentTarget.classList.add('drag-over');
}
function navDragLeave(e){
  e.currentTarget.classList.remove('drag-over');
}
function navDrop(e, scope, groupKey){
  e.preventDefault();
  const el = e.currentTarget;
  el.classList.remove('drag-over');
  if(!dragCtx || dragCtx.scope!==scope) return;
  if(scope==='child' && dragCtx.groupKey!==groupKey) return; // 다른 그룹으로는 이동 불가
  const targetKey = scope==='top' ? el.dataset.toplevel : el.dataset.child;
  if(dragCtx.key===targetKey) return;
  const order = ensureNavOrder();
  const arr = scope==='top' ? order.top : order.children[groupKey];
  const fromIdx = arr.indexOf(dragCtx.key);
  const toIdx = arr.indexOf(targetKey);
  if(fromIdx===-1 || toIdx===-1) return;
  arr.splice(fromIdx,1);
  arr.splice(toIdx,0,dragCtx.key);
  saveState(); render();
}
function navDragEnd(e){
  e.currentTarget.classList.remove('dragging');
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.remove('drag-over'));
  dragCtx = null;
}

function renderNav(){
  const nav = document.getElementById('navList');
  const order = ensureNavOrder();
  ensureNavExpanded();
  nav.innerHTML = order.top.map((key,idx)=>{
    const def = NAV_GROUPS.find(g=>g.key===key);
    if(!def) return '';
    return def.type==='single'
      ? renderNavSingle(def, idx, order.top.length)
      : renderNavGroup(def, idx, order.top.length, order.children[key]||[]);
  }).join('');
}

function renderNavSingle(def, idx, total){
  const active = currentSection===def.sectionKey;
  return `
    <div class="nav-item nav-top ${active?'active':''}" data-toplevel="${def.key}" draggable="true"
      onclick="navigate('${def.sectionKey}')"
      ondragstart="navDragStart(event,'top')" ondragover="navDragOver(event)"
      ondragleave="navDragLeave(event)" ondrop="navDrop(event,'top')" ondragend="navDragEnd(event)">
      <span class="drag-handle" title="드래그해서 순서 변경">⠿</span>
      <span class="nav-dot" style="background:${def.color}"></span>
      <span class="nav-label">${def.label}</span>
    </div>`;
}

function renderNavGroup(def, idx, total, childOrder){
  const expanded = state.navExpanded[def.key] !== false;
  const anyChildActive = childOrder.includes(currentSection);
  const childrenHtml = childOrder.map((sk,cidx)=>{
    const childDef = def.children.find(c=>c.sectionKey===sk);
    if(!childDef) return '';
    const active = currentSection===sk;
    return `
      <div class="nav-item nav-child ${active?'active':''}" data-child="${sk}" data-group="${def.key}" draggable="true"
        onclick="navigate('${sk}')"
        ondragstart="navDragStart(event,'child','${def.key}')" ondragover="navDragOver(event)"
        ondragleave="navDragLeave(event)" ondrop="navDrop(event,'child','${def.key}')" ondragend="navDragEnd(event)">
        <span class="drag-handle" title="드래그해서 순서 변경">⠿</span>
        <span class="nav-dot" style="background:${childDef.color}"></span>
        <span class="nav-label">${childDef.label}</span>
      </div>`;
  }).join('');

  return `
    <div class="nav-group">
      <div class="nav-item nav-group-header ${anyChildActive?'active-parent':''}" data-toplevel="${def.key}" draggable="true"
        onclick="navigate('${childOrder[0]}')"
        ondragstart="navDragStart(event,'top')" ondragover="navDragOver(event)"
        ondragleave="navDragLeave(event)" ondrop="navDrop(event,'top')" ondragend="navDragEnd(event)">
        <span class="drag-handle" title="드래그해서 순서 변경">⠿</span>
        <span class="nav-dot" style="background:${def.color}"></span>
        <span class="nav-label">${def.label}</span>
        <button class="nav-chevron" onclick="event.stopPropagation(); toggleGroup('${def.key}')" title="펼치기/접기">${expanded?'▾':'▸'}</button>
      </div>
      <div class="nav-children" style="display:${expanded?'block':'none'}">
        ${childrenHtml}
      </div>
    </div>`;
}

/* 월요일 시작 기준으로 이 날짜가 속한 주의 시작일~종료일을 구한다 */
function weekRangeOf(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  const day = d.getDay();
  const diffToMon = (day===0 ? -6 : 1-day);
  const monday = new Date(d); monday.setDate(d.getDate()+diffToMon);
  const sunday = new Date(monday); sunday.setDate(monday.getDate()+6);
  const fmt = x=>`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;
  return {start:fmt(monday), end:fmt(sunday)};
}
function sumDailyAmount(rows){ return rows.reduce((s,r)=>s+(Number(r.amount)||0),0); }

/* ---- 일간 매출: 달력 칸에 직접 숫자 입력 ---- */
function findDailyEntry(store, dateStr){
  return ensureSmartstore().daily.find(r=>r.store===store && r.date===dateStr);
}
function setDailyAmount(store, dateStr, value){
  const ss = ensureSmartstore();
  const amt = sanitizePromoNumber(value);
  let entry = ss.daily.find(r=>r.store===store && r.date===dateStr);
  if(!entry){
    if(!amt) return;
    ss.daily.push({id:uid(), store, date:dateStr, amount:amt, orderCount:''});
  } else {
    entry.amount = amt;
  }
  saveState(); render();
}
/* 달력 칸에는 "만원" 단위로 짧게 입력한다 (예: 150 입력 → 1,500,000원으로 저장) */
function setDailyAmountManwon(store, dateStr, value){
  const manwon = Number(String(value).replace(/[^0-9.\-]/g,'')) || 0;
  const won = Math.round(manwon * 10000);
  setDailyAmount(store, dateStr, String(won));
}

function buildSalesInputCalGrid(y, m, store){
  const firstWeekday = new Date(y, m-1, 1).getDay();
  const daysInMonth = new Date(y, m, 0).getDate();
  const pad2 = n => String(n).padStart(2,'0');
  const cells = [];
  for(let i=0;i<firstWeekday;i++) cells.push(null);
  for(let d=1; d<=daysInMonth; d++) cells.push(d);
  while(cells.length % 7 !== 0) cells.push(null);
  const todayStr2 = todayStr();
  let weekRows = '';
  for(let w=0; w<cells.length/7; w++){
    weekRows += '<tr>';
    for(let c=0;c<7;c++){
      const day = cells[w*7+c];
      if(day===null){ weekRows += `<td class="ss-input-cal-cell empty-cell"></td>`; continue; }
      const dateStr = `${y}-${pad2(m)}-${pad2(day)}`;
      const entry = findDailyEntry(store, dateStr);
      const isToday = dateStr===todayStr2;
      const wd = new Date(y,m-1,day).getDay();
      weekRows += `
        <td class="ss-input-cal-cell ${isToday?'is-today':''}">
          <div class="ss-input-cal-daynum ${wd===0?'sun':''} ${wd===6?'sat':''}">${day}</div>
          <input class="ss-input-cal-input" type="text" inputmode="numeric" placeholder="-"
            value="${entry && entry.amount ? Math.round(Number(entry.amount)/10000).toLocaleString('ko-KR') : ''}"
            onchange="setDailyAmountManwon('${store.replace(/'/g,"\\'")}','${dateStr}', this.value)">
        </td>`;
    }
    weekRows += '</tr>';
  }
  return `<table class="ss-input-cal-table"><thead><tr>${PROMO_WEEKDAY_KR.map((w,i)=>`<th class="${i===0?'sun':''} ${i===6?'sat':''}">${w}</th>`).join('')}</tr></thead><tbody>${weekRows}</tbody></table>`;
}

}

];
function findWeeklyEntry(store, weekStart){

/* 스마트스토어 대시보드에 입력해둔 일간 매출(state.smartstore.daily)에서, 이 주간(목~수) 구간에
   해당하는 날짜들의 매출을 합산해서 매출액을 자동으로 끌어온다. 따로 입력할 필요가 없다. */
function weeklyRevenueFromDaily(store, weekStart, weekEnd){
  const daily = ensureSmartstore().daily;
  return daily
    .filter(r=> r.store===store && r.date>=weekStart && r.date<=weekEnd)
    .reduce((s,r)=> s + (Number(r.amount)||0), 0);
}
function updateWeeklyMeetingField(store, weekStart, weekEnd, field, value){
  const wm = ensureWeeklyMeeting();
  let entry = wm.entries.find(e=>e.store===store && e.weekStart===weekStart);
  if(!entry){
    entry = {id:uid(), store, weekStart, weekEnd, revenue:'', profit:'', aov:'', conversionRate:'', visitors:'', eventSales:'', subscribers:''};
    wm.entries.push(entry);
  }
  entry[field] = sanitizePromoNumber(value);
  entry.weekEnd = weekEnd;
  saveState(); render();
}
let weeklyMeetingChartMetric = 'revenue';
function switchWeeklyMeetingChartMetric(key){ weeklyMeetingChartMetric = key; render(); }
function buildWeeklyTrendChart(weeks, visibleStores, metricKey){
  const width = 760, height = 220, padL = 60, padR = 16, padT = 16, padB = 30;
  const innerW = width - padL - padR;
  const innerH = height - padT - padB;

  const seriesData = visibleStores.map(store => weeks.map(w=>{
    if(metricKey==='revenue'){
      const v = weeklyRevenueFromDaily(store, w.start, w.end);
      return v>0 ? v : null;
    }
    const entry = findWeeklyEntry(store, w.start);
    const raw = entry ? entry[metricKey] : '';
    return (raw==='' || raw===undefined || raw===null) ? null : Number(raw);
  }));

  const allVals = seriesData.flat().filter(v=>v!==null);
  if(allVals.length===0){
    return `<div class="empty" style="padding:30px 0">이 지표에 입력된 데이터가 아직 없어요.</div>`;
  }
  let maxVal = Math.max(...allVals), minVal = Math.min(0, ...allVals);
  if(maxVal===minVal) maxVal = minVal + 1;
  const range = maxVal - minVal;
  const xStep = weeks.length>1 ? innerW/(weeks.length-1) : 0;
  const xOf = i => padL + i*xStep;
  const yOf = v => padT + innerH - ((v-minVal)/range)*innerH;

  let svg = `<svg viewBox="0 0 ${width} ${height}" class="wm-chart-svg" preserveAspectRatio="xMidYMid meet">`;
  svg += `<line x1="${padL}" y1="${yOf(0)}" x2="${padL+innerW}" y2="${yOf(0)}" stroke="#E2E5EA" stroke-width="1"/>`;
  svg += `<text x="${padL-8}" y="${padT+4}" font-size="10" fill="#8A93A6" text-anchor="end">${Math.round(maxVal).toLocaleString('ko-KR')}</text>`;
  svg += `<text x="${padL-8}" y="${padT+innerH+4}" font-size="10" fill="#8A93A6" text-anchor="end">${Math.round(minVal).toLocaleString('ko-KR')}</text>`;
  weeks.forEach((w,i)=>{
    svg += `<text x="${xOf(i)}" y="${height-8}" font-size="10" fill="#8A93A6" text-anchor="middle">${w.label}</text>`;
  });

  visibleStores.forEach((store, si)=>{
    const color = promoBrandColor(store);
    const pts = seriesData[si].map((v,i)=> v===null ? null : `${xOf(i)},${yOf(v)}`).filter(Boolean).join(' ');
    if(pts) svg += `<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.5"/>`;
    seriesData[si].forEach((v,i)=>{
      if(v!==null) svg += `<circle cx="${xOf(i)}" cy="${yOf(v)}" r="3.5" fill="${color}"><title>${store} ${weeks[i].label}: ${v.toLocaleString('ko-KR')}</title></circle>`;
    });
  });
  svg += `</svg>`;

  const legend = visibleStores.map(store=>`
    <span class="wm-chart-legend-item"><span class="wm-chart-legend-dot" style="background:${promoBrandColor(store)}"></span>${store}</span>
  `).join('');

  return `${svg}<div class="wm-chart-legend">${legend}</div>`;
}

function pctChangeOf(curr, prev){
  if(curr===''||curr===undefined||curr===null||prev===''||prev===undefined||prev===null) return null;
  const c = Number(curr), p = Number(prev);
  if(!isFinite(c) || !isFinite(p) || p===0) return null;
  return Math.round((c-p)/p*100);
}

/* 목요일 시작(전주 목~이번주 수) 기준 주간 구간들을, 지정한 달에 목요일이 포함되는 주만 골라 반환 */
function thuWedWeeksOfMonth(y, m){
  const pad2 = n => String(n).padStart(2,'0');
  const fmt = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
  const flabel = d => `${d.getMonth()+1}/${d.getDate()}`;
  const first = new Date(y, m-1, 1);
  const last = new Date(y, m, 0);
  const weeks = [];
  for(let d = new Date(first); d<=last; d.setDate(d.getDate()+1)){
    if(d.getDay()===4){
      const start = new Date(d);
      const end = new Date(d); end.setDate(end.getDate()+6);
      weeks.push({start: fmt(start), end: fmt(end), label: `${flabel(start)}~${flabel(end)}`});
    }
  }
  return weeks;
}

/* 입고량 계산: 필요한 만큼(평균출고량×기준일−현재고)을 그대로 입고하면 박스 단위로 안 맞아떨어질 수 있어서,
   먼저 필요 박스 수를 반올림(0.5 이상 올림/미만 내림)으로 정하고, 그 박스 수 × 입수량을 최종 입고수량(EA)으로 삼는다.
   이렇게 하면 입고수량(EA)은 항상 입수량으로 정확히 나누어떨어진다. */
function calcInbound(avgOutbound, baseDate, currentStock, packQty){
  const po = Number(packQty);
  if(!po || po<=0) return {ea:null, box:null};
  const rawNeed = Number(avgOutbound||0) * Number(baseDate||0) - Number(currentStock||0);
  if(rawNeed<=0) return {ea:0, box:0};
  const box = Math.round(rawNeed / po); // 0.5 이상 올림, 0.5 미만 내림 (Math.round 기본 동작)
  return {ea: box*po, box};
}

  f.items.forEach(it=>{

/* CJ "통합재고조회_상품별" 양식 전용 가져오기.
   헤더가 2줄로 되어있고 병합 셀이 많아서 이름으로 열을 찾기 어려우므로, 열 위치(D=품목코드, H=가용수량, T=평균출고량)로 직접 읽는다.
   품목코드가 이미 "품목 데이터"에 등록되어 있는 품목만 매칭해서 현재고·평균출고량을 채워준다 (새 품목은 만들지 않음). */
async function importCjStockExcel(){
  const fileInput = document.getElementById('cjStockFile');
  const resultEl = document.getElementById('cjStockResult');
  const file = fileInput && fileInput.files[0];
  if(!file){ resultEl.innerHTML = '<div class="helptext" style="color:var(--negative);margin-top:6px">엑셀 파일을 선택해주세요.</div>'; return; }
  if(typeof XLSX === 'undefined'){
    resultEl.innerHTML = '<div class="helptext" style="color:var(--negative);margin-top:6px">엑셀 처리 기능을 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침 후 다시 시도해주세요.</div>';
    return;
  }
  resultEl.innerHTML = '<div class="helptext" style="margin-top:6px">불러오는 중...</div>';
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array', cellDates:false});
    const ws = wb.Sheets[wb.SheetNames[0]];
    // header:1 → 열 이름이 아니라 행 배열 그대로 받아서, D/H/T 열(품목코드/가용수량/평균출고량) 위치로 직접 읽는다
    const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
    const f = ensureFulfillment();
    const byCode = {};
    f.items.forEach(it=>{ if(it.itemCode) byCode[String(it.itemCode).trim()] = it; });

    let matched = 0;
    const unmatched = [];
    rows.forEach(row=>{
      const itemCode = String(row[3]||'').trim(); // D열: 품목코드
      if(!itemCode || itemCode==='품목코드') return; // 헤더행/빈행 스킵
      const availQty = row[7];  // H열: 가용수량 → 현재고로 사용
      const avgOut = row[19];   // T열: 평균출고량
      if(availQty==='' && avgOut==='') return; // SUM행 등 수치 없는 행 스킵
      const item = byCode[itemCode];
      if(!item){ unmatched.push(itemCode); return; }
      item.currentStock = sanitizePromoNumber(String(availQty));
      item.avgOutbound = sanitizePromoNumber(String(avgOut));
      matched++;
    });
    saveState();
    let msg = `${matched}개 품목의 현재고·평균출고량을 채웠어요.`;
    if(unmatched.length>0) msg += `\n\n품목 데이터에 없는 품목코드 ${unmatched.length}개는 건너뛰었어요:\n${unmatched.slice(0,15).join(', ')}${unmatched.length>15?' 등':''}`;
    alert(msg);
    render();
  }catch(e){
    console.error(e);
    resultEl.innerHTML = '<div class="helptext" style="color:var(--negative);margin-top:6px">가져오기 실패: ' + e.message + '</div>';
  }
}

    if(ea!==null) totalEA += ea;

function ensurePromotion(){
  if(!state.promotion || typeof state.promotion!=='object'){
    state.promotion = {
      brands: bizwalletBrandsList().slice(), // 프로모션 전용 브랜드 목록 (셋팅에서 자유롭게 추가/삭제 가능, 광고 탭 데이터와는 무관)
      owners: [],
      proposals: [],
      selections: [], // 선정리스트 — 제안리스트와 별개로 수기 입력하는 데이터
      checklist: [], // 셋팅 — 프로모션 선정 후 후속작업 체크리스트
      calendarFilter: {}, // {브랜드: true/false} — 없으면 기본 표시(true)
      proposalFilter: {},
      selectionFilter: {},
      checklistFilter: {},
      brandLinks: {}, // { [브랜드]: {storeLink, productLinkPrefix} } — 셋팅도우미에서 상품 링크 자동 생성에 사용
      sheetSyncUrl: '', // 제안리스트 신규/수정 항목을 자동으로 보낼 구글 앱스스크립트 웹앱 주소
      proposeCalendarId: '', // 제안캘린더와 연동할 구글 캘린더 ID
      selectedCalendarId: '', // 선정캘린더와 연동할 구글 캘린더 ID
    };
  }
  if(!Array.isArray(state.promotion.brands)) state.promotion.brands = [];
  if(!Array.isArray(state.promotion.owners)) state.promotion.owners = [];
  if(!Array.isArray(state.promotion.proposals)) state.promotion.proposals = [];
  if(!Array.isArray(state.promotion.selections)) state.promotion.selections = [];
  if(!Array.isArray(state.promotion.checklist)) state.promotion.checklist = [];
  if(!state.promotion.calendarFilter || typeof state.promotion.calendarFilter!=='object') state.promotion.calendarFilter = {};
  if(!state.promotion.proposalFilter || typeof state.promotion.proposalFilter!=='object') state.promotion.proposalFilter = {};
  if(!state.promotion.selectionFilter || typeof state.promotion.selectionFilter!=='object') state.promotion.selectionFilter = {};
  if(!state.promotion.checklistFilter || typeof state.promotion.checklistFilter!=='object') state.promotion.checklistFilter = {};
  if(!state.promotion.brandLinks || typeof state.promotion.brandLinks!=='object') state.promotion.brandLinks = {};
  if(state.promotion.sheetSyncUrl===undefined) state.promotion.sheetSyncUrl = '';
  if(state.promotion.proposeCalendarId===undefined) state.promotion.proposeCalendarId = '';
  if(state.promotion.selectedCalendarId===undefined) state.promotion.selectedCalendarId = '';
  // 기존 데이터 마이그레이션: 제안리스트가 단일 brand(문자열)만 갖고 있던 예전 데이터를
  // brands(배열)로도 채워서 여러 브랜드를 다룰 수 있게 한다. 기존 brand 필드는 그대로 보존.
  state.promotion.proposals.forEach(p=>{
    if(!Array.isArray(p.brands)){
      p.brands = p.brand ? [p.brand] : [];
    }
    // 선정완료를 브랜드별로 관리하도록 마이그레이션: 예전에 전체 selectedDone이 true였다면
    // 그 시점 브랜드들을 모두 선정된 것으로 간주해 이관하고, 기존 selectedDone 필드는 그대로 둔다.
    if(!p.selectedBrands || typeof p.selectedBrands!=='object'){
      p.selectedBrands = {};
      if(p.selectedDone){
        p.brands.forEach(b=>{ p.selectedBrands[b] = true; });
      }
    }
  });
  // 셋팅 체크리스트: 쇼핑스토리/롤링배너/상세배너/마케팅메시지/카테고리 5칸을 "배너셋팅" 1칸으로 통합.
  // 예전 값은 지우지 않고 그대로 두되(데이터 보존), 화면에는 배너셋팅만 보이도록 대표값을 하나 뽑아둔다.
  state.promotion.checklist.forEach(c=>{
    if(c.bannerSetting === undefined){
      const legacy = [c.shoppingStory, c.rollingBanner, c.detailBanner, c.marketingMessage, c.category].filter(Boolean);
      c.bannerSetting = legacy.length ? legacy[0] : '';
    }
  });
  return state.promotion;
}

/* ---- 엑셀 가져오기 (제안리스트 / 선정리스트 / 셋팅) ---- */
function excelToDateStr(v){
  if(v===undefined || v===null || v==='') return '';
  // 엑셀에서 읽은 날짜 셀은 보통 순수 숫자(일련번호)로 들어온다 — Date 객체 변환은 컴퓨터 시간대에 따라
  // 값 자체가 달라지는 문제가 있어서, 숫자는 우리가 직접(시간대 영향 없이) 계산한다.
  if(typeof v === 'number' && !isNaN(v)){
    return excelSerialToDateStr(v);
  }
  if(Object.prototype.toString.call(v)==="[object Date]" && !isNaN(v.getTime())){
    const y=v.getUTCFullYear(), m=String(v.getUTCMonth()+1).padStart(2,'0'), d=String(v.getUTCDate()).padStart(2,'0');
    return `${y}-${m}-${d}`;
  }
  const s = String(v).trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const m2 = s.match(/^(\d{4})[.\/](\d{1,2})[.\/](\d{1,2})/);
  if(m2) return `${m2[1]}-${String(m2[2]).padStart(2,'0')}-${String(m2[3]).padStart(2,'0')}`;
  // 위 형식으로도 못 알아들었으면, 더 폭넓게 시도해보는 파서로 한 번 더 시도
  const flexible = parseFlexibleDate(s);
  if(/^\d{4}-\d{2}-\d{2}$/.test(flexible)) return flexible;
  // 마지막 안전장치: 브라우저의 일반 날짜 파싱에 맡겨본다 (예: "Tue Aug 04 2026 ..." 같은 문자열도 처리)
  const generic = new Date(s);
  if(!isNaN(generic.getTime())){
    const y=generic.getFullYear(), m=String(generic.getMonth()+1).padStart(2,'0'), d=String(generic.getDate()).padStart(2,'0');
    return `${y}-${m}-${d}`;
  }
  return s; // 그래도 인식 못하면 원본 텍스트를 그대로 두고, 나중에 화면에서 직접 고칠 수 있게 함
}
/* 엑셀 셀 하나를 복사해서 날짜 입력칸(달력)에 그대로 붙여넣기 하면(Ctrl+V) 자동으로 yyyy-mm-dd로 바꿔서 넣어준다.
   <input type="date">는 원래 이 형식이 아니면 붙여넣기가 아예 씹히기 때문에, 여러 형식(2026-08-04, 2026/8/4,
   2026.8.4, 엑셀 날짜 일련번호 등)을 미리 알아서 변환해준다. */
function excelSerialToDateStr(serial){
  const utcDays = Math.floor(serial - 25569);
  const date = new Date(utcDays * 86400 * 1000);
  const y=date.getUTCFullYear(), m=String(date.getUTCMonth()+1).padStart(2,'0'), d=String(date.getUTCDate()).padStart(2,'0');
  return `${y}-${m}-${d}`;
}
function excelSerialToTimeStr(serial){
  const frac = serial - Math.floor(serial);
  const totalMin = Math.round(frac * 24 * 60);
  const h = Math.floor(totalMin/60) % 24, m = totalMin % 60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}
function parseFlexibleDate(raw){
  if(!raw) return '';
  const s = String(raw).trim();
  if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);
  let m = s.match(/^(\d{4})[.\/](\d{1,2})[.\/](\d{1,2})/);
  if(m) return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
  m = s.match(/^(\d{1,2})[.\/](\d{1,2})[.\/](\d{4})$/);
  if(m){
    const a=parseInt(m[1],10), b=parseInt(m[2],10), y=m[3];
    // 12보다 크면 일(day)일 수밖에 없으므로 뒤에서부터 판단, 그 외엔 월/일(mm/dd) 순으로 가정
    if(a>12) return `${y}-${String(b).padStart(2,'0')}-${String(a).padStart(2,'0')}`;
    return `${y}-${String(a).padStart(2,'0')}-${String(b).padStart(2,'0')}`;
  }
  // "1월2일", "12월 25일" 처럼 연도가 아예 없는 한글 날짜 — 앱이 관리하는 연도(YEAR)를 붙여서 인식한다
  m = s.match(/^(\d{1,2})\s*월\s*(\d{1,2})\s*일$/);
  if(m) return `${YEAR}-${String(m[1]).padStart(2,'0')}-${String(m[2]).padStart(2,'0')}`;
  if(/^\d{4,6}$/.test(s)){
    const num = parseInt(s,10);
    if(num>20000 && num<80000) return excelSerialToDateStr(num); // 엑셀 날짜 일련번호로 추정되는 범위
  }
  return '';
}
function handleDatePaste(e){
  const text = (e.clipboardData || window.clipboardData).getData('text');
  if(!text) return;
  const parsed = parseFlexibleDate(text);
  if(!/^\d{4}-\d{2}-\d{2}$/.test(parsed)) return; // 못 알아들으면 브라우저 기본 붙여넣기 동작에 맡김
  e.preventDefault();
  e.target.value = parsed;
  e.target.dispatchEvent(new Event('change', {bubbles:true}));
}
function excelRowVal(row, ...keys){
  for(const k of keys){
    if(row[k]!==undefined && row[k]!==null && String(row[k]).trim()!==''){
      return String(row[k]).trim();
    }
  }
  return '';
}
/* excelRowVal과 달리 값을 문자열로 미리 바꾸지 않고 원본 그대로(Date 객체·숫자 등) 반환한다.
   날짜/시간 칸은 미리 문자열로 바꿔버리면(특히 Date 객체의 toString()은 컴퓨터의 시간대에 따라
   달라짐) 하루씩 밀리는 등 오작동하므로, 날짜·시간은 반드시 이 함수로 원본을 가져와야 한다. */
function excelRawVal(row, ...keys){
  for(const k of keys){
    if(row[k]!==undefined && row[k]!==null && row[k]!==''){
      return row[k];
    }
  }
  return '';
}
function excelRowBool(row, ...keys){
  const v = excelRowVal(row, ...keys).toLowerCase();
  return ['y','yes','예','true','1','완료','o','v'].includes(v);
}

  if(position==='bottom'){
    const sortedDesc = order.slice().sort((a,b)=>{

      const entry = groups.get(key);

      promo.selections.unshift(entry);

  return count;

    return;
  }
  resultEl.innerHTML = '<div class="helptext" style="margin-top:8px">가져오는 중...</div>';
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array', cellDates:false});
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, {defval:''});
    const batchId = uid();
    let count = 0;
    if(target==='proposals') count = importProposalsFromRows(rows, position, batchId);
    else if(target==='selections') count = importSelectionsFromRows(rows, position, batchId);
    else if(target==='checklist') count = importChecklistFromRows(rows, position, batchId);
    else if(target==='liveSchedule') count = importLiveScheduleFromRows(rows, position, batchId);
    else if(target==='fulfillmentItems') count = importFulfillmentItemsFromRows(rows, position, batchId);
    if(count>0){
      const batches = ensureImportBatches();
      batches.unshift({id:batchId, target, count, importedAt:new Date().toISOString()});
      while(batches.length>20) batches.pop();
    }
    saveState();
    if(count===0){
      alert('엑셀에서 인식할 수 있는 행을 찾지 못했어요. 1행(제목 행)의 열 이름이 안내된 이름과 같은지 확인해주세요.');
    } else {
      alert(`${count}개 행을 가져왔어요! 해당 시트로 이동해서 확인해보세요.\n(잘못 가져왔다면 이 화면 아래 "최근 가져오기 이력"에서 한 번에 되돌릴 수 있어요)`);
    }
    render();
  }catch(e){
    console.error(e);
    resultEl.innerHTML = '<div class="helptext" style="color:var(--negative);margin-top:8px">가져오기 실패: ' + e.message + '</div>';
  }
}

function koreanWeekday(dateStr){
  if(!dateStr) return '';
  const d = new Date(dateStr+'T00:00:00');
  if(isNaN(d.getTime())) return '';
  return PROMO_WEEKDAY_KR[d.getDay()] + '요일';
}
/* 오늘 기준 목표일까지 영업일(주말 제외) 수를 계산. 미래면 양수, 과거(이미 지남)면 음수 */
function businessDaysUntil(dateStr){
  if(!dateStr) return null;
  const target = new Date(dateStr+'T00:00:00');
  if(isNaN(target.getTime())) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  target.setHours(0,0,0,0);
  const isWeekend = d => d.getDay()===0 || d.getDay()===6;
  let count = 0;
  const cur = new Date(today);
  if(target.getTime()===today.getTime()) return 0;
  if(target > today){
    while(cur < target){
      cur.setDate(cur.getDate()+1);
      if(!isWeekend(cur)) count++;
    }
    return count;
  } else {
    while(cur > target){
      cur.setDate(cur.getDate()-1);
      if(!isWeekend(cur)) count--;
    }
    return count;
  }
}
function promoBrandColor(brand){
  const list = ensurePromotion().brands;
  let idx = list.indexOf(brand);
  if(idx===-1){

    idx = brand.split('').reduce((s,c)=>s+c.charCodeAt(0),0);
  }
  return PROMO_COLOR_PALETTE[idx % PROMO_COLOR_PALETTE.length];
}

let sheetDragKey = null, sheetDragId = null;
function sheetGetArray(key){
  if(key==='liveSchedule') return ensureLive().schedule;
  const promo = ensurePromotion();
  if(key==='proposals') return promo.proposals;
  if(key==='selections') return promo.selections;

  sheetDragKey = key; sheetDragId = id;

  e.preventDefault();
  e.currentTarget.classList.add('sheet-drag-over');

  e.currentTarget.classList.remove('sheet-drag-over');

function sheetDropRow(e, key, targetId){
  e.preventDefault();
  document.querySelectorAll('.sheet-drag-over').forEach(el=>el.classList.remove('sheet-drag-over'));
  if(sheetDragKey!==key || !sheetDragId || sheetDragId===targetId){ sheetDragKey=null; sheetDragId=null; return; }
  const arr = sheetGetArray(key);
  const fromIdx = arr.findIndex(x=>x.id===sheetDragId);
  const toIdx = arr.findIndex(x=>x.id===targetId);
  sheetDragKey=null; sheetDragId=null;
  if(fromIdx===-1 || toIdx===-1) return;
  const [item] = arr.splice(fromIdx,1);
  arr.splice(toIdx,0,item);
  saveState(); render();
}

  document.querySelectorAll('.sheet-drag-over').forEach(el=>el.classList.remove('sheet-drag-over'));

function ensureColWidths(table){
  if(!state.promotion) ensurePromotion();
  if(!state.colWidths || typeof state.colWidths!=='object') state.colWidths = {};
  if(!state.colWidths[table] || typeof state.colWidths[table]!=='object') state.colWidths[table] = {};
  return state.colWidths[table];
}
function renderColGroup(table, defaults){
  const widths = ensureColWidths(table);
  return '<colgroup>' + defaults.map((d,i)=>`<col style="width:${widths[i]||d}px">`).join('') + '</colgroup>';
}
let colResizeState = null;
document.addEventListener('mousedown', function(e){
  const handle = e.target.closest('.col-resizer');
  if(!handle) return;
  e.preventDefault();
  const table = handle.dataset.table;
  const col = parseInt(handle.dataset.col, 10);
  const th = handle.closest('th');
  const startWidth = th ? th.getBoundingClientRect().width : 80;
  colResizeState = {table, col, startX:e.clientX, startWidth};
  handle.classList.add('active');
  document.body.classList.add('col-resizing');
});
document.addEventListener('mousemove', function(e){
  if(!colResizeState) return;
  const delta = e.clientX - colResizeState.startX;
  const newWidth = Math.max(32, Math.round(colResizeState.startWidth + delta));
  const widths = ensureColWidths(colResizeState.table);
  widths[colResizeState.col] = newWidth;
  const wrap = document.getElementById('sheetWrap_' + colResizeState.table);
  if(wrap){
    const cols = wrap.querySelectorAll('colgroup col');
    if(cols[colResizeState.col]) cols[colResizeState.col].style.width = newWidth + 'px';
  }
});
document.addEventListener('mouseup', function(){
  if(!colResizeState) return;
  colResizeState = null;
  document.body.classList.remove('col-resizing');
  document.querySelectorAll('.col-resizer.active').forEach(el=>el.classList.remove('active'));
  saveState();
});
function colResizerHtml(table, colIndex){
  return `<div class="col-resizer" data-table="${table}" data-col="${colIndex}"></div>`;
}

// 제안리스트 → gid 956711804 탭
function handleProposalSync(ss, data) {
  var targetGid = 956711804;
  var sheet = ss.getSheets().filter(function(s){ return s.getSheetId() === targetGid; })[0];
  if (!sheet) sheet = ss.getSheets()[0];

  var header = ['ID','제안마감일','시작일','종료일','브랜드','프로모션명','등급','담당자','제안완료','선정완료 브랜드','관련링크'];
  if (sheet.getLastRow() === 0) sheet.appendRow(header);

  var lastRow = sheet.getLastRow();
  var ids = lastRow > 1 ? sheet.getRange(2, 1, lastRow - 1, 1).getValues().flat() : [];
  var rowIndex = ids.indexOf(data.id);

  var rowValues = [
    data.id, data.proposeDate || '', data.periodStart || '', data.periodEnd || '',
    data.brands || '', data.promoName || '', data.grade || '', data.owner || '',
    data.proposeDone || '', data.selectedBrands || '', data.link || ''
  ];

  if (rowIndex >= 0) {
    sheet.getRange(rowIndex + 2, 1, 1, rowValues.length).setValues([rowValues]);
  } else {
    sheet.appendRow(rowValues);
  }
}

// 선정리스트 → gid 511039182 탭
// 항목(entryId) 하나에 상품이 여러 개 있을 수 있어서, 매번 그 항목에 해당하는 행들을
// 지금 보낸 내용(rows)으로 통째로 맞춰친다 (기존 행 중 이번에 없는 건 지우고, 있는 건 갱신, 새 건 추가).
function handleSelectionSync(ss, data) {
  var targetGid = 511039182;
  var sheet = ss.getSheets().filter(function(s){ return s.getSheetId() === targetGid; })[0];
  if (!sheet) sheet = ss.getSheets()[0];

  var header = ['행키','시작일','종료일','프로모션명','노출구좌','노출일','브랜드','상품코드','상품명','등록가','즉시할인가','최종혜택가','할인율'];
  if (sheet.getLastRow() === 0) sheet.appendRow(header);

  var lastRow = sheet.getLastRow();
  var allKeys = lastRow > 1 ? sheet.getRange(2, 1, lastRow - 1, 1).getValues().flat() : [];

  // 1) 이 항목(entryId)에 해당하던 기존 행 중, 이번에 안 보낸(삭제된) 것들은 지운다
  var prefix = data.entryId + '_';
  for (var i = allKeys.length - 1; i >= 0; i--) {
    var key = allKeys[i];
    if (String(key).indexOf(prefix) === 0) {
      var stillExists = (data.rows || []).some(function(r){ return r.rowKey === key; });
      if (!stillExists) {
        sheet.deleteRow(i + 2);
        allKeys.splice(i, 1);
      }
    }
  }

  // 2) 보낸 행들을 갱신하거나 새로 추가한다
  (data.rows || []).forEach(function(r) {
    var rowValues = [
      r.rowKey, r.startDate || '', r.endDate || '', r.promoName || '', r.exposureSlot || '',
      r.exposureDate || '', r.brand || '', r.code || '', r.name || '',
      r.regPrice || '', r.instantDiscountPrice || '', r.finalBenefitPrice || '', r.rate || ''
    ];
    var idx = allKeys.indexOf(r.rowKey);
    if (idx >= 0) {
      sheet.getRange(idx + 2, 1, 1, rowValues.length).setValues([rowValues]);
    } else {
      sheet.appendRow(rowValues);
      allKeys.push(r.rowKey);
    }
  });
}

// 제안캘린더 / 선정캘린더 / 라이브캘린더 → 각각 지정한 구글 캘린더 ID로 이벤트 생성/수정/삭제
// 우리 앱의 항목 id와 실제로 만들어진 구글 캘린더 이벤트 id를 스크립트 속성에 기억해뒀다가,
// 다음에 같은 id로 요청이 오면 그 이벤트를 지우고 새로 만든다(간단하고 확실한 방식).
function handleCalendarSync(data) {
  if (!data.calendarId) return;
  var cal = CalendarApp.getCalendarById(data.calendarId);
  if (!cal) return;

  var props = PropertiesService.getScriptProperties();
  var mapKey = 'evt_' + data.id;
  var existingEventId = props.getProperty(mapKey);

  if (existingEventId) {
    try {
      var oldEv = cal.getEventById(existingEventId);
      if (oldEv) oldEv.deleteEvent();
    } catch (e) {}
    props.deleteProperty(mapKey);
  }

  if (data.action === 'delete') return;

  var newEvent;
  if (data.allDay) {
    var start = new Date(data.startDate + 'T00:00:00');
    var end = new Date((data.endDate || data.startDate) + 'T00:00:00');
    end.setDate(end.getDate() + 1); // 구글 캘린더 종일 이벤트는 종료일 다음날 0시로 지정해야 그 날짜까지 표시됨
    newEvent = cal.createAllDayEvent(data.title, start, end);
  } else {
    var start = new Date(data.date + 'T' + (data.time || '09:00') + ':00');
    var end = new Date(start.getTime() + 60 * 60 * 1000);
    newEvent = cal.createEvent(data.title, start, end);
  }
  if (data.description) newEvent.setDescription(data.description);
  props.setProperty(mapKey, newEvent.getId());
}</pre>

function buildPromoCalGrid(y, m, eventsOnDay, renderChip){
  const firstWeekday = new Date(y, m-1, 1).getDay();
  const daysInMonth = new Date(y, m, 0).getDate();
  const pad2 = n => String(n).padStart(2,'0');
  const cells = [];
  for(let i=0;i<firstWeekday;i++) cells.push(null);
  for(let d=1; d<=daysInMonth; d++) cells.push(d);
  while(cells.length % 7 !== 0) cells.push(null);
  const todayStr2 = todayStr();

  let weekRows = '';
  for(let w=0; w<cells.length/7; w++){
    weekRows += '<tr>';
    for(let c=0; c<7; c++){
      const day = cells[w*7+c];
      if(day===null){ weekRows += `<td class="promo-cal-cell empty-cell"></td>`; continue; }
      const dateStr = `${y}-${pad2(m)}-${pad2(day)}`;
      const evs = eventsOnDay(dateStr);
      const isToday = dateStr===todayStr2;
      const wd = new Date(y,m-1,day).getDay();
      weekRows += `
        <td class="promo-cal-cell ${isToday?'is-today':''}">
          <div class="promo-cal-daynum ${wd===0?'sun':''} ${wd===6?'sat':''}">${day}</div>
          <div class="promo-cal-events">${evs.map(renderChip).join('')}</div>
        </td>`;
    }
    weekRows += '</tr>';
  }
  return `
    <table class="promo-cal-table">
      <thead><tr>${PROMO_WEEKDAY_KR.map((w,i)=>`<th class="${i===0?'sun':''} ${i===6?'sat':''}">${w}</th>`).join('')}</tr></thead>
      <tbody>${weekRows}</tbody>
    </table>`;
}

/* ---- 구글 스프레드시트 자동 연동 ----
   제안리스트에 새 항목이 생기거나 내용이 바뀌면, 등록해둔 구글 앱스스크립트 웹앱 주소로
   그 항목의 내용을 보내서 시트에 자동으로 기입/갱신되도록 한다. (관리 페이지에서 주소 등록) */
let sheetSyncTimers = {};
function scheduleSheetSync(proposalId){
  const url = (ensurePromotion().sheetSyncUrl||'').trim();
  if(!url) return;
  clearTimeout(sheetSyncTimers[proposalId]);
  sheetSyncTimers[proposalId] = setTimeout(()=>{ pushProposalToSheet(proposalId); }, 1500);
}
async function pushProposalToSheet(proposalId){
  const url = (ensurePromotion().sheetSyncUrl||'').trim();
  if(!url) return;
  const p = ensurePromotion().proposals.find(x=>x.id===proposalId);
  if(!p) return;
  const payload = {
    type: 'proposal',
    id: p.id,
    proposeDate: p.proposeDate||'',
    periodStart: p.periodStart||'',
    periodEnd: p.periodEnd||'',
    brands: (p.brands||[]).join(', '),
    promoName: p.promoName||'',
    grade: p.grade||'',
    owner: p.owner||'',
    proposeDone: p.proposeDone ? 'Y' : '',
    selectedBrands: selectedBrandsOf(p).join(', '),
    link: p.link||'',
  };
  try{
    await fetch(url, {
      method: 'POST',
      mode: 'no-cors', // 앱스스크립트 웹앱은 별도 CORS 설정이 안 되므로 no-cors로 전송(응답은 못 읽지만 전송은 됨)
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload),
    });
  }catch(e){
    console.error('구글시트 동기화 실패:', e);
  }
}

/* ---- 선정리스트도 같은 방식으로 구글 스프레드시트에 동기화 (다른 탭) ----
   선정 항목 하나에 상품이 여러 개 있을 수 있어서, "이 항목의 상품 행 전체를 다시 보낸다" 방식으로 동작한다.
   보낼 때마다 그 항목(entryId)에 해당하는 시트의 기존 행들을 지금 상태로 통째로 맞춰치기 때문에,
   상품을 추가/삭제해도 시트가 항상 앱과 똑같이 맞춰진다. */
let selectionSheetSyncTimers = {};
function scheduleSelectionSheetSync(entryId){
  const url = (ensurePromotion().sheetSyncUrl||'').trim();
  if(!url) return;
  clearTimeout(selectionSheetSyncTimers[entryId]);
  selectionSheetSyncTimers[entryId] = setTimeout(()=>{ resyncSelectionEntryToSheet(entryId); }, 1500);
}
async function resyncSelectionEntryToSheet(entryId){
  const url = (ensurePromotion().sheetSyncUrl||'').trim();
  if(!url) return;
  const s = ensurePromotion().selections.find(x=>x.id===entryId);
  // 항목이 이미 삭제됐으면 rows를 빈 배열로 보내서 시트에 남아있던 그 항목의 행들도 같이 지운다
  const rows = s ? (s.products||[]).map(p=>{
    const rate = calcDiscountRate(p.regPrice, p.finalBenefitPrice);
    return {
      rowKey: `${s.id}_${p.id}`,
      startDate: s.startDate||'', endDate: s.endDate||'', promoName: s.promoName||'',
      exposureSlot: s.exposureSlot||'', exposureDate: s.exposureDate||'', brand: s.brand||'',
      code: p.code||'', name: p.name||'',
      regPrice: p.regPrice||'', instantDiscountPrice: p.instantDiscountPrice||'', finalBenefitPrice: p.finalBenefitPrice||'',
      rate: rate===null ? '' : rate+'%',
    };
  }) : [];
  const payload = { type:'selection', action:'resyncEntry', entryId, rows };
  try{
    await fetch(url, {
      method: 'POST', mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload),
    });
  }catch(e){
    console.error('선정리스트 구글시트 동기화 실패:', e);
  }
}

/* ---- 구글 캘린더 연동: 제안캘린더 / 선정캘린더 / 라이브캘린더 각각 별도 구글 캘린더로 동기화 ----
   같은 앱스스크립트 웹앱(sheetSyncUrl)을 그대로 재사용하고, "이 캘린더에 이 id로 만든 이벤트"를
   앱스스크립트 쪽에서 기억해뒀다가 있으면 갱신, 없으면 새로 만들고, 조건이 안 맞으면 지우는 방식이다. */
let calendarSyncTimers = {};
function scheduleCalendarSync(kind, entryId){
  const key = kind+'_'+entryId;
  clearTimeout(calendarSyncTimers[key]);
  calendarSyncTimers[key] = setTimeout(()=>{ pushCalendarEvent(kind, entryId); }, 1500);
}
async function pushCalendarEvent(kind, entryId){
  const url = (ensurePromotion().sheetSyncUrl||'').trim();
  if(!url) return;
  let payloads = [];

  if(kind==='propose'){
    const calId = (ensurePromotion().proposeCalendarId||'').trim();
    if(!calId) return;
    const p = ensurePromotion().proposals.find(x=>x.id===entryId);
    if(!p || !p.proposeDate){
      payloads.push({type:'calendar', calendarId:calId, id:'propose_'+entryId, action:'delete'});
    } else {
      payloads.push({type:'calendar', calendarId:calId, id:'propose_'+entryId, action:'upsert', allDay:true,
        startDate:p.proposeDate, endDate:p.proposeDate, title:p.promoName||'(제목 없음)', description:''});
    }
  } else if(kind==='selected'){
    const calId = (ensurePromotion().selectedCalendarId||'').trim();
    if(!calId) return;
    const p = ensurePromotion().proposals.find(x=>x.id===entryId);
    const sel = p ? selectedBrandsOf(p) : [];
    if(!p || sel.length===0 || !p.periodStart || !p.periodEnd){
      payloads.push({type:'calendar', calendarId:calId, id:'selected_'+entryId, action:'delete'});
    } else {
      payloads.push({type:'calendar', calendarId:calId, id:'selected_'+entryId, action:'upsert', allDay:true,
        startDate:p.periodStart, endDate:p.periodEnd, title:(p.promoName||'(제목 없음)')+'_'+sel.join(','), description:''});
    }
  } else if(kind==='live'){
    const live = ensureLive();
    const s = live.schedule.find(x=>x.id===entryId);
    // 기본 라이브캘린더 (전체 브랜드)
    const calId = (live.liveCalendarId||'').trim();
    if(calId){
      if(!s || !s.date){
        payloads.push({type:'calendar', calendarId:calId, id:'live_'+entryId, action:'delete'});
      } else {
        payloads.push({type:'calendar', calendarId:calId, id:'live_'+entryId, action:'upsert', allDay:false,
          date:s.date, time:s.time||'09:00', title:`${s.brand||'(브랜드 미정)'}(${s.time||'-'})`, description:s.content||''});
      }
    }
    // 두 번째 라이브캘린더 (지정한 브랜드만)
    const calId2 = (live.liveCalendarId2||'').trim();
    if(calId2){
      const allowedBrands = liveCalendarId2Brands();
      const matches = s && s.date && s.brand && allowedBrands.includes(s.brand);
      if(!matches){
        payloads.push({type:'calendar', calendarId:calId2, id:'live2_'+entryId, action:'delete'});
      } else {
        payloads.push({type:'calendar', calendarId:calId2, id:'live2_'+entryId, action:'upsert', allDay:false,
          date:s.date, time:s.time||'09:00', title:`${s.brand}(${s.time||'-'})`, description:s.content||''});
      }
    }
  }
  for(const payload of payloads){
    try{
      await fetch(url, {
        method:'POST', mode:'no-cors',
        headers:{'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify(payload),
      });
    }catch(e){
      console.error('구글캘린더 동기화 실패:', e);
    }
  }
}
async function syncAllToCalendars(btnEl){

/* 하나의 제안에 브랜드를 여러 개 추가할 수 있다 */
function addProposalBrand(id, brand){
  if(!brand) return;
  const promo = ensurePromotion();
  const row = promo.proposals.find(p=>p.id===id);
  if(!row) return;
  if(!Array.isArray(row.brands)) row.brands = [];
  if(!row.brands.includes(brand)) row.brands.push(brand);
  touch(row);
  saveState(); render();
  scheduleSheetSync(id);
  scheduleCalendarSync('selected', id);
}
function removeProposalBrand(id, brand){
  const promo = ensurePromotion();
  const row = promo.proposals.find(p=>p.id===id);
  if(!row) return;
  row.brands = (row.brands||[]).filter(b=>b!==brand);
  touch(row);
  saveState(); render();
  scheduleSheetSync(id);
  scheduleCalendarSync('selected', id);
}
/* 브랜드별 선정완료: 브랜드마다 따로 체크하고, 체크되는 순간 셋팅 체크리스트·선정리스트에 각각 자동으로 한 줄씩 생긴다 */
function selectedBrandsOf(p){
  if(!p.selectedBrands) return [];
  return Object.keys(p.selectedBrands).filter(b=>p.selectedBrands[b]);
}
function isProposalBrandSelected(p, brand){
  return !!(p.selectedBrands && p.selectedBrands[brand]);
}
function toggleProposalBrandSelected(id, brand){
  const promo = ensurePromotion();
  const row = promo.proposals.find(p=>p.id===id);
  if(!row) return;
  if(!row.selectedBrands) row.selectedBrands = {};
  if(!row.selectedBrandsTs) row.selectedBrandsTs = {};
  const nowSelected = !row.selectedBrands[brand];
  row.selectedBrands[brand] = nowSelected;
  row.selectedBrandsTs[brand] = Date.now(); // 이 브랜드의 선정 여부만 따로 시각을 기록 (다른 칸 수정과 무관하게 병합하기 위함)
  touch(row);
  if(nowSelected){
    addChecklistFromProposalBrand(row, brand);
    addSelectionFromProposalBrand(row, brand);
  } else {
    // 체크 해제 시, 이 제안+브랜드에서 자동 생성됐던 셋팅/선정리스트 항목도 함께 삭제
    promo.checklist = promo.checklist.filter(c => !(c.sourceProposalId===id && c.brand===brand));
    promo.selections = promo.selections.filter(s => !(s.sourceProposalId===id && s.brand===brand));
  }
  saveState(); render();
  scheduleSheetSync(id);
  scheduleCalendarSync('selected', id);
}
/* 선정완료는 한 번 체크되면 실수로(혹은 다른 이유로) 풀리지 않도록 잠가두고,
   해제하고 싶을 때만 "수정" 버튼으로 확인창을 한 번 거쳐서 풀 수 있게 한다. */
function requestUnselectProposalBrand(id, brand){
  if(!confirm(`"${brand}" 선정완료를 해제할까요?\n연결되어 있던 셋팅·선정리스트 항목도 함께 삭제됩니다.`)) return;
  toggleProposalBrandSelected(id, brand);
}
function toggleProposalField(id, field){
  const promo = ensurePromotion();
  const row = promo.proposals.find(p=>p.id===id);
  if(!row) return;
  row[field] = !row[field];
  touch(row);
  saveState(); render();
  scheduleSheetSync(id);
}
function deleteProposal(id){
  const promo = ensurePromotion();
  promo.proposals = promo.proposals.filter(p=>p.id!==id);
  saveState(); render();
  pushCalendarEvent('propose', id);

}

/* ---- 선정리스트 (제안리스트와 무관한 독립 데이터, 프로모션 1건당 상품코드 여러 개 등록 가능) ---- */
function calcDiscountRate(regPrice, finalPrice){
  const reg = Number(regPrice), fin = Number(finalPrice);
  if(!reg || reg<=0 || finalPrice===''||finalPrice===null||finalPrice===undefined) return null;
  return Math.floor((1 - fin/reg) * 100); // ROUNDDOWN((1-최종혜택가/등록가)*100,0)/100 과 동일한 정수 % 값
}

}
