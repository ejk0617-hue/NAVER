/* =========================================================================
   주간미팅 — 월요일~일요일 기준으로 스토어별 지표를
   주 단위로 입력하고, 한 달치를 나란히 비교하는 표를 보여준다.
   ========================================================================= */
function ensureWeeklyMeeting(){
  if(!state.weeklyMeeting || typeof state.weeklyMeeting!=='object') state.weeklyMeeting = {entries: []};
  if(!Array.isArray(state.weeklyMeeting.entries)) state.weeklyMeeting.entries = [];
  return state.weeklyMeeting;
}
const WEEKLY_MEETING_METRICS = [
  {key:'revenue', label:'매출액', unit:'원'},
  {key:'profit', label:'이익액', unit:'원'},
  {key:'aov', label:'객단가', unit:'원'},
  {key:'conversionRate', label:'전환율', unit:'%'},
  {key:'visitors', label:'유입수', unit:'명'},
  {key:'eventSales', label:'행사매출', unit:'원'},
  {key:'subscribers', label:'알림받기', unit:'명'},
];
function findWeeklyEntry(store, weekStart){
  return ensureWeeklyMeeting().entries.find(e=>e.store===store && e.weekStart===weekStart);
}
/* 스마트스토어 대시보드에 입력해둔 일간 매출(state.smartstore.daily)에서, 이 주간(목~수) 구간에
   해당하는 날짜들의 매출을 합산해서 매출액을 자동으로 끌어온다. 따로 입력할 필요가 없다. */
function weeklyRevenueFromDaily(store, weekStart, weekEnd){
  const daily = ensureSmartstore().daily;
  return daily
    .filter(r=> r.store===store && r.date>=weekStart && r.date<=weekEnd)
    .reduce((s,r)=> s + (Number(r.amount)||0), 0);
}
/* 지금 보고 있는 달의 첫 번째 주라도, 그 바로 앞주(전달 마지막 주일 수도 있음)를 달과 상관없이 구해서
   증감률을 계속 이어서 비교할 수 있게 한다. (예: 8월 첫째 주는 7월 마지막 주와 비교) */
function weekBefore(weekStartStr){
  const pad2 = n => String(n).padStart(2,'0');
  const fmt = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
  const start = new Date(weekStartStr+'T00:00:00');
  start.setDate(start.getDate()-7);
  const end = new Date(start);
  end.setDate(end.getDate()+6);
  return {start: fmt(start), end: fmt(end)};
}
function updateWeeklyMeetingField(store, weekStart, weekEnd, field, value){
  const wm = ensureWeeklyMeeting();
  let entry = wm.entries.find(e=>e.store===store && e.weekStart===weekStart);
  if(!entry){
    entry = {id:uid(), store, weekStart, weekEnd, revenue:'', profit:'', aov:'', conversionRate:'', visitors:'', eventSales:'', subscribers:''};
    wm.entries.push(entry);
  }
  entry[field] = sanitizePromoNumber(value);
  entry.weekEnd = weekEnd;
  saveState(); render();
}
let weeklyMeetingChartMetrics = ['revenue'];
function toggleWeeklyMeetingChartMetric(key){
  const idx = weeklyMeetingChartMetrics.indexOf(key);
  if(idx>=0){
    if(weeklyMeetingChartMetrics.length===1) return; // 최소 1개는 항상 선택되어 있어야 함
    weeklyMeetingChartMetrics.splice(idx,1);
  } else {
    weeklyMeetingChartMetrics.push(key);
  }
  render();
}
const WM_METRIC_COLORS = {
  revenue: '#8B5CF6', profit: '#12805C', aov: '#F0932B', conversionRate: '#0EA5A5',
  visitors: '#2F6FED', eventSales: '#DB5A9E', subscribers: '#D64545',
};
const WM_DASH_PATTERNS = ['0', '6,4', '2,3'];

/* Y축에 보기 좋은 간격(1/2/5 배수)으로 눈금 4~5개를 만든다 */
function niceAxisTicks(min, max, count){
  if(min===max){ min -= Math.abs(min)*0.1 || 1; max += Math.abs(max)*0.1 || 1; }
  const range = max - min;
  const rawStep = range / (count - 1);
  const mag = Math.pow(10, Math.floor(Math.log10(Math.abs(rawStep) || 1)));
  const norm = rawStep / mag;
  let step;
  if(norm < 1.5) step = 1*mag;
  else if(norm < 3) step = 2*mag;
  else if(norm < 7) step = 5*mag;
  else step = 10*mag;
  const niceMin = Math.floor(min/step)*step;
  const niceMax = Math.ceil(max/step)*step;
  const ticks = [];
  for(let v=niceMin; v<=niceMax+step*0.001; v+=step) ticks.push(Math.round(v*1000)/1000);
  return ticks;
}
function formatMiniAxisNumber(v, unit){
  if(unit==='%') return v.toLocaleString('ko-KR')+'%';
  if(unit==='명') return Math.round(v).toLocaleString('ko-KR');
  if(Math.abs(v)>=10000) return Math.round(v/10000).toLocaleString('ko-KR')+'만';
  return Math.round(v).toLocaleString('ko-KR');
}

/* 매출 대시보드의 "목표 달성률" 카드 아래 남는 공간에 넣는, 그 달 일별 매출 추이 그래프.
   스토어별로 선 색을 다르게 해서 겹쳐 보여준다(브랜드 필터에 쓰는 색과 동일하게 맞춰서 일관되게). */
let ssDailyTrendMode = 'week'; // 'week' | 'month'
function switchSsDailyTrendMode(mode){ ssDailyTrendMode = mode; render(); }

function buildDailySalesTrendChart(y, m, visibleStores){
  if(visibleStores.length===0) return '';
  const pad2 = n => String(n).padStart(2,'0');
  const daysInMonth = new Date(y, m, 0).getDate();
  const ss = ensureSmartstore();

  let dayList;
  if(ssDailyTrendMode==='week'){
    // 보고 있는 달이 지금 실제 이번 달이면 "오늘까지의 최근 7일", 지난 달을 보고 있으면 "그 달의 마지막 7일"
    const today = new Date();
    const isRealCurrentMonth = (y===today.getFullYear() && m===today.getMonth()+1);
    const endDay = isRealCurrentMonth ? Math.min(today.getDate(), daysInMonth) : daysInMonth;
    const startDay = Math.max(1, endDay-6);
    dayList = [];
    for(let d=startDay; d<=endDay; d++) dayList.push(d);
  } else {
    dayList = [];
    for(let d=1; d<=daysInMonth; d++) dayList.push(d);
  }

  const toggleBar = `
    <div class="ss-trend-mode-tabs">
      <button class="ss-trend-mode-tab ${ssDailyTrendMode==='week'?'active':''}" onclick="switchSsDailyTrendMode('week')">최근 일주일</button>
      <button class="ss-trend-mode-tab ${ssDailyTrendMode==='month'?'active':''}" onclick="switchSsDailyTrendMode('month')">한달</button>
    </div>`;

  const series = visibleStores.map(store=>{
    return dayList.map(d=>{
      const dateStr = `${y}-${pad2(m)}-${pad2(d)}`;
      const entry = ss.daily.find(r=>r.store===store && r.date===dateStr);
      return entry && entry.amount ? Number(entry.amount) : null;
    });
  });

  const title = ssDailyTrendMode==='week' ? '📈 최근 일주일 매출 추이' : '📈 이번 달 매출 추이';

  const allVals = series.flat().filter(v=>v!==null);
  if(allVals.length===0){
    const emptyMsg = ssDailyTrendMode==='week' ? '최근 일주일 동안 입력된 매출이 없어요.' : '이번 달 입력된 매출이 아직 없어요.';
    return `<div class="ss-daily-trend-wrap"><div class="ss-daily-trend-title">${title}</div>${toggleBar}<div class="empty" style="padding:16px 0;font-size:11px">${emptyMsg}</div></div>`;
  }

  const width = 380, height = 108, padL = 40, padR = 8, padT = 8, padB = 16;
  const innerW = width - padL - padR;
  const innerH = height - padT - padB;
  const ticks = niceAxisTicks(0, Math.max(...allVals), 3);
  const yMin = ticks[0], yMax = ticks[ticks.length-1];
  const range = (yMax-yMin) || 1;
  const xStep = dayList.length>1 ? innerW/(dayList.length-1) : 0;
  const xOf = i => padL + i*xStep;
  const yOf = v => padT + innerH - ((v-yMin)/range)*innerH;

  let svg = `<svg viewBox="0 0 ${width} ${height}" class="ss-daily-trend-svg">`;
  ticks.forEach(t=>{
    const ty = yOf(t);
    svg += `<line x1="${padL}" y1="${ty.toFixed(1)}" x2="${padL+innerW}" y2="${ty.toFixed(1)}" stroke="#F0F1F4" stroke-width="0.75"/>`;
    svg += `<text x="${padL-5}" y="${(ty+2.5).toFixed(1)}" font-size="7.5" fill="#9AA1AC" text-anchor="end">${formatMiniAxisNumber(t,'원')}</text>`;
  });
  // 한달 보기는 날짜가 많아서(최대 31개) 라벨을 다 찍으면 겹치니, 며칠 간격으로 골라서 보여준다
  const labelStep = dayList.length>10 ? Math.ceil(dayList.length/6) : 1;
  dayList.forEach((d,i)=>{
    if(i % labelStep !== 0 && i !== dayList.length-1) return;
    svg += `<text x="${xOf(i).toFixed(1)}" y="${height-3}" font-size="7.5" fill="#9AA1AC" text-anchor="middle">${d}일</text>`;
  });

  visibleStores.forEach((store, si)=>{
    const color = promoBrandColor(store);
    const pts = series[si].map((v,i)=> v===null ? null : `${xOf(i).toFixed(1)},${yOf(v).toFixed(1)}`).filter(Boolean).join(' ');
    if(pts) svg += `<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>`;
    series[si].forEach((v,i)=>{
      if(v===null) return;
      svg += `<circle cx="${xOf(i).toFixed(1)}" cy="${yOf(v).toFixed(1)}" r="${dayList.length>10?1.2:1.8}" fill="${color}"><title>${store} ${m}/${dayList[i]}: ${formatWon(v)}</title></circle>`;
    });
  });
  svg += `</svg>`;

  const legend = visibleStores.length>1 ? `<div class="wm-mini-store-legend">${visibleStores.map(s=>`
    <span class="wm-chart-legend-item"><span class="wm-chart-legend-dot" style="background:${promoBrandColor(s)}"></span>${s}</span>
  `).join('')}</div>` : '';

  return `<div class="ss-daily-trend-wrap"><div class="ss-daily-trend-title">${title}</div>${toggleBar}${svg}${legend}</div>`;
}

/* 지표 하나짜리 작은 꺾은선 그래프. 각자 자기 축(눈금 4~5개)을 가지고 있어서 다른 지표와
   전혀 안 섞이고, 어떤 지표가 어떻게 흔들렸는지 그래프 모양만 봐도 바로 보인다. */
function buildWeeklyMetricLineChart(weeks, visibleStores, metricKey){
  const metricMeta = WEEKLY_MEETING_METRICS.find(m=>m.key===metricKey);
  const color = WM_METRIC_COLORS[metricKey] || '#8B5CF6';
  const width = 220, height = 96, padL = 30, padR = 6, padT = 8, padB = 15;
  const innerW = width - padL - padR;
  const innerH = height - padT - padB;

  const series = visibleStores.map(store => weeks.map(w=>{
    if(metricKey==='revenue'){
      const v = weeklyRevenueFromDaily(store, w.start, w.end);
      return v>0 ? v : null;
    }
    const entry = findWeeklyEntry(store, w.start);
    const val = entry ? entry[metricKey] : '';
    return (val===''||val===undefined||val===null) ? null : Number(val);
  }));

  const allVals = series.flat().filter(v=>v!==null);
  if(allVals.length===0){
    return `<div class="wm-mini-card"><div class="wm-mini-title">${metricMeta.label} <span class="wm-unit">(${metricMeta.unit})</span></div><div class="empty" style="padding:16px 0;font-size:10px">데이터 없음</div></div>`;
  }

  const ticks = niceAxisTicks(Math.min(0,...allVals), Math.max(...allVals), 4);
  const yMin = ticks[0], yMax = ticks[ticks.length-1];
  const range = (yMax - yMin) || 1;
  const xStep = weeks.length>1 ? innerW/(weeks.length-1) : 0;
  const xOf = i => padL + i*xStep;
  const yOf = v => padT + innerH - ((v-yMin)/range)*innerH;

  let svg = `<svg viewBox="0 0 ${width} ${height}" class="wm-mini-svg">`;
  ticks.forEach(t=>{
    const ty = yOf(t);
    svg += `<line x1="${padL}" y1="${ty.toFixed(1)}" x2="${padL+innerW}" y2="${ty.toFixed(1)}" stroke="#F0F1F4" stroke-width="0.75"/>`;
    svg += `<text x="${padL-4}" y="${(ty+2.5).toFixed(1)}" font-size="8" fill="#9AA1AC" text-anchor="end">${formatMiniAxisNumber(t, metricMeta.unit)}</text>`;
  });
  weeks.forEach((w,i)=>{
    svg += `<text x="${xOf(i).toFixed(1)}" y="${height-4}" font-size="8" fill="#9AA1AC" text-anchor="middle">${w.label}</text>`;
  });

  const WM_STORE_OPACITY = [1, 0.55, 0.32];
  visibleStores.forEach((store, si)=>{
    const op = WM_STORE_OPACITY[si % WM_STORE_OPACITY.length];
    const pts = series[si].map((v,i)=> v===null ? null : `${xOf(i).toFixed(1)},${yOf(v).toFixed(1)}`).filter(Boolean).join(' ');
    if(pts) svg += `<polyline points="${pts}" fill="none" stroke="${color}" stroke-opacity="${op}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>`;
    series[si].forEach((v,i)=>{
      if(v===null) return;
      const valueText = metricMeta.unit==='%' ? v.toLocaleString('ko-KR')+'%' : v.toLocaleString('ko-KR');
      svg += `<circle cx="${xOf(i).toFixed(1)}" cy="${yOf(v).toFixed(1)}" r="1.8" fill="${color}" fill-opacity="${op}"><title>${store} ${weeks[i].label}: ${valueText}</title></circle>`;
    });
  });
  svg += `</svg>`;

  const storeLegend = visibleStores.length>1 ? `<div class="wm-mini-store-legend">${visibleStores.map((s,si)=>`
    <span class="wm-chart-legend-item"><span class="wm-mini-legend-line" style="border-top-color:${color};opacity:${WM_STORE_OPACITY[si%WM_STORE_OPACITY.length]}"></span>${s}</span>
  `).join('')}</div>` : '';

  return `<div class="wm-mini-card"><div class="wm-mini-title">${metricMeta.label} <span class="wm-unit">(${metricMeta.unit})</span></div>${svg}${storeLegend}</div>`;
}

function buildWeeklyTrendChart(weeks, visibleStores, metricKeys){
  const cards = metricKeys.map(key => buildWeeklyMetricLineChart(weeks, visibleStores, key)).join('');
  return `<div class="wm-mini-grid">${cards}</div>`;
}

function pctChangeOf(curr, prev){
  if(curr===''||curr===undefined||curr===null||prev===''||prev===undefined||prev===null) return null;
  const c = Number(curr), p = Number(prev);
  if(!isFinite(c) || !isFinite(p) || p===0) return null;
  return Math.round((c-p)/p*100);
}

/* 목요일 시작(전주 목~이번주 수) 기준 주간 구간들을, 지정한 달에 목요일이 포함되는 주만 골라 반환 */
function monSunWeeksOfMonth(y, m){
  const pad2 = n => String(n).padStart(2,'0');
  const fmt = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
  const flabel = d => `${d.getMonth()+1}/${d.getDate()}`;
  const first = new Date(y, m-1, 1);
  const last = new Date(y, m, 0);
  const weeks = [];
  for(let d = new Date(first); d<=last; d.setDate(d.getDate()+1)){
    if(d.getDay()===1){
      const start = new Date(d);
      const end = new Date(d); end.setDate(end.getDate()+6);
      weeks.push({start: fmt(start), end: fmt(end), label: `${flabel(start)}~${flabel(end)}`});
    }
  }
  return weeks;
}

/* 입고량 계산: 필요한 만큼(평균출고량×기준일−현재고)을 그대로 입고하면 박스 단위로 안 맞아떨어질 수 있어서,
   먼저 필요 박스 수를 반올림(0.5 이상 올림/미만 내림)으로 정하고, 그 박스 수 × 입수량을 최종 입고수량(EA)으로 삼는다.
   이렇게 하면 입고수량(EA)은 항상 입수량으로 정확히 나누어떨어진다. */
function calcInbound(avgOutbound, baseDate, currentStock, packQty){
  const po = Number(packQty);
  if(!po || po<=0) return {ea:null, box:null};
  const rawNeed = Number(avgOutbound||0) * Number(baseDate||0) - Number(currentStock||0);
  if(rawNeed<=0) return {ea:0, box:0};
  const box = Math.round(rawNeed / po); // 0.5 이상 올림, 0.5 미만 내림 (Math.round 기본 동작)
  return {ea: box*po, box};
}

/* 현재고·평균출고량·기준일 칸이 <input>이라서, 브랜드부터 입고수(BOX)까지 마우스로 드래그해서
   긁어 복사하는 게 브라우저 특성상 잘 안 먹힌다(입력칸 경계에서 선택이 끊김). 그래서 표 전체를
   엑셀에 그대로 붙여넣기 좋은 탭(TSV) 형식으로 클립보드에 복사하는 버튼을 따로 만들었다. */
/* 화면에 보이는 값을 "state가 아니라 실제로 렌더링된 DOM"에서 그대로 읽어서 복사한다.
   이렇게 하면 어떤 이유로든(방금 입력했는데 아직 blur가 안 됐다거나 등) state와 화면 표시가
   어긋나 있어도, 사용자 눈에 보이는 것과 100% 똑같은 내용이 복사된다. */
function copyFulfillmentTable(btnEl){
  const table = document.getElementById('fulfillInboundTable');
  if(!table){ alert('복사할 품목이 없어요.'); return; }
  const headerCells = Array.from(table.querySelectorAll('thead th')).map(th=>th.textContent.trim());
  const lines = [headerCells.join('\t')];
  table.querySelectorAll('tbody tr').forEach(tr=>{
    const cellTexts = Array.from(tr.children).map(td=>{
      const input = td.querySelector('input');
      const raw = input ? input.value : td.textContent.trim();
      const val = (raw==='-' ? '' : raw); // 값이 없어서 '-'로 표시해둔 자리는 빈 칸으로 복사
      // 상품코드·상품바코드처럼 긴 숫자로 된 값은 앞에 어퍼스트로피(')를 붙여서, 엑셀에 붙여넣을 때
      // 과학적 표기법(예: 4.903E+12)으로 안 바뀌고 원래 숫자 그대로(텍스트로) 들어가게 한다.
      if(/^\d{6,}$/.test(val)) return `'${val}`;
      return val;
    });
    lines.push(cellTexts.join('\t'));
  });
  if(lines.length<=1){ alert('복사할 품목이 없어요.'); return; }
  copyToClipboard(lines.join('\n'), btnEl);
}
function localDateStr(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), dd=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${dd}`;
}

/* CJ "통합재고조회_상품별" 양식 전용 가져오기.
   헤더가 2줄로 되어있고 병합 셀이 많아서 이름으로 열을 찾기 어려우므로, 열 위치(D=품목코드, H=가용수량, T=평균출고량)로 직접 읽는다.
   품목코드가 이미 "품목 데이터"에 등록되어 있는 품목만 매칭해서 현재고·평균출고량을 채워준다 (새 품목은 만들지 않음). */
async function importCjStockExcel(){
  const fileInput = document.getElementById('cjStockFile');
  const resultEl = document.getElementById('cjStockResult');
  const file = fileInput && fileInput.files[0];
  if(!file){ resultEl.innerHTML = '<div class="helptext" style="color:var(--negative);margin-top:6px">엑셀 파일을 선택해주세요.</div>'; return; }
  if(typeof XLSX === 'undefined'){
    resultEl.innerHTML = '<div class="helptext" style="color:var(--negative);margin-top:6px">엑셀 처리 기능을 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침 후 다시 시도해주세요.</div>';
    return;
  }
  resultEl.innerHTML = '<div class="helptext" style="margin-top:6px">불러오는 중...</div>';
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array', cellDates:false});
    const ws = wb.Sheets[wb.SheetNames[0]];
    // header:1 → 열 이름이 아니라 행 배열 그대로 받아서, D/H/T 열(품목코드/가용수량/평균출고량) 위치로 직접 읽는다
    const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
    const f = ensureFulfillment();
    const byCode = {};
    f.items.forEach(it=>{ if(it.itemCode) byCode[String(it.itemCode).trim()] = it; });

    let matched = 0;
    const unmatched = [];
    rows.forEach(row=>{
      const itemCode = String(row[3]||'').trim(); // D열: 품목코드
      if(!itemCode || itemCode==='품목코드') return; // 헤더행/빈행 스킵
      const availQty = row[7];  // H열: 가용수량 → 현재고로 사용
      const avgOut = row[19];   // T열: 평균출고량
      if(availQty==='' && avgOut==='') return; // SUM행 등 수치 없는 행 스킵
      const item = byCode[itemCode];
      if(!item){ unmatched.push(itemCode); return; }
      item.currentStock = sanitizePromoNumber(String(availQty));
      item.avgOutbound = sanitizePromoNumber(String(avgOut));
      matched++;
    });
    saveState();
    let msg = `${matched}개 품목의 현재고·평균출고량을 채웠어요.`;
    if(unmatched.length>0) msg += `\n\n품목 데이터에 없는 품목코드 ${unmatched.length}개는 건너뛰었어요:\n${unmatched.slice(0,15).join(', ')}${unmatched.length>15?' 등':''}`;
    alert(msg);
    render();
  }catch(e){
    console.error(e);
    resultEl.innerHTML = '<div class="helptext" style="color:var(--negative);margin-top:6px">가져오기 실패: ' + e.message + '</div>';
  }
}

    const {ea, box} = calcInbound(it.avgOutbound, it.baseDate, it.currentStock, it.packQty);
    if(ea!==null) totalEA += ea;
    if(box!==null) totalBox += box;
    return {it, ea, box};
  });

  // 최근 30일 프로모션 이력 (선정리스트 기준) — 풀필먼트에 등록된 브랜드 중, 브랜드 필터에 체크된 것만

function ensurePromotion(){
  if(!state.promotion || typeof state.promotion!=='object'){
    state.promotion = {
      brands: bizwalletBrandsList().slice(), // 프로모션 전용 브랜드 목록 (셋팅에서 자유롭게 추가/삭제 가능, 광고 탭 데이터와는 무관)
      owners: [],
      proposals: [],
      selections: [], // 선정리스트 — 제안리스트와 별개로 수기 입력하는 데이터
      checklist: [], // 셋팅 — 프로모션 선정 후 후속작업 체크리스트
      calendarFilter: {}, // {브랜드: true/false} — 없으면 기본 표시(true)
      proposalFilter: {},
      selectionFilter: {},
      checklistFilter: {},
      brandLinks: {}, // { [브랜드]: {storeLink, productLinkPrefix} } — 셋팅도우미에서 상품 링크 자동 생성에 사용
      sheetSyncUrl: '', // 제안리스트 신규/수정 항목을 자동으로 보낼 구글 앱스스크립트 웹앱 주소
      proposeCalendarId: '', // 제안캘린더와 연동할 구글 캘린더 ID
      selectedCalendarId: '', // 선정캘린더와 연동할 구글 캘린더 ID
    };
  }
  if(!Array.isArray(state.promotion.brands)) state.promotion.brands = [];
  if(!Array.isArray(state.promotion.owners)) state.promotion.owners = [];
  if(!Array.isArray(state.promotion.proposals)) state.promotion.proposals = [];
  if(!Array.isArray(state.promotion.selections)) state.promotion.selections = [];
  if(!Array.isArray(state.promotion.checklist)) state.promotion.checklist = [];
  if(!state.promotion.calendarFilter || typeof state.promotion.calendarFilter!=='object') state.promotion.calendarFilter = {};
  if(!state.promotion.proposalFilter || typeof state.promotion.proposalFilter!=='object') state.promotion.proposalFilter = {};
  if(!state.promotion.selectionFilter || typeof state.promotion.selectionFilter!=='object') state.promotion.selectionFilter = {};
  if(!state.promotion.checklistFilter || typeof state.promotion.checklistFilter!=='object') state.promotion.checklistFilter = {};
  if(!state.promotion.brandLinks || typeof state.promotion.brandLinks!=='object') state.promotion.brandLinks = {};
  if(state.promotion.sheetSyncUrl===undefined) state.promotion.sheetSyncUrl = '';
  if(state.promotion.proposeCalendarId===undefined) state.promotion.proposeCalendarId = '';
  if(state.promotion.selectedCalendarId===undefined) state.promotion.selectedCalendarId = '';
  // 기존 데이터 마이그레이션: 제안리스트가 단일 brand(문자열)만 갖고 있던 예전 데이터를
  // brands(배열)로도 채워서 여러 브랜드를 다룰 수 있게 한다. 기존 brand 필드는 그대로 보존.
  state.promotion.proposals.forEach(p=>{
    if(!Array.isArray(p.brands)){
      p.brands = p.brand ? [p.brand] : [];
    }
    // 선정완료를 브랜드별로 관리하도록 마이그레이션: 예전에 전체 selectedDone이 true였다면
    // 그 시점 브랜드들을 모두 선정된 것으로 간주해 이관하고, 기존 selectedDone 필드는 그대로 둔다.
    if(!p.selectedBrands || typeof p.selectedBrands!=='object'){
      p.selectedBrands = {};
      if(p.selectedDone){
        p.brands.forEach(b=>{ p.selectedBrands[b] = true; });
      }
    }
  });
  // 셋팅 체크리스트: 쇼핑스토리/롤링배너/상세배너/마케팅메시지/카테고리 5칸을 "배너셋팅" 1칸으로 통합.
  // 예전 값은 지우지 않고 그대로 두되(데이터 보존), 화면에는 배너셋팅만 보이도록 대표값을 하나 뽑아둔다.
  state.promotion.checklist.forEach(c=>{
    if(c.bannerSetting === undefined){
      const legacy = [c.shoppingStory, c.rollingBanner, c.detailBanner, c.marketingMessage, c.category].filter(Boolean);
      c.bannerSetting = legacy.length ? legacy[0] : '';
    }
  });
  return state.promotion;
}

/* ---- 엑셀 가져오기 (제안리스트 / 선정리스트 / 셋팅) ---- */
function excelToDateStr(v){
  if(v===undefined || v===null || v==='') return '';
  // 엑셀에서 읽은 날짜 셀은 보통 순수 숫자(일련번호)로 들어온다 — Date 객체 변환은 컴퓨터 시간대에 따라
  // 값 자체가 달라지는 문제가 있어서, 숫자는 우리가 직접(시간대 영향 없이) 계산한다.
  if(typeof v === 'number' && !isNaN(v)){
    return excelSerialToDateStr(v);
  }
  if(Object.prototype.toString.call(v)==="[object Date]" && !isNaN(v.getTime())){
    const y=v.getUTCFullYear(), m=String(v.getUTCMonth()+1).padStart(2,'0'), d=String(v.getUTCDate()).padStart(2,'0');
    return `${y}-${m}-${d}`;
  }
  const s = String(v).trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const m2 = s.match(/^(\d{4})[.\/](\d{1,2})[.\/](\d{1,2})/);
  if(m2) return `${m2[1]}-${String(m2[2]).padStart(2,'0')}-${String(m2[3]).padStart(2,'0')}`;
  // 위 형식으로도 못 알아들었으면, 더 폭넓게 시도해보는 파서로 한 번 더 시도
  const flexible = parseFlexibleDate(s);
  if(/^\d{4}-\d{2}-\d{2}$/.test(flexible)) return flexible;
  // 마지막 안전장치: 브라우저의 일반 날짜 파싱에 맡겨본다 (예: "Tue Aug 04 2026 ..." 같은 문자열도 처리)
  const generic = new Date(s);
  if(!isNaN(generic.getTime())){
    const y=generic.getFullYear(), m=String(generic.getMonth()+1).padStart(2,'0'), d=String(generic.getDate()).padStart(2,'0');
    return `${y}-${m}-${d}`;
  }
  return s; // 그래도 인식 못하면 원본 텍스트를 그대로 두고, 나중에 화면에서 직접 고칠 수 있게 함
}
/* 엑셀 셀 하나를 복사해서 날짜 입력칸(달력)에 그대로 붙여넣기 하면(Ctrl+V) 자동으로 yyyy-mm-dd로 바꿔서 넣어준다.
   <input type="date">는 원래 이 형식이 아니면 붙여넣기가 아예 씹히기 때문에, 여러 형식(2026-08-04, 2026/8/4,
   2026.8.4, 엑셀 날짜 일련번호 등)을 미리 알아서 변환해준다. */
function excelSerialToDateStr(serial){
  const utcDays = Math.floor(serial - 25569);
  const date = new Date(utcDays * 86400 * 1000);
  const y=date.getUTCFullYear(), m=String(date.getUTCMonth()+1).padStart(2,'0'), d=String(date.getUTCDate()).padStart(2,'0');
  return `${y}-${m}-${d}`;
}
function excelSerialToTimeStr(serial){
  const frac = serial - Math.floor(serial);
  const totalMin = Math.round(frac * 24 * 60);
  const h = Math.floor(totalMin/60) % 24, m = totalMin % 60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}
function parseFlexibleDate(raw){
  if(!raw) return '';
  const s = String(raw).trim();
  if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);
  let m = s.match(/^(\d{4})[.\/](\d{1,2})[.\/](\d{1,2})/);
  if(m) return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
  m = s.match(/^(\d{1,2})[.\/](\d{1,2})[.\/](\d{4})$/);
  if(m){
    const a=parseInt(m[1],10), b=parseInt(m[2],10), y=m[3];
    // 12보다 크면 일(day)일 수밖에 없으므로 뒤에서부터 판단, 그 외엔 월/일(mm/dd) 순으로 가정
    if(a>12) return `${y}-${String(b).padStart(2,'0')}-${String(a).padStart(2,'0')}`;
    return `${y}-${String(a).padStart(2,'0')}-${String(b).padStart(2,'0')}`;
  }
  // "1월2일", "12월 25일" 처럼 연도가 아예 없는 한글 날짜 — 앱이 관리하는 연도(YEAR)를 붙여서 인식한다
  m = s.match(/^(\d{1,2})\s*월\s*(\d{1,2})\s*일$/);
  if(m) return `${YEAR}-${String(m[1]).padStart(2,'0')}-${String(m[2]).padStart(2,'0')}`;
  if(/^\d{4,6}$/.test(s)){
    const num = parseInt(s,10);
    if(num>20000 && num<80000) return excelSerialToDateStr(num); // 엑셀 날짜 일련번호로 추정되는 범위
  }
  return '';
}
function handleDatePaste(e){
  const text = (e.clipboardData || window.clipboardData).getData('text');
  if(!text) return;
  const parsed = parseFlexibleDate(text);
  if(!/^\d{4}-\d{2}-\d{2}$/.test(parsed)) return; // 못 알아들으면 브라우저 기본 붙여넣기 동작에 맡김
  e.preventDefault();
  e.target.value = parsed;
  e.target.dispatchEvent(new Event('change', {bubbles:true}));
}
function excelRowVal(row, ...keys){
  for(const k of keys){
    if(row[k]!==undefined && row[k]!==null && String(row[k]).trim()!==''){
      return String(row[k]).trim();
    }
  }
  return '';
}
/* excelRowVal과 달리 값을 문자열로 미리 바꾸지 않고 원본 그대로(Date 객체·숫자 등) 반환한다.
   날짜/시간 칸은 미리 문자열로 바꿔버리면(특히 Date 객체의 toString()은 컴퓨터의 시간대에 따라
   달라짐) 하루씩 밀리는 등 오작동하므로, 날짜·시간은 반드시 이 함수로 원본을 가져와야 한다. */
function excelRawVal(row, ...keys){
  for(const k of keys){
    if(row[k]!==undefined && row[k]!==null && row[k]!==''){
      return row[k];
    }
  }
  return '';
}
function excelRowBool(row, ...keys){
  const v = excelRowVal(row, ...keys).toLowerCase();
  return ['y','yes','예','true','1','완료','o','v'].includes(v);
}

  // - 맨 위에 추가: 오래된 순으로 하나씩 앞에 꽂아 넣어서, 가져온 것 중 최신이 맨 위 / 가장 오래된 것이 기존 데이터 바로 위에 오도록.

  if(position==='bottom'){
    const sortedDesc = order.slice().sort((a,b)=>{
      const ea = groups.get(a), eb = groups.get(b);

      promo.selections.push(entry);

  } else {
    const sortedAsc = order.slice().sort((a,b)=>{
      const ea = groups.get(a), eb = groups.get(b);
      return (ea.startDate||'').localeCompare(eb.startDate||'');
    });
    sortedAsc.forEach(key=>{
      const entry = groups.get(key);
      if(entry.products.length===0) entry.products.push({id:uid(),code:'',name:'',regPrice:'',instantDiscountPrice:'',finalBenefitPrice:''});
      promo.selections.unshift(entry);
    });
  }
  return count;

  else if(batch.target==='liveSchedule'){ const l=ensureLive(); l.schedule.filter(x=>x.importBatchId===batchId).forEach(x=>recordDeleted('liveSchedule', x.id)); l.schedule = l.schedule.filter(x=>x.importBatchId!==batchId); }

  if(!file){
    resultEl.innerHTML = '<div class="helptext" style="color:var(--negative);margin-top:8px">엑셀 파일을 선택해주세요.</div>';
    return;
  }
  if(typeof XLSX === 'undefined'){
    resultEl.innerHTML = '<div class="helptext" style="color:var(--negative);margin-top:8px">엑셀 처리 기능을 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침 후 다시 시도해주세요.</div>';
    return;
  }
  resultEl.innerHTML = '<div class="helptext" style="margin-top:8px">가져오는 중...</div>';
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array', cellDates:false});
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, {defval:''});
    const batchId = uid();
    let count = 0;
    if(target==='proposals') count = importProposalsFromRows(rows, position, batchId);
    else if(target==='selections') count = importSelectionsFromRows(rows, position, batchId);
    else if(target==='checklist') count = importChecklistFromRows(rows, position, batchId);
    else if(target==='liveSchedule') count = importLiveScheduleFromRows(rows, position, batchId);
    else if(target==='fulfillmentItems') count = importFulfillmentItemsFromRows(rows, position, batchId);
    if(count>0){
      const batches = ensureImportBatches();
      batches.unshift({id:batchId, target, count, importedAt:new Date().toISOString()});
      while(batches.length>20) batches.pop();
    }
    saveState();
    if(count===0){
      alert('엑셀에서 인식할 수 있는 행을 찾지 못했어요. 1행(제목 행)의 열 이름이 안내된 이름과 같은지 확인해주세요.');
    } else {
      alert(`${count}개 행을 가져왔어요! 해당 시트로 이동해서 확인해보세요.\n(잘못 가져왔다면 이 화면 아래 "최근 가져오기 이력"에서 한 번에 되돌릴 수 있어요)`);
    }
    render();
  }catch(e){
    console.error(e);
    resultEl.innerHTML = '<div class="helptext" style="color:var(--negative);margin-top:8px">가져오기 실패: ' + e.message + '</div>';
  }
}

function koreanWeekday(dateStr){
  if(!dateStr) return '';
  const d = new Date(dateStr+'T00:00:00');
  if(isNaN(d.getTime())) return '';
  return PROMO_WEEKDAY_KR[d.getDay()] + '요일';
}
/* 오늘 기준 목표일까지 영업일(주말 제외) 수를 계산. 미래면 양수, 과거(이미 지남)면 음수 */
function businessDaysUntil(dateStr){
  if(!dateStr) return null;
  const target = new Date(dateStr+'T00:00:00');
  if(isNaN(target.getTime())) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  target.setHours(0,0,0,0);
  const isWeekend = d => d.getDay()===0 || d.getDay()===6;
  let count = 0;
  const cur = new Date(today);
  if(target.getTime()===today.getTime()) return 0;
  if(target > today){
    while(cur < target){
      cur.setDate(cur.getDate()+1);
      if(!isWeekend(cur)) count++;
    }
    return count;
  } else {
    while(cur > target){
      cur.setDate(cur.getDate()-1);
      if(!isWeekend(cur)) count--;
    }
    return count;
  }
}
function promoBrandColor(brand){
  const list = ensurePromotion().brands;

}

let sheetDragKey = null, sheetDragId = null;
function sheetGetArray(key){
  if(key==='liveSchedule') return ensureLive().schedule;
  const promo = ensurePromotion();
  if(key==='proposals') return promo.proposals;
  if(key==='selections') return promo.selections;
  if(key==='checklist') return promo.checklist;
  return [];
}
function sheetDragStart(e, key, id){
  sheetDragKey = key; sheetDragId = id;
  e.dataTransfer.effectAllowed = 'move';
}
function sheetDragOverRow(e){
  e.preventDefault();
  e.currentTarget.classList.add('sheet-drag-over');
}
function sheetDragLeaveRow(e){
  e.currentTarget.classList.remove('sheet-drag-over');
}
function sheetDropRow(e, key, targetId){
  e.preventDefault();
  document.querySelectorAll('.sheet-drag-over').forEach(el=>el.classList.remove('sheet-drag-over'));
  if(sheetDragKey!==key || !sheetDragId || sheetDragId===targetId){ sheetDragKey=null; sheetDragId=null; return; }
  const arr = sheetGetArray(key);
  // 드래그는 "화면에 지금 보이는(정렬된) 순서" 기준으로 계산해야, 실제 저장 배열의 순서가
  // 무엇이든 상관없이 사용자가 본 대로 정확히 옮겨진다.
  const ordered = sortByOrder(arr);
  const fromIdx = ordered.findIndex(x=>x.id===sheetDragId);
  const toIdx = ordered.findIndex(x=>x.id===targetId);
  sheetDragKey=null; sheetDragId=null;
  if(fromIdx===-1 || toIdx===-1) return;
  const [item] = ordered.splice(fromIdx,1);
  ordered.splice(toIdx,0,item);
  // 새로 정해진 화면 순서를 그대로 각 항목의 sortIndex 필드에 다시 매겨서 저장한다
  ordered.forEach((x,i)=>{ x.sortIndex = i; touch(x); });
  saveState(); render();
}
function sheetDragEnd(){
  document.querySelectorAll('.sheet-drag-over').forEach(el=>el.classList.remove('sheet-drag-over'));
  sheetDragKey=null; sheetDragId=null;
}

function ensureColWidths(table){
  if(!state.promotion) ensurePromotion();
  if(!state.colWidths || typeof state.colWidths!=='object') state.colWidths = {};
  if(!state.colWidths[table] || typeof state.colWidths[table]!=='object') state.colWidths[table] = {};
  return state.colWidths[table];
}
function renderColGroup(table, defaults){
  const widths = ensureColWidths(table);
  return '<colgroup>' + defaults.map((d,i)=>`<col style="width:${widths[i]||d}px">`).join('') + '</colgroup>';
}
let colResizeState = null;
document.addEventListener('mousedown', function(e){
  const handle = e.target.closest('.col-resizer');
  if(!handle) return;
  e.preventDefault();
  const table = handle.dataset.table;
  const col = parseInt(handle.dataset.col, 10);
  const th = handle.closest('th');
  const startWidth = th ? th.getBoundingClientRect().width : 80;
  colResizeState = {table, col, startX:e.clientX, startWidth};
  handle.classList.add('active');
  document.body.classList.add('col-resizing');
});
document.addEventListener('mousemove', function(e){
  if(!colResizeState) return;
  const delta = e.clientX - colResizeState.startX;
  const newWidth = Math.max(32, Math.round(colResizeState.startWidth + delta));
  const widths = ensureColWidths(colResizeState.table);
  widths[colResizeState.col] = newWidth;
  const wrap = document.getElementById('sheetWrap_' + colResizeState.table);
  if(wrap){
    const cols = wrap.querySelectorAll('colgroup col');
    if(cols[colResizeState.col]) cols[colResizeState.col].style.width = newWidth + 'px';
  }
});
document.addEventListener('mouseup', function(){
  if(!colResizeState) return;
  colResizeState = null;
  document.body.classList.remove('col-resizing');
  document.querySelectorAll('.col-resizer.active').forEach(el=>el.classList.remove('active'));
  saveState();
});
function colResizerHtml(table, colIndex){
  return `<div class="col-resizer" data-table="${table}" data-col="${colIndex}"></div>`;
}

            <thead><tr>

              <th>상품코드${colResizerHtml('settingHelper',1)}</th>

              <th class="num">최종혜택가${colResizerHtml('settingHelper',6)}</th>
              <th class="num">할인율${colResizerHtml('settingHelper',7)}</th>
              <th>링크${colResizerHtml('settingHelper',8)}</th>
            </tr></thead>
            <tbody>
              ${rows.map((r,ri)=>{
                const cs = (col)=>`class="cell-sel ss-copy-cell" data-source="settingHelper" data-r="${ri}" data-c="${col}" data-rspan="1" onmousedown="startCellSelect(${ri},${col},event,'settingHelper')" onmouseenter="extendCellSelect(${ri},${col})"`;
                return `
                <tr>
                  <td ${cs(0)} class="mono">${r.period}</td>

                  <td ${cs(2)}>${r.name}</td>
                  <td ${cs(3)} class="num mono">${r.regPrice? formatWon(r.regPrice):'-'}</td>
                  <td ${cs(4)} class="num mono" style="background:#FFF4DE;color:#B4790A;font-weight:800" onclick="copyCellValue('${Math.round(r.reserveDiscount)}', this)" title="클릭 또는 드래그해서 복사돼요">${formatWon(r.reserveDiscount)}</td>
                  <td ${cs(5)} class="num mono">${r.instant? formatWon(r.instant):'-'}</td>

                  <td ${cs(8)}>${r.link ? `<button class="copy-btn" onclick="copyProductLink('${r.link.replace(/'/g,"\\'")}', this)">복사 📋</button>` : `<span style="color:var(--text-secondary);font-size:12px">미등록</span>`}</td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>`}
        <div class="helptext">금액셋팅값은 <b>등록가 − 즉시할인가</b>로 자동 계산돼요. <b>상품코드·금액셋팅값 칸은 클릭하면 바로 복사</b>되고, <b>표의 어느 칸이든 마우스로 드래그해서 영역을 선택한 뒤 Ctrl+C(맥은 Cmd+C)로 한 번에 복사</b>해서 엑셀에 붙여넣을 수 있어요. 링크는 "복사" 버튼으로 바로 복사해서 쓰시면 돼요. "미등록"으로 뜨면 <b>프로모션 &gt; 관리</b> 화면 아래 "브랜드별 링크 관리"에서 상품링크 접두사를 먼저 등록해주세요.</div>
      </div>
    </div>
  `;
}

        </thead>
        <tbody>
          ${visibleChecklist.length===0 ? `<tr><td colspan="${colLabels.length}"><div class="empty">${promo.checklist.length===0 ? '등록된 체크리스트 항목이 없습니다. 제안리스트에서 "선정완료"를 체크하거나, 위 버튼으로 직접 추가해보세요.' : '필터 조건에 맞는 항목이 없습니다.'}</div></td></tr>` : visibleChecklist.map((c,idx)=>{

              <td>
                <div style="display:flex;align-items:center;gap:3px">
                  <input class="sheet-input" type="text" style="text-align:left" value="${c.promoName||''}" placeholder="프로모션명" onchange="updateChecklistField('${c.id}','promoName',this.value)">
                  <button class="btn-del" style="flex-shrink:0" onclick="openSettingHelper('${c.id}')" title="셋팅도우미 열기">🔧</button>

                <select class="sheet-input" onchange="updateChecklistField('${c.id}','brand',this.value)">

                </select>
              </td>
              <td>
                <select class="sheet-input" onchange="updateChecklistField('${c.id}','owner',this.value)">
                  <option value="">선택</option>
                  ${ownerOptions.map(o=>`<option value="${o}" ${o===c.owner?'selected':''}>${o}</option>`).join('')}

              </td>
              <td><input class="sheet-input" type="date" onpaste="handleDatePaste(event)" value="${c.deadline||''}" onchange="updateChecklistField('${c.id}','deadline',this.value)"></td>
              ${CHECKLIST_STATUS_FIELDS.map(f=>`
              <td>
                <select class="sheet-input" style="${checklistStatusStyle(c[f.key])}" onchange="updateChecklistField('${c.id}','${f.key}',this.value)">
                  <option value="">-</option>

              <td style="text-align:center"><input type="checkbox" ${c.capture?'checked':''} onclick="toggleChecklistField('${c.id}','capture')"></td>
              <td><button class="btn-del" onclick="deleteChecklistEntry('${c.id}')" title="삭제">✕</button></td>
              <td style="text-align:center"><input type="checkbox" ${c.ended?'checked':''} onclick="toggleChecklistField('${c.id}','ended')" title="종료 처리하면 회색으로 표시돼요"></td>

/* ---- 프로모션 통계: 브랜드별 · 월별 · 등급별 선정 현황 ---- */
let promoStatsView = null;
function ensurePromoStatsView(){
  if(!promoStatsView){ const t=new Date(); promoStatsView={y:t.getFullYear(), m:t.getMonth()+1}; }
  return promoStatsView;
}
function promoStatsPrev(){ const v=ensurePromoStatsView(); v.m--; if(v.m<1){v.m=12; v.y--;} render(); }
function promoStatsNext(){ const v=ensurePromoStatsView(); v.m++; if(v.m>12){v.m=1; v.y++;} render(); }
function promoStatsToday(){ promoStatsView=null; render(); }

function renderPromoStats(){
  const promo = ensurePromotion();
  const view = ensurePromoStatsView();
  const y = view.y, m = view.m;
  const monthKey = `${y}-${String(m).padStart(2,'0')}`;
  const filterKey = 'statsFilter';
  const visibleBrands = promo.brands.filter(b=>isBrandVisibleIn(filterKey, b));

  // 이 달에 시작하는 프로모션 중, 브랜드×등급 조합으로 "제안 건수"와 "선정 건수"를 각각 센다
  const selCounts = {}; // { [brand]: { S:0, A:0, B:0, C:0 } } - 선정된 것만
  const proposedCounts = {}; // { [brand]: { S:0, A:0, B:0, C:0 } } - 제안된 전체(선정 여부 무관)
  const zero = () => ({S:0, A:0, B:0, C:0});
  const selectedList = []; // 선정 내역 목록용
  const proposedList = []; // 제안 내역 목록용 (선정 여부 무관 전체)

  promo.proposals.forEach(p=>{
    if(!p.periodStart || !p.periodStart.startsWith(monthKey)) return;
    const grade = PROMO_GRADE_OPTIONS.includes(p.grade) ? p.grade : null;

    // 제안 건수: 이 제안에 걸려있는 브랜드 전체(선정 여부와 무관하게) 기준
    const proposedBrands = (p.brands||[]).filter(b=>visibleBrands.includes(b));
    if(grade){
      proposedBrands.forEach(b=>{
        if(!proposedCounts[b]) proposedCounts[b] = zero();
        proposedCounts[b][grade]++;
      });
    }
    if(proposedBrands.length>0){
      proposedList.push({p, brands: proposedBrands, grade});
    }

    // 선정 건수: 브랜드별로 실제 선정완료 체크된 것만
    const sel = selectedBrandsOf(p).filter(b=>visibleBrands.includes(b));
    if(sel.length>0){
      if(grade){
        sel.forEach(b=>{
          if(!selCounts[b]) selCounts[b] = zero();
          selCounts[b][grade]++;
        });
      }
      selectedList.push({p, sel, grade});
    }
  });
  selectedList.sort((a,b)=> (a.p.periodStart||'').localeCompare(b.p.periodStart||''));
  proposedList.sort((a,b)=> (a.p.periodStart||'').localeCompare(b.p.periodStart||''));

  // 브랜드 목록: 필터에 켜진 브랜드 + 혹시 필터목록엔 없는데 데이터엔 있는 브랜드까지 다 포함
  const allBrands = Array.from(new Set([...visibleBrands, ...Object.keys(selCounts), ...Object.keys(proposedCounts)]));
  const totalRow = zero();
  const proposedTotalRow = zero();
  allBrands.forEach(b=>{
    const c = selCounts[b] || zero();
    const pc = proposedCounts[b] || zero();
    PROMO_GRADE_OPTIONS.forEach(g=>{ totalRow[g] += c[g]; proposedTotalRow[g] += pc[g]; });
  });
  const grandTotal = PROMO_GRADE_OPTIONS.reduce((s,g)=>s+totalRow[g],0);
  const proposedGrandTotal = PROMO_GRADE_OPTIONS.reduce((s,g)=>s+proposedTotalRow[g],0);
  const overallRate = proposedGrandTotal>0 ? Math.round(grandTotal/proposedGrandTotal*100) : null;

  return `
    <div class="page-header">
      <div>
        <span class="eyebrow" style="background:#2F6FED22;color:#2F6FED">프로모션</span>
        <h1>통계</h1>
        <div class="sub">브랜드별 · 월별 · 등급별로 제안 대비 선정 현황을 한눈에 볼 수 있어요 (프로모션 기간 시작일 기준)</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <button class="btn ghost" onclick="promoStatsPrev()" style="color:var(--text-primary)">◀</button>
        <div style="font-weight:800;font-size:15px;min-width:96px;text-align:center">${y}년 ${m}월</div>
        <button class="btn ghost" onclick="promoStatsNext()" style="color:var(--text-primary)">▶</button>
        <button class="btn ghost" onclick="promoStatsToday()" style="color:var(--text-primary)">오늘</button>
      </div>
    </div>

    ${renderBrandFilterBar(filterKey, promo.brands)}

    <div class="stat-grid">
      <div class="stat-box"><div class="label">${y}년 ${m}월 제안 건수</div><div class="value mono">${proposedGrandTotal}건</div></div>
      <div class="stat-box"><div class="label">${y}년 ${m}월 선정 건수</div><div class="value mono">${grandTotal}건</div></div>
      <div class="stat-box"><div class="label">선정률</div><div class="value mono" style="color:#2F6FED">${overallRate===null?'-':overallRate+'%'}</div></div>
      ${PROMO_GRADE_OPTIONS.map(g=>`<div class="stat-box"><div class="label">${g}급 (선정/제안)</div><div class="value mono" style="color:${PROMO_GRADE_COLORS[g].fg};font-size:18px">${totalRow[g]}/${proposedTotalRow[g]}</div></div>`).join('')}
    </div>

    <div class="ss-row2col promo-stats-row2col">
      <div class="card promo-stats-card">
        <h2>브랜드별 제안 대비 선정 현황</h2>
        ${allBrands.length===0 ? `<div class="empty">브랜드 필터에서 브랜드를 선택해주세요.</div>` : `
        <div style="overflow-x:auto">
        <table class="promo-stats-table">
          <thead>
            <tr>
              <th rowspan="2" style="text-align:left;vertical-align:bottom">브랜드</th>
              <th colspan="5" style="text-align:center;border-left:1px solid var(--border)">제안 건수</th>
              <th colspan="5" style="text-align:center;border-left:1px solid var(--border)">선정 건수</th>
              <th rowspan="2" class="num" style="vertical-align:bottom;border-left:1px solid var(--border)">선정률</th>
            </tr>
            <tr>
              ${PROMO_GRADE_OPTIONS.map((g,gi)=>`<th class="num promo-grade-col" style="color:${PROMO_GRADE_COLORS[g].fg};${gi===0?'border-left:1px solid var(--border)':''}">${g}</th>`).join('')}
              <th class="num promo-grade-col" style="font-weight:800">합계</th>
              ${PROMO_GRADE_OPTIONS.map((g,gi)=>`<th class="num promo-grade-col" style="color:${PROMO_GRADE_COLORS[g].fg};${gi===0?'border-left:1px solid var(--border)':''}">${g}</th>`).join('')}
              <th class="num promo-grade-col" style="font-weight:800">합계</th>
            </tr>
          </thead>
          <tbody>
            ${allBrands.map((b,i)=>{
              const pc = proposedCounts[b] || zero();
              const sc = selCounts[b] || zero();
              const pTotal = PROMO_GRADE_OPTIONS.reduce((s,g)=>s+pc[g],0);
              const sTotal = PROMO_GRADE_OPTIONS.reduce((s,g)=>s+sc[g],0);
              const rate = pTotal>0 ? Math.round(sTotal/pTotal*100) : null;
              const gradeTds = (counts, isFirst) => PROMO_GRADE_OPTIONS.map((g,gi)=>
                `<td class="num mono promo-grade-col" style="${counts[g]>0?'font-weight:800;color:'+PROMO_GRADE_COLORS[g].fg+';':'color:var(--text-secondary)'}${gi===0&&isFirst?';border-left:1px solid var(--border)':''}">${counts[g]||'-'}</td>`
              ).join('');
              return `
              <tr class="${i%2===1?'row-alt':''}">
                <td style="display:flex;align-items:center;gap:6px;font-weight:700;white-space:nowrap">
                  <span style="width:8px;height:8px;border-radius:50%;background:${promoBrandColor(b)};display:inline-block;flex-shrink:0"></span>${b}
                </td>
                ${gradeTds(pc, true)}
                <td class="num mono promo-grade-col" style="font-weight:800">${pTotal||'-'}</td>
                ${gradeTds(sc, true)}
                <td class="num mono promo-grade-col" style="font-weight:800">${sTotal||'-'}</td>
                <td class="num mono" style="font-weight:800;border-left:1px solid var(--border);color:${rate===null?'var(--text-secondary)':(rate>=50?'#12805C':'#D64545')}">${rate===null?'-':rate+'%'}</td>
              </tr>`;
            }).join('')}
          </tbody>
          <tfoot>
            <tr style="border-top:2px solid var(--border)">
              <td style="font-weight:800">전체 합계</td>
              ${PROMO_GRADE_OPTIONS.map((g,gi)=>`<td class="num mono promo-grade-col" style="font-weight:800;color:${PROMO_GRADE_COLORS[g].fg};${gi===0?'border-left:1px solid var(--border)':''}">${proposedTotalRow[g]||'-'}</td>`).join('')}
              <td class="num mono promo-grade-col" style="font-weight:800">${proposedGrandTotal||'-'}</td>
              ${PROMO_GRADE_OPTIONS.map((g,gi)=>`<td class="num mono promo-grade-col" style="font-weight:800;color:${PROMO_GRADE_COLORS[g].fg};${gi===0?'border-left:1px solid var(--border)':''}">${totalRow[g]||'-'}</td>`).join('')}
              <td class="num mono promo-grade-col" style="font-weight:800">${grandTotal||'-'}</td>
              <td class="num mono" style="font-weight:800;border-left:1px solid var(--border);color:#2F6FED">${overallRate===null?'-':overallRate+'%'}</td>
            </tr>
          </tfoot>
        </table>
        </div>`}
      </div>

      <div class="promo-stats-listcol">
        <div class="card promo-stats-card">
          <h2>${y}년 ${m}월 제안 내역</h2>
          ${proposedList.length===0 ? `<div class="empty">이 달에 등록된 제안이 없습니다.</div>` : `
          <table>
            <thead>
              <tr>
                <th style="text-align:left">프로모션명</th>
                <th style="text-align:left">브랜드</th>
                <th>등급</th>
                <th style="text-align:left">기간</th>
              </tr>
            </thead>
            <tbody>
              ${proposedList.map(({p, brands, grade}, i)=>`
                <tr class="${i%2===1?'row-alt':''}">
                  <td style="font-weight:600">${p.promoName||'(제목 없음)'}</td>
                  <td>${brands.map(b=>`<span style="display:inline-flex;align-items:center;gap:4px;margin-right:8px"><span style="width:6px;height:6px;border-radius:50%;background:${promoBrandColor(b)};display:inline-block"></span>${b}</span>`).join('')}</td>
                  <td style="text-align:center">${grade ? `<span class="badge" style="${gradeStyle(grade)}">${grade}</span>` : '-'}</td>
                  <td class="mono" style="font-size:12.5px;color:var(--text-secondary)">${p.periodStart||'-'} ~ ${p.periodEnd||'-'}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>`}
        </div>

        <div class="card promo-stats-card">
          <h2>${y}년 ${m}월 선정 내역</h2>
          ${selectedList.length===0 ? `<div class="empty">이 달에 선정완료된 프로모션이 없습니다.</div>` : `
          <table>
            <thead>
              <tr>
                <th style="text-align:left">프로모션명</th>
                <th style="text-align:left">브랜드</th>
                <th>등급</th>
                <th style="text-align:left">기간</th>
                <th class="num">행사매출</th>
              </tr>
            </thead>
            <tbody>
              ${selectedList.map(({p, sel, grade}, i)=>{
                const eventSalesSum = sel.reduce((sum,b)=>{
                  const c = promo.checklist.find(ci=>ci.sourceProposalId===p.id && ci.brand===b);
                  return sum + (c && c.eventSales ? Number(c.eventSales)||0 : 0);
                }, 0);
                return `
                <tr class="${i%2===1?'row-alt':''}">
                  <td style="font-weight:600">${p.promoName||'(제목 없음)'}</td>
                  <td>${sel.map(b=>`<span style="display:inline-flex;align-items:center;gap:4px;margin-right:8px"><span style="width:6px;height:6px;border-radius:50%;background:${promoBrandColor(b)};display:inline-block"></span>${b}</span>`).join('')}</td>
                  <td style="text-align:center">${grade ? `<span class="badge" style="${gradeStyle(grade)}">${grade}</span>` : '-'}</td>

// 제안리스트 → gid 956711804 탭
function handleProposalSync(ss, data) {
  var targetGid = 956711804;
  var sheet = ss.getSheets().filter(function(s){ return s.getSheetId() === targetGid; })[0];
  if (!sheet) sheet = ss.getSheets()[0];

  var header = ['행키','제안마감일','시작일','종료일','브랜드','프로모션명','등급','담당자','제안완료','선정완료','관련링크'];
  if (sheet.getLastRow() === 0) sheet.appendRow(header);

  var lastRow = sheet.getLastRow();
  var allKeys = lastRow > 1 ? sheet.getRange(2, 1, lastRow - 1, 1).getValues().flat() : [];

  // 1) 이 제안(proposalId)에 해당하던 기존 행 중, 이번엔 안 보낸(브랜드가 빠지거나 삭제된) 것들은 지운다
  var prefix = data.proposalId + '_';
  for (var i = allKeys.length - 1; i >= 0; i--) {
    var key = allKeys[i];
    if (String(key).indexOf(prefix) === 0) {
      var stillExists = (data.rows || []).some(function(r){ return r.rowKey === key; });
      if (!stillExists) {
        sheet.deleteRow(i + 2);
        allKeys.splice(i, 1);
      }
    }
  }

  // 2) 지금 보낸 행(브랜드별로 하나씩)들을 갱신하거나 새로 추가한다
  (data.rows || []).forEach(function(r){
    var rowValues = [
      r.rowKey, r.proposeDate || '', r.periodStart || '', r.periodEnd || '',
      r.brand || '', r.promoName || '', r.grade || '', r.owner || '',
      r.proposeDone || '', r.selected || '', r.link || ''
    ];
    var idx = allKeys.indexOf(r.rowKey);
    if (idx >= 0) {
      sheet.getRange(idx + 2, 1, 1, rowValues.length).setValues([rowValues]);
    } else {
      sheet.appendRow(rowValues);
      allKeys.push(r.rowKey);
    }
  });
}

// 선정리스트 → gid 511039182 탭
// 항목(entryId) 하나에 상품이 여러 개 있을 수 있어서, 매번 그 항목에 해당하는 행들을
// 지금 보낸 내용(rows)으로 통째로 맞춰친다 (기존 행 중 이번에 없는 건 지우고, 있는 건 갱신, 새 건 추가).
function handleSelectionSync(ss, data) {
  var targetGid = 511039182;

  if (!sheet) sheet = ss.getSheets()[0];

  var header = ['행키','시작일','종료일','프로모션명','노출구좌','노출일','브랜드','상품코드','상품명','등록가','즉시할인가','최종혜택가','할인율','등급','목표매출','행사매출'];
  if (sheet.getLastRow() === 0) sheet.appendRow(header);

  var lastRow = sheet.getLastRow();
  var allKeys = lastRow > 1 ? sheet.getRange(2, 1, lastRow - 1, 1).getValues().flat() : [];

  // 1) 이 항목(entryId)에 해당하던 기존 행 중, 이번에 안 보낸(삭제된) 것들은 지운다
  var prefix = data.entryId + '_';
  for (var i = allKeys.length - 1; i >= 0; i--) {
    var key = allKeys[i];
    if (String(key).indexOf(prefix) === 0) {
      var stillExists = (data.rows || []).some(function(r){ return r.rowKey === key; });
      if (!stillExists) {
        sheet.deleteRow(i + 2);
        allKeys.splice(i, 1);
      }
    }
  }

  // 2) 보낸 행들을 갱신하거나 새로 추가한다
  (data.rows || []).forEach(function(r) {
    var rowValues = [
      r.rowKey, r.startDate || '', r.endDate || '', r.promoName || '', r.exposureSlot || '',
      r.exposureDate || '', r.brand || '', r.code || '', r.name || '',
      r.regPrice || '', r.instantDiscountPrice || '', r.finalBenefitPrice || '', r.rate || '',
      r.grade || '', r.targetSales || '', r.eventSales || ''
    ];
    var idx = allKeys.indexOf(r.rowKey);
    if (idx >= 0) {
      sheet.getRange(idx + 2, 1, 1, rowValues.length).setValues([rowValues]);
    } else {
      sheet.appendRow(rowValues);

  });
}

// 제안캘린더 / 선정캘린더 / 라이브캘린더 → 각각 지정한 구글 캘린더 ID로 이벤트 생성/수정/삭제
// 우리 앱의 항목 id와 실제로 만들어진 구글 캘린더 이벤트 id를 스크립트 속성에 기억해뒀다가,
// 다음에 같은 id로 요청이 오면 그 이벤트를 지우고 새로 만든다(간단하고 확실한 방식).
function handleCalendarSync(data) {
  if (!data.calendarId) return;
  var cal = CalendarApp.getCalendarById(data.calendarId);
  if (!cal) return;

  var props = PropertiesService.getScriptProperties();
  var mapKey = 'evt_' + data.id;
  var existingEventId = props.getProperty(mapKey);

  if (existingEventId) {
    try {
      var oldEv = cal.getEventById(existingEventId);
      if (oldEv) oldEv.deleteEvent();
    } catch (e) {}
    props.deleteProperty(mapKey);
  }

  if (data.action === 'delete') return;

  var newEvent;
  if (data.allDay) {
    var start = new Date(data.startDate + 'T00:00:00');
    var end = new Date((data.endDate || data.startDate) + 'T00:00:00');
    end.setDate(end.getDate() + 1); // 구글 캘린더 종일 이벤트는 종료일 다음날 0시로 지정해야 그 날짜까지 표시됨
    newEvent = cal.createAllDayEvent(data.title, start, end);
  } else {
    var start = new Date(data.date + 'T' + (data.time || '09:00') + ':00');
    var end = new Date(start.getTime() + 60 * 60 * 1000);
    newEvent = cal.createEvent(data.title, start, end);
  }
  if (data.description) newEvent.setDescription(data.description);
  props.setProperty(mapKey, newEvent.getId());
}</pre>

function ensurePromoCalView(){
  if(!promoCalView){ const t=new Date(); promoCalView={y:t.getFullYear(), m:t.getMonth()+1}; }
  return promoCalView;
}
function ensurePromoProposeCalView(){
  if(!promoProposeCalView){ const t=new Date(); promoProposeCalView={y:t.getFullYear(), m:t.getMonth()+1}; }

}
function promoCalPrev(){ const v=ensurePromoCalView(); v.m--; if(v.m<1){v.m=12; v.y--;} render(); }
function promoCalNext(){ const v=ensurePromoCalView(); v.m++; if(v.m>12){v.m=1; v.y++;} render(); }
function promoCalToday(){ promoCalView=null; render(); }
function promoProposeCalPrev(){ const v=ensurePromoProposeCalView(); v.m--; if(v.m<1){v.m=12; v.y--;} render(); }
function promoProposeCalNext(){ const v=ensurePromoProposeCalView(); v.m++; if(v.m>12){v.m=1; v.y++;} render(); }
function promoProposeCalToday(){ promoProposeCalView=null; render(); }

function isPromoBrandVisible(brand){
  const f = ensurePromotion().calendarFilter;
  return f[brand] !== false;
}
function togglePromoBrandFilter(brand){
  const promo = ensurePromotion();
  promo.calendarFilter[brand] = !isPromoBrandVisible(brand);
  saveState(); render();
}

function buildPromoCalGrid(y, m, eventsOnDay, renderChip){
  const firstWeekday = new Date(y, m-1, 1).getDay();
  const daysInMonth = new Date(y, m, 0).getDate();
  const pad2 = n => String(n).padStart(2,'0');
  const cells = [];
  for(let i=0;i<firstWeekday;i++) cells.push(null);
  for(let d=1; d<=daysInMonth; d++) cells.push(d);
  while(cells.length % 7 !== 0) cells.push(null);
  const todayStr2 = todayStr();

  let weekRows = '';
  for(let w=0; w<cells.length/7; w++){
    weekRows += '<tr>';
    for(let c=0; c<7; c++){
      const day = cells[w*7+c];
      if(day===null){ weekRows += `<td class="promo-cal-cell empty-cell"></td>`; continue; }
      const dateStr = `${y}-${pad2(m)}-${pad2(day)}`;
      const evs = eventsOnDay(dateStr);
      const isToday = dateStr===todayStr2;
      const wd = new Date(y,m-1,day).getDay();
      weekRows += `
        <td class="promo-cal-cell ${isToday?'is-today':''}">
          <div class="promo-cal-daynum ${wd===0?'sun':''} ${wd===6?'sat':''}">${day}</div>
          <div class="promo-cal-events">${evs.map(renderChip).join('')}</div>
        </td>`;
    }
    weekRows += '</tr>';
  }
  return `
    <table class="promo-cal-table">
      <thead><tr>${PROMO_WEEKDAY_KR.map((w,i)=>`<th class="${i===0?'sun':''} ${i===6?'sat':''}">${w}</th>`).join('')}</tr></thead>
      <tbody>${weekRows}</tbody>
    </table>`;
}

/* ---- 구글 스프레드시트 자동 연동 ----
   제안리스트에 새 항목이 생기거나 내용이 바뀌면, 등록해둔 구글 앱스스크립트 웹앱 주소로
   그 항목의 내용을 보내서 시트에 자동으로 기입/갱신되도록 한다. (관리 페이지에서 주소 등록) */
let sheetSyncTimers = {};
function scheduleSheetSync(proposalId){
  const url = (ensurePromotion().sheetSyncUrl||'').trim();
  if(!url) return;
  clearTimeout(sheetSyncTimers[proposalId]);
  sheetSyncTimers[proposalId] = setTimeout(()=>{ pushProposalToSheet(proposalId); }, 1500);
}
async function pushProposalToSheet(proposalId){
  const url = (ensurePromotion().sheetSyncUrl||'').trim();
  if(!url) return {ok:false, error:'웹앱 주소가 없습니다.'};
  const p = ensurePromotion().proposals.find(x=>x.id===proposalId);
  if(!p) return {ok:false, error:'제안 항목을 찾을 수 없습니다.'};
  // 브랜드가 여러 개면(예: VSL3, 갸스비) 한 줄에 몰아넣지 않고, 브랜드마다 시트에 별도 행을 만든다
  const brands = (p.brands && p.brands.length) ? p.brands : [''];
  const selected = new Set(selectedBrandsOf(p));
  const rows = brands.map(brand => ({
    rowKey: p.id + '_' + (brand || '(미지정)'),
    proposeDate: p.proposeDate||'',
    periodStart: p.periodStart||'',
    periodEnd: p.periodEnd||'',
    brand: brand||'',
    promoName: p.promoName||'',
    grade: p.grade||'',
    owner: p.owner||'',
    proposeDone: p.proposeDone ? 'Y' : '',
    selected: selected.has(brand) ? 'Y' : '',
    link: p.link||'',
  }));
  const payload = { type: 'proposal', proposalId: p.id, rows };
  try{
    // 예전엔 no-cors로 보내서 실제로 잘 들어갔는지 전혀 확인할 수 없었다. 앱스스크립트 웹앱은
    // 실제로 응답을 읽을 수 있다는 게 진단으로 확인됐으니, 이제는 응답까지 읽어서 진짜 성공/실패를 판단한다.
    const res = await fetch(url, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload),
    });
    const text = await res.text();
    let parsed = null;
    try{ parsed = JSON.parse(text); }catch(e){}
    if(parsed && parsed.ok) return {ok:true};
    return {ok:false, error: (parsed && parsed.error) ? parsed.error : ('서버 응답 이상: ' + text.slice(0,200))};
  }catch(e){
    console.error('구글시트 동기화 실패:', e);
    return {ok:false, error:e.message};
  }
}
async function syncAllProposalsToSheet(btnEl){
  const url = (ensurePromotion().sheetSyncUrl||'').trim();
  if(!url){ alert('먼저 구글 스프레드시트 웹앱 주소를 입력해주세요.'); return; }
  const proposals = ensurePromotion().proposals;
  if(proposals.length===0){ alert('보낼 제안리스트 항목이 없습니다.'); return; }
  const label = btnEl ? btnEl.textContent : '';
  if(btnEl){ btnEl.textContent = `보내는 중... (0/${proposals.length})`; btnEl.disabled = true; }
  let successCount = 0;
  const failures = [];
  for(let i=0; i<proposals.length; i++){
    const p = proposals[i];
    const result = await pushProposalToSheet(p.id);
    if(result && result.ok) successCount++;
    else failures.push({name: p.promoName || '(제목 없음)', error: result ? result.error : '알 수 없는 오류'});
    if(btnEl) btnEl.textContent = `보내는 중... (${i+1}/${proposals.length})`;
  }
  if(btnEl){ btnEl.textContent = label; btnEl.disabled = false; }
  if(failures.length===0){
    alert(`✅ 총 ${proposals.length}개 전부 정상적으로 보냈어요 (서버 응답 확인 완료).`);
  } else {
    const preview = failures.slice(0,8).map(f=>`- ${f.name}: ${f.error}`).join('\n');
    const more = failures.length>8 ? `\n...외 ${failures.length-8}개 더` : '';
    alert(`총 ${proposals.length}개 중 ${successCount}개 성공, ${failures.length}개 실패했어요.\n\n[실패 내역]\n${preview}${more}`);
  }
}
/* ---- 선정리스트도 같은 방식으로 구글 스프레드시트에 동기화 (다른 탭) ----
   선정 항목 하나에 상품이 여러 개 있을 수 있어서, "이 항목의 상품 행 전체를 다시 보낸다" 방식으로 동작한다.
   보낼 때마다 그 항목(entryId)에 해당하는 시트의 기존 행들을 지금 상태로 통째로 맞춰치기 때문에,
   상품을 추가/삭제해도 시트가 항상 앱과 똑같이 맞춰진다. */
let selectionSheetSyncTimers = {};
/* 셋팅도우미의 목표매출·행사매출을, 그 항목과 연결된 선정리스트 항목을 통해 구글시트에도 반영한다.
   (셋팅도우미가 체크리스트→선정리스트를 찾는 방식과 똑같이 매칭한다) */
function findChecklistForSelection(s){
  const promo = ensurePromotion();
  if(!s) return null;
  return promo.checklist.find(c=>{
    if(s.sourceProposalId){
      return c.sourceProposalId===s.sourceProposalId && (c.brand||'')===(s.brand||'');
    }
    return (c.promoName||'')===(s.promoName||'') && (c.brand||'')===(s.brand||'') &&
           (c.startDate||'')===(s.startDate||'') && (c.endDate||'')===(s.endDate||'');
  });
}
function resyncSalesForChecklistEntry(checklistId){
  const promo = ensurePromotion();
  const c = promo.checklist.find(x=>x.id===checklistId);
  if(!c) return;
  const sel = promo.selections.find(s=>findChecklistForSelection(s)===c);
  if(sel) scheduleSelectionSheetSync(sel.id);
}
function scheduleSelectionSheetSync(entryId){
  const url = (ensurePromotion().sheetSyncUrl||'').trim();
  if(!url) return;
  clearTimeout(selectionSheetSyncTimers[entryId]);
  selectionSheetSyncTimers[entryId] = setTimeout(()=>{ resyncSelectionEntryToSheet(entryId); }, 1500);
}
async function resyncSelectionEntryToSheet(entryId){
  const url = (ensurePromotion().sheetSyncUrl||'').trim();
  if(!url) return;
  const promo = ensurePromotion();
  const s = promo.selections.find(x=>x.id===entryId);
  const checklistEntry = s ? findChecklistForSelection(s) : null;
  const targetSales = checklistEntry ? (checklistEntry.targetSales||'') : '';
  const eventSales = checklistEntry ? (checklistEntry.eventSales||'') : '';
  // 등급은 선정리스트 자체엔 없는 값이라, 이 항목을 만들어낸 원본 제안(제안리스트)에서 가져온다
  const sourceProposal = (s && s.sourceProposalId) ? promo.proposals.find(p=>p.id===s.sourceProposalId) : null;
  const grade = sourceProposal ? (sourceProposal.grade||'') : '';
  // 항목이 이미 삭제됐으면 rows를 빈 배열로 보내서 시트에 남아있던 그 항목의 행들도 같이 지운다
  const rows = s ? (s.products||[]).map((p,i)=>{
    const rate = calcDiscountRate(p.regPrice, p.finalBenefitPrice);
    return {
      rowKey: `${s.id}_${p.id}`,
      startDate: s.startDate||'', endDate: s.endDate||'', promoName: s.promoName||'',
      exposureSlot: s.exposureSlot||'', exposureDate: s.exposureDate||'',
      brand: s.brand ? (s.exposureDate ? `${s.brand}(${s.exposureDate})` : s.brand) : '',
      code: p.code||'', name: p.name||'',
      regPrice: p.regPrice||'', instantDiscountPrice: p.instantDiscountPrice||'', finalBenefitPrice: p.finalBenefitPrice||'',
      rate: rate===null ? '' : rate+'%',
      grade: i===0 ? grade : '',
      targetSales: i===0 ? targetSales : '',
      eventSales: i===0 ? eventSales : '',
    };
  }) : [];
  const payload = { type:'selection', action:'resyncEntry', entryId, rows };
  try{
    await fetch(url, {
      method: 'POST', mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload),
    });
  }catch(e){
    console.error('선정리스트 구글시트 동기화 실패:', e);
  }
}
async function syncAllSelectionsToSheet(btnEl){
  const url = (ensurePromotion().sheetSyncUrl||'').trim();
  if(!url){ alert('먼저 구글 스프레드시트 웹앱 주소를 입력해주세요.'); return; }

/* ---- 구글 캘린더 연동: 제안캘린더 / 선정캘린더 / 라이브캘린더 각각 별도 구글 캘린더로 동기화 ----
   같은 앱스스크립트 웹앱(sheetSyncUrl)을 그대로 재사용하고, "이 캘린더에 이 id로 만든 이벤트"를
   앱스스크립트 쪽에서 기억해뒀다가 있으면 갱신, 없으면 새로 만들고, 조건이 안 맞으면 지우는 방식이다. */
let calendarSyncTimers = {};
function scheduleCalendarSync(kind, entryId){
  const key = kind+'_'+entryId;
  clearTimeout(calendarSyncTimers[key]);
  calendarSyncTimers[key] = setTimeout(()=>{ pushCalendarEvent(kind, entryId); }, 1500);
}
async function pushCalendarEvent(kind, entryId){
  const url = (ensurePromotion().sheetSyncUrl||'').trim();
  if(!url) return;
  let payloads = [];

  if(kind==='propose'){
    const calId = (ensurePromotion().proposeCalendarId||'').trim();
    if(!calId) return;
    const p = ensurePromotion().proposals.find(x=>x.id===entryId);
    if(!p || !p.proposeDate){
      payloads.push({type:'calendar', calendarId:calId, id:'propose_'+entryId, action:'delete'});
    } else {
      payloads.push({type:'calendar', calendarId:calId, id:'propose_'+entryId, action:'upsert', allDay:true,
        startDate:p.proposeDate, endDate:p.proposeDate, title:p.promoName||'(제목 없음)', description:''});
    }
  } else if(kind==='selected'){
    const calId = (ensurePromotion().selectedCalendarId||'').trim();
    if(!calId) return;
    const promoObj = ensurePromotion();
    const p = promoObj.proposals.find(x=>x.id===entryId);
    const sel = p ? selectedBrandsOf(p) : [];
    if(!p || sel.length===0 || !p.periodStart || !p.periodEnd){
      payloads.push({type:'calendar', calendarId:calId, id:'selected_'+entryId, action:'delete'});
    } else {
      // 브랜드별 선정리스트 항목에 노출일이 등록되어 있으면, 그 브랜드명 뒤에 괄호로 노출일을 같이 붙인다
      const brandLabels = sel.map(b=>{
        const selEntry = promoObj.selections.find(s=>s.sourceProposalId===p.id && s.brand===b);
        return (selEntry && selEntry.exposureDate) ? `${b}(${selEntry.exposureDate})` : b;
      });
      payloads.push({type:'calendar', calendarId:calId, id:'selected_'+entryId, action:'upsert', allDay:true,
        startDate:p.periodStart, endDate:p.periodEnd, title:(p.promoName||'(제목 없음)')+'_'+brandLabels.join(','), description:''});
    }
  } else if(kind==='live'){
    const live = ensureLive();
    const s = live.schedule.find(x=>x.id===entryId);
    // 기본 라이브캘린더 (전체 브랜드)
    const calId = (live.liveCalendarId||'').trim();
    if(calId){
      if(!s || !s.date){
        payloads.push({type:'calendar', calendarId:calId, id:'live_'+entryId, action:'delete'});
      } else {
        payloads.push({type:'calendar', calendarId:calId, id:'live_'+entryId, action:'upsert', allDay:false,
          date:s.date, time:s.time||'09:00', title:`${s.brand||'(브랜드 미정)'}(${s.time||'-'})`, description:s.content||''});
      }
    }
    // 두 번째 라이브캘린더 (지정한 브랜드만)
    const calId2 = (live.liveCalendarId2||'').trim();
    if(calId2){
      const allowedBrands = liveCalendarId2Brands();
      const matches = s && s.date && s.brand && allowedBrands.includes(s.brand);
      if(!matches){
        payloads.push({type:'calendar', calendarId:calId2, id:'live2_'+entryId, action:'delete'});
      } else {
        payloads.push({type:'calendar', calendarId:calId2, id:'live2_'+entryId, action:'upsert', allDay:false,
          date:s.date, time:s.time||'09:00', title:`${s.brand}(${s.time||'-'})`, description:s.content||''});
      }
    }
  }
  for(const payload of payloads){
    try{
      await fetch(url, {
        method:'POST', mode:'no-cors',
        headers:{'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify(payload),
      });
    }catch(e){
      console.error('구글캘린더 동기화 실패:', e);
    }
  }
}
async function syncAllToCalendars(btnEl){
  const url = (ensurePromotion().sheetSyncUrl||'').trim();
  if(!url){ alert('먼저 구글 스프레드시트 웹앱 주소를 입력해주세요 (캘린더 연동도 같은 주소를 써요).'); return; }
  const label = btnEl ? btnEl.textContent : '';
  if(btnEl){ btnEl.textContent = '보내는 중...'; btnEl.disabled = true; }
  for(const p of ensurePromotion().proposals){
    await pushCalendarEvent('propose', p.id);
    await pushCalendarEvent('selected', p.id);
  }
  for(const s of ensureLive().schedule){
    await pushCalendarEvent('live', s.id);
  }
  if(btnEl){ btnEl.textContent = label; btnEl.disabled = false; }
  alert('구글 캘린더로 전체 전송했어요. 각 캘린더에서 확인해주세요.');
}

function updateProposalField(id, field, value){
  const promo = ensurePromotion();
  const row = promo.proposals.find(p=>p.id===id);
  if(!row) return;
  row[field] = value;
  touch(row);
  saveState(); render();
  scheduleSheetSync(id);
  scheduleCalendarSync('propose', id);
  scheduleCalendarSync('selected', id);
}
/* 하나의 제안에 브랜드를 여러 개 추가할 수 있다 */
function addProposalBrand(id, brand){
  if(!brand) return;
  const promo = ensurePromotion();
  const row = promo.proposals.find(p=>p.id===id);
  if(!row) return;
  if(!Array.isArray(row.brands)) row.brands = [];
  if(!row.brands.includes(brand)) row.brands.push(brand);
  touch(row);
  saveState(); render();
  scheduleSheetSync(id);
  scheduleCalendarSync('selected', id);
}
function removeProposalBrand(id, brand){
  const promo = ensurePromotion();
  const row = promo.proposals.find(p=>p.id===id);
  if(!row) return;
  row.brands = (row.brands||[]).filter(b=>b!==brand);
  touch(row);
  saveState(); render();
  scheduleSheetSync(id);
  scheduleCalendarSync('selected', id);
}
/* 브랜드별 선정완료: 브랜드마다 따로 체크하고, 체크되는 순간 셋팅 체크리스트·선정리스트에 각각 자동으로 한 줄씩 생긴다 */
function selectedBrandsOf(p){
  if(!p.selectedBrands) return [];
  return Object.keys(p.selectedBrands).filter(b=>p.selectedBrands[b]);
}
function isProposalBrandSelected(p, brand){
  return !!(p.selectedBrands && p.selectedBrands[brand]);
}
function toggleProposalBrandSelected(id, brand){
  const promo = ensurePromotion();
  const row = promo.proposals.find(p=>p.id===id);
  if(!row) return;
  if(!row.selectedBrands) row.selectedBrands = {};
  if(!row.selectedBrandsTs) row.selectedBrandsTs = {};
  const nowSelected = !row.selectedBrands[brand];
  row.selectedBrands[brand] = nowSelected;
  row.selectedBrandsTs[brand] = Date.now(); // 이 브랜드의 선정 여부만 따로 시각을 기록 (다른 칸 수정과 무관하게 병합하기 위함)
  touch(row);
  if(nowSelected){
    addChecklistFromProposalBrand(row, brand);
    addSelectionFromProposalBrand(row, brand);
  }
  // 체크를 해제해도 이미 만들어진 셋팅·선정리스트 항목은 더 이상 자동으로 지우지 않는다.
  // 한 번 입력된 데이터는 각 리스트 화면의 삭제(🗑) 버튼으로 직접 지우지 않는 한 절대 자동으로
  // 사라지지 않아야 하기 때문 — "선정완료 체크"는 그저 새 항목을 만들어주는 트리거일 뿐, 그 뒤로
  // 두 데이터는 서로 독립적으로 관리된다.
  saveState(); render();
  scheduleSheetSync(id);
  scheduleCalendarSync('selected', id);
}
/* 선정완료는 한 번 체크되면 실수로(혹은 다른 이유로) 풀리지 않도록 잠가두고,
   해제하고 싶을 때만 "수정" 버튼으로 확인창을 한 번 거쳐서 풀 수 있게 한다. */
function requestUnselectProposalBrand(id, brand){
  if(!confirm(`"${brand}" 선정완료를 해제할까요?\n(이미 만들어진 셋팅·선정리스트 항목은 지워지지 않고 그대로 남아있어요. 지우려면 각 리스트에서 직접 삭제해주세요.)`)) return;
  toggleProposalBrandSelected(id, brand);
}
function toggleProposalField(id, field){
  const promo = ensurePromotion();
  const row = promo.proposals.find(p=>p.id===id);
  if(!row) return;
  row[field] = !row[field];
  touch(row);
  saveState(); render();
  scheduleSheetSync(id);
}
function deleteProposal(id){
  const promo = ensurePromotion();
  promo.proposals = promo.proposals.filter(p=>p.id!==id);
  recordDeleted('proposals', id);
  saveState(); render();
  pushCalendarEvent('propose', id);
  pushCalendarEvent('selected', id);
}

/* ---- 선정리스트 (제안리스트와 무관한 독립 데이터, 프로모션 1건당 상품코드 여러 개 등록 가능) ---- */
function calcDiscountRate(regPrice, finalPrice){
  const reg = Number(regPrice), fin = Number(finalPrice);
  if(!reg || reg<=0 || finalPrice===''||finalPrice===null||finalPrice===undefined) return null;
  return Math.floor((1 - fin/reg) * 100); // ROUNDDOWN((1-최종혜택가/등록가)*100,0)/100 과 동일한 정수 % 값
}

/* 엑셀/구글 스프레드시트에서 여러 셀을 복사해 붙여넣으면(탭=열 구분, 줄바꿈=행 구분)
   자동으로 부족한 상품 행을 추가하면서 각 칸에 채워 넣는다.
   가격 칸(등록가/즉시할인가/최종혜택가)은 number 입력이라 "10,000"처럼 콤마가 섞이면
   그대로는 절대 들어가지 않으므로, 붙여넣을 때 숫자만 남기고 자동으로 정리한다. */
const PROMO_PRODUCT_FIELD_ORDER = ['code','name','regPrice','instantDiscountPrice','finalBenefitPrice'];
const PROMO_PRODUCT_NUMERIC_FIELDS = ['regPrice','instantDiscountPrice','finalBenefitPrice'];
function sanitizePromoNumber(v){
  if(v===undefined || v===null) return '';
  const cleaned = String(v).trim().replace(/[^\d.\-]/g,'');
  if(!/\d/.test(cleaned)) return ''; // 숫자가 하나도 없이 "-"나 "."만 남으면(예: 엑셀의 "데이터 없음" 표시) 빈 값으로 처리
  return cleaned;
}
function handlePastePromoProduct(e, entryId, productId, field){
  const text = (e.clipboardData || window.clipboardData).getData('text');
  if(!text) return;
  const isMultiCell = text.includes('\t') || text.includes('\n');
  const isNumericField = PROMO_PRODUCT_NUMERIC_FIELDS.includes(field);
  // 여러 칸을 붙여넣는 경우, 그리고 가격 칸에 단일 값(콤마 포함 가능)을 붙여넣는 경우 모두 직접 처리
  if(!isMultiCell && !isNumericField) return; // 그 외 단일 값 붙여넣기는 브라우저 기본 동작 사용
  e.preventDefault();
  const promo = ensurePromotion();
  const row = promo.selections.find(s=>s.id===entryId);
  if(!row) return;
  const startRowIdx = row.products.findIndex(p=>p.id===productId);
  if(startRowIdx===-1) return;
  const startColIdx = PROMO_PRODUCT_FIELD_ORDER.indexOf(field);
  const lines = text.replace(/\r/g,'').split('\n').filter((line,i,arr)=> !(i===arr.length-1 && line===''));
  lines.forEach((line, li)=>{
    const cells = line.split('\t');
    const rowIdx = startRowIdx + li;
    while(row.products.length <= rowIdx){
      row.products.push({id:uid(), code:'', name:'', regPrice:'', instantDiscountPrice:'', finalBenefitPrice:''});
    }
    cells.forEach((val, ci)=>{
      const colIdx = startColIdx + ci;
      if(colIdx>=0 && colIdx<PROMO_PRODUCT_FIELD_ORDER.length){
        const fname = PROMO_PRODUCT_FIELD_ORDER[colIdx];
        row.products[rowIdx][fname] = PROMO_PRODUCT_NUMERIC_FIELDS.includes(fname) ? sanitizePromoNumber(val) : val.trim();
      }
    });
  });
  saveState(); render();
  scheduleSelectionSheetSync(entryId);
}

const SELECTIONS_COL_DEFAULTS = [30,22,100,100,130,84,100,104,96,110,86,86,86,58,26,30];
const SELECTIONS_COL_LABELS = ['','시작일','종료일','프로모션명','노출구좌','노출일','브랜드','상품코드','상품명','등록가','즉시할인가','최종혜택가','할인율','',''];
let selectedSelectionIds = new Set(); // 화면 전용 상태 — 선정리스트 체크박스로 선택된 항목 id들

/* 선정리스트: 표의 어느 칸이든 마우스로 드래그하면 사각형 영역이 선택되고, Ctrl+C(맥은 Cmd+C)로
   그 영역을 엑셀에 붙여넣기 좋은 형태(탭/줄바꿈 구분)로 클립보드에 복사할 수 있다.
   시작일·프로모션명처럼 여러 상품에 걸쳐 병합된(rowspan) 칸은, 실제로는 화면에 한 번만 그려지지만
   "이 칸이 몇 번째 행부터 몇 행까지를 덮고 있는지"(data-rspan)를 같이 기록해두고, 그 범위를
   선택/복사할 때는 병합된 값을 각 행에 반복해서 채워 넣는다(스프레드시트에서 병합칸을 복사할 때와 동일).
   렌더링할 때 selectionFlatRowsCache에 "상품 1건 = 1행" 기준의 실제 값들을 함께 저장해두고 복사 시 사용한다. */
let selectionFlatRowsCache = [];
let settingHelperFlatRowsCache = []; // 셋팅도우미 표용 드래그 선택/복사 캐시 (선정리스트와 같은 방식)
let cellSelSource = 'selections'; // 지금 드래그 선택 중인 표가 어느 것인지('selections' | 'settingHelper')
let cellSelStart = null; // {r,c}
let cellSelEnd = null;
let cellSelDragging = false;
function cellSelRange(){
  if(!cellSelStart || !cellSelEnd) return null;
  return {
    r0: Math.min(cellSelStart.r, cellSelEnd.r), r1: Math.max(cellSelStart.r, cellSelEnd.r),
    c0: Math.min(cellSelStart.c, cellSelEnd.c), c1: Math.max(cellSelStart.c, cellSelEnd.c),
  };
}
function isCellInSelRange(r, c, rspan){
  const range = cellSelRange();
  if(!range) return false;
  const r1 = r + (rspan||1) - 1;
  return r1>=range.r0 && r<=range.r1 && c>=range.c0 && c<=range.c1;
}
function applyCellSelectHighlights(){
  document.querySelectorAll('.cell-sel').forEach(td=>{
    const src = td.dataset.source || 'selections';
    if(src !== cellSelSource){ td.classList.remove('cell-sel-active'); return; }
    const r = parseInt(td.dataset.r,10), c = parseInt(td.dataset.c,10), rspan = parseInt(td.dataset.rspan||'1',10);
    td.classList.toggle('cell-sel-active', isCellInSelRange(r,c,rspan));
  });
}
function startCellSelect(r, c, e, source){
  cellSelSource = source || 'selections';
  cellSelDragging = true;
  cellSelStart = {r,c};
  cellSelEnd = {r,c};
  applyCellSelectHighlights();
}
function extendCellSelect(r, c){
  if(!cellSelDragging) return;
  cellSelEnd = {r,c};
  applyCellSelectHighlights();
}
document.addEventListener('mouseup', function(){ cellSelDragging = false; });
document.addEventListener('keydown', function(e){
  if(!(e.ctrlKey || e.metaKey) || e.key.toLowerCase()!=='c') return;
  const range = cellSelRange();
  if(!range) return;
  const active = document.activeElement;
  // 칸 하나만 선택된 상태에서 입력칸 안에 커서가 있으면, 원래 브라우저의 텍스트 복사 동작에 맡긴다
  const singleCell = range.r0===range.r1 && range.c0===range.c1;
  if(singleCell && active && active.tagName==='INPUT' && active.closest('.cell-sel')) return;
  // 여러 칸이 선택된 경우: 지금 포커스가 입력칸 안에 있으면 브라우저가 "그 칸의 텍스트만" 복사해버려서
  // 우리가 만든 여러 칸 복사 결과를 덮어써 버리는 문제가 있었다. 그래서 기본 복사 동작을 막고,
  // 포커스도 잠깐 빼서 브라우저가 끼어들지 않게 한다.
  e.preventDefault();
  if(active && typeof active.blur==='function') active.blur();
  const flatCache = cellSelSource==='settingHelper' ? settingHelperFlatRowsCache : selectionFlatRowsCache;
  const flatCols = cellSelSource==='settingHelper' ? SETTING_HELPER_FLAT_COLS : SELECTION_FLAT_COLS;
  const lines = [];
  for(let r=range.r0; r<=range.r1; r++){
    const row = flatCache[r];
    if(!row) continue;
    const cols = [];
    for(let c=range.c0; c<=range.c1; c++){
      cols.push(String(row[flatCols[c]] ?? ''));
    }
    lines.push(cols.join('\t'));
  }
  if(lines.length===0) return;
  const text = lines.join('\n');
  copyToClipboard(text);
  document.querySelectorAll('.cell-sel.cell-sel-active').forEach(td=>{
    td.classList.add('cell-sel-copied');
    setTimeout(()=>td.classList.remove('cell-sel-copied'), 400);
  });
});

const SETTING_HELPER_FLAT_COLS = ['period','code','name','regPrice','reserveDiscount','instant','final','rate','link'];

function toggleSelectionCheck(id){
  if(selectedSelectionIds.has(id)) selectedSelectionIds.delete(id);
  else selectedSelectionIds.add(id);
  render();
}
function toggleAllSelectionChecks(visibleIds){
  const allChecked = visibleIds.length>0 && visibleIds.every(id=>selectedSelectionIds.has(id));
  if(allChecked) visibleIds.forEach(id=>selectedSelectionIds.delete(id));
  else visibleIds.forEach(id=>selectedSelectionIds.add(id));
  render();
}
function deleteSelectedSelections(){
  const n = selectedSelectionIds.size;
  if(n===0){ alert('삭제할 항목을 먼저 체크해주세요.'); return; }
  if(!confirm(`선택한 ${n}개 항목을 삭제할까요?\n이 작업은 되돌릴 수 없습니다.`)) return;
  const promo = ensurePromotion();
  selectedSelectionIds.forEach(id=>recordDeleted('selections', id));
  promo.selections = promo.selections.filter(s=>!selectedSelectionIds.has(s.id));
  selectedSelectionIds.clear();
  saveState(); render();
}
function formatPriceDisplay(v){
  if(v===undefined || v===null || v==='') return '';
  const n = Number(v);
  if(isNaN(n)) return v;
  return n.toLocaleString('ko-KR');
}

   ========================================================================= */
let codeLookupResults = null; // 화면 전용 상태(조회 결과), 새로고침하면 초기화됨
function buildProductCodeIndex(){
  const promo = ensurePromotion();
  const rows = [];
  promo.selections.forEach(s=>{
    (s.products||[]).forEach(p=>{
      if(!p.code) return;
      rows.push({
        code: String(p.code).trim(),
        name: p.name||'',
        promoName: s.promoName||'',
        brand: s.brand||'',
        startDate: s.startDate||'',
        endDate: s.endDate||'',
        finalBenefitPrice: p.finalBenefitPrice,
      });
    });
  });
  return rows;
}
function runCodeLookup(){
  const raw = document.getElementById('codeLookupInput').value;
  const codes = Array.from(new Set(raw.split(/[\n,\s]+/).map(s=>s.trim()).filter(Boolean)));
  if(codes.length===0){ codeLookupResults = null; render(); return; }
  const index = buildProductCodeIndex();
  codeLookupResults = codes.map(code=>{
    const matches = index.filter(r=>r.code===code).sort((a,b)=>(b.startDate||'').localeCompare(a.startDate||''));
    const prices = matches.map(m=>Number(m.finalBenefitPrice)).filter(v=>!isNaN(v) && v>0);
    const min = prices.length ? Math.min(...prices) : null;
    const max = prices.length ? Math.max(...prices) : null;
    const avg = prices.length ? Math.round(prices.reduce((s,v)=>s+v,0)/prices.length) : null;
    return {code, matches, min, max, avg};
  });
  render();
}
function clearCodeLookup(){
  codeLookupResults = null;
  const el = document.getElementById('codeLookupInput');
  if(el) el.value = '';
  render();
}

/* =========================================================================
   라이브 (캘린더 / 라이브 일정) — 브랜드는 프로모션의 브랜드 목록을 함께 씁니다
   ========================================================================= */
function ensureLive(){
  if(!state.live || typeof state.live!=='object'){
    state.live = { schedule: [], calendarFilter: {}, liveCalendarId: '', liveCalendarId2: '', liveCalendarId2BrandsText: '', performance: [] };
  }
  if(!Array.isArray(state.live.schedule)) state.live.schedule = [];
  if(!state.live.calendarFilter || typeof state.live.calendarFilter!=='object') state.live.calendarFilter = {};
  if(state.live.liveCalendarId===undefined) state.live.liveCalendarId = '';
  if(state.live.liveCalendarId2===undefined) state.live.liveCalendarId2 = '';
  if(state.live.liveCalendarId2BrandsText===undefined) state.live.liveCalendarId2BrandsText = '';
  if(!Array.isArray(state.live.performance)) state.live.performance = [];
  if(state.live.liveSalesSheetUrl===undefined) state.live.liveSalesSheetUrl = '';
  // 각 회차에 "대표 상품 3개(상품명·판매가)" 칸을 넣을 수 있게, 예전 데이터에도 빈 자리를 채워준다
  state.live.performance.forEach(p=>{
    if(!Array.isArray(p.products) || p.products.length!==3){
      const old = Array.isArray(p.products) ? p.products : [];
      p.products = [0,1,2].map(i=> old[i] || {name:'', price:''});
    }
  });
  return state.live;
}
/* 두 번째 라이브캘린더로 보낼지 여부를 정하는 브랜드 목록 (쉼표로 구분해서 저장) */
function liveCalendarId2Brands(){
  return (ensureLive().liveCalendarId2BrandsText||'').split(/[,\n、]+/).map(b=>b.trim()).filter(Boolean);
}
function isLiveBrandVisible(brand){ return ensureLive().calendarFilter[brand] !== false; }
function toggleLiveBrandFilter(brand){
  const live = ensureLive();
  live.calendarFilter[brand] = !isLiveBrandVisible(brand);
  saveState(); render();
}
function setAllLiveBrandFilter(visible){
  const live = ensureLive();
  ensurePromotion().brands.forEach(b=>{ live.calendarFilter[b] = visible; });

}

function addLiveSchedule(){
  const live = ensureLive();
  const newId = uid();
  live.schedule.unshift(touch({id:newId, date:'', time:'', liveId:'', brand:'', content:'', sortIndex: nextSortIndex(live.schedule)}));
  saveState(); render();
}
function deleteLiveSchedule(id){
  const live = ensureLive();
  live.schedule = live.schedule.filter(s=>s.id!==id);
  recordDeleted('liveSchedule', id);
  saveState(); render();
  pushCalendarEvent('live', id);
}
function updateLiveScheduleField(id, field, value){
  const live = ensureLive();
  const row = live.schedule.find(s=>s.id===id);
  if(!row) return;
  if(field==='liveId') value = value.replace(/[^\d]/g,'').slice(0,8);
  row[field] = value;
  touch(row);
  saveState(); render();
  scheduleCalendarSync('live', id);
}
