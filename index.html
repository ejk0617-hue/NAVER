            <li><b style="color:#F599B8">셋팅</b> 셋팅 진행 상태를 체크리스트로 관리해요. 🔧 버튼(셋팅도우미)을 누르면 상품 정보와 함께 클릭 한 번으로 복사할 수 있는 팝업이 열려요.</li>
            <li><b style="color:#F599B8">통계</b> 브랜드 · 월 · 등급별로 제안 대비 선정 현황과 행사매출을 한눈에 봐요.</li>
            <li><b style="color:#F599B8">관리</b> 브랜드 · 담당자 목록, 구글 스프레드시트 · 구글 캘린더 연동을 설정해요.</li>
          </ul>

          <div class="guide-h2" style="color:#5FCBC0">🎥 라이브 카테고리</div>
          <ul class="guide-ul">
            <li><b style="color:#5FCBC0">캘린더</b> 라이브 방송 일정을 달력으로 봐요.</li>
            <li><b style="color:#5FCBC0">라이브 일정</b> 방송 날짜 · 시간 · 브랜드 · 내용을 등록해요.</li>
          </ul>

          <div class="guide-h2" style="color:#F7B266">📦 풀필먼트 카테고리</div>
          <ul class="guide-ul">
            <li><b style="color:#F7B266">입고량 계산</b> 현재고 · 평균출고량 · 기준일을 넣으면 필요한 입고 수량이 자동 계산돼요. 재고 불러오기를 누르면 N배송 기준 현재고 · 평균출고량(1일 평균)이 자동으로 채워지고, 출고 가능 일수가 7일 미만인 브랜드는 품절 임박으로 표시돼요.</li>
            <li><b style="color:#F7B266">품목 데이터</b> 상품코드 · 바코드 · 입수량 등 기본 정보를 관리해요.</li>
          </ul>

          <div class="guide-h2" style="color:#7FAEF5">🛍️ 스마트스토어 카테고리</div>
          <ul class="guide-ul">
            <li><b style="color:#7FAEF5">매출 대시보드</b> 브랜드별 일간 매출을 달력에 입력하고, 목표 달성률 · 행사 캘린더를 봐요.</li>
            <li><b style="color:#7FAEF5">주간미팅</b> 월요일~일요일 기준으로 브랜드별 주요 지표(매출 · 전환율 등)를 그래프로 봐요.</li>
            <li><b style="color:#7FAEF5">매출계산기</b> 엑셀 주문 파일에서 행사에 해당하는 매출만 골라 자동 계산해요.</li>
          </ul>
        </div>

        <div class="guide-section">
          <div class="guide-h1"><span class="guide-num">5</span> 알아두면 편한 기능</div>
          <ul class="guide-ul">
            <li><b>↩️ 되돌리기</b> 사이드바 위쪽 버튼 또는 Ctrl+Z로 방금 한 작업을 취소할 수 있어요 (최근 30단계).</li>
            <li><b>💾 데이터 백업</b> 사이드바 하단 "⬇ 데이터 백업"으로 전체 데이터를 파일로 저장해둘 수 있어요.</li>
            <li><b>☁️ 클라우드 동기화</b> Firebase를 연결하면 다른 컴퓨터 · 팀원과 실시간으로 같은 데이터를 봐요. 연결 안 해도 내 컴퓨터에는 정상적으로 저장돼요.</li>
            <li><b>🔍 브랜드 필터</b> 대부분의 화면 위쪽에 브랜드 체크박스가 있어요. 필요한 브랜드만 체크하면 그것만 보여요.</li>
            <li><b>↔️ 열 너비 조절</b> 표 머리글 오른쪽 끝을 드래그하면 칸 너비를 바꿀 수 있어요.</li>
          </ul>
        </div>

        <div style="text-align:center;color:var(--text-secondary);font-size:13px;font-style:italic;padding:16px 0 4px">궁금한 점이나 더 필요한 기능이 있으면 언제든 편하게 요청해주세요 🌸</div>
      </div>
    </div>
  `;
}

function renderSsImportModal(){
  if(!ssImportModalOpen) return '';
  const promo = ensurePromotion();
  const uniqueStores = ssImportRows ? Array.from(new Set(ssImportRows.map(r=>r.store))) : [];
  const dateRange = ssImportRows && ssImportRows.length>0 ? {
    start: ssImportRows.reduce((m,r)=>r.date<m?r.date:m, ssImportRows[0].date),
    end: ssImportRows.reduce((m,r)=>r.date>m?r.date:m, ssImportRows[0].date),
  } : null;
  return `
    <div class="modal-overlay" onclick="closeSsImportModal()">
      <div class="modal-panel" onclick="event.stopPropagation()" style="max-width:640px">
        <button class="modal-close" onclick="closeSsImportModal()" title="닫기">✕</button>
        <div class="modal-title">📥 매출 엑셀 일괄 불러오기</div>
        <div class="modal-sub">"스토어명 · 날짜 · 매출액" 열이 있는 엑셀을 그대로 올려주세요. "플랫폼" 열이 있으면 스마트스토어만 자동으로 골라내고, "주문건수" 열이 있으면 같이 채워드려요.</div>

        ${!ssImportRows ? `
          <div style="margin-top:18px">
            <label class="ssc-file-btn">
              📁 엑셀 파일 선택
              <input type="file" id="ssImportFile" accept=".xlsx,.xls" onchange="handleSsImportFile()" style="display:none">
            </label>
          </div>
        ` : `
          <div class="helptext" style="margin-top:14px">총 ${ssImportRows.length.toLocaleString('ko-KR')}건, ${dateRange.start} ~ ${dateRange.end} · 스토어 ${uniqueStores.length}개</div>
          ${ssImportPlatformFiltered ? `<div class="helptext" style="margin-top:4px;color:#12805C">✅ "플랫폼" 열을 보고 스마트스토어만 남기고 쿠팡 등 다른 플랫폼은 제외했어요.</div>` : ''}
          <div class="helptext" style="margin-top:4px">이름이 다르게 되어있는 스토어는 아래에서 우리 브랜드로 맞춰주세요 (최대한 비슷한 이름을 자동으로 골라놨어요).</div>
          <div class="ss-import-mapping-list">
            ${uniqueStores.map(s=>{
              const rowCount = ssImportRows.filter(r=>r.store===s).length;
              const mapped = ssImportMapping[s]||'';
              return `
              <div class="ss-import-mapping-row ${mapped?'':'unmapped'}">
                <span class="ss-import-source-name">${s} <span style="color:var(--text-secondary);font-weight:400">(${rowCount}건)</span></span>
                <span style="color:var(--text-secondary)">→</span>
                <select class="row-input ssc-left" onchange="updateSsImportMapping('${s.replace(/'/g,"\\'")}', this.value)">
                  <option value="">건너뛰기</option>
                  ${promo.brands.map(b=>`<option value="${b}" ${b===mapped?'selected':''}>${b}</option>`).join('')}
                </select>
              </div>`;
            }).join('')}
          </div>
          <button class="btn" style="margin-top:16px;width:100%" onclick="runSsImport()">✅ 매출 대시보드에 반영하기</button>
        `}
      </div>
    </div>
  `;
}

function renderSmartstoreDashboard(){
  const ss = ensureSmartstore();
  const promo = ensurePromotion();
  const allStores = promo.brands;
  const filterKey = 'smartstoreFilter';
  const visibleStores = allStores.filter(b=>isBrandVisibleIn(filterKey, b));

  // 목표 달성률은 "일간 매출 입력" 달력이 지금 보여주고 있는 달을 그대로 따라간다
  // (달력을 7월로 넘기면 목표 달성률도 7월 기준으로 같이 바뀜)
  const inputView = ensureSmartstoreInputCalView();
  const iy = inputView.y, im = inputView.m;
  const inputMonthKey = `${iy}-${String(im).padStart(2,'0')}`;
  const daysInViewedMonth = new Date(iy, im, 0).getDate();

  const dailyRows = ss.daily.filter(r=>!r.store || visibleStores.includes(r.store));
  const monthTotal = sumDailyAmount(dailyRows.filter(r=>r.date && r.date.slice(0,7)===inputMonthKey));

  const monthlyTargetSum = visibleStores.reduce((s,store)=> s + Number((ss.monthlyTargets[store]||{})[inputMonthKey] || 0), 0);
  const dailyTarget = daysInViewedMonth>0 ? monthlyTargetSum/daysInViewedMonth : 0;
  const weeksInMonthForTarget = daysInViewedMonth/7;
  const weeklyTarget = weeksInMonthForTarget>0 ? monthlyTargetSum/weeksInMonthForTarget : 0;
  // "일평균 실제 매출" = 보고 있는 달의 누적 매출을 일수로 나눈 평균값
  const dailyActual = daysInViewedMonth>0 ? monthTotal/daysInViewedMonth : 0;
  // "주간 실제 매출"은 평균이 아니라, 진짜 그 주(월요일~일요일) 하루하루를 그대로 합산한 값이다.
  // 지금 보고 있는 달이 실제 이번 달이면 오늘이 속한 주, 지난 달이면 그 달의 마지막 주(월~일) 기준으로 계산한다.
  const todayObj = new Date();
  const isRealCurrentMonthForWeek = (iy===todayObj.getFullYear() && im===todayObj.getMonth()+1);
  const weekRefDate = isRealCurrentMonthForWeek ? todayStr() : `${inputMonthKey}-${String(daysInViewedMonth).padStart(2,'0')}`;
  const thisWeekRange = weekRangeOf(weekRefDate);
  const weeklyActual = sumDailyAmount(dailyRows.filter(r=>r.date>=thisWeekRange.start && r.date<=thisWeekRange.end));

  const graphGauges = [
    {label:'주간', actual:weeklyActual, target:weeklyTarget},
    {label:'월간', actual:monthTotal, target:monthlyTargetSum},
  ].map(g=>({...g, pct: g.target>0 ? Math.round(g.actual/g.target*100) : null}));

  // 행사 캘린더: 선정리스트 기준
  const calView = ensureSmartstoreCalView();
  const cy = calView.y, cm = calView.m;
  function calEventsOnDay(dateStr){
    const fromSelections = promo.selections.filter(s=>{
      if(!s.brand || !visibleStores.includes(s.brand)) return false;
      if(!s.startDate || !s.endDate) return false;
      return s.startDate<=dateStr && s.endDate>=dateStr;
    }).map(s=>({brand:s.brand, name:s.promoName||'(제목 없음)', manual:false}));
    const fromManual = ss.manualEvents.filter(e=>{
      const range = manualEventRange(e);
      if(!range.start) return false;
      if(range.start>dateStr || range.end<dateStr) return false;
      if(e.store && !visibleStores.includes(e.store)) return false;
      return true;
    }).map(e=>({brand:e.store||'', name:e.name||'(제목 없음)', manual:true}));
    return [...fromSelections, ...fromManual];
  }
  const calChip = ev=>{
    const color = ev.brand ? promoBrandColor(ev.brand) : '#8B5CF6';
    return `<div class="promo-cal-chip" style="background:${color}22;color:${color}" title="${ev.name}">${ev.manual?'✏️ ':''}${ev.name}</div>`;
  };

  return `
    <div class="page-header">
      <div>
        <span class="eyebrow" style="background:#8B5CF622;color:#8B5CF6">스마트스토어</span>
        <h1>매출 대시보드</h1>
        <div class="sub">달력에 매출만 입력하면, 주간·월간 목표 달성률까지 자동으로 계산돼요</div>
      </div>
      <button class="btn ghost" style="color:var(--text-primary)" onclick="openSsImportModal()">📥 엑셀로 일괄 불러오기</button>
    </div>

    ${renderSmartstoreBrandFilter()}

    <div class="ss-row2col ss-row2col-narrow">
      <div class="card ss-compact-card">
        <h2 style="margin:0 0 10px;font-size:14px">🎯 목표 달성률 (${inputMonthKey})</h2>
        ${visibleStores.length===0 ? `<div class="empty" style="padding:10px 0">브랜드 필터에서 스토어를 선택해주세요.</div>` : `
        <div class="ss-goal-target-line">일 목표액 <b class="mono">${formatWon(Math.round(dailyTarget))}</b> <span class="ss-goal-target-sub">(일평균 실제 ${formatWon(Math.round(dailyActual))})</span></div>
        <div class="ss-gauge-list">
          ${graphGauges.map(g=>`
            <div class="ss-gauge-row">
              <span class="ss-gauge-label">${g.label}</span>
              <div class="ss-gauge-track"><div class="ss-gauge-fill ${g.pct!==null && g.pct>=100?'over':''}" style="width:${g.pct===null?0:Math.min(g.pct,100)}%"></div></div>
              <span class="ss-gauge-pct">${g.pct===null?'-':g.pct+'%'}</span>
              <span class="ss-gauge-detail mono">${formatWon(g.actual)} / ${formatWon(Math.round(g.target))}</span>
            </div>
          `).join('')}
        </div>
        ${buildDailySalesTrendChart(iy, im, visibleStores)}`}
      </div>

      <div class="card ss-compact-card">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
          <h2 style="margin:0;font-size:14px">☀️ 일간 매출 입력 <span style="font-weight:400;color:var(--text-secondary);font-size:11px">(단위: 만원, 예 150→1,500,000원)</span></h2>
          <div style="display:flex;align-items:center;gap:4px">
            <button class="btn ghost ss-cal-nav" onclick="smartstoreInputCalPrev()">◀</button>
            <div style="font-weight:800;font-size:12px;min-width:60px;text-align:center">${iy}.${im}</div>
            <button class="btn ghost ss-cal-nav" onclick="smartstoreInputCalNext()">▶</button>
            <button class="btn ghost ss-cal-nav" onclick="smartstoreInputCalToday()">오늘</button>
          </div>
        </div>
        ${visibleStores.length===0 ? `<div class="empty">브랜드 필터에서 스토어를 선택해주세요.</div>` : `
        <div class="ss-input-cal-grid ss-input-cal-grid-narrow">
          ${visibleStores.map(store=>{
            const storeMonthTotal = sumDailyAmount(ss.daily.filter(r=>r.store===store && r.date && r.date.slice(0,7)===inputMonthKey));
            const target = Number((ss.monthlyTargets[store]||{})[inputMonthKey] || 0);
            return `
            <div class="ss-input-cal-card">
              <div class="ss-input-cal-head">
                <span class="ss-input-cal-store">${store}</span>
                <span class="ss-input-cal-total mono">${formatWon(storeMonthTotal)}</span>
              </div>
              ${buildSalesInputCalGrid(iy, im, store)}
              <div class="ss-input-cal-target">
                <label>목표</label>
                <input class="row-input mono" type="text" inputmode="numeric" placeholder="0" value="${target?target.toLocaleString('ko-KR'):''}" onchange="updateMonthlyTarget('${store.replace(/'/g,"\\'")}','${inputMonthKey}',this.value)">
              </div>
            </div>`;
          }).join('')}
        </div>`}
      </div>
    </div>

    <div class="card">
      <h2 style="margin:0 0 10px">📋 스토어별 체크리스트 · 메모장</h2>
      ${visibleStores.length===0 ? `<div class="empty">브랜드 필터에서 스토어를 선택해주세요.</div>` : `
      <div class="ss-store-notes-grid">
        ${visibleStores.map(store=>{
          const checklist = ensureStoreChecklist(store);
          const notes = ss.notesByStore[store] || '';
          return `
          <div class="ss-store-notes-card">
            <div class="ss-store-notes-head">${store}</div>
            <div class="ss-store-notes-body">
              <div class="ss-checklist">
                ${checklist.map(item=>`
                  <div class="ss-checklist-item">
                    <input type="checkbox" ${item.done?'checked':''} onclick="toggleStoreChecklistItem('${store.replace(/'/g,"\\'")}','${item.id}')">
                    <input class="ss-checklist-text ${item.done?'done':''}" type="text" value="${item.text.replace(/"/g,'&quot;')}" onchange="updateStoreChecklistText('${store.replace(/'/g,"\\'")}','${item.id}', this.value)">
                    <button class="btn-del" onclick="deleteStoreChecklistItem('${store.replace(/'/g,"\\'")}','${item.id}')" title="삭제">✕</button>
                  </div>
                `).join('')}
                <div class="ss-checklist-item ss-checklist-blank">
                  <input type="checkbox" disabled>
                  <input class="ss-checklist-text" type="text" placeholder="새 항목 입력..." value=""
                    onchange="addStoreChecklistFromBlank('${store.replace(/'/g,"\\'")}', this.value); this.value='';"
                    onkeydown="if(event.key==='Enter'){ this.blur(); }">
                </div>
              </div>
              <textarea class="ss-notepad ss-notepad-compact" placeholder="메모..." onchange="updateStoreNotes('${store.replace(/'/g,"\\'")}', this.value)">${notes}</textarea>
            </div>
          </div>`;
        }).join('')}
      </div>`}
    </div>

    <div class="ss-row2col ss-row2col-cal-first">
      <div class="card ss-compact-card">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
          <h2 style="margin:0;font-size:14px">🎉 브랜드별 행사 캘린더</h2>
          <div style="display:flex;align-items:center;gap:4px">
            <button class="btn ghost ss-cal-nav" onclick="smartstoreCalPrev()">◀</button>
            <div style="font-weight:800;font-size:12px;min-width:64px;text-align:center">${cy}.${cm}</div>
            <button class="btn ghost ss-cal-nav" onclick="smartstoreCalNext()">▶</button>
          </div>
        </div>
        ${visibleStores.length===0 ? `<div class="empty" style="padding:16px 0">브랜드 필터에서 스토어를 선택해주세요.</div>` : `<div class="ss-mini-cal">${buildPromoCalGrid(cy, cm, calEventsOnDay, calChip)}</div>`}
        <div class="ss-manual-event-form">
          <div class="ss-manual-event-add">
            <select id="ssManualEventStore" class="row-input">
              <option value="">스토어 선택</option>
              ${allStores.map(b=>`<option value="${b}">${b}</option>`).join('')}
            </select>
            <input id="ssManualEventStartDate" class="row-input" type="date" value="${todayStr()}" title="시작 날짜">
            <input id="ssManualEventEndDate" class="row-input" type="date" value="${todayStr()}" title="종료 날짜">
            <input id="ssManualEventName" class="row-input" style="text-align:left" type="text" placeholder="행사명">
            <button class="btn" onclick="submitManualEvent()">+ 행사 추가</button>
          </div>
          ${ss.manualEvents.filter(e=>!e.store || visibleStores.includes(e.store)).length>0 ? `
          <div class="ss-manual-event-list">
            ${ss.manualEvents.filter(e=>!e.store || visibleStores.includes(e.store)).map(e=>{
              const range = manualEventRange(e);
              const rangeLabel = range.start===range.end ? range.start : `${range.start} ~ ${range.end}`;
              return `
              <div class="ss-manual-event-row">
                <span class="mono">${rangeLabel}</span>
                <span>${e.store||'(스토어 미지정)'}</span>
                <span class="ss-manual-event-name">${e.name||'(제목 없음)'}</span>
                <button class="btn-del" onclick="deleteManualEvent('${e.id}')" title="삭제">✕</button>
              </div>
            `;}).join('')}
          </div>` : ''}
        </div>
      </div>

      <div class="card ss-compact-card">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
          <h2 style="margin:0;font-size:14px">💰 행사 매출표</h2>
          <button class="btn-del" style="font-size:13px" onclick="addEventSale()" title="행사 매출 추가">➕</button>
        </div>
        <table class="ss-event-sales-table">

/* =========================================================================
   주간미팅 — 월요일~일요일 기준으로 스토어별 지표를
   주 단위로 입력하고, 한 달치를 나란히 비교하는 표를 보여준다.
   ========================================================================= */
function ensureWeeklyMeeting(){
  if(!state.weeklyMeeting || typeof state.weeklyMeeting!=='object') state.weeklyMeeting = {entries: []};
  if(!Array.isArray(state.weeklyMeeting.entries)) state.weeklyMeeting.entries = [];
  return state.weeklyMeeting;
}
const WEEKLY_MEETING_METRICS = [
  {key:'revenue', label:'매출액', unit:'원'},
  {key:'profit', label:'이익액', unit:'원'},
  {key:'aov', label:'객단가', unit:'원'},
  {key:'conversionRate', label:'전환율', unit:'%'},
  {key:'visitors', label:'유입수', unit:'명'},
  {key:'eventSales', label:'행사매출', unit:'원'},
  {key:'subscribers', label:'알림받기', unit:'명'},
];
function findWeeklyEntry(store, weekStart){
  return ensureWeeklyMeeting().entries.find(e=>e.store===store && e.weekStart===weekStart);
}
/* 스마트스토어 대시보드에 입력해둔 일간 매출(state.smartstore.daily)에서, 이 주간(목~수) 구간에
   해당하는 날짜들의 매출을 합산해서 매출액을 자동으로 끌어온다. 따로 입력할 필요가 없다. */
function weeklyRevenueFromDaily(store, weekStart, weekEnd){
  const daily = ensureSmartstore().daily;
  return daily
    .filter(r=> r.store===store && r.date>=weekStart && r.date<=weekEnd)
    .reduce((s,r)=> s + (Number(r.amount)||0), 0);
}
/* 지금 보고 있는 달의 첫 번째 주라도, 그 바로 앞주(전달 마지막 주일 수도 있음)를 달과 상관없이 구해서
   증감률을 계속 이어서 비교할 수 있게 한다. (예: 8월 첫째 주는 7월 마지막 주와 비교) */
function weekBefore(weekStartStr){
  const pad2 = n => String(n).padStart(2,'0');
  const fmt = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
  const start = new Date(weekStartStr+'T00:00:00');
  start.setDate(start.getDate()-7);
  const end = new Date(start);
  end.setDate(end.getDate()+6);
  return {start: fmt(start), end: fmt(end)};
}
function updateWeeklyMeetingField(store, weekStart, weekEnd, field, value){
  const wm = ensureWeeklyMeeting();
  let entry = wm.entries.find(e=>e.store===store && e.weekStart===weekStart);
  if(!entry){
    entry = {id:uid(), store, weekStart, weekEnd, revenue:'', profit:'', aov:'', conversionRate:'', visitors:'', eventSales:'', subscribers:''};
    wm.entries.push(entry);
  }
  entry[field] = sanitizePromoNumber(value);
  entry.weekEnd = weekEnd;
  saveState(); render();
}
let weeklyMeetingChartMetrics = ['revenue'];
function toggleWeeklyMeetingChartMetric(key){
  const idx = weeklyMeetingChartMetrics.indexOf(key);
  if(idx>=0){
    if(weeklyMeetingChartMetrics.length===1) return; // 최소 1개는 항상 선택되어 있어야 함
    weeklyMeetingChartMetrics.splice(idx,1);
  } else {
    weeklyMeetingChartMetrics.push(key);
  }
  render();
}
const WM_METRIC_COLORS = {
  revenue: '#8B5CF6', profit: '#12805C', aov: '#F0932B', conversionRate: '#0EA5A5',
  visitors: '#2F6FED', eventSales: '#DB5A9E', subscribers: '#D64545',
};
const WM_DASH_PATTERNS = ['0', '6,4', '2,3'];

/* Y축에 보기 좋은 간격(1/2/5 배수)으로 눈금 4~5개를 만든다 */
function niceAxisTicks(min, max, count){
  if(min===max){ min -= Math.abs(min)*0.1 || 1; max += Math.abs(max)*0.1 || 1; }
  const range = max - min;
  const rawStep = range / (count - 1);
  const mag = Math.pow(10, Math.floor(Math.log10(Math.abs(rawStep) || 1)));
  const norm = rawStep / mag;
  let step;
  if(norm < 1.5) step = 1*mag;
  else if(norm < 3) step = 2*mag;
  else if(norm < 7) step = 5*mag;
  else step = 10*mag;
  const niceMin = Math.floor(min/step)*step;
  const niceMax = Math.ceil(max/step)*step;
  const ticks = [];
  for(let v=niceMin; v<=niceMax+step*0.001; v+=step) ticks.push(Math.round(v*1000)/1000);
  return ticks;
}
function formatMiniAxisNumber(v, unit){
  if(unit==='%') return v.toLocaleString('ko-KR')+'%';
  if(unit==='명') return Math.round(v).toLocaleString('ko-KR');
  if(Math.abs(v)>=10000) return Math.round(v/10000).toLocaleString('ko-KR')+'만';
  return Math.round(v).toLocaleString('ko-KR');
}

/* 매출 대시보드의 "목표 달성률" 카드 아래 남는 공간에 넣는, 그 달 일별 매출 추이 그래프.
   스토어별로 선 색을 다르게 해서 겹쳐 보여준다(브랜드 필터에 쓰는 색과 동일하게 맞춰서 일관되게). */
let ssDailyTrendMode = 'week'; // 'week' | 'month'
function switchSsDailyTrendMode(mode){ ssDailyTrendMode = mode; render(); }

function buildDailySalesTrendChart(y, m, visibleStores){
  if(visibleStores.length===0) return '';
  const pad2 = n => String(n).padStart(2,'0');
  const daysInMonth = new Date(y, m, 0).getDate();
  const ss = ensureSmartstore();

  let dayList;
  if(ssDailyTrendMode==='week'){
    // 보고 있는 달이 지금 실제 이번 달이면 "오늘까지의 최근 7일", 지난 달을 보고 있으면 "그 달의 마지막 7일"
    const today = new Date();
    const isRealCurrentMonth = (y===today.getFullYear() && m===today.getMonth()+1);
    const endDay = isRealCurrentMonth ? Math.min(today.getDate(), daysInMonth) : daysInMonth;
    const startDay = Math.max(1, endDay-6);
    dayList = [];
    for(let d=startDay; d<=endDay; d++) dayList.push(d);
  } else {
    dayList = [];
    for(let d=1; d<=daysInMonth; d++) dayList.push(d);
  }

  const toggleBar = `
    <div class="ss-trend-mode-tabs">
      <button class="ss-trend-mode-tab ${ssDailyTrendMode==='week'?'active':''}" onclick="switchSsDailyTrendMode('week')">최근 일주일</button>
      <button class="ss-trend-mode-tab ${ssDailyTrendMode==='month'?'active':''}" onclick="switchSsDailyTrendMode('month')">한달</button>
    </div>`;

  const series = visibleStores.map(store=>{
    return dayList.map(d=>{
      const dateStr = `${y}-${pad2(m)}-${pad2(d)}`;
      const entry = ss.daily.find(r=>r.store===store && r.date===dateStr);
      return entry && entry.amount ? Number(entry.amount) : null;
    });
  });

  const title = ssDailyTrendMode==='week' ? '📈 최근 일주일 매출 추이' : '📈 이번 달 매출 추이';

  const allVals = series.flat().filter(v=>v!==null);
  if(allVals.length===0){
    const emptyMsg = ssDailyTrendMode==='week' ? '최근 일주일 동안 입력된 매출이 없어요.' : '이번 달 입력된 매출이 아직 없어요.';
    return `<div class="ss-daily-trend-wrap"><div class="ss-daily-trend-title">${title}</div>${toggleBar}<div class="empty" style="padding:16px 0;font-size:11px">${emptyMsg}</div></div>`;
  }

  const width = 380, height = 108, padL = 40, padR = 8, padT = 8, padB = 16;
  const innerW = width - padL - padR;
  const innerH = height - padT - padB;
  const ticks = niceAxisTicks(0, Math.max(...allVals), 3);
  const yMin = ticks[0], yMax = ticks[ticks.length-1];
  const range = (yMax-yMin) || 1;
  const xStep = dayList.length>1 ? innerW/(dayList.length-1) : 0;
  const xOf = i => padL + i*xStep;
  const yOf = v => padT + innerH - ((v-yMin)/range)*innerH;

  let svg = `<svg viewBox="0 0 ${width} ${height}" class="ss-daily-trend-svg">`;
  ticks.forEach(t=>{
    const ty = yOf(t);
    svg += `<line x1="${padL}" y1="${ty.toFixed(1)}" x2="${padL+innerW}" y2="${ty.toFixed(1)}" stroke="#F0F1F4" stroke-width="0.75"/>`;
    svg += `<text x="${padL-5}" y="${(ty+2.5).toFixed(1)}" font-size="7.5" fill="#9AA1AC" text-anchor="end">${formatMiniAxisNumber(t,'원')}</text>`;
  });
  // 한달 보기는 날짜가 많아서(최대 31개) 라벨을 다 찍으면 겹치니, 며칠 간격으로 골라서 보여준다
  const labelStep = dayList.length>10 ? Math.ceil(dayList.length/6) : 1;
  dayList.forEach((d,i)=>{
    if(i % labelStep !== 0 && i !== dayList.length-1) return;
    svg += `<text x="${xOf(i).toFixed(1)}" y="${height-3}" font-size="7.5" fill="#9AA1AC" text-anchor="middle">${d}일</text>`;
  });

  visibleStores.forEach((store, si)=>{
    const color = promoBrandColor(store);
    const pts = series[si].map((v,i)=> v===null ? null : `${xOf(i).toFixed(1)},${yOf(v).toFixed(1)}`).filter(Boolean).join(' ');
    if(pts) svg += `<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>`;
    series[si].forEach((v,i)=>{
      if(v===null) return;
      svg += `<circle cx="${xOf(i).toFixed(1)}" cy="${yOf(v).toFixed(1)}" r="${dayList.length>10?1.2:1.8}" fill="${color}"><title>${store} ${m}/${dayList[i]}: ${formatWon(v)}</title></circle>`;
    });
  });
  svg += `</svg>`;

  const legend = visibleStores.length>1 ? `<div class="wm-mini-store-legend">${visibleStores.map(s=>`
    <span class="wm-chart-legend-item"><span class="wm-chart-legend-dot" style="background:${promoBrandColor(s)}"></span>${s}</span>
  `).join('')}</div>` : '';

  return `<div class="ss-daily-trend-wrap"><div class="ss-daily-trend-title">${title}</div>${toggleBar}${svg}${legend}</div>`;
}

/* 지표 하나짜리 작은 꺾은선 그래프. 각자 자기 축(눈금 4~5개)을 가지고 있어서 다른 지표와
   전혀 안 섞이고, 어떤 지표가 어떻게 흔들렸는지 그래프 모양만 봐도 바로 보인다. */
function buildWeeklyMetricLineChart(weeks, visibleStores, metricKey){
  const metricMeta = WEEKLY_MEETING_METRICS.find(m=>m.key===metricKey);
  const color = WM_METRIC_COLORS[metricKey] || '#8B5CF6';
  const width = 220, height = 96, padL = 30, padR = 6, padT = 8, padB = 15;
  const innerW = width - padL - padR;
  const innerH = height - padT - padB;

  const series = visibleStores.map(store => weeks.map(w=>{
    if(metricKey==='revenue'){
      const v = weeklyRevenueFromDaily(store, w.start, w.end);
      return v>0 ? v : null;
    }
    const entry = findWeeklyEntry(store, w.start);
    const val = entry ? entry[metricKey] : '';
    return (val===''||val===undefined||val===null) ? null : Number(val);
  }));

  const allVals = series.flat().filter(v=>v!==null);
  if(allVals.length===0){
    return `<div class="wm-mini-card"><div class="wm-mini-title">${metricMeta.label} <span class="wm-unit">(${metricMeta.unit})</span></div><div class="empty" style="padding:16px 0;font-size:10px">데이터 없음</div></div>`;
  }

  const ticks = niceAxisTicks(Math.min(0,...allVals), Math.max(...allVals), 4);
  const yMin = ticks[0], yMax = ticks[ticks.length-1];
  const range = (yMax - yMin) || 1;
  const xStep = weeks.length>1 ? innerW/(weeks.length-1) : 0;
  const xOf = i => padL + i*xStep;
  const yOf = v => padT + innerH - ((v-yMin)/range)*innerH;

  let svg = `<svg viewBox="0 0 ${width} ${height}" class="wm-mini-svg">`;
  ticks.forEach(t=>{
    const ty = yOf(t);
    svg += `<line x1="${padL}" y1="${ty.toFixed(1)}" x2="${padL+innerW}" y2="${ty.toFixed(1)}" stroke="#F0F1F4" stroke-width="0.75"/>`;
    svg += `<text x="${padL-4}" y="${(ty+2.5).toFixed(1)}" font-size="8" fill="#9AA1AC" text-anchor="end">${formatMiniAxisNumber(t, metricMeta.unit)}</text>`;
  });
  weeks.forEach((w,i)=>{
    svg += `<text x="${xOf(i).toFixed(1)}" y="${height-4}" font-size="8" fill="#9AA1AC" text-anchor="middle">${w.label}</text>`;
  });

  const WM_STORE_OPACITY = [1, 0.55, 0.32];
  visibleStores.forEach((store, si)=>{
    const op = WM_STORE_OPACITY[si % WM_STORE_OPACITY.length];
    const pts = series[si].map((v,i)=> v===null ? null : `${xOf(i).toFixed(1)},${yOf(v).toFixed(1)}`).filter(Boolean).join(' ');
    if(pts) svg += `<polyline points="${pts}" fill="none" stroke="${color}" stroke-opacity="${op}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>`;
    series[si].forEach((v,i)=>{
      if(v===null) return;
      const valueText = metricMeta.unit==='%' ? v.toLocaleString('ko-KR')+'%' : v.toLocaleString('ko-KR');
      svg += `<circle cx="${xOf(i).toFixed(1)}" cy="${yOf(v).toFixed(1)}" r="1.8" fill="${color}" fill-opacity="${op}"><title>${store} ${weeks[i].label}: ${valueText}</title></circle>`;
    });
  });
  svg += `</svg>`;

  const storeLegend = visibleStores.length>1 ? `<div class="wm-mini-store-legend">${visibleStores.map((s,si)=>`
    <span class="wm-chart-legend-item"><span class="wm-mini-legend-line" style="border-top-color:${color};opacity:${WM_STORE_OPACITY[si%WM_STORE_OPACITY.length]}"></span>${s}</span>
  `).join('')}</div>` : '';

  return `<div class="wm-mini-card"><div class="wm-mini-title">${metricMeta.label} <span class="wm-unit">(${metricMeta.unit})</span></div>${svg}${storeLegend}</div>`;
}

function buildWeeklyTrendChart(weeks, visibleStores, metricKeys){
  const cards = metricKeys.map(key => buildWeeklyMetricLineChart(weeks, visibleStores, key)).join('');
  return `<div class="wm-mini-grid">${cards}</div>`;
}

function pctChangeOf(curr, prev){
  if(curr===''||curr===undefined||curr===null||prev===''||prev===undefined||prev===null) return null;
  const c = Number(curr), p = Number(prev);
  if(!isFinite(c) || !isFinite(p) || p===0) return null;
  return Math.round((c-p)/p*100);
}

/* 목요일 시작(전주 목~이번주 수) 기준 주간 구간들을, 지정한 달에 목요일이 포함되는 주만 골라 반환 */
function monSunWeeksOfMonth(y, m){
  const pad2 = n => String(n).padStart(2,'0');
  const fmt = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
  const flabel = d => `${d.getMonth()+1}/${d.getDate()}`;
  const first = new Date(y, m-1, 1);
  const last = new Date(y, m, 0);
  const weeks = [];
  for(let d = new Date(first); d<=last; d.setDate(d.getDate()+1)){
    if(d.getDay()===1){
      const start = new Date(d);
      const end = new Date(d); end.setDate(end.getDate()+6);
      weeks.push({start: fmt(start), end: fmt(end), label: `${flabel(start)}~${flabel(end)}`});
    }
  }
  return weeks;
}

                  ${weeks.map((w,i)=>{
                    const isRevenue = metric.key==='revenue';
                    const val = isRevenue ? weeklyRevenueFromDaily(store, w.start, w.end) : (findWeeklyEntry(store, w.start) ? findWeeklyEntry(store, w.start)[metric.key] : '');
                    const prevWeek = i>0 ? weeks[i-1] : weekBefore(w.start);
                    const prevVal = isRevenue
                      ? weeklyRevenueFromDaily(store, prevWeek.start, prevWeek.end)
                      : (findWeeklyEntry(store, prevWeek.start) ? findWeeklyEntry(store, prevWeek.start)[metric.key] : '');
                    const pct = pctChangeOf(val, prevVal);
                    const cellInner = isRevenue
                      ? `<div class="row-input wm-input wm-input-readonly mono">${val ? Number(val).toLocaleString('ko-KR') : '-'}</div>`
                      : `<input class="row-input mono wm-input" type="text" inputmode="decimal" placeholder="-" value="${val?Number(val).toLocaleString('ko-KR'):''}" onchange="updateWeeklyMeetingField('${store.replace(/'/g,"\\'")}','${w.start}','${w.end}','${metric.key}',this.value)">`;
                    return `<td>
                      <div class="wm-cell-row">
                        ${cellInner}
                        ${pct===null ? '' : `<span class="wm-delta ${pct>=0?'up':'down'}">${pct>=0?'▲':'▼'}${Math.abs(pct)}%</span>`}
                      </div>
                    </td>`;
                  }).join('')}
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      </div>
    `).join('')}
  `;
}

function mergeLastInbound(a, b){ // 브랜드별로 더 늦은 날짜를 남긴다
  const out = Object.assign({}, (a && typeof a==='object') ? a : {});
  Object.keys((b && typeof b==='object') ? b : {}).forEach(k=>{ if(!out[k] || String(b[k])>String(out[k])) out[k] = b[k]; });
  return out;
}
function ensureFulfillment(){
  if(!state.fulfillment || typeof state.fulfillment!=='object'){
    state.fulfillment = {
      brandCarriers: [
        {id:uid(), brand:'VSL', carrier:'CJ'},
        {id:uid(), brand:'갸스비', carrier:'CJ'},
        {id:uid(), brand:'리틀타익스', carrier:'CJ'},

        {id:uid(), brand:'그란츠', carrier:'롯데'},
        {id:uid(), brand:'자이스', carrier:'롯데'},
        {id:uid(), brand:'로트벡쉔', carrier:'품고'},
      ],
      logistics: {}, // { [brand]: {...} }
      items: [],     // [{id, brand, itemCode, itemBarcode, itemName, packQty}]
      itemFilter: {},
    };
  }
  if(!Array.isArray(state.fulfillment.brandCarriers)) state.fulfillment.brandCarriers = [];
  if(!state.fulfillment.logistics || typeof state.fulfillment.logistics!=='object') state.fulfillment.logistics = {};
  if(!Array.isArray(state.fulfillment.items)) state.fulfillment.items = [];
  if(!state.fulfillment.itemFilter || typeof state.fulfillment.itemFilter!=='object') state.fulfillment.itemFilter = {};
  return state.fulfillment;
}
function fulfillmentBrandList(){
  return ensureFulfillment().brandCarriers.map(bc=>bc.brand);
}
function fulfillmentCarrierOf(brand){
  const bc = ensureFulfillment().brandCarriers.find(x=>x.brand===brand);
  return bc ? bc.carrier : '';
}

function addFulfillmentBrandCarrier(){
  const brandEl = document.getElementById('newFulBrand');
  const carrierEl = document.getElementById('newFulCarrier');
  const brand = brandEl.value.trim();
  const carrier = carrierEl.value.trim();
  if(!brand || !carrier){ alert('브랜드명과 배송사를 모두 입력해주세요.'); return; }
  const f = ensureFulfillment();
  if(f.brandCarriers.some(x=>x.brand===brand)){ alert('이미 등록된 브랜드입니다.'); return; }
  f.brandCarriers.push({id:uid(), brand, carrier});
  brandEl.value=''; carrierEl.value='';
  saveState(); render();
}
function deleteFulfillmentBrandCarrier(id){
  const f = ensureFulfillment();
  f.brandCarriers = f.brandCarriers.filter(x=>x.id!==id);
  saveState(); render();
}
function updateFulfillmentBrandCarrierField(id, field, val){
  const f = ensureFulfillment();
  const row = f.brandCarriers.find(x=>x.id===id);
  if(!row) return;
  row[field] = val;
  saveState(); render();
}
/* ---- 브랜드별 입출고 정보 ---- */
function ensureFulfillmentLogistics(brand){
  const f = ensureFulfillment();
  if(!f.logistics[brand]){
    f.logistics[brand] = {
      inboundCenter:'', inboundAddress:'', inboundManagerContact:'',
      supplierName:'', bizRegNo:'', outboundAddress:'', outboundManagerContact:'',
    };
  }
  return f.logistics[brand];
}
function updateFulfillmentLogisticsField(brand, field, val){
  const rec = ensureFulfillmentLogistics(brand);
  rec[field] = val;
  saveState(); render();
}

function applyFulfillmentSheetV1(force){
  const f = ensureFulfillment();
  if(f.sheetV1Applied && !force) return;
  f.sheetV1Applied = true;
  const D = FULFILL_SHEET_V1;
  let upd = 0, add = 0, newBrands = [];
  Object.keys(D.carriers).forEach(b0=>{
    const b = normalizeFulfillmentBrand(b0);
    const ex = f.brandCarriers.find(x=>x.brand===b);
    if(ex){ if(D.carriers[b0]) ex.carrier = D.carriers[b0]; }
    else { f.brandCarriers.push({id:uid(), brand:b, carrier:D.carriers[b0]||''}); newBrands.push(b); }
  });
  D.items.forEach(src=>{
    let row = null;
    if(src.itemCode) row = f.items.find(x=>String(x.itemCode||'').trim()===src.itemCode);
    if(!row && src.itemBarcode) row = f.items.find(x=>String(x.itemBarcode||'').trim()===src.itemBarcode);
    if(row){
      row.brand = normalizeFulfillmentBrand(src.brand); row.itemCode = src.itemCode; row.itemBarcode = src.itemBarcode; row.itemName = src.itemName;
      row.packQty = src.packQty; row.pltBoxQty = src.pltBoxQty; row.clCode = src.clCode; row.active = src.active;
      touch(row); upd++;
    } else {
      f.items.push(touch(Object.assign({id:uid()}, src, {brand:normalizeFulfillmentBrand(src.brand)}))); add++;
    }
  });
  let logiBrands = 0;
  Object.keys(D.logistics).forEach(b0=>{
    const b = normalizeFulfillmentBrand(b0);
    const vals = D.logistics[b0];
    if(!Object.keys(vals).length) return;
    const rec = ensureFulfillmentLogistics(b);
    Object.keys(vals).forEach(k=>{ rec[k] = vals[k]; });
    logiBrands++;
  });
  f.sheetV1Msg = `시트 반영 완료: 품목 ${upd}개 갱신 · ${add}개 새로 추가 · 입출고 정보 ${logiBrands}개 브랜드 채움`+(newBrands.length?` · 새 브랜드 ${newBrands.join(', ')}`:'');
  saveState();
}

/* ---- 재고 불러오기: 관리부 재고 현황(stock_share.php)에서 CL 코드 기준으로 판매가능 재고·출고량을 가져온다 ----
   공유키가 들어있는 주소는 코드에 넣지 않고, 이 기기(브라우저)에만 저장한다(서버 동기화 안 함). */
const STOCK_URL_KEY = 'naver_stock_share_url_v1';
function getStockShareUrl(){ try{ return localStorage.getItem(STOCK_URL_KEY)||''; }catch(e){ return ''; } }
function saveStockShareUrl(v){
  v = String(v||'').trim().replace('stock_widget.php','stock_share.php');
  try{ if(v) localStorage.setItem(STOCK_URL_KEY, v); else localStorage.removeItem(STOCK_URL_KEY); }catch(e){}
  render();
}
async function syncFulfillmentStock(){
  const base = getStockShareUrl();
  if(!base){ alert('먼저 화면 위쪽 "⚙ 재고 연동 주소"를 펼쳐서 stock_share.php 주소를 붙여넣고 저장해주세요.'); return; }
  const f = ensureFulfillment();
  const btn = document.getElementById('stockSyncBtn');
  if(btn){ btn.disabled = true; btn.textContent = '불러오는 중…'; }
  try{
    // N배송 재고만 사용: 품목 바코드로 매칭해서 판매가능·최근 7일 주문을 가져온다 (CL 재고·출고는 쓰지 않음)
    const u = new URL(base); u.searchParams.set('view','nship');
    const r = await fetch(u.toString(), {cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const j = await r.json();
    if(!j || j.ok===false) throw new Error((j && j.error) || '응답 오류');
    const byBar = {};
    (j.items||[]).forEach(x=>{
      const vals = []; (function walk(o){ if(o && typeof o==='object'){ Object.keys(o).forEach(k=>walk(o[k])); } else if(o!==null && o!==undefined) vals.push(String(o).trim()); })(x);
      vals.forEach(v=>{ if(/^\d{8,14}$/.test(v) && !byBar[v]) byBar[v] = x; });
    });
    let hit = 0, none = 0;
    f.items.forEach(it=>{
      const bc = String(it.itemBarcode||'').trim();
      if(!bc) return;
      const x = byBar[bc];
      if(x){
        const n = x.totalAvailableInventoryNormalQuantity;
        it.nStock = (n===null||n===undefined||n==='') ? '' : Math.round(Number(n)||0);
        it.nOut7 = Math.round(Number(x.last7dOrderQuantity)||0);
        // 입고량 계산: 현재고 = N배송 판매가능, 평균출고량(일) = 최근 7일 주문 ÷ 7
        if(it.nStock!==''){ it.currentStock = String(it.nStock); it.avgOutbound = String(Math.round(it.nOut7/7*10)/10); }
        hit++;
      } else { none++; }
      touch(it);
    });
    f.nshipAt = j.nship_at || '';
    const nd = f.nshipAt ? new Date(f.nshipAt) : null;
    const hm = (z)=> `${z.getMonth()+1}/${z.getDate()} ${String(z.getHours()).padStart(2,'0')}:${String(z.getMinutes()).padStart(2,'0')}`;
    f.stockMsg = `재고 불러오기 완료: N배송 ${hit}개 갱신` + (none?` · 바코드가 N배송에 없는 품목 ${none}개`:'') + (nd && !isNaN(nd) ? ` · N배송 ${hm(nd)} 수집 기준(실시간 아님)` : '');
    saveState(); render();
  }catch(e){
    if(btn){ btn.disabled = false; btn.textContent = '재고 불러오기'; }
    alert('재고를 불러오지 못했어요.\n\n'+e.message+'\n\n주소(공유키 포함)가 맞는지, NAS의 stock_share.php 가 새 버전(view=nship 포함)인지, 나스가 이 앱의 접근을 허용하는지 확인해주세요.');
  }
}

/* VSL 과 VSL3 는 같은 브랜드로 본다. 이미 있는 쪽 이름을 기준으로 맞춘다(둘 다 없으면 VSL3). */
function normalizeFulfillmentBrand(b){
  if(b==='후에버' && ensureFulfillment().brandCarriers.some(x=>x.brand==='후')) return '후';
  if(b!=='VSL' && b!=='VSL3') return b;
  const names = ensureFulfillment().brandCarriers.map(x=>x.brand);
  if(names.includes('VSL3')) return 'VSL3';
  if(names.includes('VSL')) return 'VSL';
  return 'VSL3';
}
/* 시트 반영 때 VSL3 품목이 'VSL'이라는 새 브랜드로 옮겨졌던 것을 VSL3 쪽으로 다시 합친다(1회).
   품목·입출고 정보는 하나도 지우지 않고, VSL3 쪽에 이미 적힌 값은 그대로 두고 빈 칸만 채운다. */
function mergeVslIntoVsl3(){
  const f = ensureFulfillment();
  if(f.vslMergedV1) return;
  f.vslMergedV1 = true;
  const hasVsl = f.brandCarriers.some(x=>x.brand==='VSL');
  if(!hasVsl) return;
  let moved = 0;
  f.items.forEach(it=>{ if(it.brand==='VSL'){ it.brand = 'VSL3'; touch(it); moved++; } });
  const vc = f.brandCarriers.find(x=>x.brand==='VSL');
  let tc = f.brandCarriers.find(x=>x.brand==='VSL3');
  if(!tc){ vc.brand = 'VSL3'; tc = vc; }
  else {
    if(!tc.carrier && vc.carrier) tc.carrier = vc.carrier;
    f.brandCarriers = f.brandCarriers.filter(x=>x!==vc);
  }
  const lv = f.logistics['VSL'];
  if(lv){
    const l3 = ensureFulfillmentLogistics('VSL3');
    Object.keys(lv).forEach(k=>{ if(lv[k] && !l3[k]) l3[k] = lv[k]; });
    delete f.logistics['VSL'];
  }
  if(f.itemFilter['VSL']!==undefined){ if(f.itemFilter['VSL3']===undefined) f.itemFilter['VSL3'] = f.itemFilter['VSL']; delete f.itemFilter['VSL']; }
  f.sheetV1Msg = `VSL 품목 ${moved}개를 VSL3로 다시 합쳤어요 (VSL = VSL3)` + (f.sheetV1Msg ? ' · '+f.sheetV1Msg : '');
  saveState();
}
/* '후에버'가 '후'와 따로 생긴 것을 정리(1회): 후에버에 품목이 있으면 '후'로 옮기고, 입출고 정보는 '후'의 빈 칸만 채운 뒤 후에버 브랜드를 없앤다. */
function mergeHueverIntoHu(){
  const f = ensureFulfillment();
  if(f.hueverMergedV1) return;
  f.hueverMergedV1 = true;
  const hv = f.brandCarriers.find(x=>x.brand==='후에버');
  const hu = f.brandCarriers.find(x=>x.brand==='후');
  if(!hv || !hu) return;
  f.items.forEach(it=>{ if(it.brand==='후에버'){ it.brand = '후'; touch(it); } });
  if(!hu.carrier && hv.carrier) hu.carrier = hv.carrier;
  f.brandCarriers = f.brandCarriers.filter(x=>x!==hv);
  const lv = f.logistics['후에버'];
  if(lv){ const lh = ensureFulfillmentLogistics('후'); Object.keys(lv).forEach(k=>{ if(lv[k] && !lh[k]) lh[k] = lv[k]; }); delete f.logistics['후에버']; }
  if(f.itemFilter && f.itemFilter['후에버']!==undefined){ delete f.itemFilter['후에버']; }
  saveState();
}

/* 입고량 계산: 필요한 만큼(평균출고량×기준일−현재고)을 그대로 입고하면 박스 단위로 안 맞아떨어질 수 있어서,
   먼저 필요 박스 수를 반올림(0.5 이상 올림/미만 내림)으로 정하고, 그 박스 수 × 입수량을 최종 입고수량(EA)으로 삼는다.
   이렇게 하면 입고수량(EA)은 항상 입수량으로 정확히 나누어떨어진다. */
function calcInbound(avgOutbound, baseDate, currentStock, packQty){
  const po = Number(packQty);
  if(!po || po<=0) return {ea:null, box:null};
  const rawNeed = Number(avgOutbound||0) * Number(baseDate||0) - Number(currentStock||0);
  if(rawNeed<=0) return {ea:0, box:0};
  const box = Math.round(rawNeed / po); // 0.5 이상 올림, 0.5 미만 내림 (Math.round 기본 동작)
  return {ea: box*po, box};
}
function applyBaseDateToAllVisible(){
  const val = document.getElementById('bulkBaseDateInput').value;
  if(val===''){ alert('일괄 적용할 기준일 값을 입력해주세요.'); return; }
  const f = ensureFulfillment();
  let count = 0;
  f.items.forEach(it=>{
    if(!it.brand || isFulfillmentBrandVisible(it.brand)){ it.baseDate = val; count++; }
  });
  saveState(); render();
}
/* 현재고·평균출고량·기준일 칸이 <input>이라서, 브랜드부터 입고수(BOX)까지 마우스로 드래그해서
   긁어 복사하는 게 브라우저 특성상 잘 안 먹힌다(입력칸 경계에서 선택이 끊김). 그래서 표 전체를
   엑셀에 그대로 붙여넣기 좋은 탭(TSV) 형식으로 클립보드에 복사하는 버튼을 따로 만들었다. */
/* 화면에 보이는 값을 "state가 아니라 실제로 렌더링된 DOM"에서 그대로 읽어서 복사한다.
   이렇게 하면 어떤 이유로든(방금 입력했는데 아직 blur가 안 됐다거나 등) state와 화면 표시가
   어긋나 있어도, 사용자 눈에 보이는 것과 100% 똑같은 내용이 복사된다. */
function copyFulfillmentTable(btnEl){
  const table = document.getElementById('fulfillInboundTable');
  if(!table){ alert('복사할 품목이 없어요.'); return; }
  const headerCells = Array.from(table.querySelectorAll('thead th')).filter(th=>!th.classList.contains('no-copy')).map(th=>th.textContent.trim());
  const lines = [headerCells.join('\t')];
  table.querySelectorAll('tbody tr').forEach(tr=>{
    const cellTexts = Array.from(tr.children).filter(td=>!td.classList.contains('no-copy')).map(td=>{
      const input = td.querySelector('input');
      const raw = input ? input.value : td.textContent.trim();
      const val = (raw==='-' ? '' : raw); // 값이 없어서 '-'로 표시해둔 자리는 빈 칸으로 복사
      // 상품코드·상품바코드처럼 긴 숫자로 된 값은 앞에 어퍼스트로피(')를 붙여서, 엑셀에 붙여넣을 때
      // 과학적 표기법(예: 4.903E+12)으로 안 바뀌고 원래 숫자 그대로(텍스트로) 들어가게 한다.
      if(/^\d{6,}$/.test(val)) return `'${val}`;
      return val;
    });
    lines.push(cellTexts.join('\t'));
  });
  if(lines.length<=1){ alert('복사할 품목이 없어요.'); return; }
  copyToClipboard(lines.join('\n'), btnEl);
}
function localDateStr(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), dd=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${dd}`;
}

/* CJ "통합재고조회_상품별" 양식 전용 가져오기.
   헤더가 2줄로 되어있고 병합 셀이 많아서 이름으로 열을 찾기 어려우므로, 열 위치(D=품목코드, H=가용수량, T=평균출고량)로 직접 읽는다.
   품목코드가 이미 "품목 데이터"에 등록되어 있는 품목만 매칭해서 현재고·평균출고량을 채워준다 (새 품목은 만들지 않음). */
async function importCjStockExcel(){
  const fileInput = document.getElementById('cjStockFile');
  const resultEl = document.getElementById('cjStockResult');
  const file = fileInput && fileInput.files[0];
  if(!file){ resultEl.innerHTML = '<div class="helptext" style="color:var(--negative);margin-top:6px">엑셀 파일을 선택해주세요.</div>'; return; }
  if(typeof XLSX === 'undefined'){
    resultEl.innerHTML = '<div class="helptext" style="color:var(--negative);margin-top:6px">엑셀 처리 기능을 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침 후 다시 시도해주세요.</div>';
    return;
  }
  resultEl.innerHTML = '<div class="helptext" style="margin-top:6px">불러오는 중...</div>';
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array', cellDates:false});
    const ws = wb.Sheets[wb.SheetNames[0]];
    // header:1 → 열 이름이 아니라 행 배열 그대로 받아서, D/H/T 열(품목코드/가용수량/평균출고량) 위치로 직접 읽는다
    const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
    const f = ensureFulfillment();
    const byCode = {};
    f.items.forEach(it=>{ if(it.itemCode) byCode[String(it.itemCode).trim()] = it; });

    let matched = 0;
    const unmatched = [];
    rows.forEach(row=>{
      const itemCode = String(row[3]||'').trim(); // D열: 품목코드
      if(!itemCode || itemCode==='품목코드') return; // 헤더행/빈행 스킵
      const availQty = row[7];  // H열: 가용수량 → 현재고로 사용
      const avgOut = row[19];   // T열: 평균출고량
      if(availQty==='' && avgOut==='') return; // SUM행 등 수치 없는 행 스킵
      const item = byCode[itemCode];
      if(!item){ unmatched.push(itemCode); return; }
      item.currentStock = sanitizePromoNumber(String(availQty));
      item.avgOutbound = sanitizePromoNumber(String(avgOut));
      matched++;
    });
    saveState();
    let msg = `${matched}개 품목의 현재고·평균출고량을 채웠어요.`;
    if(unmatched.length>0) msg += `\n\n품목 데이터에 없는 품목코드 ${unmatched.length}개는 건너뛰었어요:\n${unmatched.slice(0,15).join(', ')}${unmatched.length>15?' 등':''}`;
    alert(msg);
    render();
  }catch(e){
    console.error(e);
    resultEl.innerHTML = '<div class="helptext" style="color:var(--negative);margin-top:6px">가져오기 실패: ' + e.message + '</div>';
  }
}

function inboundCarrierKind(brand){ const c = fulfillmentCarrierOf(brand)||''; if(/cj/i.test(c)) return 'cj'; if(/롯데/.test(c)) return 'lotte'; return ''; }
function isCjBrand(brand){ return inboundCarrierKind(brand)==='cj'; }
function xmlEsc(v){ return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
/* 입고수량: 자동 계산값. 수기로 고친 값(inbManual)이 있으면 그 값을 쓰고, 박스 수는 입고수량 ÷ 입수량으로 다시 계산한다 */
function inboundCalcOf(it){
  const auto = calcInbound(it.avgOutbound, it.baseDate, it.currentStock, it.packQty);
  if(it.inbManual===undefined || it.inbManual===null || it.inbManual==='') return auto;
  const ea = Number(it.inbManual); const po = Number(it.packQty);
  if(isNaN(ea) || ea<0) return auto;
  return {ea, box: po>0 ? Math.round(ea/po*100)/100 : null, manual:true};
}
function setInboundManual(id, val){
  const f = ensureFulfillment(); const it = f.items.find(x=>x.id===id); if(!it) return;
  val = String(val).trim();
  if(val===''){ delete it.inbManual; }
  else { const n = Math.round(Number(val)); if(isNaN(n) || n<0){ alert('0 이상의 숫자를 입력해주세요.'); return; } it.inbManual = n; }
  touch(it); saveState(); render();
}
function toggleInboundConfirm(id){
  __inbDl = {}; __inbMsg = '';
  const f = ensureFulfillment();
  const it = f.items.find(x=>x.id===id); if(!it) return;
  if(it.inbConfirm){ it.inbConfirm = null; }
  else {
    const {ea, box} = inboundCalcOf(it);
    if(!ea || !box){ alert('입고수량이 0이거나 계산되지 않은 품목은 확정할 수 없어요.'); return; }
    it.inbConfirm = {ea, box};
  }
  touch(it); saveState(); render();
}
let __inbDl = {}; let __inbMsg = '';
function clearBrandConfirms(brand){
  const f = ensureFulfillment();
  f.items.forEach(it=>{ if(it.brand===brand && it.inbConfirm){ it.inbConfirm = null; touch(it); } });
  saveState();
}
function clearInboundConfirms(){
  if(!confirm('확정한 품목을 모두 해제할까요?')) return;
  const f = ensureFulfillment();
  f.items.forEach(it=>{ if(it.inbConfirm){ it.inbConfirm = null; touch(it); } });
  saveState(); render();
}
function setInboundType(v){ ensureFulfillment().inboundType = v; saveState(); }
function cjConfirmedGroups(){
  const f = ensureFulfillment(); const map = {}; const order = []; let other = 0;
  f.items.forEach(it=>{
    if(!it.inbConfirm || it.active===false) return;
    const kind = inboundCarrierKind(it.brand);
    if(!kind){ other++; return; }
    if(!map[it.brand]){ map[it.brand] = {brand:it.brand, carrier:kind, items:[]}; order.push(it.brand); }
    map[it.brand].items.push({it, ea:it.inbConfirm.ea, box:it.inbConfirm.box});
  });
  return {groups: order.map(b=>map[b]), other};
}
function cjSupplierOf(brand){ const r = ensureFulfillment().logistics[brand] || {}; return {id: r.supplierId||'', name: r.supplierName||''}; }
function ymdStr(){ const d=new Date(); return String(d.getFullYear()).slice(2)+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0'); }
function cjPrintAtStr(){
  const d = new Date(); const wd = ['일','월','화','수','목','금','토'][d.getDay()];
  const h = d.getHours(); const h12 = h%12===0 ? 12 : h%12;
  return `${d.getFullYear()}년${d.getMonth()+1}월${d.getDate()}일 ${wd} ${h12}시${String(d.getMinutes()).padStart(2,'0')}분${String(d.getSeconds()).padStart(2,'0')}초 ${h<12?'오전':'오후'}`;
}
async function cjLoadTpl(b64){
  if(typeof JSZip==='undefined') throw new Error('엑셀 생성 도구(JSZip)를 불러오지 못했어요. 인터넷 연결을 확인해주세요.');
  return await JSZip.loadAsync(b64, {base64:true});
}
const cjIs = (ref, style, v)=> `<c r="${ref}"${style!==''?` s="${style}"`:''} t="inlineStr"><is><t xml:space="preserve">${xmlEsc(v)}</t></is></c>`;
/* 1) 입고 등록 파일 */
async function buildCjRegBlob(group){
  const f = ensureFulfillment(); const sup = cjSupplierOf(group.brand);
  const zip = await cjLoadTpl(CJ_TPL_REG_B64);
  let xml = await zip.file('xl/worksheets/sheet1.xml').async('string');
  const type = f.inboundType || '12';
  let rows = '';
  group.items.forEach((g,i)=>{
    const r = i+2;
    rows += `<row r="${r}" spans="1:13" x14ac:dyDescent="0.3">`
      + cjIs('A'+r,3,type) + `<c r="B${r}" s="12"/><c r="C${r}" s="12"/><c r="D${r}" s="12"/>`
      + cjIs('E'+r,7,sup.id) + cjIs('F'+r,9,g.it.itemCode||'') + cjIs('G'+r,8,g.it.itemName||'')
      + `<c r="H${r}" s="11"><v>${Number(g.ea)}</v></c></row>`;
  });
  xml = xml.split('{{ROWS}}').join(rows).split('{{LAST}}').join(String(group.items.length+1));
  zip.file('xl/worksheets/sheet1.xml', xml);
  return await zip.generateAsync({type:'blob', compression:'DEFLATE', mimeType:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
/* 2) 거래명세서 (입고증) */
const CJ_INBOUND_TYPE_NAMES = {'11':'일반입고','12':'화물입고','13':'CD입고','14':'밀크런입고','31':'택배입고','91':'반품입고'};
function cjPhoneOf(v){ v = String(v||'').trim(); if(!v) return ''; return v.indexOf('_')>=0 ? v.split('_').pop().trim() : v; }
/* '정민호 과장님_010-7788-4099' → '정민호 / 010-7788-4099' (직함 떼고 이름 / 연락처) */
function cjContactOf(v){
  v = String(v||'').trim(); if(!v) return '';
  if(v.indexOf('_')<0) return v;
  const parts = v.split('_'); const phone = parts.pop().trim();
  const name = parts.join('_').trim().replace(/\s*(대표|이사|실장|부장|차장|과장|팀장|대리|주임|사원|매니저|담당자)?\s*님?\s*$/,'').trim();
  return name ? `${name} / ${phone}` : phone;
}
async function buildCjNoticeBlob(group){
  const f = ensureFulfillment(); const brand = group.brand;
  const rec = f.logistics[brand] || {};
  const zip = await cjLoadTpl(CJ_TPL_NOTICE_B64);
  let xml = await zip.file('xl/worksheets/sheet1.xml').async('string');
  const N = group.items.length;
  // 머리 칸: 박스번호·입고일·센터입고시간(입고시간)은 비워둔다
  const num = v=> /^\d{1,15}$/.test(String(v||'').trim());
  const D = {
    F2:'', B5:'', B6:'', C5:'입고시간\n',
    D5: CJ_INBOUND_TYPE_NAMES[f.inboundType||'12'] || '',
    B7: rec.inboundAddress||'', B8: rec.inboundCenter||'', D8: cjPhoneOf(rec.inboundManagerContact),
    G6: rec.supplierId||'', G7: rec.supplierName||'', G8: rec.bizRegNo||'', G9: rec.outboundAddress||'',
    G10: cjContactOf(rec.outboundManagerContact)
  };
  xml = xml.replace(/\{\{D:([A-Z]+\d+):(\d+)\}\}/g, (m,ref,st)=>{
    const v = D[ref];
    if(v===undefined || v==='') return `<c r="${ref}" s="${st}"/>`;
    if(ref==='G6' && num(v)) return `<c r="${ref}" s="${st}"><v>${String(v).trim()}</v></c>`;
    return cjIs(ref, st, v);
  });

      + `<c r="E${r}" s="33"><v>${Number(g.ea)}</v></c>`

  });

    + `<c r="E${tr}" s="34"><v>${totEA}</v></c><c r="F${tr}" s="14"/><c r="G${tr}" s="29"><v>${totBox}</v></c><c r="H${tr}" s="11"/><c r="I${tr}" s="12"/></row>`;

/* 롯데 입고 등록 파일(.xls): 고객사주문일자(오늘)·고객사상품코드·상품명·예정수량·쇼핑몰코드(NAVER 고정). 나머지 칸은 비워둔다. */
function buildLotteRegBlob(group){
  if(typeof XLSX==='undefined') throw new Error('엑셀 도구(XLSX)를 불러오지 못했어요. 인터넷 연결을 확인해주세요.');
  const head = ['고객사주문일자','고객사주문번호','고객사라인번호','입고처메모','고객사상품코드','상품명','예정수량','생산일자','유통기한','상품로트','쇼핑몰코드','브랜드코드'];
  const ws = {}; const col = i=>String.fromCharCode(65+i);
  head.forEach((h,i)=>{ ws[col(i)+'1'] = {t:'s', v:h}; });
  const now = new Date(); const serial = Math.floor((Date.UTC(now.getFullYear(),now.getMonth(),now.getDate()) - Date.UTC(1899,11,30))/86400000);
  group.items.forEach((g,i)=>{
    const r = i+2, it = g.it, code = String(it.itemCode||'').trim();
    ws['A'+r] = {t:'n', v:serial, z:'yyyy-mm-dd'};
    ws['E'+r] = /^[1-9]\d{0,14}$/.test(code) ? {t:'n', v:Number(code)} : {t:'s', v:code};
    ws['F'+r] = {t:'s', v:it.itemName||''};
    ws['G'+r] = {t:'n', v:Number(g.ea)};
    ws['K'+r] = {t:'s', v:'NAVER'};
  });
  ws['!ref'] = 'A1:L'+(group.items.length+1);
  ws['!cols'] = [18.5703125,16.140625,16.140625,16.140625,16.140625,46.5703125,16.140625,16.140625,19.7109375,16.140625,20.5703125,16.140625].map(w=>({width:w}));
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Sheet0');
  const arr = XLSX.write(wb, {bookType:'xls', type:'array'});
  return new Blob([arr], {type:'application/vnd.ms-excel'});
}

      + cjIs('C'+r,32,it.itemBarcode||'') + cjIs('D'+r,31,it.itemName||'')
      + `<c r="E${r}" s="27"><v>${Number(g.ea)}</v></c><c r="F${r}" s="26"><v>${Number(it.packQty)||0}</v></c><c r="G${r}" s="21"><v>${Number(g.box)}</v></c>`
      + `<c r="H${r}" s="28"/><c r="I${r}" s="30"/><c r="J${r}" s="22"/><c r="K${r}" s="3"/></row>`;
  });
  const tr = 11+N, last = 11+N;
  rows += `<row r="${tr}" spans="1:13"><c r="A${tr}" s="40"/><c r="B${tr}" s="41"/><c r="C${tr}" s="41"/><c r="D${tr}" s="42"/>`
    + `<c r="E${tr}" s="19"><f>SUM(E11:E${tr-1})</f><v>${totEA}</v></c>` + cjIs('F'+tr,19,'-')
    + `<c r="G${tr}" s="19"><f>SUM(G11:G${tr-1})</f><v>${totBox}</v></c><c r="H${tr}" s="24"/><c r="I${tr}" s="25"/><c r="J${tr}" s="12"/><c r="K${tr}" s="3"/></row>`;
  const shift = N-3;
  xml = xml.replace(/\{\{T:(\d+)\}\}/g, (m,n)=> String(Number(n)+shift));
  const rep = {'{{ROWS}}':rows, '{{TR}}':String(tr), '{{MCOUNT}}':'9', '{{LAST}}':String(28+shift)};
  Object.keys(rep).forEach(k=>{ xml = xml.split(k).join(rep[k]); });
  zip.file('xl/worksheets/sheet1.xml', xml);
  const sheetName = String(group.brand).replace(/[\[\]:*?\/\\]/g,'').slice(0,31) || 'Sheet1';
  let wbx = await zip.file('xl/workbook.xml').async('string'); zip.file('xl/workbook.xml', wbx.split('{{SHEET}}').join(xmlEsc(sheetName)));

  return await zip.generateAsync({type:'blob', compression:'DEFLATE', mimeType:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}

async function downloadCjFile(brandEnc, kind){

    const brand = normalizeFulfillmentBrand(s.brand===('후에버')?'후':s.brand); // VSL=VSL3, 후에버=후
    if(!brand || !fulfillBrandSet.has(brand)) return; // 풀필먼트에 등록되지 않은 브랜드는 제외
    if(!isFulfillmentBrandVisible(brand)) return; // 브랜드 필터에서 체크 해제된 것도 제외
    // 최근 30일 안에 시작했거나, 더 전에 시작했어도 아직 끝나지 않은(종료일이 30일 전 이후인) 선정 프로모션
    const st = s.startDate || '', en = s.endDate || '';
    if(!st && !en) return;
    if(!(st >= cutoffStr || en >= cutoffStr)) return;
    const prods = (s.products||[]).length ? s.products : [{}];
    prods.forEach(p=>{
      promoHistory.push({brand, startDate:st, endDate:en, promoName:s.promoName||'(제목 없음)', code:p.code||'-', name:p.name||'-'});
    });
  });
  promoHistory.sort((a,b)=>(b.startDate||'').localeCompare(a.startDate||''));

  return `

      <div>
        <span class="eyebrow" style="background:#0EA5A522;color:#0EA5A5">풀필먼트</span>
        <h1>입고량 계산</h1>
        <div class="sub">현재고·평균출고량·기준일을 입력하면 박스 단위로 딱 맞는 입고수량(EA)·입고수(BOX)가 자동 계산돼요</div>
      </div>
    </div>

    ${renderFulfillmentBrandFilterBar()}
    ${renderFulfillmentSoldoutBar()}

    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px">
        <h2 style="margin:0">입고량 계산</h2>
        <div style="display:flex;gap:8px;align-items:flex-end">
          <button class="btn ghost" id="fulfillCopyAllBtn" style="color:var(--text-primary)" onclick="copyFulfillmentTable(this)">📋 표 전체 복사</button>
          <div class="field"><label style="display:block;font-size:11px;color:var(--text-secondary);font-weight:600;margin-bottom:4px">기준일 일괄 적용</label>
            <input type="number" id="bulkBaseDateInput" placeholder="예: 30" style="width:90px;border:1px solid var(--border);border-radius:8px;padding:9px 10px;font-size:13.5px;font-family:inherit">
          </div>
          <button class="btn" onclick="applyBaseDateToAllVisible()">전체 적용</button>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px dashed var(--border)">
        <button class="btn ghost" id="stockSyncBtn" style="color:var(--text-primary)" onclick="syncFulfillmentStock()">📦 재고 불러오기</button>
        <span class="helptext" style="margin:0">현재고(N배송 판매가능)와 평균출고량(N배송 최근 7일 주문 ÷ 7, 1일 평균)이 자동으로 채워져요. 값은 직접 고쳐도 되고, 다시 불러오면 새 값으로 바뀌어요.</span>
      </div>
      ${f.stockMsg ? `<div class="card" style="background:#EEF4FB;border-color:#C9DBF0;padding:8px 14px;font-size:12.5px;margin:8px 0 0">📦 ${f.stockMsg}<button class="copy-btn" style="float:right" onclick="ensureFulfillment().stockMsg='';saveState();render()">닫기</button></div>` : ''}
      ${rows.length===0 ? `<div class="empty">${f.items.length===0 ? '등록된 품목이 없습니다. 품목 데이터 메뉴에서 먼저 추가해주세요.' : '필터 조건에 맞는 품목이 없습니다.'}</div>` : `
      <table id="fulfillInboundTable" style="table-layout:fixed;width:100%">
        <colgroup>
          <col style="width:100px"><col style="width:84px"><col style="width:110px"><col><col style="width:60px">
          <col style="width:80px"><col style="width:104px"><col style="width:64px"><col style="width:96px"><col style="width:80px"><col style="width:92px">
        </colgroup>
        <thead><tr>
          <th>브랜드</th><th>상품코드</th><th>상품바코드</th><th>상품명</th><th class="num">입수량</th>
          <th class="num">현재고</th><th class="num" title="1일 평균 출고량">평균출고량(일)</th><th class="num">기준일</th><th class="num">입고수량(EA)</th><th class="num">입고수(BOX)</th><th class="no-copy" style="text-align:center">확정</th>
        </tr></thead>
        <tbody>
          ${rows.map(({it,ea,box,manual})=>{ const dl = fulfillmentDaysLeft(it); const soon = dl!==null && dl<7; return `
            <tr style="${soon?'background:#FDECF0':''}" ${soon?`title="출고 가능 ${dl.toFixed(1)}일 — 품절 임박"`:''}>
              <td>${it.brand||'-'}</td>
              <td>${it.itemCode||'-'}</td>
              <td>${it.itemBarcode||'-'}</td>
              <td style="text-align:left">${it.itemName||'-'}</td>
              <td class="num mono">${it.packQty||'-'}</td>
              <td class="num"><input class="row-input" type="number" value="${it.currentStock||''}" placeholder="0" onchange="updateFulfillmentItemField('${it.id}','currentStock',this.value)"></td>
              <td class="num"><input class="row-input" type="number" value="${it.avgOutbound||''}" placeholder="0" onchange="updateFulfillmentItemField('${it.id}','avgOutbound',this.value)"></td>
              <td class="num"><input class="row-input" type="number" value="${it.baseDate||''}" placeholder="0" onchange="updateFulfillmentItemField('${it.id}','baseDate',this.value)"></td>
              <td class="num"><input class="row-input" type="number" min="0" value="${ea===null?'':ea}" placeholder="-" ${manual?'title="수기로 입력한 값이에요. 칸을 비우면 자동 계산으로 돌아가요" style="font-weight:700;background:#FFF8DC"':'title="자동 계산값이에요. 직접 고치면 그 값으로 바뀌고 박스 수도 따라 바뀌어요" style="font-weight:700"'} onchange="setInboundManual('${it.id}',this.value)"></td>
              <td class="num mono" style="font-weight:700" ${box!==null && !Number.isInteger(box)?'title="입수량으로 나누어떨어지지 않아요"':''}>${box===null?'-':box.toLocaleString('ko-KR')}</td>
              <td class="no-copy" style="text-align:center">${(()=>{
                const c = it.inbConfirm;
                if(c){ const changed = (ea!==c.ea || box!==c.box);
                  return `<button onclick="toggleInboundConfirm('${it.id}')" title="확정: ${c.ea.toLocaleString('ko-KR')} EA / ${c.box.toLocaleString('ko-KR')} BOX${changed?' (이후 계산값이 바뀌었어요 — 해제 후 다시 확정하면 새 값으로 바뀌어요)':''}. 누르면 해제" style="cursor:pointer;border:1px solid ${changed?'#E6B34A':'#BFE3CC'};background:${changed?'#FFF6E0':'#E6F6EC'};color:${changed?'#9A6A00':'#1a7f4b'};font-weight:700;border-radius:6px;padding:3px 9px;font-size:12px;font-family:inherit">✔ 확정${changed?'·변경됨':''}</button>`; }
                const ok = ea && box;
                return `<button onclick="toggleInboundConfirm('${it.id}')" ${ok?'':'disabled'} style="cursor:${ok?'pointer':'not-allowed'};border:1px solid var(--border);background:#fff;color:${ok?'var(--text-primary)':'#bbb'};border-radius:6px;padding:3px 12px;font-size:12px;font-family:inherit">확정</button>`;
              })()}</td>
            </tr>
          `;}).join('')}
        </tbody>
        <tfoot>
          <tr style="background:#F4F5F7;font-weight:800">
            <td colspan="4">합계</td>
            <td class="num"></td>
            <td class="num" colspan="3">SKU ${rows.length.toLocaleString('ko-KR')}개</td>
            <td class="num mono">${totalEA.toLocaleString('ko-KR')} EA</td>
            <td class="num mono">${totalBox.toLocaleString('ko-KR')} BOX</td>
            <td class="no-copy"></td>
          </tr>
        </tfoot>
      </table>`}
      <div class="helptext">필요수량 = 평균출고량 × 기준일 − 현재고 → 이 값을 입수량으로 나눈 뒤 <b>0.5 이상은 올리고 0.5 미만은 내려서</b> 박스 수를 정하고, <b>입고수량(EA) = 박스 수 × 입수량</b>으로 계산해서 항상 박스 단위로 딱 맞아떨어져요. (필요수량이 0 이하면 입고수량도 0) · 입고수량 칸은 <b>직접 고칠 수 있어요</b>(노란 칸 = 수기 입력, 비우면 자동 계산). 고치면 입고수(BOX)는 입고수량 ÷ 입수량으로 바뀌어요. · 표는 <b>입고수량이 많은 순</b>으로 정렬되고, 입고가 필요 없는 품목은 맨 아래에 있어요.</div>
    </div>

    ${renderInboundConfirmPanel()}

    <div class="card">
      <h2>최근 30일 프로모션 이력 <span style="font-size:12px;font-weight:600;color:var(--text-secondary)">· 선정리스트 기준</span></h2>

      <table>
        <thead><tr><th>브랜드</th><th>시작일</th><th>종료일</th><th>프로모션</th><th>상품코드</th><th>상품명</th></tr></thead>
        <tbody>
          ${promoHistory.map(h=>`
            <tr>
              <td>${xmlEsc(h.brand)}</td>
              <td>${h.startDate||'-'}</td>
              <td>${h.endDate||'-'}</td>
              <td><b>${h.promoName}</b></td>
              <td>${h.code}</td>
              <td>${h.name}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>`}
    </div>
  `;
}

function ensurePromotion(){

    state.promotion = {
      brands: bizwalletBrandsList().slice(), // 프로모션 전용 브랜드 목록 (셋팅에서 자유롭게 추가/삭제 가능, 광고 탭 데이터와는 무관)

      proposals: [],
      selections: [], // 선정리스트 — 제안리스트와 별개로 수기 입력하는 데이터
      checklist: [], // 셋팅 — 프로모션 선정 후 후속작업 체크리스트
      calendarFilter: {}, // {브랜드: true/false} — 없으면 기본 표시(true)
      proposalFilter: {},
      selectionFilter: {},
      checklistFilter: {},
      brandLinks: {}, // { [브랜드]: {storeLink, productLinkPrefix} } — 셋팅도우미에서 상품 링크 자동 생성에 사용
      sheetSyncUrl: '', // 제안리스트 신규/수정 항목을 자동으로 보낼 구글 앱스스크립트 웹앱 주소
      proposeCalendarId: '', // 제안캘린더와 연동할 구글 캘린더 ID
      selectedCalendarId: '', // 선정캘린더와 연동할 구글 캘린더 ID
    };
  }
  if(!Array.isArray(state.promotion.brands)) state.promotion.brands = [];
  if(!Array.isArray(state.promotion.owners)) state.promotion.owners = [];
  if(!Array.isArray(state.promotion.proposals)) state.promotion.proposals = [];
  if(!Array.isArray(state.promotion.selections)) state.promotion.selections = [];
  if(!Array.isArray(state.promotion.checklist)) state.promotion.checklist = [];
  if(!state.promotion.calendarFilter || typeof state.promotion.calendarFilter!=='object') state.promotion.calendarFilter = {};
  if(!state.promotion.proposalFilter || typeof state.promotion.proposalFilter!=='object') state.promotion.proposalFilter = {};
  if(!state.promotion.selectionFilter || typeof state.promotion.selectionFilter!=='object') state.promotion.selectionFilter = {};
  if(!state.promotion.checklistFilter || typeof state.promotion.checklistFilter!=='object') state.promotion.checklistFilter = {};
  if(!state.promotion.brandLinks || typeof state.promotion.brandLinks!=='object') state.promotion.brandLinks = {};
  if(state.promotion.sheetSyncUrl===undefined) state.promotion.sheetSyncUrl = '';
  if(state.promotion.proposeCalendarId===undefined) state.promotion.proposeCalendarId = '';
  if(state.promotion.selectedCalendarId===undefined) state.promotion.selectedCalendarId = '';
  // 기존 데이터 마이그레이션: 제안리스트가 단일 brand(문자열)만 갖고 있던 예전 데이터를
  // brands(배열)로도 채워서 여러 브랜드를 다룰 수 있게 한다. 기존 brand 필드는 그대로 보존.
  state.promotion.proposals.forEach(p=>{
    if(!Array.isArray(p.brands)){
      p.brands = p.brand ? [p.brand] : [];
    }
    // 선정완료를 브랜드별로 관리하도록 마이그레이션: 예전에 전체 selectedDone이 true였다면
    // 그 시점 브랜드들을 모두 선정된 것으로 간주해 이관하고, 기존 selectedDone 필드는 그대로 둔다.
    if(!p.selectedBrands || typeof p.selectedBrands!=='object'){
      p.selectedBrands = {};
      if(p.selectedDone){
        p.brands.forEach(b=>{ p.selectedBrands[b] = true; });
      }
    }
  });
  // 셋팅 체크리스트: 쇼핑스토리/롤링배너/상세배너/마케팅메시지/카테고리 5칸을 "배너셋팅" 1칸으로 통합.
  // 예전 값은 지우지 않고 그대로 두되(데이터 보존), 화면에는 배너셋팅만 보이도록 대표값을 하나 뽑아둔다.
  state.promotion.checklist.forEach(c=>{
    if(c.bannerSetting === undefined){
      const legacy = [c.shoppingStory, c.rollingBanner, c.detailBanner, c.marketingMessage, c.category].filter(Boolean);
      c.bannerSetting = legacy.length ? legacy[0] : '';
    }
  });
  // "선정리스트 수기 등록 → 셋팅 자동생성" 기능이 생기기 전부터 있던 선정 항목들은,
  // 앞으로 다시 손대도 자동으로 셋팅 항목이 새로 생기지 않도록 "이미 처리됨"으로 한 번만 표시해둔다.
  // (딱 한 번만 실행 — 그래야 이후에 새로 추가하는 항목은 정상적으로 자동연동 대상이 됨)
  if(!state.promotion._legacySelectionsMarked){
    state.promotion.selections.forEach(s=>{
      if(s.checklistSynced===undefined) s.checklistSynced = true;
    });
    state.promotion._legacySelectionsMarked = true;
  }
  return state.promotion;
}

/* ---- 엑셀 가져오기 (제안리스트 / 선정리스트 / 셋팅) ---- */
function excelToDateStr(v){
  if(v===undefined || v===null || v==='') return '';
  // 엑셀에서 읽은 날짜 셀은 보통 순수 숫자(일련번호)로 들어온다 — Date 객체 변환은 컴퓨터 시간대에 따라
  // 값 자체가 달라지는 문제가 있어서, 숫자는 우리가 직접(시간대 영향 없이) 계산한다.
  if(typeof v === 'number' && !isNaN(v)){
    return excelSerialToDateStr(v);
  }
  if(Object.prototype.toString.call(v)==="[object Date]" && !isNaN(v.getTime())){
    const y=v.getUTCFullYear(), m=String(v.getUTCMonth()+1).padStart(2,'0'), d=String(v.getUTCDate()).padStart(2,'0');
    return `${y}-${m}-${d}`;
  }
  const s = String(v).trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const m2 = s.match(/^(\d{4})[.\/](\d{1,2})[.\/](\d{1,2})/);
  if(m2) return `${m2[1]}-${String(m2[2]).padStart(2,'0')}-${String(m2[3]).padStart(2,'0')}`;
  // 위 형식으로도 못 알아들었으면, 더 폭넓게 시도해보는 파서로 한 번 더 시도
  const flexible = parseFlexibleDate(s);
  if(/^\d{4}-\d{2}-\d{2}$/.test(flexible)) return flexible;
  // 마지막 안전장치: 브라우저의 일반 날짜 파싱에 맡겨본다 (예: "Tue Aug 04 2026 ..." 같은 문자열도 처리)
  const generic = new Date(s);
  if(!isNaN(generic.getTime())){
    const y=generic.getFullYear(), m=String(generic.getMonth()+1).padStart(2,'0'), d=String(generic.getDate()).padStart(2,'0');
    return `${y}-${m}-${d}`;
  }
  return s; // 그래도 인식 못하면 원본 텍스트를 그대로 두고, 나중에 화면에서 직접 고칠 수 있게 함
}
/* 엑셀 셀 하나를 복사해서 날짜 입력칸(달력)에 그대로 붙여넣기 하면(Ctrl+V) 자동으로 yyyy-mm-dd로 바꿔서 넣어준다.
   <input type="date">는 원래 이 형식이 아니면 붙여넣기가 아예 씹히기 때문에, 여러 형식(2026-08-04, 2026/8/4,
   2026.8.4, 엑셀 날짜 일련번호 등)을 미리 알아서 변환해준다. */
function excelSerialToDateStr(serial){
  const utcDays = Math.floor(serial - 25569);
  const date = new Date(utcDays * 86400 * 1000);
  const y=date.getUTCFullYear(), m=String(date.getUTCMonth()+1).padStart(2,'0'), d=String(date.getUTCDate()).padStart(2,'0');
  return `${y}-${m}-${d}`;
}
function excelSerialToTimeStr(serial){
  const frac = serial - Math.floor(serial);
  const totalMin = Math.round(frac * 24 * 60);
  const h = Math.floor(totalMin/60) % 24, m = totalMin % 60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}
function parseFlexibleDate(raw){
  if(!raw) return '';
  const s = String(raw).trim();
  if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);
  let m = s.match(/^(\d{4})[.\/](\d{1,2})[.\/](\d{1,2})/);
  if(m) return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
  m = s.match(/^(\d{1,2})[.\/](\d{1,2})[.\/](\d{4})$/);
  if(m){
    const a=parseInt(m[1],10), b=parseInt(m[2],10), y=m[3];
    // 12보다 크면 일(day)일 수밖에 없으므로 뒤에서부터 판단, 그 외엔 월/일(mm/dd) 순으로 가정
    if(a>12) return `${y}-${String(b).padStart(2,'0')}-${String(a).padStart(2,'0')}`;
    return `${y}-${String(a).padStart(2,'0')}-${String(b).padStart(2,'0')}`;
  }
  // "1월2일", "12월 25일" 처럼 연도가 아예 없는 한글 날짜 — 앱이 관리하는 연도(YEAR)를 붙여서 인식한다
  m = s.match(/^(\d{1,2})\s*월\s*(\d{1,2})\s*일$/);
  if(m) return `${YEAR}-${String(m[1]).padStart(2,'0')}-${String(m[2]).padStart(2,'0')}`;
  if(/^\d{4,6}$/.test(s)){
    const num = parseInt(s,10);
    if(num>20000 && num<80000) return excelSerialToDateStr(num); // 엑셀 날짜 일련번호로 추정되는 범위
  }
  return '';
}
function handleDatePaste(e){
  const text = (e.clipboardData || window.clipboardData).getData('text');
  if(!text) return;
  const parsed = parseFlexibleDate(text);
  if(!/^\d{4}-\d{2}-\d{2}$/.test(parsed)) return; // 못 알아들으면 브라우저 기본 붙여넣기 동작에 맡김
  e.preventDefault();
  e.target.value = parsed;
  e.target.dispatchEvent(new Event('change', {bubbles:true}));
}
function excelRowVal(row, ...keys){
  for(const k of keys){
    if(row[k]!==undefined && row[k]!==null && String(row[k]).trim()!==''){
      return String(row[k]).trim();
    }
  }
  return '';
}
/* excelRowVal과 달리 값을 문자열로 미리 바꾸지 않고 원본 그대로(Date 객체·숫자 등) 반환한다.
   날짜/시간 칸은 미리 문자열로 바꿔버리면(특히 Date 객체의 toString()은 컴퓨터의 시간대에 따라
   달라짐) 하루씩 밀리는 등 오작동하므로, 날짜·시간은 반드시 이 함수로 원본을 가져와야 한다. */
function excelRawVal(row, ...keys){
  for(const k of keys){
    if(row[k]!==undefined && row[k]!==null && row[k]!==''){
      return row[k];
    }
  }
  return '';
}
function excelRowBool(row, ...keys){
  const v = excelRowVal(row, ...keys).toLowerCase();
  return ['y','yes','예','true','1','완료','o','v'].includes(v);
}

function importSelectionsFromRows(rows, position, batchId){

  if(position==='bottom'){
    const sortedDesc = order.slice().sort((a,b)=>{
      const ea = groups.get(a), eb = groups.get(b);
      return (eb.startDate||'').localeCompare(ea.startDate||'');

      promo.selections.push(entry);

  } else {

      const ea = groups.get(a), eb = groups.get(b);
      return (ea.startDate||'').localeCompare(eb.startDate||'');
    });
    sortedAsc.forEach(key=>{
      const entry = groups.get(key);
      if(entry.products.length===0) entry.products.push({id:uid(),code:'',name:'',regPrice:'',instantDiscountPrice:'',finalBenefitPrice:''});
      promo.selections.unshift(entry);
    });
  }
  return count;
}

function excelToTimeStr(v){

  if(typeof v === 'number' && !isNaN(v)){

  }
  if(Object.prototype.toString.call(v)==="[object Date]" && !isNaN(v.getTime())){
    const h=String(v.getUTCHours()).padStart(2,'0'), mnt=String(v.getUTCMinutes()).padStart(2,'0');
    return `${h}:${mnt}`;
  }
  const s = String(v).trim();
  const m = s.match(/^(\d{1,2}):(\d{2})/);
  if(m) return `${m[1].padStart(2,'0')}:${m[2]}`;
  return s;
}
function importLiveScheduleFromRows(rows, position, batchId){
  const promo = ensurePromotion();
  const live = ensureLive();
  const imported = [];
  let count = 0;
  rows.forEach(row=>{
    const date = excelToDateStr(excelRawVal(row,'날짜'));
    const time = excelToTimeStr(row['시간']);
    const liveId = excelRowVal(row,'라이브ID','라이브아이디','라이브 ID').replace(/[^\d]/g,'').slice(0,8);
    const brand = excelRowVal(row,'브랜드');
    const content = excelRowVal(row,'행사내용');
    if(!date && !brand && !liveId && !content) return;
    if(brand && !promo.brands.includes(brand)) promo.brands.push(brand);
    imported.push({id:uid(), importBatchId: batchId, date, time, liveId, brand, content});
    count++;
  });
  if(position==='bottom') live.schedule.push(...imported);
  else live.schedule.unshift(...imported);
  return count;
}
function importFulfillmentItemsFromRows(rows, position, batchId){
  const f = ensureFulfillment();
  const imported = [];
  let count = 0;
  rows.forEach(row=>{
    const brand = normalizeFulfillmentBrand(excelRowVal(row,'브랜드'));
    const itemCode = excelRowVal(row,'품목코드');
    const itemBarcode = excelRowVal(row,'품목바코드') || excelRowVal(row,'바코드');
    const itemName = excelRowVal(row,'품목명');
    const packQty = excelRowVal(row,'입수량').replace(/[^\d.\-]/g,'');
    if(!brand && !itemCode && !itemBarcode && !itemName) return;
    // 엑셀에 있는 브랜드가 아직 배송사·브랜드 목록에 없으면 배송사는 비운 채로 자동 등록해둔다
    if(brand && !f.brandCarriers.some(bc=>bc.brand===brand)){
      f.brandCarriers.push({id:uid(), brand, carrier:''});
    }
    const useRaw = String(excelRowVal(row,'사용')||'').trim().toUpperCase();
    imported.push({id:uid(), importBatchId: batchId, brand, itemCode, itemBarcode, itemName, packQty,
      pltBoxQty: String(excelRowVal(row,'PLT당 박스수')||'').replace(/[^\d.\-]/g,''), clCode: excelRowVal(row,'CL 코드')||'',
      active: !['FALSE','0','N','X'].includes(useRaw)});
    count++;
  });
  if(position==='bottom') f.items.push(...imported);
  else f.items.unshift(...imported);
  return count;
}
/* 가져오기 이력 — 잘못 가져온 경우 한 번에 되돌릴 수 있도록 배치 단위로 기록해둔다 */
const EXCEL_TARGET_LABELS = {
  proposals:'제안리스트', selections:'선정리스트', checklist:'셋팅 체크리스트',
  liveSchedule:'라이브 일정', fulfillmentItems:'풀필먼트 품목 데이터',
};
function ensureImportBatches(){
  if(!Array.isArray(state.importBatches)) state.importBatches = [];
  return state.importBatches;
}
function undoImportBatch(batchId){
  const batches = ensureImportBatches();
  const batch = batches.find(b=>b.id===batchId);
  if(!batch) return;
  if(!confirm(`"${EXCEL_TARGET_LABELS[batch.target]||batch.target}"에 가져왔던 ${batch.count}개 항목을 전부 삭제할까요?`)) return;
  if(batch.target==='proposals'){ const p=ensurePromotion(); p.proposals.filter(x=>x.importBatchId===batchId).forEach(x=>recordDeleted('proposals', x.id)); p.proposals = p.proposals.filter(x=>x.importBatchId!==batchId); }
  else if(batch.target==='selections'){ const p=ensurePromotion(); p.selections.filter(x=>x.importBatchId===batchId).forEach(x=>recordDeleted('selections', x.id)); p.selections = p.selections.filter(x=>x.importBatchId!==batchId); }
  else if(batch.target==='checklist'){ const p=ensurePromotion(); p.checklist.filter(x=>x.importBatchId===batchId).forEach(x=>recordDeleted('checklist', x.id)); p.checklist = p.checklist.filter(x=>x.importBatchId!==batchId); }
  else if(batch.target==='liveSchedule'){ const l=ensureLive(); l.schedule.filter(x=>x.importBatchId===batchId).forEach(x=>recordDeleted('liveSchedule', x.id)); l.schedule = l.schedule.filter(x=>x.importBatchId!==batchId); }
  else if(batch.target==='fulfillmentItems'){ const f=ensureFulfillment(); f.items.filter(x=>x.importBatchId===batchId).forEach(x=>recordDeleted('fulfillmentItems', x.id)); f.items = f.items.filter(x=>x.importBatchId!==batchId); }
  state.importBatches = batches.filter(b=>b.id!==batchId);
  saveState(); render();
}
function formatBatchTime(iso){
  try{ const d=new Date(iso); return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
  catch(e){ return ''; }
}
async function runExcelImport(){
  const fileInput = document.getElementById('excelImportFile');
  const target = document.getElementById('excelImportTarget').value;
  const position = document.getElementById('excelImportPosition').value; // 'top' | 'bottom'
  const resultEl = document.getElementById('excelImportResult');
  const file = fileInput && fileInput.files[0];
  if(!file){
    resultEl.innerHTML = '<div class="helptext" style="color:var(--negative);margin-top:8px">엑셀 파일을 선택해주세요.</div>';
    return;
  }
  if(typeof XLSX === 'undefined'){
    resultEl.innerHTML = '<div class="helptext" style="color:var(--negative);margin-top:8px">엑셀 처리 기능을 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침 후 다시 시도해주세요.</div>';
    return;
  }
  resultEl.innerHTML = '<div class="helptext" style="margin-top:8px">가져오는 중...</div>';
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array', cellDates:false});
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, {defval:''});
    const batchId = uid();
    let count = 0;
    if(target==='proposals') count = importProposalsFromRows(rows, position, batchId);
    else if(target==='selections') count = importSelectionsFromRows(rows, position, batchId);
    else if(target==='checklist') count = importChecklistFromRows(rows, position, batchId);
    else if(target==='liveSchedule') count = importLiveScheduleFromRows(rows, position, batchId);
    else if(target==='fulfillmentItems') count = importFulfillmentItemsFromRows(rows, position, batchId);
    if(count>0){
      const batches = ensureImportBatches();
      batches.unshift({id:batchId, target, count, importedAt:new Date().toISOString()});
      while(batches.length>20) batches.pop();
    }
    saveState();
    if(count===0){
      alert('엑셀에서 인식할 수 있는 행을 찾지 못했어요. 1행(제목 행)의 열 이름이 안내된 이름과 같은지 확인해주세요.');
    } else {
      alert(`${count}개 행을 가져왔어요! 해당 시트로 이동해서 확인해보세요.\n(잘못 가져왔다면 이 화면 아래 "최근 가져오기 이력"에서 한 번에 되돌릴 수 있어요)`);
    }
    render();
  }catch(e){
    console.error(e);
    resultEl.innerHTML = '<div class="helptext" style="color:var(--negative);margin-top:8px">가져오기 실패: ' + e.message + '</div>';
  }
}

/* ---- 제목행(헤더) 필터 — 구글 스프레드시트처럼, 열 머리글의 ▾ 버튼을 누르면 그 열에 어떤
   값들이 있는지 체크박스로 보여주고, 체크 해제한 값이 있는 행은 화면에서 숨긴다. ---- */
let colFilterPopoverOpen = null; // {table, col}
function ensureColumnFilters(table){
  const promo = ensurePromotion();
  if(!promo.columnFilters || typeof promo.columnFilters!=='object') promo.columnFilters = {};
  if(!promo.columnFilters[table] || typeof promo.columnFilters[table]!=='object') promo.columnFilters[table] = {};
  return promo.columnFilters[table];
}
function isColValueVisible(table, col, value){
  const excluded = ensureColumnFilters(table)[col];
  if(!excluded) return true;
  return !excluded.includes(value);
}
/* 그 열에 지금 필터가 걸려있는지(체크박스든 텍스트검색이든) 한 번에 판단 — 헤더 색상 표시용 */
function isColFilterActive(table, col){
  const f = ensureColumnFilters(table)[col];
  if(Array.isArray(f) && f.length>0) return true;
  return !!getColTextFilter(table, col);
}
function isBrandColFilterActive(filterKey, allBrands){
  return allBrands.some(b=>!isBrandVisibleIn(filterKey, b));
}
function toggleColFilterPopover(table, col, evt){
  if(evt) evt.stopPropagation();
  colFilterPopoverOpen = (colFilterPopoverOpen && colFilterPopoverOpen.table===table && colFilterPopoverOpen.col===col) ? null : {table, col};
  render();
}
function closeColFilterPopover(){
  if(colFilterPopoverOpen){ colFilterPopoverOpen = null; render(); }
}
function toggleColFilterValue(table, col, value){
  const filters = ensureColumnFilters(table);
  if(!filters[col]) filters[col] = [];
  const idx = filters[col].indexOf(value);
  if(idx>=0) filters[col].splice(idx,1); else filters[col].push(value);
  if(filters[col].length===0) delete filters[col];
  saveState(); render();
}
function excludeAllColFilter(table, col, values){
  const filters = ensureColumnFilters(table);
  filters[col] = values.slice();
  saveState(); render();
}
function clearColFilter(table, col){
  const filters = ensureColumnFilters(table);
  if(filters[col]){ delete filters[col]; saveState(); render(); }
}
/* 브랜드 열은 이미 표 위에 있는 "브랜드 필터" 체크박스 바(같은 filterKey)와 상태를 공유한다 —

function renderColFilterHeader(table, col, label, values){
