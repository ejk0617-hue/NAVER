<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>네이버 업무</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&family=Roboto+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F7F3;
    --sidebar-bg:#FFFFFF;
    --sidebar-text:#66766A;
    --sidebar-text-active:#1B2620;
    --card-bg:#FFFFFF;
    --border:#E7EDE6;
    --text-primary:#20261F;
    --text-secondary:#7C8A7B;
    --accent:#03C75A;
    --accent2:#2EC4B6;
    --positive:#03C75A;
    --negative:#FF5C6F;
    --warning:#FFB627;

    --c-shogeom:#8B5CF6;
    --c-gfa:#B15CFF;
    --c-seosea:#2EC4B6;
    --c-brgeom:#FFB627;
    --c-bizwallet:#FF5C8A;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text-primary);}
  .mono{font-family:'Roboto Mono',monospace;font-variant-numeric:tabular-nums;}
  #app{display:flex;min-height:100vh;}
  /* 숫자 입력칸의 증가/감소 화살표(스피너) 전체 제거 — 수기 입력만 사용 */
  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
  input[type=number]{-moz-appearance:textfield;appearance:textfield;}

  /* ---------- Sidebar ---------- */
  #sidebar{
    width:204px;flex-shrink:0;background:rgba(255,255,255,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:var(--sidebar-text);
    display:flex;flex-direction:column;padding:20px 0;position:sticky;top:0;height:100vh;overflow-y:auto;
    border-right:1px solid var(--border);
  }
  .brand-title{padding:0 20px 18px 20px;border-bottom:1px solid var(--border);margin-bottom:10px;display:flex;align-items:center;gap:9px;}
  .brand-logo{width:26px;height:26px;flex-shrink:0;border-radius:7px;background:#03C75A;display:flex;align-items:center;justify-content:center;}
  .brand-title-text{min-width:0;}
  .brand-title .t1{font-size:11px;letter-spacing:.14em;color:var(--accent);text-transform:uppercase;font-weight:700;}
  .brand-title .t2{font-size:17px;font-weight:800;color:var(--text-primary);}
  nav{flex:1;padding:6px 10px;}
  .nav-item{
    display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:13px;cursor:pointer;
    font-size:14.5px;font-weight:500;color:var(--sidebar-text);margin-bottom:2px;transition:background .12s,color .12s;
    user-select:none;
  }
  .nav-item:hover{background:#F1F5F1;color:var(--text-primary);}
  .nav-item.active{background:#E4F8EC;color:var(--sidebar-text-active);font-weight:700;box-shadow:inset 3px 0 0 var(--accent);}
  .nav-item.dragging{opacity:.35;}
  .nav-item.drag-over{outline:2px dashed var(--accent);outline-offset:-2px;}
  .nav-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .drag-handle{cursor:grab;color:#B7C2B9;font-size:12px;flex-shrink:0;}
  .drag-handle:active{cursor:grabbing;}
  .nav-group{margin-bottom:2px;}
  .nav-group-header{cursor:pointer;}
  .nav-group-header.active-parent{color:var(--text-primary);font-weight:700;}
  .nav-chevron{background:#F1F5F1;border:none;color:#8A9A8C;font-size:15px;cursor:pointer;padding:4px 9px;margin-left:2px;flex-shrink:0;border-radius:6px;line-height:1;}
  .nav-chevron:hover{background:#E4F8EC;color:var(--accent);}
  .nav-children{padding-left:13px;margin-left:15px;border-left:1px solid var(--border);margin-top:2px;margin-bottom:6px;}
  .nav-child{font-size:13.5px;padding:9px 10px;}
  .nav-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .nav-item.active .nav-dot{box-shadow:0 0 0 3px rgba(3,199,90,.16);}
  .sidebar-footer{padding:14px 18px 4px 18px;border-top:1px solid var(--border);margin-top:8px;}
  .sidebar-footer button{
    width:100%;background:#F1F5F1;color:#5B6B5D;border:1px solid var(--border);
    padding:9px 10px;border-radius:7px;font-size:12.5px;cursor:pointer;margin-top:6px;font-family:inherit;
  }
  .sidebar-footer button:hover{background:#E4F8EC;color:var(--text-primary);}
  #undoBtn{background:var(--accent)!important;color:#fff!important;border-color:var(--accent)!important;font-weight:700;margin-top:0!important;}
  #forceSaveBtn{background:#2F6FED!important;color:#fff!important;border-color:#2F6FED!important;font-weight:700;margin-top:6px!important;}
  #forceSaveBtn:hover{background:#255ACB!important;}
  #forceSaveToast{position:fixed;top:22px;left:50%;transform:translateX(-50%) translateY(-14px);background:#20261F;color:#fff;padding:11px 22px;border-radius:10px;font-size:13.5px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:999;opacity:0;pointer-events:none;transition:opacity .18s, transform .18s;}
  #chartTooltip{position:fixed;display:none;background:#20261F;color:#fff;padding:6px 10px;border-radius:7px;font-size:12px;font-weight:700;white-space:nowrap;pointer-events:none;z-index:998;box-shadow:0 4px 14px rgba(0,0,0,.2);}
  .live-perf-table-wrap{overflow-x:auto;}
  .live-perf-table{width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap;}
  .live-perf-table th{background:#F7F5FF;color:#6B3FB8;font-weight:700;padding:8px 10px;text-align:left;position:sticky;top:0;}
  .live-perf-table td{padding:7px 10px;border-bottom:1px solid var(--border);}
  .live-perf-table tr:nth-child(even) td{background:#FBFAFF;}
  .live-perf-table input{width:88px;border:1px solid var(--border);border-radius:6px;padding:4px 6px;font-size:11.5px;font-family:inherit;}
  .live-perf-table input.price-input{width:76px;text-align:right;font-family:'Roboto Mono',monospace;}
  .live-perf-prod-cell{display:flex;gap:4px;align-items:center;}
  #forceSaveToast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  #undoBtn:hover{background:#02A64C!important;}
  .sync-badge{font-size:11px;color:var(--text-secondary);padding:6px 2px;line-height:1.5;}
  #importFile{display:none;}

  /* ---------- Main ---------- */
  #main{flex:1;padding:28px 20px 60px 20px;max-width:2000px;}
  .page-layout{display:flex;gap:24px;align-items:flex-start;}
  .page-main{flex:1;min-width:0;}
  .page-side{
    width:216px;flex-shrink:0;background:#fff;border:1px solid var(--border);border-radius:12px;
    padding:14px;position:sticky;top:32px;max-height:calc(100vh - 64px);overflow-y:auto;
  }
  .page-side h3{font-size:11px;font-weight:700;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.05em;margin:0 0 10px 2px;}
  .side-item{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:8px;cursor:pointer;font-size:13.5px;margin-bottom:2px;transition:background .12s;}
  .side-item:hover{background:#F4F5F8;}
  .side-item.active{background:#EFEDFF;font-weight:700;color:var(--accent);}
  .side-item input[type=checkbox]{width:15px;height:15px;accent-color:var(--accent);cursor:pointer;flex-shrink:0;margin:0;}
  .side-item .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .side-item-row{display:flex;align-items:center;gap:2px;}
  .side-item-row:hover .side-item-del{opacity:1;}
  .side-item-del{opacity:0;flex-shrink:0;background:none;border:none;color:var(--text-secondary);cursor:pointer;font-size:11px;padding:6px 5px;border-radius:6px;transition:opacity .12s;}
  .side-item-del:hover{background:#FFEBEE;color:var(--negative);}
  .low-balance-strip{display:flex;align-items:center;flex-wrap:wrap;gap:6px;background:#FDF1DC;border:1px solid #F0D9A8;border-radius:10px;padding:8px 10px;margin-bottom:16px;}
  .low-balance-label{font-size:11.5px;font-weight:800;color:#9A6B0A;flex-shrink:0;}
  .low-balance-chip{display:flex;align-items:center;gap:5px;background:#fff;border:1px solid #F0D9A8;border-radius:20px;padding:4px 10px;font-size:11.5px;font-weight:700;color:#7A5308;cursor:pointer;font-family:inherit;}
  .low-balance-chip:hover{background:#FFF7E8;}
  .low-balance-chip .mono{font-weight:800;}
  .goal-row{padding:12px 0;border-bottom:1px solid var(--border);}
  .goal-row:last-child{border-bottom:none;padding-bottom:0;}
  .goal-row:first-child{padding-top:4px;}
  .goal-row-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;}
  .goal-store{font-size:13.5px;font-weight:700;}
  .goal-target-input{display:flex;align-items:center;gap:6px;}
  .goal-target-input label{font-size:11px;color:var(--text-secondary);font-weight:700;flex-shrink:0;}
  .goal-bar-track{background:#EEF0F3;border-radius:20px;height:10px;overflow:hidden;}
  .goal-bar-fill{background:linear-gradient(90deg,#8B5CF6,#B49BFA);height:100%;border-radius:20px;transition:width .2s;}
  .goal-bar-fill.over{background:linear-gradient(90deg,#12805C,#22A67A);}
  .goal-row-foot{display:flex;align-items:center;justify-content:space-between;margin-top:6px;font-size:12px;color:var(--text-secondary);}

  /* ---------- 스마트스토어 매출 대시보드 ---------- */
  .ss-filter-box{background:#fff;border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:16px;display:flex;flex-direction:column;gap:6px;}
  .ss-filter-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;}
  .ss-filter-label{font-size:11px;font-weight:800;color:#8B5CF6;flex-shrink:0;min-width:78px;}
  .ss-filter-row:last-of-type .ss-filter-label{color:var(--text-secondary);}
  .ss-filter-chip{display:flex;align-items:center;gap:5px;cursor:pointer;font-size:12px;}
  .ss-filter-chip input{width:13px;height:13px;accent-color:var(--accent);cursor:pointer;margin:0;}
  .ss-filter-actions{display:flex;justify-content:flex-end;gap:6px;margin-top:2px;}

  .ss-row2col{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;align-items:start;}
  @media (max-width:900px){ .ss-row2col{grid-template-columns:1fr;} }
  .ss-compact-card{padding:16px 18px;}

  .ss-cal-nav{padding:4px 8px;font-size:11px;}
  .ss-mini-cal .promo-cal-table{font-size:12.5px;}
  .ss-mini-cal .promo-cal-cell{height:80px;padding:5px;}
  .ss-mini-cal .promo-cal-daynum{font-size:12px;margin-bottom:3px;}
  .ss-mini-cal .promo-cal-chip{font-size:10.5px;padding:2px 4px;gap:2px;}
  .ss-mini-cal th{padding:7px;font-size:11.5px;}

  .ss-notepad{width:100%;min-height:200px;border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:13px;font-family:inherit;resize:vertical;color:var(--text-primary);line-height:1.6;}
  .ss-notepad:focus{outline:none;border-color:var(--accent);}

  .ss-gauge-list{display:flex;flex-direction:column;gap:10px;}
  .ss-gauge-row{display:grid;grid-template-columns:44px 1fr 44px auto;align-items:center;gap:10px;}
  .ss-gauge-label{font-size:12.5px;font-weight:800;color:#8B5CF6;}
  .ss-gauge-track{background:#EEF0F3;border-radius:20px;height:14px;overflow:hidden;}
  .ss-gauge-fill{background:linear-gradient(90deg,#8B5CF6,#B49BFA);height:100%;border-radius:20px;transition:width .2s;}
  .ss-gauge-fill.over{background:linear-gradient(90deg,#12805C,#22A67A);}
  .ss-gauge-pct{font-size:13px;font-weight:800;text-align:right;}
  .ss-gauge-detail{font-size:11px;color:var(--text-secondary);white-space:nowrap;}

  .ss-input-cal-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;}
  .ss-input-cal-card{border:1px solid var(--border);border-radius:10px;padding:12px;}
  .ss-input-cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .ss-input-cal-store{font-size:13px;font-weight:800;}
  .ss-input-cal-total{font-size:12px;color:#8B5CF6;font-weight:700;}
  .ss-input-cal-table{width:100%;border-collapse:collapse;table-layout:fixed;}
  .ss-input-cal-table th{font-size:9.5px;padding:3px 0;color:var(--text-secondary);font-weight:700;text-align:center;}
  .ss-input-cal-table th.sun{color:var(--negative);} .ss-input-cal-table th.sat{color:var(--accent);}
  .ss-input-cal-cell{padding:1.5px;vertical-align:top;}
  .ss-input-cal-cell.empty-cell{background:transparent;}
  .ss-input-cal-cell.is-today .ss-input-cal-daynum{color:var(--accent);}
  .ss-input-cal-daynum{font-size:9.5px;color:var(--text-secondary);text-align:center;margin-bottom:1px;}
  .ss-input-cal-daynum.sun{color:var(--negative);} .ss-input-cal-daynum.sat{color:var(--accent);}
  .ss-input-cal-input{width:100%;min-width:0;border:1px solid var(--border);border-radius:4px;background:#FAFBFC;padding:3px 2px;font-size:9.5px;text-align:center;font-family:'Roboto Mono',monospace;}
  .ss-input-cal-order-input{width:100%;min-width:0;border:1px solid transparent;border-radius:4px;background:transparent;padding:1px 2px;font-size:8px;text-align:center;font-family:'Roboto Mono',monospace;color:var(--text-secondary);margin-top:1px;}
  .ss-input-cal-order-input:focus{border-color:var(--border);background:#FAFBFC;outline:none;}
  .ss-input-cal-order-input:not(:placeholder-shown){color:#8B5CF6;}
  .ss-input-cal-input:focus{outline:none;border-color:var(--accent);background:#fff;}
  .ss-input-cal-target{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;padding-top:8px;border-top:1px dashed var(--border);}
  .ss-input-cal-target label{font-size:11px;color:var(--text-secondary);font-weight:700;}
  .ss-input-cal-target input{width:110px;padding:5px 7px !important;font-size:12px !important;}

  .ss-checklist{display:flex;flex-direction:column;gap:2px;max-height:260px;overflow-y:auto;}
  .ss-checklist-item{display:flex;align-items:center;gap:8px;padding:5px 4px;border-radius:6px;}
  .ss-checklist-item:hover{background:var(--bg);}
  .ss-checklist-item input[type=checkbox]{width:15px;height:15px;accent-color:#8B5CF6;cursor:pointer;flex-shrink:0;}
  .ss-checklist-text{flex:1;min-width:0;border:1px solid transparent;background:transparent;padding:5px 6px;border-radius:6px;font-size:13px;font-family:inherit;}
  .ss-checklist-text:hover, .ss-checklist-text:focus{border-color:var(--border);background:#fff;}
  .ss-checklist-text:focus{outline:none;}
  .ss-checklist-text.done{text-decoration:line-through;color:var(--text-secondary);}
  .ss-checklist-item .btn-del{opacity:0;flex-shrink:0;}
  .ss-checklist-item:hover .btn-del{opacity:1;}
  .ss-checklist-blank .btn-del{visibility:hidden;}

  .ss-row2col-narrow{grid-template-columns:400px 1fr;}
  @media (max-width:1000px){ .ss-row2col-narrow{grid-template-columns:1fr;} }
  .ss-row2col-cal-first{grid-template-columns:1.3fr 1fr;}
  @media (max-width:900px){ .ss-row2col-cal-first{grid-template-columns:1fr;} }
  .ss-goal-target-line{font-size:12.5px;color:var(--text-secondary);margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--border);}
  .ss-daily-trend-wrap{margin-top:14px;padding-top:12px;border-top:1px solid var(--border);}
  .ss-daily-trend-title{font-size:11.5px;font-weight:800;color:var(--text-primary);margin-bottom:6px;}
  .ss-trend-mode-tabs{display:inline-flex;gap:2px;background:#EEEAF5;border-radius:8px;padding:2px;margin-bottom:8px;}
  .ss-trend-mode-tab{border:none;background:transparent;padding:4px 10px;border-radius:6px;font-size:10.5px;font-weight:700;color:var(--text-secondary);cursor:pointer;font-family:inherit;}
  .ss-trend-mode-tab.active{background:#fff;color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.08);}
  .ss-daily-trend-svg{width:100%;height:auto;display:block;overflow:visible;}
  .ss-goal-target-line b{color:#8B5CF6;font-size:14px;margin:0 4px;white-space:nowrap;}
  .ss-goal-target-sub{font-size:11px;}
  .ss-gauge-detail{font-size:11px;color:var(--text-secondary);white-space:nowrap;overflow:visible;}
  .ss-input-cal-grid-narrow{grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;}
  .ss-input-cal-grid-narrow .ss-input-cal-card{padding:10px;}
  .ss-input-cal-grid-narrow .ss-input-cal-store{font-size:13px;}
  .ss-input-cal-grid-narrow .ss-input-cal-total{font-size:12px;}
  .ss-input-cal-grid-narrow .ss-input-cal-input{font-size:12.5px;padding:5px 2px;}
  .ss-input-cal-grid-narrow .ss-input-cal-order-input{font-size:10px;}
  .ss-input-cal-grid-narrow .ss-input-cal-daynum{font-size:11px;}
  .ss-input-cal-grid-narrow .ss-input-cal-table th{font-size:10.5px;padding:4px 0;}
  .ss-input-cal-grid-narrow .ss-input-cal-cell{padding:2px;}
  .ss-input-cal-grid-narrow .ss-input-cal-target label{font-size:11px;}
  .ss-input-cal-grid-narrow .ss-input-cal-target input{width:90px;padding:5px 6px !important;font-size:12px !important;}

  .ss-store-notes-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px;}
  .ss-store-notes-card{border:1px solid var(--border);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;}
  .ss-store-notes-head{font-size:12.5px;font-weight:800;color:#8B5CF6;padding-bottom:6px;border-bottom:1px solid var(--border);}
  .ss-store-notes-body{display:flex;gap:10px;align-items:stretch;}
  .ss-store-notes-body .ss-checklist{flex:1;min-width:0;max-height:150px;}
  .ss-store-notes-body .ss-notepad-compact{flex:1;min-width:0;}
  .ss-notepad-compact{min-height:150px;font-size:12px;}

  .ss-event-sales-table{width:100%;border-collapse:collapse;}
  .ss-event-sales-table th{font-size:10.5px;text-align:left;color:var(--text-secondary);padding:5px 3px;border-bottom:1px solid var(--border);}
  .ss-event-sales-table th.num{text-align:right;}
  .ss-event-sales-table td{padding:3px;}
  .ss-event-sales-table td.num{text-align:right;}
  .ss-event-sales-table input{font-size:11.5px !important;padding:4px 6px !important;}

  .ss-manual-event-form{margin-top:12px;padding-top:12px;border-top:1px solid var(--border);}
  .ss-manual-event-add{display:grid;grid-template-columns:1fr .8fr .8fr 1.2fr auto;gap:6px;}
  @media (max-width:820px){ .ss-manual-event-add{grid-template-columns:1fr 1fr; } }
  .ss-manual-event-add select, .ss-manual-event-add input{font-size:12px !important;padding:6px 8px !important;}
  .ss-manual-event-add .btn{padding:6px 12px;font-size:12px;white-space:nowrap;}
  .ss-manual-event-list{display:flex;flex-direction:column;gap:2px;margin-top:10px;max-height:140px;overflow-y:auto;}
  .ss-manual-event-row{display:flex;align-items:center;gap:10px;padding:5px 4px;border-radius:6px;font-size:12px;}
  .ss-manual-event-row:hover{background:var(--bg);}
  .ss-manual-event-row .mono{color:var(--text-secondary);flex-shrink:0;}
  .ss-manual-event-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ss-manual-event-row .btn-del{opacity:0;flex-shrink:0;}
  .ss-manual-event-row:hover .btn-del{opacity:1;}

  /* ---------- 주간미팅 비교표 ---------- */
  .wm-table{border-collapse:collapse;width:100%;min-width:640px;}
  .wm-table th{font-size:12px;font-weight:800;color:var(--text-secondary);padding:8px 10px;border-bottom:2px solid var(--border);text-align:center;white-space:nowrap;}
  .wm-table td{padding:4px 6px;border-bottom:1px solid var(--border);}
  .wm-metric-col{font-size:12.5px;font-weight:700;white-space:nowrap;text-align:left !important;color:var(--text-primary);}
  .wm-unit{font-weight:400;color:var(--text-secondary);font-size:11px;}
  .wm-cell-row{display:flex;align-items:center;gap:6px;justify-content:flex-end;}
  .wm-input{width:84px;flex-shrink:0;text-align:right;font-size:14.5px !important;font-weight:700;padding:6px 8px !important;}
  .wm-input-readonly{background:#F5F1FC;border-color:#E4D9F7 !important;color:#6B3FB8;}
  .wm-auto-badge{display:inline-block;background:#8B5CF622;color:#8B5CF6;font-size:9.5px;font-weight:800;padding:1px 6px;border-radius:8px;margin-left:2px;}
  .wm-delta{font-size:12px;font-weight:800;white-space:nowrap;flex-shrink:0;min-width:38px;}
  .wm-delta.up{color:#D64545;}
  .wm-delta.down{color:#2F6FED;}

/* 좌측 메뉴 구조: 대카테고리(그룹) + 중카테고리(하위 메뉴). type:'single'은 그룹 없이 단독 메뉴 */

    {sectionKey:'live_schedule', label:'라이브 일정', color:'#FF6B9D'},
    {sectionKey:'live_performance', label:'라이브 현황', color:'#7C4DFF'},
  ]},
  {key:'smartstore', type:'group', label:'스마트스토어', color:'#8B5CF6', children:[
    {sectionKey:'smartstore_sales', label:'매출 대시보드', color:'#8B5CF6'},
    {sectionKey:'weekly_meeting',   label:'주간미팅',     color:'#0EA5A5'},
    {sectionKey:'smartstore_calc',  label:'매출계산기',   color:'#F0932B'},
  ]},
];

/* 예전엔 이 5개(쇼검 계정, GFA/스스광고/브검/비즈월렛 브랜드)가 코드에 고정된 값이었는데,
   이제 state에 넣어서 화면에서 자유롭게 추가/삭제할 수 있게 바꿨다. 처음 쓰는 사람은 예전과
   똑같은 기본 목록으로 시작하고(아래 기본값), 그 다음부터는 각자 화면에서 바꾼 대로 저장된다. */
const AD_BRAND_LISTS_DEFAULT = {
  shogeom: [
    {id:'best3327', biz:'서정', brands:'VSL3, 갸스비, 리플클래식, 로버츠베리에'},
    {id:'yocyoc',   biz:'인트리', brands:'에델코첸, 하늘비행, 자이스, 그란츠'},
    {id:'yocyocwb', biz:'웰빙', brands:'리틀타익스, 클레보스, 마조렛'},
  ],
  gfa: [
    {id:'VSL', account:'서정커머스_VSL3'},
    {id:'갸스비', account:'서정커머스_갸스비'},
    {id:'로버츠베리에', account:'theheiress:naver'},
    {id:'오스템/자이스', account:'인트리_오스템와픽, 자이스'},
    {id:'리틀타익스', account:'웰빙프라자_리틀타익스'},
    {id:'클레보스', account:'웰빙프라자_클레보스'},
  ],
  seosea: ['VSL3','갸스비','리플클래식','자이스','오스템와픽','하늘비행','드롬팔스','원더비','그란츠','라움','덴탈프로','후','코어루틴','로버츠베리에','로트벡쉔','게이트맨'],
  brgeom: [
    {id:'VSL3', note:'best3327 (SY)'},
    {id:'로버츠베리에', note:'best3327 (서정)'},
    {id:'로트벡쉔', note:'업체요청'},
  ],
  bizwallet: ['VSL3','코어루틴','갸스비','게이트맨','그란츠','네이쳐스패밀리','뉴트리바이탈','덴탈프로','드롬팔스','라움365','로버츠베리에','로트벡쉔','리틀타익스','리플클래식','마조렛','아사아블로이','원더비','자이스','클레보스','하늘비행','후'],
};
function ensureAdBrandLists(){
  if(!state.adBrandLists || typeof state.adBrandLists!=='object'){
    state.adBrandLists = JSON.parse(JSON.stringify(AD_BRAND_LISTS_DEFAULT));
  }
  Object.keys(AD_BRAND_LISTS_DEFAULT).forEach(k=>{
    if(!Array.isArray(state.adBrandLists[k])) state.adBrandLists[k] = [];
  });
  if(!state.adBrandLists.migEdel1){ // 요청으로 GFA·스스광고·비즈월렛에서 에델코첸 삭제 (한 번만)
    const al = state.adBrandLists;
    al.gfa = al.gfa.filter(x=>x.id!=='에델코첸');
    al.seosea = al.seosea.filter(x=>x!=='에델코첸');
    al.bizwallet = al.bizwallet.filter(x=>x!=='에델코첸');
    al.migEdel1 = true;
  }
  return state.adBrandLists;
}
function shogeomAccounts(){ return ensureAdBrandLists().shogeom; }
function gfaBrandsList(){ return ensureAdBrandLists().gfa; }
function seoseaBrandsList(){ return ensureAdBrandLists().seosea; }
function brgeomBrandsList(){ return ensureAdBrandLists().brgeom; }

/* 광고 탭(쇼검/GFA/스스광고/브검/비즈월렛)의 계정·브랜드를 직접 추가/삭제할 때 쓴다.
   목록마다 생김새가 조금씩 달라서(문자열만 있는 것 vs id+부가정보가 있는 것), 종류별로 물어보는 내용이 다르다. */
const AD_BRAND_LIST_META = {
  shogeom: {plain:false, promptLabel:'계정 ID (예: best3327)', extra:[{key:'biz', label:'사업자명'}, {key:'brands', label:'브랜드 목록(쉼표로 구분, 표시용)'}]},
  gfa: {plain:false, promptLabel:'브랜드명', extra:[{key:'account', label:'계정명'}]},
  seosea: {plain:true, promptLabel:'브랜드명'},
  brgeom: {plain:false, promptLabel:'브랜드명', extra:[{key:'note', label:'메모(예: 계정 정보)'}]},
  bizwallet: {plain:true, promptLabel:'브랜드명'},
};
function addAdBrand(sectionKey){
  const meta = AD_BRAND_LIST_META[sectionKey];
  const list = ensureAdBrandLists()[sectionKey];
  const idInput = window.prompt(`추가할 ${meta.promptLabel}을(를) 입력해주세요.`);
  if(!idInput) return;
  const id = idInput.trim();
  if(!id) return;
  const existsAlready = list.some(item => (meta.plain ? item : item.id) === id);
  if(existsAlready){ alert('이미 있는 항목이에요.'); return; }
  if(meta.plain){
    list.push(id);
  } else {
    const entry = {id};
    (meta.extra||[]).forEach(f=>{
      entry[f.key] = window.prompt(f.label + ' (비워두려면 그냥 확인)') || '';
    });
    list.push(entry);
  }
  saveState(); render();
}
function deleteAdBrand(sectionKey, id){
  const meta = AD_BRAND_LIST_META[sectionKey];
  const brandData = ensureAdBrandLists();
  const list = brandData[sectionKey];
  if(list.length<=1){ alert('최소 1개는 남아있어야 해요.'); return; }
  if(!confirm(`"${id}" 항목을 삭제할까요?\n(이미 등록된 충전 내역 등 다른 데이터는 지워지지 않아요)`)) return;
  brandData[sectionKey] = list.filter(item => (meta.plain ? item : item.id) !== id);
  // 지금 선택 중이던 항목이 삭제됐으면 첫 번째 항목으로 이동
  if(currentPick[sectionKey]===id){
    const first = brandData[sectionKey][0];
    currentPick[sectionKey] = first ? (meta.plain ? first : first.id) : '';
  }
  saveState(); render();
}

/* =========================================================================
   상태 관리 (localStorage)
   ========================================================================= */
const STORAGE_KEY = 'naver_ad_budget_v1';

function defaultState(){
  return {
    shogeom:   {charges:[], months:{}}, // months[accountId][m] = {budget, rolloverManual}
    gfa:       {charges:[], months:{}},
    seosea:    {charges:[], dailyBudget:{}},
    brgeom:    {cycles:[]},
    bizwallet: {charges:[], usages:[], initialBalance:{}},
    chargePlan: {today:'', nextDate:'', rows:{}}, // 충전 탭: 오늘/다음 충전일, 행별 현잔액·평균소진
    draftEntries: [], // 충전기안 탭에서 수기로 등록하는 계정/브랜드 목록 (광고종류, 계정, 사업자, 스토어, 계좌)
    navOrder: null, // 왼쪽 메뉴 순서 (null이면 기본 순서, 사용자가 바꾸면 배열로 저장됨)
    promotion: null, // 프로모션 카테고리 데이터 (null이면 최초 진입 시 ensurePromotion()에서 기본값 생성)
    live: null, // 라이브 카테고리 데이터 (null이면 최초 진입 시 ensureLive()에서 기본값 생성)
    colWidths: {}, // 제안리스트/선정리스트/셋팅 체크리스트의 사용자 지정 열 너비
  };
}

/* 안전장치: 이 브라우저에 저장된 데이터가 전혀 없는 상태(새 브라우저·시크릿 창·저장소 삭제 직후)로 시작했다면,
   서버 데이터를 한 번 받아오기 전까지는 절대 서버로 올리지 않고, 처음 받은 서버 데이터를 그대로 기준으로 삼는다.
   (빈 화면이 서버의 실제 데이터를 덮어쓰는 사고 방지) */
let freshLocalBoot = (function(){ try{ return !localStorage.getItem('naver_ad_budget_v1'); }catch(e){ return false; } })();
let state = loadState();
/* 브라우저에 저장된 내용이 있어도, 실제 업무 데이터가 하나도 없는 "빈 상태"라면(예: 빈 상태로 한 번 열렸다가 저장된 경우)
   서버 데이터보다 최신이라고 우기지 못하게, 처음 한 번은 서버 내용을 그대로 받아오도록 한다. */
(function(){
  try{
    const n = (v)=> Array.isArray(v) ? v.length : 0;
    const blank = !(
      n(state.gfa&&state.gfa.charges) || n(state.bizwallet&&state.bizwallet.charges) || n(state.seosea&&state.seosea.charges) ||
      n(state.shogeom&&state.shogeom.charges) || n(state.smartstore&&state.smartstore.daily) ||
      n(state.promotion&&state.promotion.selections) || n(state.promotion&&state.promotion.proposals) ||
      n(state.live&&state.live.schedule) || n(state.fulfillment&&state.fulfillment.items) || n(state.draftEntries)
    );
    if(blank) freshLocalBoot = true;
  }catch(e){}
})();
/* Firebase는 빈 배열([])을 저장하면 그 항목 자체를 통째로 없애버리는 특성이 있어서,
   나중에 다시 받아올 때 그 자리가 배열이 아니라 아예 없는 값(undefined)으로 와버리는 문제가 있다.
   그래서 어떤 경로로 상태가 갱신되든(로컬 로드, Firebase에서 받아온 직후) 한 번씩 이 함수로
   "배열이어야 할 자리에 배열이 없으면 빈 배열로 되돌려놓는다"를 해준다. 이미 있는 ensureXxx() 함수들은
   각자 담당 영역을 이미 이렇게 보정해주고 있어서, 여기서는 그 함수가 없는 나머지 영역만 직접 보정한다. */
function ensureAdSections(){
  if(!state.shogeom || typeof state.shogeom!=='object') state.shogeom = {charges:[], months:{}};
  if(!Array.isArray(state.shogeom.charges)) state.shogeom.charges = [];
  if(!state.shogeom.months || typeof state.shogeom.months!=='object') state.shogeom.months = {};

  if(!state.gfa || typeof state.gfa!=='object') state.gfa = {charges:[], months:{}};
  if(!Array.isArray(state.gfa.charges)) state.gfa.charges = [];
  if(!state.gfa.months || typeof state.gfa.months!=='object') state.gfa.months = {};

  if(!state.seosea || typeof state.seosea!=='object') state.seosea = {charges:[], dailyBudget:{}};
  if(!Array.isArray(state.seosea.charges)) state.seosea.charges = [];
  if(!state.seosea.dailyBudget || typeof state.seosea.dailyBudget!=='object') state.seosea.dailyBudget = {};

  if(!state.brgeom || typeof state.brgeom!=='object') state.brgeom = {cycles:[]};
  if(!Array.isArray(state.brgeom.cycles)) state.brgeom.cycles = [];

  if(!Array.isArray(state.draftEntries)) state.draftEntries = [];
  if(!state.chargePlan || typeof state.chargePlan!=='object') state.chargePlan = {today:'', nextDate:'', rows:{}};
  if(!state.chargePlan.rows || typeof state.chargePlan.rows!=='object') state.chargePlan.rows = {};
  if(!state.colWidths || typeof state.colWidths!=='object') state.colWidths = {};
}
function sanitizeStateArrays(){
  ensureAdSections();
  ensureAdBrandLists();
  ensurePromotion();
  ensureLive();
  ensureFulfillment();
  ensureBizwallet();
  ensureSmartstore();
  ensureWeeklyMeeting();
  ensureDraftEntries();
  ensureDeletedIds();
  if(state.promotion){
    ensureSortIndexes(state.promotion.proposals);
    ensureSortIndexes(state.promotion.selections);
    ensureSortIndexes(state.promotion.checklist);
  }
  if(state.live) ensureSortIndexes(state.live.schedule);
}
sanitizeStateArrays();
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    const d = defaultState();
    return Object.assign(d, parsed);
  }catch(e){
    console.error('상태 로드 실패', e);
    return defaultState();
  }
}
/* ---------- 되돌리기(Ctrl+Z) ----------
   saveState()가 호출될 때마다(=뭔가 하나 바뀔 때마다), "이번 변경이 일어나기 직전의 상태"를
   스택에 쌓아둔다. 되돌리기를 누르면 그 스택에서 하나 꺼내서 그 시점으로 되돌린다. */
const UNDO_STACK_MAX = 30;
let undoStack = [];
let previousStateSnapshot = (()=>{ try{ return JSON.stringify(state); }catch(e){ return null; } })(); // 마지막 saveState() 시점의 state 스냅샷(JSON 문자열)
let isUndoing = false;

function undoLastAction(){
  if(undoStack.length===0){
    flashUndoButton('되돌릴 작업이 없어요');
    return;
  }
  isUndoing = true;
  try{
    const prevSnap = undoStack.pop();
    state = JSON.parse(prevSnap);
    previousStateSnapshot = prevSnap;
    sanitizeStateArrays();
    saveState();
    render();
    flashUndoButton('되돌렸어요');
  }catch(e){
    console.error('되돌리기 실패:', e);
  }finally{
    isUndoing = false;
  }
}
function flashUndoButton(msg){
  const btn = document.getElementById('undoBtn');
  if(!btn) return;
  const original = btn.dataset.label || btn.textContent;
  btn.dataset.label = original;
  btn.textContent = '↩️ ' + msg;
  clearTimeout(flashUndoButton._t);
  flashUndoButton._t = setTimeout(()=>{ if(btn) btn.textContent = original; }, 1200);
}
document.addEventListener('keydown', (e)=>{
  const key = (e.key||'').toLowerCase();
  if((e.ctrlKey || e.metaKey) && key==='z' && !e.shiftKey){
    // 텍스트 입력칸에 포커스가 있을 땐 브라우저 기본 되돌리기(글자 입력 취소)를 그대로 두고 방해하지 않는다
    const tag = document.activeElement ? document.activeElement.tagName : '';
    const isEditable = tag==='INPUT' || tag==='TEXTAREA' || (document.activeElement && document.activeElement.isContentEditable);
    if(isEditable) return;
    e.preventDefault();
    undoLastAction();
  }
  if((e.ctrlKey || e.metaKey) && key==='s'){
    // Ctrl+S(브라우저의 "페이지 저장" 대화상자)는 항상 막고, 대신 지금 상태를 즉시 저장한다.
    // 텍스트 입력 중이어도 예외 없이 작동해야 안심할 수 있어서, 포커스 여부와 상관없이 항상 실행한다.
    e.preventDefault();
    forceSaveNow();
  }
});

function saveState(){
  if(!isUndoing && previousStateSnapshot!==null){
    undoStack.push(previousStateSnapshot);
    if(undoStack.length > UNDO_STACK_MAX) undoStack.shift();
  }
  state.__lastLocalEdit = Date.now(); // 로컬에서 마지막으로 수정한 시각 — 새로고침해도 localStorage에 그대로 남아있음
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }catch(e){
    console.error('저장 실패 (localStorage 사용 불가 환경일 수 있습니다):', e);
  }
  if(!isUndoing){
    try{ previousStateSnapshot = JSON.stringify(state); }catch(e){}
  }
  scheduleServerPush();
}
/* Ctrl+S(또는 사이드바 버튼)로 "지금 이 순간"을 확실하게 저장한다.
   평소엔 250ms 정도 기다렸다가 서버에 반영하는데(연타 방지), 이 강제저장은 그 대기 없이 즉시 반영하고,
   화면 한켠에 "저장됐어요" 표시를 잠깐 띄워서 눈으로 확인할 수 있게 한다. */
function forceSaveNow(){
  // 지금 뭔가 입력하던 칸이 있으면, 브라우저가 알아서 change를 발생시켜주길 기다리지 않고
  // 명시적으로 change 이벤트를 보내서 그 값이 확실하게 state에 반영되고 나서 저장한다
  const active = document.activeElement;
  if(active && (active.tagName==='INPUT' || active.tagName==='TEXTAREA' || active.tagName==='SELECT')){
    active.dispatchEvent(new Event('change', {bubbles:true}));
    active.blur();
  }
  state.__lastLocalEdit = Date.now();
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }catch(e){
    console.error('저장 실패 (localStorage 사용 불가 환경일 수 있습니다):', e);
  }
  clearTimeout(pushTimer);
  pushToServer();
  showSaveToast();
}
function showSaveToast(){
  let toast = document.getElementById('forceSaveToast');
  if(!toast){
    toast = document.createElement('div');
    toast.id = 'forceSaveToast';
    document.body.appendChild(toast);
  }
  toast.textContent = '💾 저장됐어요';
  toast.classList.remove('show'); void toast.offsetWidth; // 애니메이션 재시작을 위한 강제 리플로우
  toast.classList.add('show');
  clearTimeout(showSaveToast._t);
  showSaveToast._t = setTimeout(()=>{ toast.classList.remove('show'); }, 1600);
}

/* =========================================================================
   구글 Firebase 실시간 동기화 — 팀원과 같은 데이터를 공유하고 싶을 때 사용
   Firebase 콘솔에서 무료로 프로젝트를 만들고 설정을 붙여넣으면 자동으로 동기화됩니다.
   설정이 없으면 자동으로 "로컬 전용 모드"로 동작합니다.
   ========================================================================= */
const FIREBASE_CONFIG_KEY = 'naver_ad_firebase_config';
let syncStatus = {state:'idle', lastSync:null, message:''}; // idle|syncing|ok|offline|error
let pushTimer = null;
let firebaseApp = null;
let firebaseDb = null;
let firebaseListenerAttached = false;

function getFirebaseConfig(){
  try{
    const raw = localStorage.getItem(FIREBASE_CONFIG_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function setFirebaseConfig(configObj){
  try{ localStorage.setItem(FIREBASE_CONFIG_KEY, JSON.stringify(configObj)); }catch(e){}
}
function clearFirebaseConfig(){
  try{ localStorage.removeItem(FIREBASE_CONFIG_KEY); }catch(e){}
}
// 예전 코드 곳곳에서 "서버 연결이 설정되어 있는지"를 이 이름으로 확인하고 있어서, 뜻만 Firebase 설정 여부로 바꿔 그대로 둔다
function getAccessCode(){
  return getFirebaseConfig() ? '1' : '';
}
/* Firebase 콘솔의 "SDK 설정 및 구성"에서 복사한 코드(순수 JSON이 아니어도 됨)를 그대로 붙여넣을 수 있게,
   텍스트 안에서 { ... } 객체 부분만 찾아 안전하게 값으로 변환한다 */
function parseFirebaseConfigText(text){
  try{ return JSON.parse(text); }catch(e){}
  try{
    const match = text.match(/\{[\s\S]*\}/);
    if(!match) return null;
    const obj = new Function('return (' + match[0] + ');')();
    if(obj && typeof obj==='object' && obj.databaseURL) return obj;
    return null;
  }catch(e){ return null; }
}
function openAccessCodeDialog(){
  const current = getFirebaseConfig();
  const currentText = current ? JSON.stringify(current, null, 2) : '';
  const pasted = window.prompt(
    '구글 Firebase 설정을 붙여넣어주세요.\n' +
    '(Firebase 콘솔 → 프로젝트 설정 → 일반 탭 → "내 앱"의 SDK 설정 및 구성에서 나오는 코드를 그대로 복사해서 붙여넣으시면 돼요)\n\n' +
    '비워두고 확인을 누르면 로컬 전용 모드로 전환됩니다.',
    currentText
  );
  if(pasted===null) return; // 취소
  const trimmed = pasted.trim();
  if(!trimmed){
    clearFirebaseConfig();
    detachFirebaseListener();
    syncStatus = {state:'idle', lastSync:null, message:''};
    updateSyncBadge();
    alert('로컬 전용 모드로 전환했습니다.');
    return;
  }
  const parsed = parseFirebaseConfigText(trimmed);
  if(!parsed){
    alert('Firebase 설정을 인식하지 못했어요. Firebase 콘솔에서 복사한 구성 코드 전체를 그대로 붙여넣어주세요 (databaseURL 항목이 포함되어 있어야 해요).');
    return;
  }
  setFirebaseConfig(parsed);
  initFirebaseSync(true);
}
function initFirebaseSync(showAlert){
  const config = getFirebaseConfig();
  if(!config){ syncStatus = {state:'idle', lastSync:null, message:''}; updateSyncBadge(); return; }
  if(typeof firebase === 'undefined'){
    syncStatus = {state:'offline', lastSync:syncStatus.lastSync, message:'Firebase 라이브러리를 아직 불러오지 못했어요.'};
    updateSyncBadge();
    if(showAlert) alert('Firebase 라이브러리를 아직 불러오는 중이에요. 잠시 후 다시 시도해주세요 (인터넷 연결을 확인해주세요).');
    return;
  }
  try{
    firebaseApp = (firebase.apps && firebase.apps.length) ? firebase.apps[0] : firebase.initializeApp(config);
    firebaseDb = firebase.database();
    syncStatus.state = 'syncing'; updateSyncBadge();
    attachFirebaseListener();
  }catch(e){
    console.error('Firebase 초기화 실패:', e);
    syncStatus = {state:'error', lastSync:syncStatus.lastSync, message:e.message};
    updateSyncBadge();
    if(showAlert) alert('Firebase 연결에 실패했어요: ' + e.message + '\n\n붙여넣으신 설정이 정확한지 다시 확인해주세요.');
  }
}
function detachFirebaseListener(){
  try{ if(firebaseDb && firebaseListenerAttached) firebaseDb.ref('appData').off('value'); }catch(e){}
  firebaseListenerAttached = false;
  firebaseApp = null;
  firebaseDb = null;
}
let pendingLocalPush = false; // 방금 로컬에서 바뀐 게 있는데 아직 서버 저장이 안 끝난 상태인지
/* 항목(레코드) 하나를 고칠 때마다 "이 항목을 마지막으로 언제 고쳤는지"를 같이 기록해둔다.
   여러 명이 동시에 서로 다른 항목을 고쳐도, 나중에 서버와 합칠 때 항목 단위로 "누가 더 최근에 고쳤는지"
   비교해서 서로의 변경사항이 사라지지 않게 하기 위함 (전체를 통째로 덮어쓰지 않음). */
function touch(record){ if(record) record._ts = Date.now(); return record; }
/* 화면에 보여줄 순서를 배열에 "저장된 순서" 그대로에 맡기지 않고, 각 항목에 sortIndex라는 숫자를
   따로 기록해서 그 값 기준으로 매번 다시 정렬한다. 왜 이렇게 하냐면:
   - 오늘 이 컴퓨터에서 새 항목을 추가하면 로컬에서는 맨 위(unshift)로 잘 들어가지만,
   - 그 항목이 아직 서버(Firebase)에 안 올라간 상태에서 하루가 지나 "새 세션"으로 다시 열면,
     그 항목은 "이 세션에는 없던, 서버에만 있는 항목"이 되어서 병합 시 맨 뒤에 붙어버리는 문제가 있었다.
   sortIndex는 일반 필드라서 다른 필드들과 똑같이 _ts 기준으로 병합되기 때문에, 배열 저장 순서가
   어떻게 뒤섞이든 상관없이 "정렬 기준값"만 정확하면 화면에는 항상 올바른 순서로 보인다. */
function nextSortIndex(arr){
  if(!arr || arr.length===0) return 0;
  const min = Math.min(...arr.map(x=>Number(x && x.sortIndex || 0)));
  return min - 1;
}
function sortByOrder(arr){
  return (arr||[]).slice().sort((a,b)=> Number((a&&a.sortIndex)||0) - Number((b&&b.sortIndex)||0));
}
/* 제안리스트·선정리스트는 사람이 드래그로 순서를 정하는 대신, 프로모션 시작일이 최신인 것부터
   자동으로 위에 오도록 정렬한다. 날짜가 같으면(또는 둘 다 없으면) sortIndex로 한 번 더 정리한다. */
function sortByStartDateDesc(arr, dateField){
  return (arr||[]).slice().sort((a,b)=>{
    const ad = (a && a[dateField]) || '';
    const bd = (b && b[dateField]) || '';
    if(ad && bd && ad!==bd) return bd.localeCompare(ad); // 최신 날짜가 위로
    if(ad && !bd) return -1; // 날짜 있는 쪽이 위
    if(!ad && bd) return 1;
    return Number((a&&a.sortIndex)||0) - Number((b&&b.sortIndex)||0);
  });
}
/* 기존에 sortIndex가 없던(예전에 만들어진) 항목들은, 배열에 저장되어 있던 순서를 그대로 기준으로
   최초 sortIndex를 매겨준다 — 그래야 지금까지 보던 순서가 갑자기 안 바뀐다. */
function ensureSortIndexes(arr){
  if(!Array.isArray(arr)) return;
  arr.forEach((x,i)=>{ if(x && (x.sortIndex===undefined || x.sortIndex===null)) x.sortIndex = i; });
}
/* 항목을 삭제할 때 배열에서 그냥 지우기만 하면, 나중에 서버에 아직 그 항목이 남아있는 스냅샷과
   병합될 때(예: 새로고침 타이밍이 안 맞았을 때) "로컬엔 없던 항목"으로 보여서 되살아나버린다.
   그래서 삭제한 항목의 id와 삭제 시각을 따로 기록해두고(무덤/tombstone), 병합할 때 그 시각 이후로
   서버에서 온 데이터는 "이미 삭제된 것"으로 보고 무시한다. */
function ensureDeletedIds(){
  if(!state.deletedIds || typeof state.deletedIds!=='object') state.deletedIds = {};
  ['proposals','selections','checklist','liveSchedule','fulfillmentItems'].forEach(k=>{
    if(!state.deletedIds[k] || typeof state.deletedIds[k]!=='object') state.deletedIds[k] = {};
  });
  return state.deletedIds;
}
function recordDeleted(collectionKey, id){
  if(!id) return;
  ensureDeletedIds()[collectionKey][id] = Date.now();
}
function mergeDeletedIds(localMap, serverMap){
  const merged = Object.assign({}, localMap||{});
  Object.keys(serverMap||{}).forEach(id=>{
    const sTs = Number(serverMap[id]||0);
    if(!merged[id] || sTs > Number(merged[id]||0)) merged[id] = sTs;
  });
  return merged;
}
/* 여러 명이 동시에 같은 프로모션/셋팅/라이브/풀필먼트 데이터를 만질 수 있기 때문에,
   "서버 데이터로 통째로 덮어쓰기"는 누군가 방금 고친 걸 다른 사람이 지워버리는 문제가 생긴다.
   그래서 자주 같이 만지는 배열들은 항목(id) 단위로 합치고, 같은 항목이 양쪽에 다 있으면
   touch()로 기록해둔 "_ts"(마지막으로 고친 시각)가 더 최근인 쪽을 그대로 살린다. */
function mergeById(localArr, serverArr, tombstones){
  if(!Array.isArray(serverArr)) serverArr = [];
  if(!Array.isArray(localArr)) localArr = [];
  tombstones = tombstones || {};
  const byId = new Map();
  // 화면에 보일 순서는 "로컬(내가 마지막으로 드래그해서 정렬해둔) 순서"를 기준으로 삼는다.
  // 예전엔 서버 배열을 먼저 넣어서 항상 서버 순서로 되돌아갔는데(새로고침하면 정렬이 풀리던 원인),
  // Map은 이미 있는 키를 다시 set해도 순서가 안 바뀌는 특성이 있어서, 로컬을 먼저 넣어두면
  // 값(내용)은 더 최신 쪽으로 갱신되면서도 순서 자체는 그대로 유지된다.
  // 한 번 삭제 기록(무덤)이 남은 id는, 그 뒤에 누가 무슨 시각으로 손댔든 상관없이 절대 되살리지 않는다
  // (예전엔 "삭제 시각 vs 그 항목 최종수정 시각"을 비교했는데, 다른 탭이 열려있다가 뒤늦게 같은 항목을
  //  건드리면 그 비교에서 삭제가 져버려서 계속 되살아나는 문제가 있었다. 그래서 그냥 무조건 제외한다).
  localArr.forEach(r=>{ if(r && r.id && tombstones[r.id]===undefined) byId.set(r.id, r); });
  serverArr.forEach(r=>{
    if(!r || !r.id) return;
    if(tombstones[r.id]!==undefined) return; // 삭제된 적 있는 id는 무조건 제외
    const existing = byId.get(r.id);
    if(!existing || Number(r._ts||0) > Number(existing._ts||0)) byId.set(r.id, r);
  });
  return Array.from(byId.values());
}
/* 제안리스트는 한 줄 안에 여러 칸(담당자·등급·선정완료 등)이 있는데, 전체 줄 단위로만 "더 최신"을
   비교하면 — 누가 담당자만 살짝 고쳐도 그게 더 최신이 되어서, 내가 방금 체크한 선정완료가
   같이 덮어써져 사라지는 문제가 있었다. 그래서 선정완료(selectedBrands)만은 줄 전체와 별개로,
   브랜드 하나하나마다 각자 기록해둔 시각(selectedBrandsTs)을 비교해서 병합한다. */
function mergeProposals(localArr, serverArr, tombstones){
  const merged = mergeById(localArr, serverArr, tombstones);
  const localById = new Map((localArr||[]).filter(p=>p&&p.id).map(p=>[p.id,p]));
  const serverById = new Map((serverArr||[]).filter(p=>p&&p.id).map(p=>[p.id,p]));
  return merged.map(p=>{
    const localP = localById.get(p.id);
    const serverP = serverById.get(p.id);
    if(!localP || !serverP) return p; // 한쪽에만 있는 새 항목은 그대로 사용
    const brands = new Set([
      ...Object.keys(localP.selectedBrands||{}),
      ...Object.keys(serverP.selectedBrands||{}),
    ]);
    const mergedSelected = {};
    brands.forEach(b=>{
      const lTs = Number((localP.selectedBrandsTs||{})[b] || 0);
      const sTs = Number((serverP.selectedBrandsTs||{})[b] || 0);
      const lVal = !!(localP.selectedBrands||{})[b];
      const sVal = !!(serverP.selectedBrands||{})[b];
      const winner = (lTs >= sTs) ? lVal : sVal;
      mergedSelected[b] = winner;
      if(lVal !== sVal){
        console.log(`[선정완료 병합] "${p.promoName||p.id}" / ${b}: 로컬=${lVal}(${lTs}) 서버=${sVal}(${sTs}) → 결과=${winner}`);
      }
    });
    return Object.assign({}, p, {
      selectedBrands: mergedSelected,
      selectedBrandsTs: Object.assign({}, serverP.selectedBrandsTs, localP.selectedBrandsTs),
    });
  });
}
/* Firebase에서 실시간으로(또는 수동 새로고침으로) 새 데이터가 도착했을 때 로컬과 합치는 공통 로직 */
/* Firebase Realtime Database는 객체의 "키"에 . # $ / [ ] 문자를 쓸 수 없다(브랜드명에 "/"가 들어가는
   경우 등에서 저장이 거부됨). 그래서 Firebase로 보내기 직전에 키에 있는 이 문자들만 안전한 문자로
   바꿔서 보내고, 받아올 때 다시 원래대로 되돌린다. 값(문자열/숫자 등) 자체는 건드리지 않는다. */
const FIREBASE_KEY_ENCODE_MAP = {'.':'%2E', '#':'%23', '$':'%24', '/':'%2F', '[':'%5B', ']':'%5D'};
function encodeFirebaseKeys(obj){
  if(Array.isArray(obj)) return obj.map(encodeFirebaseKeys);
  if(obj && typeof obj==='object'){
    const out = {};
    Object.keys(obj).forEach(k=>{
      const safeKey = k.replace(/[.#$\/\[\]]/g, ch=>FIREBASE_KEY_ENCODE_MAP[ch]);
      out[safeKey] = encodeFirebaseKeys(obj[k]);
    });
    return out;
  }
  return obj;
}
function decodeFirebaseKeys(obj){
  if(Array.isArray(obj)) return obj.map(decodeFirebaseKeys);
  if(obj && typeof obj==='object'){
    const out = {};
    Object.keys(obj).forEach(k=>{
      const originalKey = k.replace(/%2E/g,'.').replace(/%23/g,'#').replace(/%24/g,'$').replace(/%2F/g,'/').replace(/%5B/g,'[').replace(/%5D/g,']');
      out[originalKey] = decodeFirebaseKeys(obj[k]);
    });
    return out;
  }
  return obj;
}
function handleRemoteStateUpdate(rawRemoteState){
  const remoteState = rawRemoteState ? decodeFirebaseKeys(rawRemoteState) : rawRemoteState;
  if(freshLocalBoot){
    freshLocalBoot = false;
    if(remoteState){
      clearTimeout(pushTimer); pendingLocalPush = false;
      state = Object.assign(defaultState(), remoteState);
      sanitizeStateArrays();
      try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
      syncStatus = {state:'ok', lastSync: new Date().toISOString(), message:''};
      render();
      return;
    }
  }
  if(pendingLocalPush){ updateSyncBadge(); return; } // 아직 못 올린 로컬 변경사항이 있으면 섣불리 덮어쓰지 않는다
  if(!remoteState){
    // Firebase에 아직 아무 데이터도 없는 최초 상태 → 지금 로컬 내용을 그대로 올려보낸다
    scheduleServerPush();
    syncStatus = {state:'ok', lastSync: new Date().toISOString(), message:''};
    updateSyncBadge();
    return;
  }
  const localEdit = Number(state.__lastLocalEdit || 0);
  const serverEdit = Number(remoteState.__lastLocalEdit || 0);
  const serverPromo = remoteState.promotion || {};
  const serverLive = remoteState.live || {};
  const serverFulfillment = remoteState.fulfillment || {};

  if(localEdit > serverEdit){
    /* 안전장치: 이 브라우저의 어떤 영역(광고·매출 등)이 텅 비어 있는데 서버에는 그 영역의 내용이 있다면,
       "로컬이 더 최신"이라는 이유로 빈 영역을 지키지 않고 서버의 내용을 받아온다. */
    (function(){
      const has = (v)=>{
        if(Array.isArray(v)) return v.length>0;
        if(v && typeof v==='object') return Object.keys(v).some(k=>has(v[k]));
        if(typeof v==='string') return v!=='';
        if(typeof v==='number') return true;
        return false;
      };
      const skip = {promotion:1, live:1, fulfillment:1, deletedIds:1, __lastLocalEdit:1};
      Object.keys(remoteState).forEach(k=>{
        if(skip[k]) return;
        if(has(remoteState[k]) && !has(state[k])) state[k] = remoteState[k];
      });
    })();
    // 로컬이 서버보다 최신이면 절대로 로컬을 통째로 서버 걸로 바꾸지 않는다. 제안·선정·셋팅·라이브·풀필먼트만
    // 항목 단위로 합치고, 나머지(광고비 충전 내역, 스마트스토어 매출 등)는 전부 로컬 그대로 유지한다.
    const localDeleted = ensureDeletedIds();
    const serverDeleted = remoteState.deletedIds || {};
    const mergedDeleted = {};
    Object.keys(localDeleted).forEach(k=>{ mergedDeleted[k] = mergeDeletedIds(localDeleted[k], serverDeleted[k]); });
    state.deletedIds = mergedDeleted;
    if(state.promotion){
      state.promotion.proposals = mergeProposals(state.promotion.proposals, serverPromo.proposals||[], mergedDeleted.proposals);
      state.promotion.selections = mergeById(state.promotion.selections, serverPromo.selections||[], mergedDeleted.selections);
      state.promotion.checklist = mergeById(state.promotion.checklist, serverPromo.checklist||[], mergedDeleted.checklist);
    }
    if(state.live) state.live.schedule = mergeById(state.live.schedule, serverLive.schedule||[], mergedDeleted.liveSchedule);
    if(state.fulfillment){ state.fulfillment.items = mergeById(state.fulfillment.items, serverFulfillment.items||[], mergedDeleted.fulfillmentItems); state.fulfillment.lastInbound = mergeLastInbound(state.fulfillment.lastInbound, serverFulfillment.lastInbound); }
    scheduleServerPush(); // 이렇게 합친 최신 내용을 다시 서버로 밀어올린다
  } else {
    // 서버가 로컬과 같거나 더 최신이면(다른 사람이 더 나중에 저장한 경우) 서버 내용을 기본으로 받아들이되,
    // 제안·선정·셋팅·라이브·풀필먼트는 그래도 항목 단위로 합쳐서 서로 다른 항목을 동시에 고쳐도 안 사라지게 한다.
    const localProposals = (state.promotion && state.promotion.proposals) || [];
    const localSelections = (state.promotion && state.promotion.selections) || [];
    const localChecklist = (state.promotion && state.promotion.checklist) || [];
    const localLiveSchedule = (state.live && state.live.schedule) || [];
    const localFulfillItems = (state.fulfillment && state.fulfillment.items) || [];
    const localLastInbound = (state.fulfillment && state.fulfillment.lastInbound) || {};
    const localDeleted = ensureDeletedIds();
    const serverDeleted = remoteState.deletedIds || {};
    const mergedDeleted = {};
    Object.keys(localDeleted).forEach(k=>{ mergedDeleted[k] = mergeDeletedIds(localDeleted[k], serverDeleted[k]); });

    state = Object.assign(defaultState(), remoteState);
    state.deletedIds = mergedDeleted;

    if(state.promotion){
      state.promotion.proposals = mergeProposals(localProposals, state.promotion.proposals, mergedDeleted.proposals);
      state.promotion.selections = mergeById(localSelections, state.promotion.selections, mergedDeleted.selections);
      state.promotion.checklist = mergeById(localChecklist, state.promotion.checklist, mergedDeleted.checklist);
    }
    if(state.live) state.live.schedule = mergeById(localLiveSchedule, state.live.schedule, mergedDeleted.liveSchedule);
    if(state.fulfillment){ state.fulfillment.items = mergeById(localFulfillItems, state.fulfillment.items, mergedDeleted.fulfillmentItems); state.fulfillment.lastInbound = mergeLastInbound(localLastInbound, state.fulfillment.lastInbound); }
  }
  sanitizeStateArrays();
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  syncStatus = {state:'ok', lastSync: new Date().toISOString(), message:''};
  render();
}
/* 한 번 연결해두면, 이후로는 60초마다 물어보러 가는 게 아니라 Firebase가 변경사항이 생기는 즉시
   실시간으로 알려준다(웹소켓 방식). 그래서 다른 팀원이 저장하면 몇 초 안에 바로 반영된다. */
function attachFirebaseListener(){
  if(!firebaseDb || firebaseListenerAttached) return;
  firebaseListenerAttached = true;
  firebaseDb.ref('appData').on('value', (snapshot)=>{
    handleRemoteStateUpdate(snapshot.val());
  }, (err)=>{
    console.error('Firebase 실시간 동기화 오류:', err);
    syncStatus = {state:'offline', lastSync:syncStatus.lastSync, message:err.message};
    updateSyncBadge();
  });
}
async function loadFromServer(showAlertOnFail){
  const config = getFirebaseConfig();
  if(!config){ syncStatus = {state:'idle', lastSync:null, message:''}; updateSyncBadge(); return; }
  if(pendingLocalPush){ updateSyncBadge(); return; }
  if(!firebaseDb){ initFirebaseSync(showAlertOnFail); return; }
  syncStatus.state = 'syncing'; updateSyncBadge();
  try{
    const snapshot = await firebaseDb.ref('appData').get();
    handleRemoteStateUpdate(snapshot.val());
  }catch(e){
    console.error('Firebase 불러오기 실패:', e);
    syncStatus = {state:'offline', lastSync:syncStatus.lastSync, message:e.message};
    updateSyncBadge();
    if(showAlertOnFail) alert('Firebase 서버에 연결할 수 없습니다.\n' + e.message + '\n\n(연결 전까지는 이 기기에만 데이터가 저장되는 로컬 모드로 계속 사용할 수 있어요)');
  }
}
function scheduleServerPush(){
  if(!getFirebaseConfig()) return;
  if(freshLocalBoot) return; // 서버 데이터를 처음 받아오기 전에는 빈 로컬 상태를 올리지 않는다
  pendingLocalPush = true;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(pushToServer, 250);
}
async function pushToServer(){
  if(!getFirebaseConfig()) return;
  if(freshLocalBoot) return; // 서버 데이터를 처음 받아오기 전(빈 브라우저)에는 서버로 올리지 않는다
  if(!firebaseDb){ initFirebaseSync(false); if(!firebaseDb) return; }
  syncStatus.state = 'syncing'; updateSyncBadge();
  try{
    await firebaseDb.ref('appData').set(encodeFirebaseKeys(state));
    syncStatus = {state:'ok', lastSync: new Date().toISOString(), message:''};
    pendingLocalPush = false;
  }catch(e){
    console.error('Firebase 저장 실패:', e);
    syncStatus = {state:'error', lastSync:syncStatus.lastSync, message:e.message};
    // 저장 실패했으면 로컬 변경사항이 여전히 서버에 반영 안 된 상태이므로 pendingLocalPush를 유지하고 잠시 후 재시도
    setTimeout(()=>{ if(pendingLocalPush) scheduleServerPush(); }, 5000);
  }
  updateSyncBadge();
}
function manualRefresh(){
  loadFromServer(true);
}
function formatSyncTime(iso){
  try{ return new Date(iso).toLocaleTimeString('ko-KR', {hour:'2-digit', minute:'2-digit'}); }
  catch(e){ return ''; }
}
function updateSyncBadge(){
  const el = document.getElementById('syncBadge');
  if(!el) return;
  const dotMap = {idle:'#8A93AA', syncing:'#6C63FF', ok:'#1FA588', offline:'#FF6B81', error:'#FF6B81'};
  const textMap = {
    idle: '로컬 전용 모드 (클라우드 미연결)',
    syncing: '동기화 중...',
    ok: '동기화됨' + (syncStatus.lastSync ? ' · ' + formatSyncTime(syncStatus.lastSync) : ''),
    offline: '클라우드 연결 실패 · 로컬 데이터 사용 중',
    error: '저장 실패 · 다시 시도해주세요',
  };

/* 월별 충전 합계 계산 */
function monthlyCharged(charges, keyField, keyValue){
  const sums = {};
  MONTHS.forEach(m=> sums[m]=0);
  charges.filter(c=>c[keyField]===keyValue).forEach(c=>{
    const m = monthOf(c.date);
    if(m) sums[m] = (sums[m]||0) + Number(c.amount||0);
  });
  return sums;
}

/* 쇼검/GFA 공용: 월별 예산/이월/충전/잔액 계산 */
function computeMonthlyBudget(sectionKey, key, charges, keyField){
  const monthsData = state[sectionKey].months[key] || {};
  const charged = monthlyCharged(charges, keyField, key);
  const rows = [];
  let prevBalance = 0;
  MONTHS.forEach(m=>{
    const md = monthsData[m] || {};
    const budget = Number(md.budget||0);
    let rollover;
    if(md.rolloverManual !== undefined && md.rolloverManual !== null && md.rolloverManual !== ''){
      // 사용자가 직접 입력한 이월잔액 (자동계산 값을 덮어씀 — 시트 사용 시작 전 실제 잔액 반영용)
      rollover = Number(md.rolloverManual);
    } else if(m===1){
      rollover = 0;
    } else {
      rollover = Math.max(prevBalance,0);
    }
    const chargedAmt = charged[m]||0;
    const balance = budget - rollover - chargedAmt;
    rows.push({m, budget, rollover, charged:chargedAmt, balance});
    prevBalance = balance;
  });
  return rows;
}

function ensureMonthEntry(sectionKey, key, m){
  const months = state[sectionKey].months;
  if(!months[key]) months[key] = {};
  if(!months[key][m]) months[key][m] = {budget:0, rolloverManual:null};
  return months[key][m];
}

/* ---- 사이드바 메뉴 순서 (대카테고리/중카테고리 각각 드래그 또는 화살표 버튼으로 변경, localStorage에 저장) ---- */
function ensureNavOrder(){
  const defaultTop = NAV_GROUPS.map(g=>g.key);
  const defaultChildren = {};
  NAV_GROUPS.forEach(g=>{ if(g.type==='group') defaultChildren[g.key] = g.children.map(c=>c.sectionKey); });

  if(!state.navOrder || typeof state.navOrder!=='object' || Array.isArray(state.navOrder)){
    state.navOrder = {ver:3, top:defaultTop.slice(), children:JSON.parse(JSON.stringify(defaultChildren))};
    return state.navOrder;
  }
  if(state.navOrder.ver!==3){ // 메뉴 구성이 바뀐 버전 — 예전에 저장된 순서는 새 기본 순서로 한 번만 초기화
    state.navOrder = {ver:3, top:defaultTop.slice(), children:JSON.parse(JSON.stringify(defaultChildren))};
    return state.navOrder;
  }
  if(!Array.isArray(state.navOrder.top) || state.navOrder.top.length!==defaultTop.length || !defaultTop.every(k=>state.navOrder.top.includes(k))){
    state.navOrder.top = defaultTop.slice();
  }
  if(!state.navOrder.children || typeof state.navOrder.children!=='object') state.navOrder.children = {};
  Object.keys(defaultChildren).forEach(gk=>{
    const def = defaultChildren[gk];
    const cur = state.navOrder.children[gk];
    if(!Array.isArray(cur) || cur.length!==def.length || !def.every(k=>cur.includes(k))){
      state.navOrder.children[gk] = def.slice();
    }
  });
  return state.navOrder;
}
function ensureNavExpanded(){
  if(!state.navExpanded || typeof state.navExpanded!=='object') state.navExpanded = {};
  NAV_GROUPS.forEach(g=>{ if(g.type==='group' && !(g.key in state.navExpanded)) state.navExpanded[g.key]=true; });
  return state.navExpanded;
}
function toggleGroup(key){
  ensureNavExpanded();
  state.navExpanded[key] = !state.navExpanded[key];
  saveState(); render();
}

let dragCtx = null; // {scope:'top'|'child', groupKey, key}
function navDragStart(e, scope, groupKey){
  const el = e.currentTarget;
  const key = scope==='top' ? el.dataset.toplevel : el.dataset.child;
  dragCtx = {scope, groupKey, key};
  e.dataTransfer.effectAllowed = 'move';
  el.classList.add('dragging');
}
function navDragOver(e){
  e.preventDefault();
  e.currentTarget.classList.add('drag-over');
}
function navDragLeave(e){
  e.currentTarget.classList.remove('drag-over');
}
function navDrop(e, scope, groupKey){
  e.preventDefault();
  const el = e.currentTarget;
  el.classList.remove('drag-over');
  if(!dragCtx || dragCtx.scope!==scope) return;
  if(scope==='child' && dragCtx.groupKey!==groupKey) return; // 다른 그룹으로는 이동 불가
  const targetKey = scope==='top' ? el.dataset.toplevel : el.dataset.child;
  if(dragCtx.key===targetKey) return;
  const order = ensureNavOrder();
  const arr = scope==='top' ? order.top : order.children[groupKey];
  const fromIdx = arr.indexOf(dragCtx.key);
  const toIdx = arr.indexOf(targetKey);
  if(fromIdx===-1 || toIdx===-1) return;
  arr.splice(fromIdx,1);
  arr.splice(toIdx,0,dragCtx.key);
  saveState(); render();
}
function navDragEnd(e){
  e.currentTarget.classList.remove('dragging');
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.remove('drag-over'));
  dragCtx = null;
}

function renderNav(){
  const nav = document.getElementById('navList');
  const order = ensureNavOrder();
  ensureNavExpanded();
  nav.innerHTML = order.top.map((key,idx)=>{
    const def = NAV_GROUPS.find(g=>g.key===key);
    if(!def) return '';
    return def.type==='single'
      ? renderNavSingle(def, idx, order.top.length)
      : renderNavGroup(def, idx, order.top.length, order.children[key]||[]);
  }).join('');
}

function renderNavSingle(def, idx, total){
  const active = currentSection===def.sectionKey;
  return `
    <div class="nav-item nav-top ${active?'active':''}" data-toplevel="${def.key}" draggable="true"
      onclick="navigate('${def.sectionKey}')"
      ondragstart="navDragStart(event,'top')" ondragover="navDragOver(event)"
      ondragleave="navDragLeave(event)" ondrop="navDrop(event,'top')" ondragend="navDragEnd(event)">
      <span class="drag-handle" title="드래그해서 순서 변경">⠿</span>
      <span class="nav-dot" style="background:${def.color}"></span>
      <span class="nav-label">${def.label}</span>
    </div>`;
}

function renderNavGroup(def, idx, total, childOrder){
  const expanded = state.navExpanded[def.key] !== false;
  const anyChildActive = childOrder.includes(currentSection);
  const childrenHtml = childOrder.map((sk,cidx)=>{
    const childDef = def.children.find(c=>c.sectionKey===sk);
    if(!childDef) return '';
    const active = currentSection===sk;
    return `
      <div class="nav-item nav-child ${active?'active':''}" data-child="${sk}" data-group="${def.key}" draggable="true"
        onclick="navigate('${sk}')"
        ondragstart="navDragStart(event,'child','${def.key}')" ondragover="navDragOver(event)"
        ondragleave="navDragLeave(event)" ondrop="navDrop(event,'child','${def.key}')" ondragend="navDragEnd(event)">
        <span class="drag-handle" title="드래그해서 순서 변경">⠿</span>
        <span class="nav-dot" style="background:${childDef.color}"></span>
        <span class="nav-label">${childDef.label}</span>
      </div>`;
  }).join('');

  return `
    <div class="nav-group">
      <div class="nav-item nav-group-header ${anyChildActive?'active-parent':''}" data-toplevel="${def.key}" draggable="true"
        onclick="navigate('${childOrder[0]}')"
        ondragstart="navDragStart(event,'top')" ondragover="navDragOver(event)"
        ondragleave="navDragLeave(event)" ondrop="navDrop(event,'top')" ondragend="navDragEnd(event)">
        <span class="drag-handle" title="드래그해서 순서 변경">⠿</span>
        <span class="nav-dot" style="background:${def.color}"></span>
        <span class="nav-label">${def.label}</span>
        <button class="nav-chevron" onclick="event.stopPropagation(); toggleGroup('${def.key}')" title="펼치기/접기">${expanded?'▾':'▸'}</button>
      </div>
      <div class="nav-children" style="display:${expanded?'block':'none'}">
        ${childrenHtml}
      </div>
    </div>`;
}

function ensureSmartstore(){

  if(!Array.isArray(state.smartstore.daily)) state.smartstore.daily = [];

  if(!state.smartstore.checklistByStore || typeof state.smartstore.checklistByStore!=='object') state.smartstore.checklistByStore = {};

  if(!Array.isArray(state.smartstore.manualEvents)) state.smartstore.manualEvents = [];

  if(typeof state.smartstore.calcEventStart !== 'string') state.smartstore.calcEventStart = '';
  if(typeof state.smartstore.calcEventEnd !== 'string') state.smartstore.calcEventEnd = '';
  return state.smartstore;
}

  if(endDate < startEl.value){ alert('종료 날짜가 시작 날짜보다 빠를 수 없어요.'); return; }

function weekRangeOf(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  const day = d.getDay();
  const diffToMon = (day===0 ? -6 : 1-day);
  const monday = new Date(d); monday.setDate(d.getDate()+diffToMon);
  const sunday = new Date(monday); sunday.setDate(monday.getDate()+6);
  const fmt = x=>`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;
  return {start:fmt(monday), end:fmt(sunday)};
}

function buildSalesInputCalGrid(y, m, store){
  const firstWeekday = new Date(y, m-1, 1).getDay();
  const daysInMonth = new Date(y, m, 0).getDate();
  const pad2 = n => String(n).padStart(2,'0');
  const cells = [];
  for(let i=0;i<firstWeekday;i++) cells.push(null);
  for(let d=1; d<=daysInMonth; d++) cells.push(d);
  while(cells.length % 7 !== 0) cells.push(null);
  const todayStr2 = todayStr();
  let weekRows = '';
  for(let w=0; w<cells.length/7; w++){
    weekRows += '<tr>';
    for(let c=0;c<7;c++){
      const day = cells[w*7+c];
      if(day===null){ weekRows += `<td class="ss-input-cal-cell empty-cell"></td>`; continue; }
      const dateStr = `${y}-${pad2(m)}-${pad2(day)}`;
      const entry = findDailyEntry(store, dateStr);
      const isToday = dateStr===todayStr2;
      const wd = new Date(y,m-1,day).getDay();
      weekRows += `
        <td class="ss-input-cal-cell ${isToday?'is-today':''}">
          <div class="ss-input-cal-daynum ${wd===0?'sun':''} ${wd===6?'sat':''}">${day}</div>
          <input class="ss-input-cal-input" type="text" inputmode="numeric" placeholder="-"
            value="${entry && entry.amount ? Math.round(Number(entry.amount)/10000).toLocaleString('ko-KR') : ''}"
            onchange="setDailyAmountManwon('${store.replace(/'/g,"\\'")}','${dateStr}', this.value)">
          <input class="ss-input-cal-order-input" type="text" inputmode="numeric" placeholder="건수"
            value="${entry && entry.orderCount ? entry.orderCount : ''}"
            onchange="setDailyOrderCount('${store.replace(/'/g,"\\'")}','${dateStr}', this.value)">
        </td>`;
    }
    weekRows += '</tr>';
  }
  return `<table class="ss-input-cal-table"><thead><tr>${PROMO_WEEKDAY_KR.map((w,i)=>`<th class="${i===0?'sun':''} ${i===6?'sat':''}">${w}</th>`).join('')}</tr></thead><tbody>${weekRows}</tbody></table>`;
}

async function handleSmartstoreCalcFile(fileIdx){
  const fileInput = document.getElementById('ssCalcFile'+fileIdx);
  const file = fileInput && fileInput.files[0];
  if(!file) return;
  if(typeof XLSX === 'undefined'){
    alert('엑셀 처리 기능을 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침 후 다시 시도해주세요.');
    return;
  }
  try{
    const buf = await file.arrayBuffer();
    // cellDates:true로 읽어야 "주문일시" 같은 날짜 칸이 진짜 날짜로 들어와서, 행사 기간으로 걸러낼 수 있다
    const wb = XLSX.read(buf, {type:'array', cellDates:true});
    const ws = wb.Sheets[wb.SheetNames[0]];
    // 네이버 스마트스토어 주문 엑셀은 파일 종류에 따라 1행에 표가 아니라 사용법 안내문구가 들어있기도 해서,
    // "상품번호"라는 글자가 있는 행을 찾아서 그 행을 진짜 헤더로 쓴다 (1행이 바로 헤더인 파일도 문제없이 처리됨).
    const grid = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
    let headerRowIdx = grid.findIndex(row => row.some(cell => String(cell).trim()==='상품번호'));
    if(headerRowIdx===-1) headerRowIdx = 0;
    const headers = grid[headerRowIdx].map(h=>String(h).trim());
    const dataRows = grid.slice(headerRowIdx+1)
      .filter(row => row.some(cell => String(cell).trim()!==''))
      .map(row=>{
        const obj = {};
        headers.forEach((h,i)=>{ if(h) obj[h] = row[i]!==undefined ? row[i] : ''; });
        return obj;
      });
    if(dataRows.length===0){ alert('엑셀에서 데이터를 찾지 못했어요. 첫 시트에 표 형태로 되어있는지 확인해주세요.'); return; }
    const cleanHeaders = headers.filter(Boolean);
    const f = ssCalcFiles[fileIdx];
    f.parsedRows = dataRows;
    f.headers = cleanHeaders;
    f.fileName = file.name;
    // 열 이름을 보고 그럴듯한 걸 자동으로 추측해서 미리 골라준다 (틀리면 화면에서 직접 바꾸면 됨).
    // 예전엔 못 찾으면 그냥 앞/뒤 아무 열이나 대신 골랐는데, 그러다 "주문번호"(16자리 숫자) 같은 게
    // 금액으로 잘못 골라져서 총액이 억 단위를 훌쩍 넘는 사고가 났었다. 그래서 이제 확실히 못 찾으면
    // 그냥 비워두고, 사람이 직접 고르게 한다.
    f.codeCol = cleanHeaders.find(h=>/상품\s*번호/.test(h)) || cleanHeaders.find(h=>h==='상품번호') || '';
    f.amountCol = cleanHeaders.find(h=>/총\s*주문\s*금액/.test(h)) || cleanHeaders.find(h=>/주문\s*금액/.test(h)) || cleanHeaders.find(h=>/정산.*금액/.test(h)) || '';
    f.dateCol = cleanHeaders.find(h=>/주문\s*일시/.test(h)) || cleanHeaders.find(h=>/결제일/.test(h)) || cleanHeaders.find(h=>/주문일/.test(h)) || cleanHeaders.find(h=>/발송일/.test(h)) || cleanHeaders.find(h=>/구매확정일/.test(h)) || '';
    ssCalcResult = null;
    render();
  }catch(e){
    console.error(e);
    const msg = String(e && e.message || e);
    if(/password/i.test(msg)){
      alert('이 엑셀 파일은 비밀번호로 잠겨있어서 여기서 바로 열 수 없어요.\n\n엑셀에서 파일을 여신 뒤 "파일 > 정보 > 통합 문서 보호 > 암호로 보호"에서 암호를 지우고 저장한 다음, 그 파일을 다시 올려주세요.');
    } else {
      alert('엑셀 파일을 읽는 중 문제가 생겼어요. 파일 형식을 확인해주세요.');
    }
  }
}

/* 엑셀에서 읽어온 날짜값(Date 객체 / 엑셀 시리얼 숫자 / 문자열 등 어떤 형태로 오든)을 "YYYY-MM-DD"로 통일해서 비교할 수 있게 만든다 */
function normalizeExcelDateToYMD(v){
  if(!v) return '';
  if(v instanceof Date && !isNaN(v)){
    return `${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,'0')}-${String(v.getDate()).padStart(2,'0')}`;
  }
  const s = String(v).trim();
  const m = s.match(/(\d{4})[.\-\/](\d{1,2})[.\-\/](\d{1,2})/);
  if(m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  return '';
}
/* 파일들·원하는 상품코드 목록·기간을 받아서 상품별 합계를 계산하는 핵심 로직.

function computeCalcForCodes(activeFiles, codes, startDate, endDate){
  const wantedSet = new Set(codes);
  const byCode = {};
  codes.forEach(c=>{ byCode[c] = {code:c, count:0, total:0, name:''}; });
  let skippedByDate = 0;
  let usedDateFilter = false;
  let skippedDuplicate = 0;
  let suspiciousRowCount = 0; // 한 줄 금액이 비정상적으로 커서(잘못된 열 선택 의심) 경고할 건수
  const SUSPICIOUS_ROW_AMOUNT = 30000000; // 주문 한 줄에 3천만원은 일반적인 소매 주문으로는 비정상적으로 큰 값
  const seenOrderKeys = new Set(); // 파일 두 개에 같은 주문이 겹쳐 들어와도 한 번만 세기 위한 안전장치

  activeFiles.forEach(f=>{
    const nameCol = f.headers.find(h=>/상품명/.test(h));
    const orderNoCol = f.headers.find(h=>/상품주문번호/.test(h));
    const useDateFilter = !!(f.dateCol && (startDate || endDate));
    if(useDateFilter) usedDateFilter = true;
    f.parsedRows.forEach(row=>{
      const code = String(row[f.codeCol]||'').trim();
      if(!wantedSet.has(code)) return;
      if(orderNoCol){
        const orderNo = String(row[orderNoCol]||'').trim();
        if(orderNo){
          const dupKey = code+'__'+orderNo;
          if(seenOrderKeys.has(dupKey)){ skippedDuplicate++; return; }
          seenOrderKeys.add(dupKey);
        }
      }
      if(useDateFilter){
        const rowDate = normalizeExcelDateToYMD(row[f.dateCol]);
        if(rowDate){
          if(startDate && rowDate<startDate){ skippedByDate++; return; }
          if(endDate && rowDate>endDate){ skippedByDate++; return; }
        }
      }
      const amt = Number(sanitizePromoNumber(String(row[f.amountCol]||'0')))||0;
      if(amt > SUSPICIOUS_ROW_AMOUNT) suspiciousRowCount++;
      byCode[code].count++;
      byCode[code].total += amt;
      if(!byCode[code].name && nameCol) byCode[code].name = String(row[nameCol]||'');
    });
  });

  const rows = codes.map(c=>byCode[c]);
  const grandTotal = rows.reduce((s,r)=>s+r.total,0);
  const matchedCount = rows.reduce((s,r)=>s+r.count,0);
  return {rows, grandTotal, matchedCount, usedDateFilter, skippedByDate, skippedDuplicate, suspiciousRowCount, fileCount:activeFiles.length};
}
function runSmartstoreCalc(){
  const activeFiles = ssCalcFiles.filter(f=>f.parsedRows);
  if(activeFiles.length===0){ alert('먼저 엑셀 파일을 하나 이상 선택해주세요.'); return; }
  for(const f of activeFiles){
    if(!f.codeCol || !f.amountCol){ alert(`"${f.fileName}" 파일의 상품번호 열과 주문금액 열을 선택해주세요.`); return; }
  }
  const raw = (ensureSmartstore().calcSelectedCodes||'').trim();
  if(!raw){ alert('행사에 선정된 상품번호를 입력해주세요.'); return; }
  const wanted = Array.from(new Set(raw.split(/[\n,]/).map(s=>s.trim()).filter(Boolean)));
  const ss = ensureSmartstore();
  const startDate = (ss.calcEventStart||'').trim();
  const endDate = (ss.calcEventEnd||'').trim();
  ssCalcResult = computeCalcForCodes(activeFiles, wanted, startDate, endDate);
  render();
}

let ssCalcBatchBrand = '';
let ssCalcBatchStart = '';
let ssCalcBatchEnd = '';
let ssCalcBatchResults = null;
function updateSsCalcBatchBrand(v){ ssCalcBatchBrand=v; render(); }

function runSmartstoreCalcBatch(){
  const activeFiles = ssCalcFiles.filter(f=>f.parsedRows);
  if(activeFiles.length===0){ alert('먼저 엑셀 파일을 하나 이상 선택해주세요.'); return; }
  for(const f of activeFiles){
    if(!f.codeCol || !f.amountCol){ alert(`"${f.fileName}" 파일의 상품번호 열과 주문금액 열을 선택해주세요.`); return; }
  }
  if(!ssCalcBatchBrand){ alert('브랜드를 선택해주세요.'); return; }
  if(!ssCalcBatchStart || !ssCalcBatchEnd){ alert('조회 기간(시작일·종료일)을 입력해주세요.'); return; }

  const promo = ensurePromotion();
  // 그 브랜드의, 조회 기간과 겹치는 모든 선정리스트 항목(행사)을 찾는다
  const matches = promo.selections.filter(s=>{
    if((s.brand||'')!==ssCalcBatchBrand) return false;
    if(!s.startDate || !s.endDate) return false;
    return s.startDate<=ssCalcBatchEnd && s.endDate>=ssCalcBatchStart; // 기간이 겹치는지 판정
  }).sort((a,b)=>(a.startDate||'').localeCompare(b.startDate||''));

  if(matches.length===0){
    alert('그 브랜드·기간에 해당하는 행사(선정리스트 항목)를 찾지 못했어요.');
    ssCalcBatchResults = null;
    render();
    return;
  }

  ssCalcBatchResults = matches.map(sel=>{
    const codes = Array.from(new Set((sel.products||[]).map(p=>String(p.code||'').trim()).filter(Boolean)));
    const calc = computeCalcForCodes(activeFiles, codes, sel.startDate||'', sel.endDate||'');
    return Object.assign({selectionId: sel.id, promoName: sel.promoName||'(제목 없음)', brand: sel.brand||'', startDate: sel.startDate||'', endDate: sel.endDate||''}, calc);
  });
  render();
}
function applyBatchResultToSettings(selectionId){
  if(!ssCalcBatchResults) return;
  const result = ssCalcBatchResults.find(r=>r.selectionId===selectionId);
  if(!result) return;
  const promo = ensurePromotion();
  const sel = promo.selections.find(s=>s.id===selectionId);
  if(!sel){ alert('선정리스트 항목을 찾을 수 없어요.'); return; }
  const matched = promo.checklist.find(c=>{
    if(sel.sourceProposalId){
      return c.sourceProposalId===sel.sourceProposalId && (c.brand||'')===(sel.brand||'');
    }
    return (c.promoName||'')===(sel.promoName||'') && (c.brand||'')===(sel.brand||'') &&
           (c.startDate||'')===(sel.startDate||'') && (c.endDate||'')===(sel.endDate||'');
  });
  if(!matched){
    alert(`"${sel.promoName||'(제목 없음)'}"와 연결된 "셋팅" 항목을 찾지 못했어요. 프로모션 > 셋팅에 이 행사가 등록되어 있는지 확인해주세요.`);
    return;
  }
  matched.eventSales = String(Math.round(result.grandTotal));
  touch(matched);
  saveState(); render();
  alert(`"${matched.promoName||'(제목 없음)'}_${matched.brand||''}" 셋팅 항목에 행사매출 ${formatWon(result.grandTotal)}을 반영했어요.`);
}

/* =========================================================================
   외부 매출 엑셀(스토어명·날짜·매출 3열짜리) 일괄 불러오기
   외부 시스템의 브랜드명 표기가 우리 앱과 살짝 다를 수 있어서(예: "후에버"↔"후",
   "네이처스패밀리"↔"네이쳐스패밀리"), 그대로 매칭하지 않고 사람이 한 번 확인하는
   "브랜드 매칭" 단계를 거친 다음에 실제로 반영한다.
   ========================================================================= */
function levenshteinDistance(a, b){
  const m = a.length, n = b.length;
  if(m===0) return n;
  if(n===0) return m;
  const dp = Array.from({length:m+1}, ()=>new Array(n+1).fill(0));
  for(let i=0;i<=m;i++) dp[i][0]=i;
  for(let j=0;j<=n;j++) dp[0][j]=j;
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++){
      dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1] : 1+Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
    }
  }
  return dp[m][n];
}
function guessBrandMatch(externalName, ourBrands){
  const clean = externalName.trim();
  const cleanLower = clean.toLowerCase();
  const exact = ourBrands.find(b=>b.trim().toLowerCase()===cleanLower);
  if(exact) return exact;
  const contains = ourBrands.find(b=>{
    const bLower = b.trim().toLowerCase();
    return cleanLower.includes(bLower) || bLower.includes(cleanLower);
  });
  if(contains) return contains;
  let best = null, bestDist = Infinity;
  ourBrands.forEach(b=>{
    const d = levenshteinDistance(cleanLower, b.trim().toLowerCase());
    if(d < bestDist){ bestDist = d; best = b; }
  });
  // 편집거리 2 이상은 짧은 브랜드명끼리 우연히 겹쳐서(예: "오스템"↔"갸스비") 엉뚱하게 매칭될 위험이 있어서,
  // 정말 표기 차이(예: "네이처스패밀리"↔"네이쳐스패밀리", 글자 하나 차이) 정도인 1까지만 자동으로 인정한다.
  return (best && bestDist<=1) ? best : '';
}

async function handleSsImportFile(){
  const fileInput = document.getElementById('ssImportFile');
  const file = fileInput && fileInput.files[0];
  if(!file) return;
  if(typeof XLSX === 'undefined'){ alert('엑셀 처리 기능을 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침 후 다시 시도해주세요.'); return; }
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array', cellDates:false});
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, {defval:''});
    if(rows.length===0){ alert('엑셀에서 데이터를 찾지 못했어요.'); return; }
    const headers = Object.keys(rows[0]);
    const platformCol = headers.find(h=>/플랫폼/.test(h)) || '';
    const storeCol = headers.find(h=>/스토어명|브랜드/.test(h)) || headers[0];
    const dateCol = headers.find(h=>/날짜|일자/.test(h)) || headers[1];
    // "매출액"이라는 정확한 이름을 가장 먼저 찾고, 없으면 "매출"이 들어간 다른 열(순매출 등)로 넘어간다.
    // (순매출 · 취소금액처럼 "매출"이 안 들어간 다른 금액 열과 헷갈리지 않도록 매출액을 최우선으로 본다)
    const amountCol = headers.find(h=>h==='매출액') || headers.find(h=>/매출/.test(h)) || headers[3] || headers[2];
    const orderCountCol = headers.find(h=>/주문\s*건수/.test(h)) || '';

    let skippedByPlatform = 0;
    const parsed = rows.map(r=>{
      if(platformCol){
        const platform = String(r[platformCol]||'').trim();
        if(platform !== '스마트스토어'){ return null; }
      }
      const store = String(r[storeCol]||'').trim();
      const date = normalizeExcelDateToYMD(r[dateCol]) || String(r[dateCol]||'').trim();
      if(!store || !/^\d{4}-\d{2}-\d{2}$/.test(date)) return null;
      return {
        store,
        date,
        amount: Number(sanitizePromoNumber(String(r[amountCol]||'0')))||0,
        orderCount: orderCountCol ? (Number(sanitizePromoNumber(String(r[orderCountCol]||'0')))||0) : null,
      };
    });
    skippedByPlatform = parsed.filter(r=>r===null).length; // 플랫폼 필터·형식 불량으로 제외된 행(참고용, 정확한 사유 구분은 안 함)
    const cleaned = parsed.filter(Boolean);
    if(cleaned.length===0){ alert('"스토어명 · 날짜 · 매출액" 형태의 데이터를 찾지 못했어요. 파일 구조를 확인해주세요.'); return; }
    ssImportRows = cleaned;
    ssImportPlatformFiltered = !!platformCol;
    const promo = ensurePromotion();
    const uniqueStores = Array.from(new Set(cleaned.map(r=>r.store)));
    ssImportMapping = {};
    uniqueStores.forEach(s=>{ ssImportMapping[s] = guessBrandMatch(s, promo.brands); });
    render();
  }catch(e){
    console.error(e);
    alert('엑셀 파일을 읽는 중 문제가 생겼어요. 파일 형식을 확인해주세요.');
  }
}
function updateSsImportMapping(storeName, brand){
  ssImportMapping[storeName] = brand;
  render();
}
function runSsImport(){
  if(!ssImportRows){ return; }
  const unmapped = Object.keys(ssImportMapping).filter(s=>!ssImportMapping[s]);
  if(unmapped.length>0){
    if(!confirm(`"${unmapped.join('", "')}" 스토어는 브랜드를 못 정했어요.\n이 스토어들은 건너뛰고 나머지만 가져올까요?`)) return;
  }
  const ss = ensureSmartstore();
  let importedCount = 0, skippedCount = 0;
  ssImportRows.forEach(r=>{
    const brand = ssImportMapping[r.store];
    if(!brand){ skippedCount++; return; }
    const orderCountVal = (r.orderCount!==null && r.orderCount!==undefined) ? String(r.orderCount) : '';
    let entry = ss.daily.find(d=>d.store===brand && d.date===r.date);
    if(!entry){
      ss.daily.push({id:uid(), store:brand, date:r.date, amount:String(r.amount), orderCount:orderCountVal});
    } else {
      entry.amount = String(r.amount);
      if(orderCountVal!=='') entry.orderCount = orderCountVal;
    }
    importedCount++;
  });
  saveState();
  ssImportModalOpen = false;
  ssImportRows = null;
  render();
  alert(`${importedCount.toLocaleString('ko-KR')}일치 매출을 매출 대시보드에 반영했어요.${skippedCount>0 ? `\n(브랜드 매칭이 안 된 ${skippedCount}건은 건너뛰었어요)` : ''}`);
}
