function budgetInputVal(sectionKey,key,m){
  const md = (state[sectionKey].months[key]||{})[m];
  return md && md.budget ? md.budget : '';
}
function rolloverInputVal(sectionKey,key,row){
  // 사용자가 직접 입력한 값이 있으면 그 값을, 없으면 자동계산된 값을 표시(수정 시 수기 입력으로 전환)
  return row.rollover ? row.rollover : '';
}
function updateBudget(sectionKey,key,m,val){
  const entry = ensureMonthEntry(sectionKey,key,m);
  entry.budget = Number(val)||0;
  saveState(); render();
}
function updateRollover(sectionKey,key,m,val){
  const entry = ensureMonthEntry(sectionKey,key,m);
  entry.rolloverManual = (val==='' ? null : Number(val));
  saveState(); render();
}
function pickItem(sectionKey,val){
  currentPick[sectionKey]=val;
  render();
}
function todayStr(){
  // new Date().toISOString()은 UTC(세계표준시) 기준이라, 한국 시간 새벽~아침 시간대(UTC로는 아직 전날)에는
  // "오늘"이 하루 전으로 잘못 계산되는 문제가 있었다. 그래서 브라우저의 로컬 시간(한국 시간) 그대로 계산한다.
  const d = new Date();
  const pad2 = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
}

function renderChargeTable(charges, sectionKey){
  if(charges.length===0) return `<div class="empty">등록된 충전 내역이 없습니다. 아래에서 추가해보세요.</div>`;
  const sorted = sortByDateDesc(charges);
  return `
    <table>
      <thead><tr><th>날짜</th><th class="num">충전금액</th><th>메모</th><th></th></tr></thead>
      <tbody>
        ${sorted.map(c=>`
          <tr>
            <td>${c.date}</td>
            <td class="num mono">${formatWon(c.amount)}</td>
            <td>${c.memo||''}</td>
            <td><button class="btn-del" onclick="deleteCharge('${sectionKey}','${c.id}')" title="삭제">✕</button></td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

function addCharge(sectionKey, keyField, keyValue){
  const date = document.getElementById(`newDate_${sectionKey}`).value;
  const amount = Number(document.getElementById(`newAmount_${sectionKey}`).value)||0;
  const memo = document.getElementById(`newMemo_${sectionKey}`).value;
  if(!date || amount<=0){ alert('날짜와 충전금액을 입력해주세요.'); return; }
  const charge = {id:uid(), date, amount, memo};
  charge[keyField] = keyValue;
  state[sectionKey].charges.push(charge);
  saveState(); render();
}
function deleteCharge(sectionKey, id){
  state[sectionKey].charges = state[sectionKey].charges.filter(c=>c.id!==id);
  saveState(); render();
}

/* ---- 비즈월렛: 소진 내역 + 시작 잔액 (기존 데이터에 없을 수 있어 안전하게 보완) ---- */
function ensureBizwallet(){
  if(!state.bizwallet || typeof state.bizwallet!=='object') state.bizwallet = {charges:[], usages:[], initialBalance:{}};
  if(!Array.isArray(state.bizwallet.charges)) state.bizwallet.charges = [];
  if(!Array.isArray(state.bizwallet.usages)) state.bizwallet.usages = [];
  if(!state.bizwallet.initialBalance || typeof state.bizwallet.initialBalance!=='object') state.bizwallet.initialBalance = {};
  return state.bizwallet;
}
function renderUsageTable(usages, sectionKey){
  if(usages.length===0) return `<div class="empty">등록된 소진 내역이 없습니다.</div>`;
  const sorted = sortByDateDesc(usages);
  return `
    <table>
      <thead><tr><th>날짜</th><th class="num">소진금액</th><th>메모</th><th></th></tr></thead>
      <tbody>
        ${sorted.map(u=>`
          <tr>
            <td>${u.date}</td>
            <td class="num mono">${formatWon(u.amount)}</td>
            <td>${u.memo||''}</td>

/* =========================================================================
   브검 (브랜드별 현재 일정 1건을 직접 수정하는 방식)

function brgeomDdayInfo(endStr){
  const today = new Date(); today.setHours(0,0,0,0);
  if(!endStr) return {days:null, badge:'<span class="badge muted">종료일 미입력</span>'};
  const end = new Date(endStr); end.setHours(0,0,0,0);
  const days = Math.round((end-today)/86400000);
  let badge;
  if(days < 0) badge = `<span class="badge danger">만료 ${Math.abs(days)}일 경과</span>`;
  else if(days <= 7) badge = `<span class="badge warn">진행중 D-${days}</span>`;
  else badge = `<span class="badge ok">진행중 D-${days}</span>`;
  return {days, badge};
}
/* 예전에는 사이클을 계속 "추가"하는 방식이었는데, 브랜드당 현재 값 1세트만 직접 고쳐 쓰는 방식으로 변경.
   기존에 쌓여있던 사이클 이력(state.brgeom.cycles)은 지우지 않고 그대로 두고(데이터 보존),
   그중 가장 최근 것을 꺼내와 새 구조(state.brgeom.current)의 초기값으로 딱 한 번만 옮겨 쓴다. */
function ensureBrgeomCurrentAll(){
  if(!state.brgeom.current || typeof state.brgeom.current!=='object') state.brgeom.current = {};
  brgeomBrandsList().forEach(item=>{
    if(!state.brgeom.current[item.id]){
      const brandCycles = (state.brgeom.cycles||[]).filter(c=>c.brand===item.id)
        .slice()
        .sort((a,b)=> (b.pcStart||b.start||'').localeCompare(a.pcStart||a.start||''));
      const latest = brandCycles[0];
      state.brgeom.current[item.id] = latest ? {
        pcStart: latest.pcStart || latest.start || '',
        pcEnd: latest.pcEnd || latest.end || '',
        pcAmount: latest.pcAmount!=null ? latest.pcAmount : (latest.amount || ''),
        mobileStart: latest.mobileStart || '',
        mobileEnd: latest.mobileEnd || '',
        mobileAmount: latest.mobileAmount || '',
      } : {pcStart:'', pcEnd:'', pcAmount:'', mobileStart:'', mobileEnd:'', mobileAmount:''};
    }
  });
  return state.brgeom.current;
}
/* 브검 자동 연장: 종료일이 지나면 다음 계약을 종료일 다음날부터 30일(예: 10/3 종료 → 10/4~11/2)로 자동 기입.
   PC/모바일을 따로 계산하고, 충전금액은 그대로 둔다. 며칠 접속 안 했어도 오늘이 속한 계약 기간까지 이어서 계산한다. */
function brgAddDays(str, n){
  const t = Date.UTC(+str.slice(0,4), +str.slice(5,7)-1, +str.slice(8,10)) + n*86400000;
  const d = new Date(t);
  return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0');
}
function brgeomAutoRoll(){
  if(!state.brgeom) return false;
  const cur = ensureBrgeomCurrentAll(); const today = todayStr(); let changed = false;
  Object.keys(cur).forEach(b=>{
    const c = cur[b]; if(!c) return; let rolled = false;
    [['pcStart','pcEnd'],['mobileStart','mobileEnd']].forEach(([sk,ek])=>{
      if(!/^\d{4}-\d{2}-\d{2}$/.test(c[ek]||'')) return;
      let n = 0;
      while(c[ek] < today && n++ < 120){ c[sk] = brgAddDays(c[ek], 1); c[ek] = brgAddDays(c[sk], 29); changed = true; rolled = true; }
    });
    if(rolled) c.autoRolledAt = today;
  });
  return changed;
}
function updateBrgeomCurrentField(brand, field, value){

  if(!current[brand]) current[brand] = {pcStart:'', pcEnd:'', pcAmount:'', mobileStart:'', mobileEnd:'', mobileAmount:''};

function copyToClipboard(text, btnEl){
  function fallback(){
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.left = '-9999px';
    document.body.appendChild(ta); ta.focus(); ta.select();
    try{ document.execCommand('copy'); }catch(e){}
    document.body.removeChild(ta);
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).catch(fallback);
  } else {
    fallback();
  }
  if(btnEl){
    const orig = btnEl.textContent;
    btnEl.textContent = '복사됨 ✓';
    setTimeout(()=>{ btnEl.textContent = orig; }, 1400);
  }
}
/* 셀 자체를 클릭해서 복사할 때 쓴다. copyToClipboard()는 버튼용이라 복사 후 글자를 "복사됨"으로
   바꿔치기하는데, 데이터가 그대로 보여야 하는 표 안 칸에 그렇게 하면 값이 사라져 보이니까,
   대신 살짝 색이 반짝하는 것으로만 복사됐다는 걸 알려준다. */
function copyCellValue(text, cellEl){
  if(!text || text==='-') return;
  copyToClipboard(text, null);
  if(cellEl){
    cellEl.classList.add('ss-copy-cell-flash');
    setTimeout(()=>{ cellEl.classList.remove('ss-copy-cell-flash'); }, 500);
  }
}

/* 오늘 날짜 기준으로 해당 항목의 충전 내역(들)을 합산해서 반환. 없으면 null */
/* 브검 충전기안 항목이 가리키는 브랜드 키들: 계정칸이 브랜드명이면 그것, 아니면 스토어칸의 브랜드명(쉼표로 여러 개 가능)으로 찾는다 */
function brgeomKeysForEntry(entry){
  const ids = brgeomBrandsList().map(i=>i.id);
  const keys = [];
  const add = k => { k = String(k||'').trim(); if(k && ids.includes(k) && !keys.includes(k)) keys.push(k); };
  add(entry.accountKey);
  String(entry.store||'').split(/[,，·\/]/).forEach(add);
  return keys;
}
function getTodayChargeSum(entry){
  const cfg = getAdTypeConfig(entry.adType);
  const today = todayStr();
  if(cfg.isCycle){
    let amount = 0, count = 0;
    brgeomKeysForEntry(entry).forEach(key=>{
      const c = ensureBrgeomCurrentAll()[key];
      if(!c || c.draftHidden===today) return;
      if(c.chargedDate===today){ // 충전 탭의 '충전' 버튼을 누른 경우: MO+PC 가격
        if(Number(c.pcAmount||0)>0){ amount += Number(c.pcAmount); count++; }
        if(Number(c.mobileAmount||0)>0){ amount += Number(c.mobileAmount); count++; }
      } else {
        if(c.pcStart && c.pcStart===today){ amount += Number(c.pcAmount||0); count++; }
        if(c.mobileStart && c.mobileStart===today){ amount += Number(c.mobileAmount||0); count++; }
      }
    });
    if(count===0) return null;
    return {amount, count};
  }
  const matches = state[cfg.chargeSection].charges.filter(c=>c[cfg.keyField]===entry.accountKey && c.date===today);
  if(matches.length===0) return null;
  const amount = matches.reduce((s,c)=>s+Number(c.amount||0),0);
  return {amount, count:matches.length};
}


/* =========================================================================
   충전 (전체 광고 한 화면: 현잔액·평균 소진금액 입력 → 충전필요 금액 자동 계산 → 충전내역 일괄 생성)
   ========================================================================= */
function ensureChargePlan(){
  if(!state.chargePlan || typeof state.chargePlan!=='object') state.chargePlan = {today:'', nextDate:'', rows:{}};
  if(!state.chargePlan.rows || typeof state.chargePlan.rows!=='object') state.chargePlan.rows = {};
  return state.chargePlan;
}
function chargePlanRows(){
  const rows = [];
  shogeomAccounts().forEach(a=>rows.push({adType:'shogeom', adName:'쇼검', key:a.id, brand:a.id + (a.brands?` (${a.brands})`:'')}));
  gfaBrandsList().forEach(a=>rows.push({adType:'gfa', adName:'GFA', key:a.id, brand:a.id}));
  seoseaBrandsList().forEach(b=>rows.push({adType:'seosea', adName:'스스광고', key:b, brand:b}));
  brgeomBrandsList().forEach(a=>rows.push({adType:'brgeom', adName:'브검', key:a.id, brand:a.id}));
  bizwalletBrandsList().forEach(b=>rows.push({adType:'bizwallet', adName:'비즈월렛', key:b, brand:b}));
  return rows;
}
function chargePlanRowId(r){ return r.adType+'|'+r.key; }
function chargePlanDays(){
  const p = ensureChargePlan();
  const t = p.today || todayStr();
  if(!p.nextDate) return null;
  const d = Math.round((new Date(p.nextDate+'T00:00:00') - new Date(t+'T00:00:00'))/86400000);
  return d>0 ? d : null;
}
function chargePlanNeed(r){
  const days = chargePlanDays();
  if(days===null) return null;
  const v = ensureChargePlan().rows[chargePlanRowId(r)] || {};
  const avg = Number(v.avg)||0, bal = Number(v.balance)||0;
  if(!avg) return null;
  return Math.max(0, Math.round(avg*days - bal));
}
/* 충전할 금액 기본값: 충전필요 금액을 10만원 단위로 올림 (예: 183,750 → 200,000). 직접 입력한 값이 있으면 그 값이 우선 */
function chargeRoundUp(need){ return need>0 ? Math.ceil(need/100000)*100000 : 0; }
function chargeAmountOf(r){
  const custom = Number((ensureChargePlan().rows[chargePlanRowId(r)]||{}).charge)||0;
  return custom>0 ? custom : chargeRoundUp(chargePlanNeed(r));
}
function updateChargePlanDate(field, value){

  if(inputEl) inputEl.value = n ? Number(n).toLocaleString('ko-KR') : '';

function addChargeRow(rid){
  const p = ensureChargePlan();
  const date = p.today || todayStr();
  const r = chargePlanRows().find(x=>chargePlanRowId(x)===rid);
  if(!r) return;
  if(chargeRowDone(rid)) return; // 이미 추가한 행은 중복으로 추가하지 않는다
  const need = chargePlanNeed(r);
  const custom = Number((p.rows[rid]||{}).charge)||0;
  if(!(custom>0) && chargePlanDays()===null && r.adType!=='bizwallet'){ alert('다음 충전 날짜를 오늘 이후 날짜로 먼저 입력해주세요.'); return; }
  const amount = custom>0 ? custom : chargeRoundUp(need);
  if(!(amount>0)){ alert('충전할 금액을 입력해주세요. (비워두면 충전필요 금액을 10만원 단위로 올림해서 등록돼요)'); return; }
  const cfg = getAdTypeConfig(r.adType);
  if(cfg.isCycle){
    const cur = ensureBrgeomCurrentAll();
    if(!cur[r.key]) cur[r.key] = {pcStart:'', pcEnd:'', pcAmount:'', mobileStart:'', mobileEnd:'', mobileAmount:''};
    cur[r.key].pcStart = date;
    cur[r.key].pcAmount = String(amount);
  } else {
    const ch = touch({id:uid(), date, amount, memo:'충전 탭 등록'});
    ch[cfg.keyField] = r.key;
    state[cfg.chargeSection].charges.push(ch);
  }
  if(!p.rows[rid]) p.rows[rid] = {};
  p.rows[rid].charge = ''; p.rows[rid].done = date;
  saveState(); render();
}

/* 나스에는 있는데 앱 목록에 없던 계정 — 처음 한 번만 앱 목록에 추가해서 같이 연동한다(나중에 지워도 다시 안 생김) */
const CHARGE_SYNC_EXTRAS = [
  {flag:'shogeom_로트벡쉔검색', list:'shogeom', item:{id:'로트벡쉔 · 검색', biz:'', brands:'로트벡쉔'}},
  {flag:'shogeom_게이트맨아사', list:'shogeom', item:{id:'게이트맨·아사아블로이 · 검색+성과형', biz:'', brands:'게이트맨, 아사아블로이'}},
  {flag:'gfa_로트벡쉔', list:'gfa', item:{id:'로트벡쉔', account:'로트벡쉔 · 성과형'}},
  {flag:'bizwallet_오스템', list:'bizwallet', item:'오스템'},
];
const CHARGE_SYNC_ALIAS = { 'VSL3':'VSL#3', '오스템와픽':'오스템', '라움':'라움365', '네이쳐스패밀리':'네이처스패밀리' };
const CHARGE_SYNC_HOLD = ['게이트맨','아사아블로이']; // 나스 페이지에서 충전 보류 처리된 스마트광고 → 잔액만 가져옴
function chargeSyncNorm(x){ return String(x||'').replace(/[#\s]/g,'').replace(/쳐/g,'처'); }
function chargeSyncFindKey(obj, wanted){ // 이름 표기가 조금 달라도(#, 공백, 쳐/처) 같은 항목을 찾는다
  if(obj[wanted]!==undefined) return wanted;
  const w = chargeSyncNorm(wanted);
  return Object.keys(obj).find(k=>chargeSyncNorm(k)===w) || null;
}
function chargeSyncAvg3(series){
  if(!series) return null;
  const today = todayStr();
  let ds = Object.keys(series).sort();
  if(ds.length && ds[ds.length-1]===today) ds = ds.slice(0,-1); // 오늘은 집계 도중이라 제외
  ds = ds.slice(-3);
  if(!ds.length) return null;
  return ds.reduce((t,d)=>t+(Number(series[d])||0),0)/ds.length;
}
async function syncChargeFromServer(){
  const p = ensureChargePlan();
  const btn = document.getElementById('cpSyncBtn');
  if(btn){ btn.disabled = true; btn.textContent = '불러오는 중…'; }
  try{
    const get = async f => {
      const r = await fetch(CHARGE_SYNC_BASE+'cors.php?f='+f, {cache:'no-store'});
      if(!r.ok) throw new Error(f+' ('+r.status+')');
      return r.json();
    };
    const [bal, daily, plan] = await Promise.all([get('ad_balances'), get('account_daily'), get('charge_plan').catch(()=>({}))]);
    // 0) 앱에 없던 나스 계정 추가(최초 1회)
    if(!p.addedExtras || typeof p.addedExtras!=='object') p.addedExtras = {};
    const lists = ensureAdBrandLists(); const addedNames = [];
    CHARGE_SYNC_EXTRAS.forEach(ex=>{
      if(p.addedExtras[ex.flag]) return;
      p.addedExtras[ex.flag] = true;
      const arr = lists[ex.list];
      const id = typeof ex.item==='string' ? ex.item : ex.item.id;
      const al = x => CHARGE_SYNC_ALIAS[x] || x; // 오스템 = 오스템와픽처럼 같은 걸 가리키는 이름이 이미 있으면 새로 만들지 않는다
      if(arr.some(x=>al(typeof x==='string'?x:x.id)===al(id))) return;
      arr.push(typeof ex.item==='string' ? ex.item : Object.assign({}, ex.item));
      addedNames.push(id);
    });
    let updated = 0; const missing = [];
    chargePlanRows().forEach(r=>{
      if(r.adType==='brgeom') return;
      let balNames = [], ids = [], withBurn = true;
      if(r.adType==='shogeom'){
        const m = CHARGE_SYNC_SHOGEOM[r.key];
        if(m){ balNames=m.bal; ids=m.ids; }
        else { const k = chargeSyncFindKey(bal, r.key); if(k) balNames=[k]; }
      } else if(r.adType==='gfa'){
        const m = CHARGE_SYNC_GFA[r.key];
        if(m){ balNames=m.bal; ids=m.ids; }
        else { const k = chargeSyncFindKey(bal, r.key+' · 성과형'); if(k) balNames=[k]; }
      } else if(r.adType==='seosea'){
        const nm = CHARGE_SYNC_ALIAS[r.key] || r.key;
        const k = chargeSyncFindKey(bal, nm+' · 스마트광고');
        if(k) balNames=[k];
        const dk = chargeSyncFindKey(daily, 'smart_'+nm);
        if(dk) ids=[dk];
        if(CHARGE_SYNC_HOLD.includes(r.key)) withBurn = false;
      } else if(r.adType==='bizwallet'){
        const nm = CHARGE_SYNC_ALIAS[r.key] || r.key;
        const k = chargeSyncFindKey(bal, nm+' · 비즈월렛');
        if(k) balNames=[k];
        withBurn = false; // 비즈월렛은 소진 개념이 없어 잔액만
      }
      const found = balNames.filter(n=>bal[n] && bal[n].amt!=null);
      if(!found.length){ missing.push(r.adName+'/'+r.key); return; }
      const rid = chargePlanRowId(r);
      if(!p.rows[rid]) p.rows[rid] = {};
      p.rows[rid].balance = String(Math.max(0, Math.round(found.reduce((t,n)=>t+(Number(bal[n].amt)||0),0))));
      if(withBurn && ids.length){
        let sum = 0, any = false;
        ids.forEach(id=>{ const a = chargeSyncAvg3(daily[String(id)]); if(a!==null){ sum+=a; any=true; } });
        p.rows[rid].avg = any && sum>0 ? String(Math.round(sum)) : '';
      }
      updated++;
    });
    if(plan && plan.date) p.nextDate = plan.date;
    const now = new Date();
    p.lastSync = `${todayStr()} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')} · ${updated}개 항목 갱신`
      + (addedNames.length?` · 새로 추가 ${addedNames.join(', ')}`:'')
      + (missing.length?` · 나스에 없음 ${missing.length}개 (${missing.join(', ')})`:'');
    saveState(); render();
  }catch(e){
    if(btn){ btn.disabled = false; btn.textContent = '잔액·소진 불러오기'; }
    alert('나스에서 불러오지 못했어요.\n\n'+e.message+'\n\n나스 marketing_ad 폴더에 cors.php 파일이 들어있는지 확인해주세요.');
  }
}

function ensureDraftEntries(){
  if(!Array.isArray(state.draftEntries)) state.draftEntries = [];
  return state.draftEntries;
}

function addDraftEntry(){
  const adType = document.getElementById('draftAdType').value;
  const accountKey = document.getElementById('draftAccountKey').value.trim();
  const biz = document.getElementById('draftBiz').value.trim();
  const store = document.getElementById('draftStore').value.trim();
  const bank = document.getElementById('draftBank').value.trim();
  if(!accountKey){ alert('계정(브랜드)명을 입력해주세요. 충전 내역 등록 시 사용하는 이름과 정확히 같아야 금액이 자동으로 매칭됩니다.'); return; }
  ensureDraftEntries().push({id:uid(), adType, accountKey, biz, store, bank});
  saveState(); render();
}
function deleteDraftEntry(id){
  if(!confirm('이 등록 정보를 삭제할까요?')) return;
  state.draftEntries = ensureDraftEntries().filter(e=>e.id!==id);
  saveState(); render();
}
function updateDraftEntryField(id, field, val){
  const entry = ensureDraftEntries().find(e=>e.id===id);
  if(!entry) return;
  entry[field] = val;
  saveState(); render();
}

function buildEntryDraftText(entry, todayInfo){
  const cfg = getAdTypeConfig(entry.adType);
  const amountText = `${formatWon(todayInfo.amount)} (VAT 포함)`;
  return `[${cfg.label}]\n계정: ${entry.accountKey}\n사업자: ${entry.biz||''}\n스토어: ${entry.store||''}\n계좌: ${entry.bank||'(계좌 미입력)'}\n금액: ${amountText}`;
}
function removeTodayDraftCharge(entryId){
  const entry = ensureDraftEntries().find(e=>e.id===entryId);
  if(!entry) return;
  const info = getTodayChargeSum(entry);
  if(!info) return;
  const cfg = getAdTypeConfig(entry.adType);
  if(!confirm(`${cfg.label} · ${entry.accountKey}\n오늘 충전 내역 ${info.count}건(${formatWon(info.amount)})을 삭제할까요?`)) return;
  const today = todayStr();
  if(cfg.isCycle){
    brgeomKeysForEntry(entry).forEach(key=>{
      const c = ensureBrgeomCurrentAll()[key];
      if(c){ c.chargedDate = ''; c.draftHidden = today; }
    });
  } else {
    state[cfg.chargeSection].charges = state[cfg.chargeSection].charges.filter(c=>!(c[cfg.keyField]===entry.accountKey && c.date===today));
  }
  saveState(); render();
}
function copyEntryCard(id, btnEl){
  const entry = ensureDraftEntries().find(e=>e.id===id);

  const todayInfo = getTodayChargeSum(entry);

function ensureDraftTemplates(){
  if(!state.draftTemplates || typeof state.draftTemplates!=='object') state.draftTemplates = Object.assign({}, DRAFT_TEMPLATE_DEFAULTS);
  Object.keys(DRAFT_TEMPLATE_DEFAULTS).forEach(k=>{ if(state.draftTemplates[k]===undefined) state.draftTemplates[k] = DRAFT_TEMPLATE_DEFAULTS[k]; });
  return state.draftTemplates;
}

function resetDraftTemplate(field){

function todayYYMMDD(){
  const d = new Date();
  return String(d.getFullYear()).slice(-2) + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
}
/* 문구 안의 {날짜} 자리에 오늘 날짜(YYMMDD)를 넣어서 실제로 복사될 최종 텍스트를 만든다 */
function resolveDraftTemplate(text){
  return String(text||'').split('{날짜}').join(todayYYMMDD());

  const t = ensureDraftTemplates();
  copyToClipboard(resolveDraftTemplate(t[field]), btnEl);
}

/* =========================================================================
   라이브 일정 자동 반영 — 나스 쇼핑라이브 분석 페이지(marketing_liveshopping)의 schedule.json에서 우리 브랜드 라이브 일정을 가져온다
   (schedule.json의 days[날짜].ours = [{brand, start, id}]). 이미 있는 일정은 라이브ID로 찾아 날짜·시간·브랜드만 맞추고
   행사내용 등 직접 적은 내용은 그대로 두며, 없는 일정만 새로 추가한다. 지운 일정은 다시 만들지 않는다.
   ========================================================================= */
const LIVE_NAS_BASE = 'https://intriholdings.synology.me/marketing_liveshopping/';
/* name: 'schedule'(우리 브랜드 라이브 현황) 또는 '_plans'(앞으로 잡아둔 일정). 직접 읽어보고 막히면 cors.php를 거친다 */
async function fetchLiveNas(name){
  const urls = [LIVE_NAS_BASE+'data/'+name+'.json', LIVE_NAS_BASE+'cors.php?f='+name];
  let err = '';
  for(const u of urls){
    try{
      const r = await fetch(u + (u.includes('?')?'&':'?') + '_t=' + Date.now(), {cache:'no-store'});
      if(!r.ok){ err = name+' ('+r.status+')'; continue; }
      return {data: await r.json(), err:''};
    }catch(e){ err = e.message || String(e); }
  }
  return {data:null, err};
}
let liveNasStatus = {at:'', msg:'', busy:false};
function liveNasBrand(b){ return String(b||'').replace(/#/g,'').trim(); } // 'VSL#3' → 'VSL3'
async function syncLiveFromNas(manual){
  if(liveNasStatus.busy) return;
  liveNasStatus.busy = true;
  const [sc, pl] = await Promise.all([fetchLiveNas('schedule'), fetchLiveNas('_plans')]);
  const data = sc.data, lastErr = sc.err, plans = pl.data;
  liveNasStatus.busy = false;
  if(!data || !data.days){
    liveNasStatus.msg = '나스에서 불러오지 못했어요 ('+lastErr+')';
    if(manual) alert('나스 라이브 일정을 불러오지 못했어요.\n\n'+lastErr+'\n\n나스 marketing_liveshopping 폴더에 cors.php 파일이 들어있는지 확인해주세요.');
    if(currentSection==='live_schedule') render();
    return;
  }
  const promo = ensurePromotion(); const live = ensureLive(); const del = ensureDeletedIds().liveSchedule;
  let added = 0, fixed = 0;
  const addPlanned = (o, brand)=>{ // 라이브ID가 아직 없는 예정 일정: 같은 날·같은 브랜드가 이미 있으면 건너뛰고, 없으면 추가
    if(live.schedule.some(x=>x.date===o.date && x.brand===brand)) return;
    const id = 'nasp_'+o.date+'_'+brand;
    if(del[id]) return;
    if(!promo.brands.includes(brand)) promo.brands.push(brand);
    live.schedule.push(touch({id, importBatchId:'nas', date:o.date, time:o.start, liveId:'', brand, content:o.content||''}));
    added++;
  };
  const items = [];
  Object.keys(data.days).forEach(date=>{ (data.days[date].ours||[]).forEach(o=>items.push({date, brand:o.brand, start:String(o.start||'').slice(11,16), id:o.id})); });
  (data.plans||[]).forEach(o=>items.push({date:o.date, brand:o.brand, start:o.time, id:o.id})); // 앞으로 잡힌 우리 라이브(plans)도 포함
  // _plans.json: {브랜드:[{date,time,id,쇼호스트,행사}]} — 아직 라이브ID가 없는 예정 일정(11월 등)
  if(plans && typeof plans==='object') Object.keys(plans).forEach(br=>{ (Array.isArray(plans[br])?plans[br]:[]).forEach(o=>{ if(o && o.date) items.push({date:o.date, brand:br, start:o.time||'', id:o.id||'', content:String(o['행사']||'').trim(), planned:true}); }); });
  {
    items.forEach(o=>{
      const liveId = String(o.id||'').replace(/[^\d]/g,'').slice(0,8);
      const brand = liveNasBrand(o.brand);
      if(o.planned && !liveId) return addPlanned(o, brand);
      const time = o.start||''; const date = o.date;
      if(!liveId || !brand || !date) return;
      let row = live.schedule.find(x=>String(x.liveId||'').trim()===liveId);
      if(!row) row = live.schedule.find(x=>!String(x.liveId||'').trim() && x.date===date && x.brand===brand); // 직접 적어둔 같은 날·같은 브랜드 일정에 라이브ID를 붙여준다
      if(row){
        const before = JSON.stringify([row.date,row.time,row.brand,row.liveId]);
        row.date = date; if(time) row.time = time; row.brand = brand; row.liveId = liveId;
        if(before !== JSON.stringify([row.date,row.time,row.brand,row.liveId])){ touch(row); fixed++; }
        return;
      }
      const id = 'nas_'+liveId;
      if(del[id]) return; // 사용자가 지운 일정은 되살리지 않는다
      if(!promo.brands.includes(brand)) promo.brands.push(brand);
      live.schedule.push(touch({id, importBatchId:'nas', date, time, liveId, brand, content:''}));
      added++;
    });
  }
  liveNasStatus.at = new Date().toTimeString().slice(0,5);
  liveNasStatus.msg = `나스 기준 ${data.updated ? data.updated.replace('T',' ').slice(0,16) : ''} · 새 일정 ${added}건, 수정 ${fixed}건`;
  if(added || fixed){ saveState(); }
  if(manual) alert(`나스에서 라이브 일정을 반영했어요.\n새로 추가 ${added}건 · 수정 ${fixed}건`);
  if(added || fixed || currentSection==='live_schedule' || currentSection==='live_calendar') render();
}

/* =========================================================================
   초기화
   ========================================================================= */
try{
  render();
  updateSyncBadge();
  if(getAccessCode()){
    // 새로고침 직전에 저장이 서버까지 못 갔을 수 있으니, 서버에서 받아오기 전에
    // 지금 이 브라우저에 있는 내용을 한 번 먼저 밀어넣어 둔다(그래야 그다음 받아올 때 안전하게 합쳐짐).
    loadFromServer(false); // (예전에는 여기서 먼저 올렸지만, 비어 있는 브라우저가 서버를 지우는 사고가 나서 받아오기만 한다)
  }
  setTimeout(()=>syncLiveFromNas(false), 2500); // 나스 라이브 일정 자동 반영 (앱을 열 때 + 10분마다)
  setInterval(()=>{ if(!document.hidden) syncLiveFromNas(false); }, 600000);
  // 60초마다 서버 데이터를 자동으로 확인 (입력 중일 때는 건너뜀)
  setInterval(()=>{
    const active = document.activeElement;
    const isEditing = active && (active.tagName==='INPUT' || active.tagName==='SELECT' || active.tagName==='TEXTAREA');
    if(!isEditing) loadFromServer(false);
  }, 60000);
}catch(e){
  console.error('초기 렌더링 실패:', e);
  document.getElementById('main').innerHTML = `
    <div class="card" style="border-color:#F3B3B3;margin:24px">
      <h2 style="color:var(--negative)">⚠ 앱을 불러오는 중 오류가 발생했습니다</h2>
      <pre style="background:#FAFAFB;border:1px solid var(--border);border-radius:8px;padding:12px;font-size:12px;white-space:pre-wrap;color:var(--negative)">${(e && e.message ? e.message : String(e)).replace(/</g,'&lt;')}</pre>
      <button class="btn ghost" style="margin-top:10px" onclick="if(confirm('저장된 모든 데이터를 초기화할까요? 이 작업은 되돌릴 수 없습니다.')){ localStorage.removeItem('naver_ad_budget_v1'); location.reload(); }">데이터 초기화 후 새로고침</button>
    </div>`;
}
</script>
</body>
</html>
