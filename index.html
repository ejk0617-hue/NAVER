/* 프로모션명처럼 값이 다 제각각인 자유 텍스트 열은, 체크박스로 일일이 고르게 하는 대신
   검색어를 입력하면 그 글자가 포함된 행만 남기는 방식으로 필터한다. */
function getColTextFilter(table, col){
  return ensureColumnFilters(table)[col+'__search'] || '';
}
let colTextFilterDebounce = null;
function updateColTextFilter(table, col, value){
  // 한글은 자음+모음이 조합되는 도중(예: ㅊ→차→창)인데 매번 즉시 다시 그리면, 조합이 끊겨서
  // 글자가 뒤죽박죽되는 문제가 있었다. 그래서 타이핑이 잠깐 멈췄을 때만 실제로 필터에 반영한다.
  clearTimeout(colTextFilterDebounce);
  colTextFilterDebounce = setTimeout(()=>{
    const filters = ensureColumnFilters(table);
    const key = col+'__search';
    if(value) filters[key] = value; else delete filters[key];
    saveState(); render();
  }, 350);
}
function clearColTextFilter(table, col){
  clearTimeout(colTextFilterDebounce);
  const filters = ensureColumnFilters(table);
  delete filters[col+'__search'];
  saveState(); render();
}
function isColTextVisible(table, col, value){
  const search = getColTextFilter(table, col);
  if(!search) return true;
  return String(value||'').toLowerCase().includes(search.toLowerCase());
}
function renderTextColFilterHeader(table, col, label){
  const search = getColTextFilter(table, col);
  const hasActive = !!search;
  const isOpen = colFilterPopoverOpen && colFilterPopoverOpen.table===table && colFilterPopoverOpen.col===col;
  return `
    <div class="col-filter-head">
      <span>${label}</span>
      <button id="${isOpen?'colFilterActiveBtn':''}" class="col-filter-btn ${hasActive?'active':''}" onclick="toggleColFilterPopover('${table}','${col}',event)" title="필터">▾</button>
      ${isOpen ? `
        <div id="colFilterPopoverEl" class="col-filter-popover" onclick="event.stopPropagation()" style="width:190px">
          <div style="display:flex;align-items:center;gap:5px">
            <input type="text" id="colFilterTextInput" class="row-input" style="flex:1;min-width:0;border:1px solid var(--border);border-radius:6px;padding:6px 8px;text-align:left;font-weight:400" placeholder="검색어 입력" value="${search}" oninput="updateColTextFilter('${table}','${col}',this.value)">
            ${hasActive ? `<button class="col-filter-clear-x" onclick="clearColTextFilter('${table}','${col}')" title="지우기">✕</button>` : ''}
          </div>
        </div>

  `;
}

function koreanWeekday(dateStr){
  if(!dateStr) return '';
  const d = new Date(dateStr+'T00:00:00');
  if(isNaN(d.getTime())) return '';
  return PROMO_WEEKDAY_KR[d.getDay()] + '요일';
}
/* 오늘 기준 목표일까지 영업일(주말 제외) 수를 계산. 미래면 양수, 과거(이미 지남)면 음수 */
function businessDaysUntil(dateStr){
  if(!dateStr) return null;
  const target = new Date(dateStr+'T00:00:00');
  if(isNaN(target.getTime())) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  target.setHours(0,0,0,0);
  const isWeekend = d => d.getDay()===0 || d.getDay()===6;
  let count = 0;
  const cur = new Date(today);
  if(target.getTime()===today.getTime()) return 0;
  if(target > today){
    while(cur < target){
      cur.setDate(cur.getDate()+1);
      if(!isWeekend(cur)) count++;
    }
    return count;
  } else {
    while(cur > target){
      cur.setDate(cur.getDate()-1);
      if(!isWeekend(cur)) count--;
    }
    return count;
  }
}
function promoBrandColor(brand){
  const list = ensurePromotion().brands;
  let idx = list.indexOf(brand);
  if(idx===-1){
    // 관리 목록에서 삭제된 브랜드라도 항상 같은 색이 나오도록 문자열 해시로 대체
    idx = brand.split('').reduce((s,c)=>s+c.charCodeAt(0),0);
  }
  return PROMO_COLOR_PALETTE[idx % PROMO_COLOR_PALETTE.length];
}
/* 관리 목록 + 실제 데이터에 남아있는 예전 값까지 합쳐서 드롭다운 옵션을 만든다 (기존 데이터가 안 보이는 것을 방지) */
function promoOptionSet(list, extraValue){
  const set = list.slice();
  if(extraValue && !set.includes(extraValue)) set.push(extraValue);
  return set;
}

/* ---- 제안리스트 / 선정리스트 / 셋팅 체크리스트 공용: 드래그로 행(프로모션 단위) 순서 바꾸기 ---- */
let sheetDragKey = null, sheetDragId = null;
function sheetGetArray(key){
  if(key==='liveSchedule') return ensureLive().schedule;
  const promo = ensurePromotion();
  if(key==='proposals') return promo.proposals;
  if(key==='selections') return promo.selections;
  if(key==='checklist') return promo.checklist;
  return [];
}
function sheetDragStart(e, key, id){
  sheetDragKey = key; sheetDragId = id;
  e.dataTransfer.effectAllowed = 'move';
}
function sheetDragOverRow(e){
  e.preventDefault();
  e.currentTarget.classList.add('sheet-drag-over');
}
function sheetDragLeaveRow(e){
  e.currentTarget.classList.remove('sheet-drag-over');
}
function sheetDropRow(e, key, targetId){
  e.preventDefault();
  document.querySelectorAll('.sheet-drag-over').forEach(el=>el.classList.remove('sheet-drag-over'));
  if(sheetDragKey!==key || !sheetDragId || sheetDragId===targetId){ sheetDragKey=null; sheetDragId=null; return; }
  const arr = sheetGetArray(key);
  // 드래그는 "화면에 지금 보이는(정렬된) 순서" 기준으로 계산해야, 실제 저장 배열의 순서가
  // 무엇이든 상관없이 사용자가 본 대로 정확히 옮겨진다.
  const ordered = sortByOrder(arr);
  const fromIdx = ordered.findIndex(x=>x.id===sheetDragId);
  const toIdx = ordered.findIndex(x=>x.id===targetId);
  sheetDragKey=null; sheetDragId=null;
  if(fromIdx===-1 || toIdx===-1) return;
  const [item] = ordered.splice(fromIdx,1);
  ordered.splice(toIdx,0,item);
  // 새로 정해진 화면 순서를 그대로 각 항목의 sortIndex 필드에 다시 매겨서 저장한다
  ordered.forEach((x,i)=>{ x.sortIndex = i; touch(x); });
  saveState(); render();
}
function sheetDragEnd(){
  document.querySelectorAll('.sheet-drag-over').forEach(el=>el.classList.remove('sheet-drag-over'));
  sheetDragKey=null; sheetDragId=null;
}

function ensureColWidths(table){
  if(!state.promotion) ensurePromotion();
  if(!state.colWidths || typeof state.colWidths!=='object') state.colWidths = {};
  if(!state.colWidths[table] || typeof state.colWidths[table]!=='object') state.colWidths[table] = {};
  return state.colWidths[table];
}
function renderColGroup(table, defaults){
  const widths = ensureColWidths(table);
  return '<colgroup>' + defaults.map((d,i)=>`<col style="width:${widths[i]||d}px">`).join('') + '</colgroup>';
}
let colResizeState = null;
document.addEventListener('mousedown', function(e){
  const handle = e.target.closest('.col-resizer');
  if(!handle) return;
  e.preventDefault();
  const table = handle.dataset.table;
  const col = parseInt(handle.dataset.col, 10);
  const th = handle.closest('th');
  const startWidth = th ? th.getBoundingClientRect().width : 80;
  colResizeState = {table, col, startX:e.clientX, startWidth};
  handle.classList.add('active');
  document.body.classList.add('col-resizing');
});
document.addEventListener('mousemove', function(e){
  if(!colResizeState) return;
  const delta = e.clientX - colResizeState.startX;
  const newWidth = Math.max(32, Math.round(colResizeState.startWidth + delta));
  const widths = ensureColWidths(colResizeState.table);
  widths[colResizeState.col] = newWidth;
  const wrap = document.getElementById('sheetWrap_' + colResizeState.table);
  if(wrap){
    const cols = wrap.querySelectorAll('colgroup col');
    if(cols[colResizeState.col]) cols[colResizeState.col].style.width = newWidth + 'px';
  }
});
document.addEventListener('mouseup', function(){
  if(!colResizeState) return;
  colResizeState = null;
  document.body.classList.remove('col-resizing');
  document.querySelectorAll('.col-resizer.active').forEach(el=>el.classList.remove('active'));
  saveState();
});
function colResizerHtml(table, colIndex){
  return `<div class="col-resizer" data-table="${table}" data-col="${colIndex}"></div>`;
}

   안전하게 호출한다. */
/* 선정리스트를 수기로 등록한 항목(제안리스트의 "선정완료" 체크로 자동 생성된 게 아닌 것)이,
   브랜드·프로모션명을 처음으로 다 채우는 그 순간에 딱 한 번만 셋팅 항목을 만들어준다.
   (제안에서 자동 생성된 항목은 addChecklistFromProposalBrand()가 처리)
   주의: 예전엔 render()마다 전체 선정리스트를 훑으면서 계속 다시 만들었는데, 그러면
   (1) 이 기능 생기기 전부터 있던 기존 항목까지 전부 끌려와버리고, (2) 사용자가 만들어진 셋팅
   항목을 지워도 다음 렌더링에서 또 생겨버리는 문제가 있었다. 그래서 이제는 "이 선정 항목에
   대해 한 번이라도 시도했다"는 표시(checklistSynced)를 남겨서, 그 뒤로는(삭제됐든 아니든)
   두 번 다시 자동으로 손대지 않는다 — 딱 새로 채워 넣는 시점 1회성 트리거로만 동작한다. */
function maybeSyncManualSelectionToChecklist(selectionId){
  const promo = ensurePromotion();
  const s = promo.selections.find(x=>x.id===selectionId);
  if(!s || s.sourceProposalId || s.checklistSynced) return;
  if(!s.brand || !s.promoName) return;
  s.checklistSynced = true; // 성공하든 이미 있든, 이 항목은 다시는 자동으로 건드리지 않는다
  const exists = promo.checklist.some(c=>c.sourceSelectionId===s.id);
  if(exists) return;
  promo.checklist.unshift(touch(newChecklistEntry({
    promoName: s.promoName, brand: s.brand,
    startDate: s.startDate||'', endDate: s.endDate||'',
    sourceSelectionId: s.id,
    sortIndex: nextSortIndex(promo.checklist),
  })));
}

/* 셋팅 표의 드롭다운(브랜드·담당자·진행상태)을 마우스 없이 키보드로만 다루고 싶을 때:
   - 칸을 클릭(포커스)한 뒤 Ctrl+C로 값 복사
   - 같은 종류의 다른 칸에서 Ctrl+V로 붙여넣기 (다른 종류 칸엔 안 붙음 — 예: 브랜드값이 담당자칸에 안 들어감)
   - ↑/↓ 화살표로 같은 열의 위/아래 칸으로 바로 이동 (복사 → 아래로 → 붙여넣기 → 아래로 → ... 반복하기 편하게) */
let selectCellClipboard = null; // {field, value}
let lastFocusedSelectKey = null; // {id, field} — 다시 그려진 뒤에도 포커스를 그 자리로 복원하기 위함
function handleSelectCellKeydown(e, id, field){
  const key = (e.key||'').toLowerCase();
  if((e.ctrlKey||e.metaKey) && key==='c'){
    e.preventDefault();
    selectCellClipboard = {field, value: e.target.value};
    return;
  }
  if((e.ctrlKey||e.metaKey) && key==='v'){
    if(selectCellClipboard && selectCellClipboard.field===field){
      e.preventDefault();
      e.target.value = selectCellClipboard.value;
      e.target.dispatchEvent(new Event('change', {bubbles:true})); // 실제 값 저장을 위해 change를 명시적으로 발생시킴
    }
    return;
  }
  if(e.key==='ArrowDown' || e.key==='ArrowUp'){
    e.preventDefault();
    const all = Array.from(document.querySelectorAll(`select.kb-copy-select[data-kb-field="${field}"]`));
    const idx = all.indexOf(e.target);
    if(idx===-1) return;
    const nextEl = all[e.key==='ArrowDown' ? idx+1 : idx-1];
    if(nextEl) nextEl.focus();
  }
}

              <th class="num">금액셋팅값${colResizerHtml('settingHelper',4)}</th>
              <th class="num">즉시할인가${colResizerHtml('settingHelper',5)}</th>
              <th class="num">최종혜택가${colResizerHtml('settingHelper',6)}</th>
              <th class="num">할인율${colResizerHtml('settingHelper',7)}</th>
              <th>링크${colResizerHtml('settingHelper',8)}</th>
            </tr></thead>
            <tbody>
              ${rows.map((r,ri)=>{
                const cs = (col)=>`class="cell-sel ss-copy-cell" data-source="settingHelper" data-r="${ri}" data-c="${col}" data-rspan="1" onmousedown="startCellSelect(${ri},${col},event,'settingHelper')" onmouseenter="extendCellSelect(${ri},${col})"`;
                return `
                <tr>
                  <td ${cs(0)} class="mono">${r.period}</td>
                  <td ${cs(1)} onclick="copyCellValue('${String(r.code).replace(/'/g,"\\'")}', this)" title="클릭 또는 드래그해서 복사돼요">${r.code}</td>
                  <td ${cs(2)}>${r.name}</td>
                  <td ${cs(3)} class="num mono">${r.regPrice? formatWon(r.regPrice):'-'}</td>
                  <td ${cs(4)} class="num mono" style="background:#FFF4DE;color:#B4790A;font-weight:800" onclick="copyCellValue('${Math.round(r.reserveDiscount)}', this)" title="클릭 또는 드래그해서 복사돼요">${formatWon(r.reserveDiscount)}</td>
                  <td ${cs(5)} class="num mono">${r.instant? formatWon(r.instant):'-'}</td>
                  <td ${cs(6)} class="num mono">${r.final? formatWon(r.final):'-'}</td>
                  <td ${cs(7)} class="num mono">${r.rate===null?'-':r.rate+'%'}</td>
                  <td ${cs(8)}>${r.link ? `<button class="copy-btn" onclick="copyProductLink('${r.link.replace(/'/g,"\\'")}', this)">복사 📋</button>` : `<span style="color:var(--text-secondary);font-size:12px">미등록</span>`}</td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>`}
        <div class="helptext">금액셋팅값은 <b>등록가 − 즉시할인가</b>로 자동 계산돼요. <b>상품코드·금액셋팅값 칸은 클릭하면 바로 복사</b>되고, <b>표의 어느 칸이든 마우스로 드래그해서 영역을 선택한 뒤 Ctrl+C(맥은 Cmd+C)로 한 번에 복사</b>해서 엑셀에 붙여넣을 수 있어요. 링크는 "복사" 버튼으로 바로 복사해서 쓰시면 돼요. "미등록"으로 뜨면 <b>프로모션 &gt; 관리</b> 화면 아래 "브랜드별 링크 관리"에서 상품링크 접두사를 먼저 등록해주세요.</div>

  `;

/* ---- 상품명 데이터(구글시트): 상품번호로 "간단" 상품명·정식 상품명을 찾아 이미지 요청안의 상품명을 다듬는다 (가격 열은 보지 않는다) ---- */
function parseDelimitedRows(text){
  const delim = text.includes('\t') ? '\t' : ',';
  const rows = []; let row = [], cur = '', q = false;
  for(let i=0;i<text.length;i++){
    const ch = text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){ cur+='"'; i++; } else q=false; } else cur+=ch; }
    else if(ch==='"') q=true;
    else if(ch===delim){ row.push(cur); cur=''; }
    else if(ch==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; }
    else if(ch!=='\r') cur+=ch;
  }
  if(cur!=='' || row.length){ row.push(cur); rows.push(row); }
  return rows;
}
function parseProductNameData(text){
  const rows = parseDelimitedRows(text||''); const out = {};
  let hdr = null; // {code, name, short} 열 위치 — "상품번호"와 "상품명" 제목이 있는 행에서 읽는다
  const isCode = (v)=> /^\d{8,}$/.test(String(v||'').trim());
  const junk = (v)=>{ const t=String(v||'').trim(); return !t || /^[\d,.\s]+%?$/.test(t) || /^#/.test(t) || /^https?:/i.test(t); };
  rows.forEach(r=>{
    const ci = r.findIndex(v=>String(v).trim()==='상품번호'), ni = r.findIndex(v=>String(v).trim()==='상품명');
    if(ci>=0 && ni>=0){ hdr = {code:ci, name:ni, short:r.findIndex(v=>String(v).trim()==='간단')}; return; }
    let code = '', full = '', short = '';
    if(hdr && isCode(r[hdr.code])){ code = String(r[hdr.code]).trim(); full = String(r[hdr.name]||'').trim(); short = hdr.short>=0 ? String(r[hdr.short]||'').trim() : ''; }
    else {
      const k = r.findIndex(isCode); if(k<0) return;
      code = String(r[k]).trim();
      const nm = r.slice(k+1).find(v=>!junk(v)); full = nm ? String(nm).trim() : '';
    }
    if(!code || (!full && !short)) return;
    const prev = out[code] || {};
    out[code] = {s: short || prev.s || '', n: full || prev.n || ''};
  });
  return out;
}
function productSheetFetchUrl(url){
  const m = /\/d\/([A-Za-z0-9_-]+)/.exec(url||''); if(!m) return '';
  const g = /[?&#]gid=(\d+)/.exec(url);
  return `https://docs.google.com/spreadsheets/d/${m[1]}/gviz/tq?tqx=out:csv${g?'&gid='+g[1]:''}`;
}
async function fetchProductNameText(url, timeoutMs){
  const fu = productSheetFetchUrl(url); if(!fu) throw new Error('구글시트 주소를 확인해주세요.');
  const ac = new AbortController(); const tm = setTimeout(()=>ac.abort(), timeoutMs||10000);
  try{
    const res = await fetch(fu, {signal: ac.signal}); if(!res.ok) throw new Error('시트를 읽지 못했어요 ('+res.status+')');
    return await res.text();
  } finally { clearTimeout(tm); }
}

    : promo.selections.filter(s=>

function imgReqColL(n){ let s=''; while(n>0){ const r=(n-1)%26; s=String.fromCharCode(65+r)+s; n=Math.floor((n-1)/26); } return s; }
function imgReqColN(c){ let n=0; for(const ch of c) n=n*26+ch.charCodeAt(0)-64; return n; }

function imgReqDateSerial(str){
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(str||''); if(!m) return null;
  return Math.round(Date.UTC(+m[1], +m[2]-1, +m[3]) / 86400000) + 25569;

function imgReqBlockSheet(model, nBlocks, widthC, widthD, fillFn){
  // model.rows(첫 블록의 칸 정의)를 4칸 간격으로 nBlocks번 복제한다. fillFn(blockIndex, ref) → 그 칸에 넣을 값(없으면 null)
  let rowsXml = '';
  model.rows.forEach(row=>{
    let cells = '';
    for(let k=0;k<nBlocks;k++){
      row.cells.forEach(c=>{
        const ref = imgReqColL(imgReqColN(c.c)+4*k)+row.r;
        const sAttr = c.s!=null ? ` s="${c.s}"` : '';
        const fv = fillFn ? fillFn(k, c.c+row.r) : null;
        if(fv!==null && fv!==undefined && fv!==''){
          cells += (typeof fv==='number') ? `<c r="${ref}"${sAttr}><v>${fv}</v></c>` : `<c r="${ref}"${sAttr} t="inlineStr"><is><t xml:space="preserve">${xmlEsc(fv)}</t></is></c>`;
        } else if(c.t==='s'){
          cells += `<c r="${ref}"${sAttr} t="inlineStr"><is><t xml:space="preserve">${xmlEsc(c.v)}</t></is></c>`;
        } else if(c.t==='n'){
          cells += `<c r="${ref}"${sAttr}><v>${c.v}</v></c>`;

  for(let k=1;k<nBlocks;k++) cols += `<col min="${4*k+1}" max="${4*k+2}" width="2.5" style="1" customWidth="1"/><col min="${4*k+3}" max="${4*k+3}" width="${widthC}" style="1" customWidth="1"/><col min="${4*k+4}" max="${4*k+4}" width="${widthD}" style="1" customWidth="1"/>`;

function imgReqPending(c){ return reqStatusOf(c,'imageReq')==='요청중' && !c.ended; } // 이미지 요청안에 들어갈 항목
function imgReqEntries(){

    const sels = checklistSelectionsOf(c, promo);
    const items = [];
    sels.forEach(sel=>(sel.products||[]).forEach(p=>{
      if(!(String(p.code||'').trim() || String(p.name||'').trim())) return;
      const pn = (promo.productNames||{})[String(p.code||'').trim()];
      items.push({start:sel.startDate||'', end:sel.endDate||'', code:String(p.code||'').trim(), name:(pn&&pn.n)||p.name||'', shortName:(pn&&(pn.s||pn.n))||p.name||'', known:!!pn,
        reg:p.regPrice, instant:p.instantDiscountPrice, final:p.finalBenefitPrice, rate:calcDiscountRate(p.regPrice, p.finalBenefitPrice)});
    }));
    const rates = items.map(i=>i.rate).filter(r=>r!==null);
    const type = bannerTypeOf(c.brand);
    // 행사 일정: 연결된 선정리스트의 가장 이른 시작일 ~ 가장 늦은 종료일 (없으면 체크리스트 항목의 날짜)

    const md = (d)=>{ const m=/^\d{4}-(\d{2})-(\d{2})/.exec(d||''); return m ? (+m[1])+'.'+(+m[2]) : ''; };
    const period = (md(st)&&md(en)) ? (md(st)===md(en) ? md(st) : md(st)+'~'+md(en)) : (md(st)||md(en));

    return null;
  }));
  // 2-2) 이벤트 탭 — 스토어명·행사기간
  zip.file('xl/worksheets/sheet5.xml', imgReqBlockSheet(M.m4, list.length, 13.375, 60.5, (k, cell)=>{
    const it = list[k];
    if(cell==='D5') return imgReqStoreName(it.brand);
    if(cell==='D16') return it.period || null;
    const mm = /^([CD])(2[1-3])$/.exec(cell); if(mm){ const x = it.items[+mm[2]-21]; if(!x) return null; if(mm[1]==='D') return x.shortName||null; return /^\d+$/.test(x.code) ? Number(x.code) : (x.code||null); }
    return null;
  }));
  // 3) 선정상품 탭
  const m3 = M.m3;
  const colsOrder = ['B','C','D','E','F','G','H','I'];
  const styleOf = {B:'29', C:'29', D:'59', E:'62', F:'60', G:'30', H:'30', I:'25'};
  let rowsXml = `<row r="2" ht="24" customHeight="1">${m3.hdr.map((h,i)=>`<c r="${h[0]}2" s="${h[1]}" t="inlineStr"><is><t>${xmlEsc(m3.hdrText[i])}</t></is></c>`).join('')}</row>`;
  let r = 3;
  const numOrBlank = (ref, st, v)=>{ const n = Number(String(v==null?'':v).replace(/,/g,'')); return (v===''||v==null||!isFinite(n)) ? `<c r="${ref}" s="${st}"/>` : `<c r="${ref}" s="${st}"><v>${n}</v></c>`; };
  list.forEach(it=>{
    it.items.forEach(x=>{
      const sd = imgReqDateSerial(x.start), ed = imgReqDateSerial(x.end);
      const codeCell = /^\d+$/.test(x.code) ? `<c r="D${r}" s="59"><v>${x.code}</v></c>` : `<c r="D${r}" s="59" t="inlineStr"><is><t xml:space="preserve">${xmlEsc(x.code)}</t></is></c>`;
      rowsXml += `<row r="${r}">` +
        (sd!==null ? `<c r="B${r}" s="29"><v>${sd}</v></c>` : `<c r="B${r}" s="29"/>`) +
        (ed!==null ? `<c r="C${r}" s="29"><v>${ed}</v></c>` : `<c r="C${r}" s="29"/>`) +
        codeCell +
        `<c r="E${r}" s="62" t="inlineStr"><is><t xml:space="preserve">${xmlEsc(x.name)}</t></is></c>` +
        numOrBlank('F'+r,'60',x.reg) + numOrBlank('G'+r,'30',x.instant) + numOrBlank('H'+r,'30',x.final) +
        (x.rate!==null ? `<c r="I${r}" s="25"><v>${x.rate/100}</v></c>` : `<c r="I${r}" s="25"/>`) +
        (it.promoName ? `<c r="J${r}" t="inlineStr"><is><t xml:space="preserve">${xmlEsc(it.promoName)}</t></is></c>` : '') +
        `</row>`;
      r++;
    });
  });
  zip.file('xl/worksheets/sheet3.xml', m3.head + `<dimension ref="B2:J${Math.max(r-1,2)}"/>` + m3.sv + m3.sf + m3.cols + `<sheetData>${rowsXml}</sheetData>` + m3.tail + '</worksheet>');
  return await zip.generateAsync({type:'blob', mimeType:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', compression:'DEFLATE'});
}
async function downloadImageRequest(){
  if(ensurePromotion().productSheetUrl){
    try{ const m = parseProductNameData(await fetchProductNameText(ensurePromotion().productSheetUrl, 6000)); if(Object.keys(m).length){ const pr = ensurePromotion(); pr.productNames = m; pr.productNamesAt = new Date().toLocaleString('ko-KR'); saveState(); } }catch(e){ /* 못 불러오면 저장해둔 데이터를 그대로 쓴다 */ }
  }
  const list = imgReqEntries();
  if(!list.length){ alert('"이미지 요청"을 체크한 항목이 없어요.'); return; }
  
  const warn = [];
  const noSel = list.filter(it=>!it.items.length).map(it=>`${it.brand||'(브랜드 미정)'}·${it.promoName||'(제목 없음)'}`);
  if(noSel.length) warn.push('연결된 선정리스트 상품이 없어서 선정상품 탭이 비는 항목:\n  - '+noSel.join('\n  - '));
  const unknown = [...new Set(list.flatMap(it=>it.items.filter(x=>!x.known).map(x=>x.code||x.name)))];
  if(!Object.keys(ensurePromotion().productNames||{}).length) warn.push('상품명 데이터(구글시트)가 아직 없어서 선정리스트의 상품명을 그대로 써요. (프로모션 > 관리 > 상품명 데이터에서 불러올 수 있어요)');
  else if(unknown.length) warn.push('상품명 데이터에 없는 상품번호('+unknown.length+'개)는 선정리스트의 상품명을 그대로 써요:\n  '+unknown.slice(0,8).join(', ')+(unknown.length>8?' 외 '+(unknown.length-8)+'개':''));
  const over = list.filter(it=>it.items.length>3).map(it=>`${it.brand||'(브랜드 미정)'}·${it.promoName||'(제목 없음)'} (${it.items.length}개)`);
  if(over.length) warn.push('선정상품이 3개를 넘어서, 배너·이벤트 탭의 선정상품 리스트에는 앞의 3개만 들어가는 항목(선정상품 탭에는 모두 들어가요):\n  - '+over.join('\n  - '));
  const noType = [...new Set(list.filter(it=>!it.type).map(it=>it.brand||'(브랜드 미정)'))];
  if(noType.length) warn.push('배너 유형(스마트/브랜드/기타)이 지정되지 않아 사이즈가 빈 브랜드: '+noType.join(', ')+'\n  (프로모션 > 관리 > 브랜드별 링크 관리에서 지정할 수 있어요)');
  if(warn.length && !confirm(warn.join('\n\n')+'\n\n그대로 만들까요?')) return;
  try{
    triggerBlobDownload(await buildImageRequestBlob(list), `${ymdStr()}_이미지요청.xlsx`);
    list.forEach(it=>{ it.entry.bannerSetting = '요청완료'; touch(it.entry); }); // 요청안에 들어간 항목만 배너셋팅 '요청완료'로
    saveState(); render();
  }catch(e){ alert('엑셀을 만들지 못했어요.\n\n'+e.message); }
}

/* ---- 프로모션 통계: 브랜드별 · 월별 · 등급별 선정 현황 ---- */
let promoStatsView = null;
function ensurePromoStatsView(){
  if(!promoStatsView){ const t=new Date(); promoStatsView={y:t.getFullYear(), m:t.getMonth()+1}; }
  return promoStatsView;
}
function promoStatsPrev(){ const v=ensurePromoStatsView(); v.m--; if(v.m<1){v.m=12; v.y--;} render(); }
function promoStatsNext(){ const v=ensurePromoStatsView(); v.m++; if(v.m>12){v.m=1; v.y++;} render(); }
function promoStatsToday(){ promoStatsView=null; render(); }

function renderPromoStats(){
  const promo = ensurePromotion();
  const view = ensurePromoStatsView();
  const y = view.y, m = view.m;
  const monthKey = `${y}-${String(m).padStart(2,'0')}`;
  const filterKey = 'statsFilter';
  const visibleBrands = promo.brands.filter(b=>isBrandVisibleIn(filterKey, b));

  // 이 달에 시작하는 프로모션 중, 브랜드×등급 조합으로 "제안 건수"와 "선정 건수"를 각각 센다
  const selCounts = {}; // { [brand]: { S:0, A:0, B:0, C:0 } } - 선정된 것만
  const proposedCounts = {}; // { [brand]: { S:0, A:0, B:0, C:0 } } - 제안된 전체(선정 여부 무관)
  const zero = () => ({S:0, A:0, B:0, C:0});
  const selectedList = []; // 선정 내역 목록용
  const proposedList = []; // 제안 내역 목록용 (선정 여부 무관 전체)

  promo.proposals.forEach(p=>{
    if(!p.periodStart || !p.periodStart.startsWith(monthKey)) return;
    const grade = PROMO_GRADE_OPTIONS.includes(p.grade) ? p.grade : null;

    // 제안 건수: 이 제안에 걸려있는 브랜드 전체(선정 여부와 무관하게) 기준
    const proposedBrands = (p.brands||[]).filter(b=>visibleBrands.includes(b));
    if(grade){
      proposedBrands.forEach(b=>{
        if(!proposedCounts[b]) proposedCounts[b] = zero();
        proposedCounts[b][grade]++;
      });
    }
    if(proposedBrands.length>0){
      proposedList.push({p, brands: proposedBrands, grade});
    }

    // 선정 건수: 브랜드별로 실제 선정완료 체크된 것만
    const sel = selectedBrandsOf(p).filter(b=>visibleBrands.includes(b));
    if(sel.length>0){
      if(grade){
        sel.forEach(b=>{
          if(!selCounts[b]) selCounts[b] = zero();
          selCounts[b][grade]++;
        });
      }
      // 같은 행사라도 브랜드별로 행사매출이 따로 잡히니, 화면에도 브랜드마다 한 줄씩 분리해서 보여준다
      sel.forEach(b=>{
        selectedList.push({p, brand: b, grade});
      });
    }
  });
  selectedList.sort((a,b)=> (a.p.periodStart||'').localeCompare(b.p.periodStart||'') || a.brand.localeCompare(b.brand));
  proposedList.sort((a,b)=> (a.p.periodStart||'').localeCompare(b.p.periodStart||''));

  // 브랜드 목록: 필터에 켜진 브랜드 + 혹시 필터목록엔 없는데 데이터엔 있는 브랜드까지 다 포함
  const allBrands = Array.from(new Set([...visibleBrands, ...Object.keys(selCounts), ...Object.keys(proposedCounts)]));
  const totalRow = zero();
  const proposedTotalRow = zero();
  allBrands.forEach(b=>{
    const c = selCounts[b] || zero();
    const pc = proposedCounts[b] || zero();
    PROMO_GRADE_OPTIONS.forEach(g=>{ totalRow[g] += c[g]; proposedTotalRow[g] += pc[g]; });
  });
  const grandTotal = PROMO_GRADE_OPTIONS.reduce((s,g)=>s+totalRow[g],0);
  const proposedGrandTotal = PROMO_GRADE_OPTIONS.reduce((s,g)=>s+proposedTotalRow[g],0);
  const overallRate = proposedGrandTotal>0 ? Math.round(grandTotal/proposedGrandTotal*100) : null;

  return `
    <div class="page-header">
      <div>
        <span class="eyebrow" style="background:#2F6FED22;color:#2F6FED">프로모션</span>
        <h1>통계</h1>
        <div class="sub">브랜드별 · 월별 · 등급별로 제안 대비 선정 현황을 한눈에 볼 수 있어요 (프로모션 기간 시작일 기준)</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <button class="btn ghost" onclick="promoStatsPrev()" style="color:var(--text-primary)">◀</button>
        <div style="font-weight:800;font-size:15px;min-width:96px;text-align:center">${y}년 ${m}월</div>
        <button class="btn ghost" onclick="promoStatsNext()" style="color:var(--text-primary)">▶</button>
        <button class="btn ghost" onclick="promoStatsToday()" style="color:var(--text-primary)">오늘</button>
      </div>
    </div>

    ${renderBrandFilterBar(filterKey, promo.brands)}

    <div class="stat-grid">
      <div class="stat-box"><div class="label">${y}년 ${m}월 제안 건수</div><div class="value mono">${proposedGrandTotal}건</div></div>
      <div class="stat-box"><div class="label">${y}년 ${m}월 선정 건수</div><div class="value mono">${grandTotal}건</div></div>
      <div class="stat-box"><div class="label">선정률</div><div class="value mono" style="color:#2F6FED">${overallRate===null?'-':overallRate+'%'}</div></div>
      ${PROMO_GRADE_OPTIONS.map(g=>`<div class="stat-box"><div class="label">${g}급 (선정/제안)</div><div class="value mono" style="color:${PROMO_GRADE_COLORS[g].fg};font-size:18px">${totalRow[g]}/${proposedTotalRow[g]}</div></div>`).join('')}
    </div>

    <div class="ss-row2col promo-stats-row2col">
      <div class="card promo-stats-card">
        <h2>브랜드별 제안 대비 선정 현황</h2>
        ${allBrands.length===0 ? `<div class="empty">브랜드 필터에서 브랜드를 선택해주세요.</div>` : `
        <div style="overflow-x:auto">
        <table class="promo-stats-table">
          <thead>
            <tr>
              <th rowspan="2" style="text-align:left;vertical-align:bottom">브랜드</th>
              <th colspan="5" style="text-align:center;border-left:1px solid var(--border)">제안 건수</th>
              <th colspan="5" style="text-align:center;border-left:1px solid var(--border)">선정 건수</th>
              <th rowspan="2" class="num" style="vertical-align:bottom;border-left:1px solid var(--border)">선정률</th>
            </tr>
            <tr>
              ${PROMO_GRADE_OPTIONS.map((g,gi)=>`<th class="num promo-grade-col" style="color:${PROMO_GRADE_COLORS[g].fg};${gi===0?'border-left:1px solid var(--border)':''}">${g}</th>`).join('')}
              <th class="num promo-grade-col" style="font-weight:800">합계</th>
              ${PROMO_GRADE_OPTIONS.map((g,gi)=>`<th class="num promo-grade-col" style="color:${PROMO_GRADE_COLORS[g].fg};${gi===0?'border-left:1px solid var(--border)':''}">${g}</th>`).join('')}
              <th class="num promo-grade-col" style="font-weight:800">합계</th>
            </tr>
          </thead>
          <tbody>
            ${allBrands.map((b,i)=>{
              const pc = proposedCounts[b] || zero();
              const sc = selCounts[b] || zero();
              const pTotal = PROMO_GRADE_OPTIONS.reduce((s,g)=>s+pc[g],0);
              const sTotal = PROMO_GRADE_OPTIONS.reduce((s,g)=>s+sc[g],0);
              const rate = pTotal>0 ? Math.round(sTotal/pTotal*100) : null;
              const gradeTds = (counts, isFirst) => PROMO_GRADE_OPTIONS.map((g,gi)=>

            </tbody>

        <div class="card promo-stats-card">
          <h2>${y}년 ${m}월 선정 내역</h2>
          ${selectedList.length===0 ? `<div class="empty">이 달에 선정완료된 프로모션이 없습니다.</div>` : `
          <table>
            <thead>
              <tr>
                <th style="text-align:left">프로모션명</th>
                <th style="text-align:left">브랜드</th>

                const eventSales = c && c.eventSales ? Number(c.eventSales)||0 : 0;
                return `
                <tr class="${i%2===1?'row-alt':''}">
                  <td style="font-weight:600">${p.promoName||'(제목 없음)'}</td>
                  <td><span style="display:inline-flex;align-items:center;gap:4px"><span style="width:6px;height:6px;border-radius:50%;background:${promoBrandColor(brand)};display:inline-block"></span>${brand}</span></td>
                  <td style="text-align:center">${grade ? `<span class="badge" style="${gradeStyle(grade)}">${grade}</span>` : '-'}</td>

}

// 제안리스트 → gid 956711804 탭
function handleProposalSync(ss, data) {
  var targetGid = 956711804;
  var sheet = ss.getSheets().filter(function(s){ return s.getSheetId() === targetGid; })[0];
  if (!sheet) sheet = ss.getSheets()[0];

  var header = ['행키','제안마감일','시작일','종료일','브랜드','프로모션명','등급','담당자','제안완료','선정완료','관련링크'];
  if (sheet.getLastRow() === 0) sheet.appendRow(header);

  var lastRow = sheet.getLastRow();
  var allKeys = lastRow > 1 ? sheet.getRange(2, 1, lastRow - 1, 1).getValues().flat() : [];

  // 1) 이 제안(proposalId)에 해당하던 기존 행 중, 이번엔 안 보낸(브랜드가 빠지거나 삭제된) 것들은 지운다
  var prefix = data.proposalId + '_';
  for (var i = allKeys.length - 1; i >= 0; i--) {
    var key = allKeys[i];
    if (String(key).indexOf(prefix) === 0) {
      var stillExists = (data.rows || []).some(function(r){ return r.rowKey === key; });
      if (!stillExists) {
        sheet.deleteRow(i + 2);
        allKeys.splice(i, 1);
      }
    }
  }

  // 2) 지금 보낸 행(브랜드별로 하나씩)들을 갱신하거나 새로 추가한다
  (data.rows || []).forEach(function(r){
    var rowValues = [
      r.rowKey, r.proposeDate || '', r.periodStart || '', r.periodEnd || '',
      r.brand || '', r.promoName || '', r.grade || '', r.owner || '',
      r.proposeDone || '', r.selected || '', r.link || ''
    ];
    var idx = allKeys.indexOf(r.rowKey);
    if (idx >= 0) {
      sheet.getRange(idx + 2, 1, 1, rowValues.length).setValues([rowValues]);
    } else {
      sheet.appendRow(rowValues);
      allKeys.push(r.rowKey);
    }
  });
}

// 제안캘린더 / 선정캘린더 / 라이브캘린더 → 각각 지정한 구글 캘린더 ID로 이벤트 생성/수정/삭제
// 우리 앱의 항목 id와 실제로 만들어진 구글 캘린더 이벤트 id를 스크립트 속성에 기억해뒀다가,
// 다음에 같은 id로 요청이 오면 그 이벤트를 지우고 새로 만든다(간단하고 확실한 방식).
function handleCalendarSync(data) {
  if (!data.calendarId) return;
  var cal = CalendarApp.getCalendarById(data.calendarId);
  if (!cal) return;

  var props = PropertiesService.getScriptProperties();
  var mapKey = 'evt_' + data.id;
  var existingEventId = props.getProperty(mapKey);

  if (existingEventId) {
    try {
      var oldEv = cal.getEventById(existingEventId);
      if (oldEv) oldEv.deleteEvent();
    } catch (e) {}
    props.deleteProperty(mapKey);
  }

  if (data.action === 'delete') return;

  var newEvent;
  if (data.allDay) {
    var start = new Date(data.startDate + 'T00:00:00');
    var end = new Date((data.endDate || data.startDate) + 'T00:00:00');
    end.setDate(end.getDate() + 1); // 구글 캘린더 종일 이벤트는 종료일 다음날 0시로 지정해야 그 날짜까지 표시됨
    newEvent = cal.createAllDayEvent(data.title, start, end);
  } else {
    var start = new Date(data.date + 'T' + (data.time || '09:00') + ':00');
    var end = new Date(start.getTime() + 60 * 60 * 1000);
    newEvent = cal.createEvent(data.title, start, end);
  }
  if (data.description) newEvent.setDescription(data.description);
  props.setProperty(mapKey, newEvent.getId());
}</pre>

function buildPromoCalGrid(y, m, eventsOnDay, renderChip){
  const firstWeekday = new Date(y, m-1, 1).getDay();
  const daysInMonth = new Date(y, m, 0).getDate();
  const pad2 = n => String(n).padStart(2,'0');
  const cells = [];
  for(let i=0;i<firstWeekday;i++) cells.push(null);
  for(let d=1; d<=daysInMonth; d++) cells.push(d);
  while(cells.length % 7 !== 0) cells.push(null);
  const todayStr2 = todayStr();

  let weekRows = '';
  for(let w=0; w<cells.length/7; w++){
    weekRows += '<tr>';
    for(let c=0; c<7; c++){
      const day = cells[w*7+c];
      if(day===null){ weekRows += `<td class="promo-cal-cell empty-cell"></td>`; continue; }
      const dateStr = `${y}-${pad2(m)}-${pad2(day)}`;
      const evs = eventsOnDay(dateStr);
      const isToday = dateStr===todayStr2;
      const wd = new Date(y,m-1,day).getDay();
      weekRows += `
        <td class="promo-cal-cell ${isToday?'is-today':''}">
          <div class="promo-cal-daynum ${wd===0?'sun':''} ${wd===6?'sat':''}">${day}</div>
          <div class="promo-cal-events">${evs.map(renderChip).join('')}</div>
        </td>`;
    }
    weekRows += '</tr>';
  }
  return `
    <table class="promo-cal-table">
      <thead><tr>${PROMO_WEEKDAY_KR.map((w,i)=>`<th class="${i===0?'sun':''} ${i===6?'sat':''}">${w}</th>`).join('')}</tr></thead>
      <tbody>${weekRows}</tbody>
    </table>`;
}

let proposalAddModalOpen = false;
let proposalAddDraft = null;
function newProposalDraft(){
  return {

}
function openProposalAddModal(){
  proposalAddModalOpen = true;

function closeProposalAddModal(){
  proposalAddModalOpen = false;

}
function updateProposalDraftField(field, value){
  if(!proposalAddDraft) return;
  proposalAddDraft[field] = value;
}
function addProposalDraftBrand(brand){
  if(!proposalAddDraft || !brand) return;
  if(!proposalAddDraft.brands.includes(brand)) proposalAddDraft.brands.push(brand);

}
function removeProposalDraftBrand(brand){
  if(!proposalAddDraft) return;
  proposalAddDraft.brands = proposalAddDraft.brands.filter(b=>b!==brand);

}
function submitProposalAdd(){

    proposeDate: proposalAddDraft.proposeDate || todayStr(),

}

/* ---- 구글 스프레드시트 자동 연동 ----
   제안리스트에 새 항목이 생기거나 내용이 바뀌면, 등록해둔 구글 앱스스크립트 웹앱 주소로
   그 항목의 내용을 보내서 시트에 자동으로 기입/갱신되도록 한다. (관리 페이지에서 주소 등록) */
let sheetSyncTimers = {};
function scheduleSheetSync(proposalId){
  const url = (ensurePromotion().sheetSyncUrl||'').trim();
  if(!url) return;
  clearTimeout(sheetSyncTimers[proposalId]);
  sheetSyncTimers[proposalId] = setTimeout(()=>{ pushProposalToSheet(proposalId); }, 1500);
}
async function pushProposalToSheet(proposalId){
  const url = (ensurePromotion().sheetSyncUrl||'').trim();
  if(!url) return {ok:false, error:'웹앱 주소가 없습니다.'};
  const p = ensurePromotion().proposals.find(x=>x.id===proposalId);
  if(!p) return {ok:false, error:'제안 항목을 찾을 수 없습니다.'};
  // 브랜드가 여러 개면(예: VSL3, 갸스비) 한 줄에 몰아넣지 않고, 브랜드마다 시트에 별도 행을 만든다
  const brands = (p.brands && p.brands.length) ? p.brands : [''];
  const selected = new Set(selectedBrandsOf(p));
  const rows = brands.map(brand => ({
    rowKey: p.id + '_' + (brand || '(미지정)'),
    proposeDate: p.proposeDate||'',
    periodStart: p.periodStart||'',
    periodEnd: p.periodEnd||'',
    brand: brand||'',
    promoName: p.promoName||'',
    grade: p.grade||'',
    owner: p.owner||'',
    proposeDone: p.proposeDone ? 'Y' : '',
    selected: selected.has(brand) ? 'Y' : '',
    link: p.link||'',
  }));
  const payload = { type: 'proposal', proposalId: p.id, rows };
  try{
    // 예전엔 no-cors로 보내서 실제로 잘 들어갔는지 전혀 확인할 수 없었다. 앱스스크립트 웹앱은
    // 실제로 응답을 읽을 수 있다는 게 진단으로 확인됐으니, 이제는 응답까지 읽어서 진짜 성공/실패를 판단한다.
    const res = await fetch(url, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload),
    });
    const text = await res.text();
    let parsed = null;
    try{ parsed = JSON.parse(text); }catch(e){}
    if(parsed && parsed.ok) return {ok:true};
    return {ok:false, error: (parsed && parsed.error) ? parsed.error : ('서버 응답 이상: ' + text.slice(0,200))};
  }catch(e){
    console.error('구글시트 동기화 실패:', e);
    return {ok:false, error:e.message};
  }
}
async function syncAllProposalsToSheet(btnEl){
  const url = (ensurePromotion().sheetSyncUrl||'').trim();
  if(!url){ alert('먼저 구글 스프레드시트 웹앱 주소를 입력해주세요.'); return; }
  const proposals = ensurePromotion().proposals;
  if(proposals.length===0){ alert('보낼 제안리스트 항목이 없습니다.'); return; }
  const label = btnEl ? btnEl.textContent : '';
  if(btnEl){ btnEl.textContent = `보내는 중... (0/${proposals.length})`; btnEl.disabled = true; }
  let successCount = 0;
  const failures = [];
  for(let i=0; i<proposals.length; i++){
    const p = proposals[i];
    const result = await pushProposalToSheet(p.id);
    if(result && result.ok) successCount++;
    else failures.push({name: p.promoName || '(제목 없음)', error: result ? result.error : '알 수 없는 오류'});
    if(btnEl) btnEl.textContent = `보내는 중... (${i+1}/${proposals.length})`;
  }
  if(btnEl){ btnEl.textContent = label; btnEl.disabled = false; }
  if(failures.length===0){
    alert(`✅ 총 ${proposals.length}개 전부 정상적으로 보냈어요 (서버 응답 확인 완료).`);
  } else {
    const preview = failures.slice(0,8).map(f=>`- ${f.name}: ${f.error}`).join('\n');
    const more = failures.length>8 ? `\n...외 ${failures.length-8}개 더` : '';
    alert(`총 ${proposals.length}개 중 ${successCount}개 성공, ${failures.length}개 실패했어요.\n\n[실패 내역]\n${preview}${more}`);
  }
}
/* ---- 선정리스트도 같은 방식으로 구글 스프레드시트에 동기화 (다른 탭) ----
   선정 항목 하나에 상품이 여러 개 있을 수 있어서, "이 항목의 상품 행 전체를 다시 보낸다" 방식으로 동작한다.
   보낼 때마다 그 항목(entryId)에 해당하는 시트의 기존 행들을 지금 상태로 통째로 맞춰치기 때문에,
   상품을 추가/삭제해도 시트가 항상 앱과 똑같이 맞춰진다. */
let selectionSheetSyncTimers = {};
/* 셋팅도우미의 목표매출·행사매출을, 그 항목과 연결된 선정리스트 항목을 통해 구글시트에도 반영한다.
   (셋팅도우미가 체크리스트→선정리스트를 찾는 방식과 똑같이 매칭한다) */
function findChecklistForSelection(s){
  const promo = ensurePromotion();
  if(!s) return null;
  if(s.sourceProposalId){
    return promo.checklist.find(c=>c.sourceProposalId===s.sourceProposalId && (c.brand||'')===(s.brand||''));
  }
  // 수기 등록 항목은 안정적인 id로 먼저 찾아보고(자동연동으로 만들어진 경우), 없으면
  // 예전 방식(값 일치)으로도 한 번 더 찾아본다 — 이 기능 생기기 전에 셋팅에서 직접 만든 항목 대비.
  const bySourceId = promo.checklist.find(c=>c.sourceSelectionId===s.id);
  if(bySourceId) return bySourceId;
  return promo.checklist.find(c=>
    !c.sourceProposalId && !c.sourceSelectionId &&
    (c.promoName||'')===(s.promoName||'') && (c.brand||'')===(s.brand||'') &&
    (c.startDate||'')===(s.startDate||'') && (c.endDate||'')===(s.endDate||'')
  );
}
function resyncSalesForChecklistEntry(checklistId){
  const promo = ensurePromotion();
  const c = promo.checklist.find(x=>x.id===checklistId);
  if(!c) return;
  const sel = promo.selections.find(s=>findChecklistForSelection(s)===c);
  if(sel) scheduleSelectionSheetSync(sel.id);
}
function scheduleSelectionSheetSync(entryId){
  const url = (ensurePromotion().sheetSyncUrl||'').trim();
  if(!url) return;
  clearTimeout(selectionSheetSyncTimers[entryId]);
  selectionSheetSyncTimers[entryId] = setTimeout(()=>{ resyncSelectionEntryToSheet(entryId); }, 1500);
}
async function resyncSelectionEntryToSheet(entryId){
  const url = (ensurePromotion().sheetSyncUrl||'').trim();
  if(!url) return;
  const promo = ensurePromotion();
  const s = promo.selections.find(x=>x.id===entryId);
  const checklistEntry = s ? findChecklistForSelection(s) : null;
  const targetSales = checklistEntry ? (checklistEntry.targetSales||'') : '';
  const eventSales = checklistEntry ? (checklistEntry.eventSales||'') : '';
  // 등급은 선정리스트 자체엔 없는 값이라, 이 항목을 만들어낸 원본 제안(제안리스트)에서 가져온다
  const sourceProposal = (s && s.sourceProposalId) ? promo.proposals.find(p=>p.id===s.sourceProposalId) : null;
  const grade = sourceProposal ? (sourceProposal.grade||'') : '';
  // 항목이 이미 삭제됐으면 rows를 빈 배열로 보내서 시트에 남아있던 그 항목의 행들도 같이 지운다
  const rows = s ? (s.products||[]).map((p,i)=>{
    const rate = calcDiscountRate(p.regPrice, p.finalBenefitPrice);
    return {
      rowKey: `${s.id}_${p.id}`,
      startDate: s.startDate||'', endDate: s.endDate||'', promoName: s.promoName||'',
      exposureSlot: s.exposureSlot||'', exposureDate: s.exposureDate||'',
      brand: s.brand||'',
      code: p.code||'', name: p.name||'',
      regPrice: p.regPrice||'', instantDiscountPrice: p.instantDiscountPrice||'', finalBenefitPrice: p.finalBenefitPrice||'',
      rate: rate===null ? '' : rate+'%',
      grade: i===0 ? grade : '',
      targetSales: i===0 ? targetSales : '',
      eventSales: i===0 ? eventSales : '',
    };
  }) : [];
  const payload = { type:'selection', action:'resyncEntry', entryId, rows };
  try{
    await fetch(url, {
      method: 'POST', mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload),
    });
  }catch(e){
    console.error('선정리스트 구글시트 동기화 실패:', e);
  }
}
async function syncAllSelectionsToSheet(btnEl){
  const url = (ensurePromotion().sheetSyncUrl||'').trim();
  if(!url){ alert('먼저 구글 스프레드시트 웹앱 주소를 입력해주세요.'); return; }
  const selections = ensurePromotion().selections;
  if(selections.length===0){ alert('보낼 선정리스트 항목이 없습니다.'); return; }
  const label = btnEl ? btnEl.textContent : '';
  if(btnEl){ btnEl.textContent = '보내는 중...'; btnEl.disabled = true; }
  for(const s of selections){
    await resyncSelectionEntryToSheet(s.id);
  }
  if(btnEl){ btnEl.textContent = label; btnEl.disabled = false; }
  alert(`${selections.length}개 항목을 구글 스프레드시트로 보냈어요. 시트에서 확인해주세요.`);
}

/* ---- 구글 캘린더 연동: 제안캘린더 / 선정캘린더 / 라이브캘린더 각각 별도 구글 캘린더로 동기화 ----
   같은 앱스스크립트 웹앱(sheetSyncUrl)을 그대로 재사용하고, "이 캘린더에 이 id로 만든 이벤트"를
   앱스스크립트 쪽에서 기억해뒀다가 있으면 갱신, 없으면 새로 만들고, 조건이 안 맞으면 지우는 방식이다. */
let calendarSyncTimers = {};
function scheduleCalendarSync(kind, entryId){
  const key = kind+'_'+entryId;
  clearTimeout(calendarSyncTimers[key]);
  calendarSyncTimers[key] = setTimeout(()=>{ pushCalendarEvent(kind, entryId); }, 1500);
}
async function pushCalendarEvent(kind, entryId){
  const url = (ensurePromotion().sheetSyncUrl||'').trim();
  if(!url) return;
  let payloads = [];

  if(kind==='propose'){
    const calId = (ensurePromotion().proposeCalendarId||'').trim();
    if(!calId) return;
    const p = ensurePromotion().proposals.find(x=>x.id===entryId);
    if(!p || !p.proposeDate){
      payloads.push({type:'calendar', calendarId:calId, id:'propose_'+entryId, action:'delete'});
    } else {
      payloads.push({type:'calendar', calendarId:calId, id:'propose_'+entryId, action:'upsert', allDay:true,
        startDate:p.proposeDate, endDate:p.proposeDate, title:p.promoName||'(제목 없음)', description:''});
    }
  } else if(kind==='selected'){
    const calId = (ensurePromotion().selectedCalendarId||'').trim();
    if(!calId) return;
    const promoObj = ensurePromotion();
    const p = promoObj.proposals.find(x=>x.id===entryId);
    const sel = p ? selectedBrandsOf(p) : [];
    if(!p || sel.length===0 || !p.periodStart || !p.periodEnd){
      payloads.push({type:'calendar', calendarId:calId, id:'selected_'+entryId, action:'delete'});
    } else {
      // 브랜드별 선정리스트 항목에 노출일이 등록되어 있으면, 그 브랜드명 뒤에 괄호로 노출일을 같이 붙인다
      const brandLabels = sel.map(b=>{
        const selEntry = promoObj.selections.find(s=>s.sourceProposalId===p.id && s.brand===b);
        return (selEntry && selEntry.exposureDate) ? `${b}(${selEntry.exposureDate})` : b;
      });
      payloads.push({type:'calendar', calendarId:calId, id:'selected_'+entryId, action:'upsert', allDay:true,
        startDate:p.periodStart, endDate:p.periodEnd, title:(p.promoName||'(제목 없음)')+'_'+brandLabels.join(','), description:''});
    }
  } else if(kind==='live'){
    const live = ensureLive();
    const s = live.schedule.find(x=>x.id===entryId);
    // 기본 라이브캘린더 (전체 브랜드)
    const calId = (live.liveCalendarId||'').trim();
    if(calId){
      if(!s || !s.date){
        payloads.push({type:'calendar', calendarId:calId, id:'live_'+entryId, action:'delete'});
      } else {
        payloads.push({type:'calendar', calendarId:calId, id:'live_'+entryId, action:'upsert', allDay:false,
          date:s.date, time:s.time||'09:00', title:`${s.brand||'(브랜드 미정)'}(${s.time||'-'})`, description:s.content||''});
      }
    }
    // 두 번째 라이브캘린더 (지정한 브랜드만)
    const calId2 = (live.liveCalendarId2||'').trim();
    if(calId2){
      const allowedBrands = liveCalendarId2Brands();
      const matches = s && s.date && s.brand && allowedBrands.includes(s.brand);
      if(!matches){
        payloads.push({type:'calendar', calendarId:calId2, id:'live2_'+entryId, action:'delete'});
      } else {
        payloads.push({type:'calendar', calendarId:calId2, id:'live2_'+entryId, action:'upsert', allDay:false,
          date:s.date, time:s.time||'09:00', title:`${s.brand}(${s.time||'-'})`, description:s.content||''});
      }
    }
  }
  for(const payload of payloads){
    try{
      await fetch(url, {
        method:'POST', mode:'no-cors',
        headers:{'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify(payload),
      });
    }catch(e){
      console.error('구글캘린더 동기화 실패:', e);
    }
  }
}
async function syncAllToCalendars(btnEl){
  const url = (ensurePromotion().sheetSyncUrl||'').trim();
  if(!url){ alert('먼저 구글 스프레드시트 웹앱 주소를 입력해주세요 (캘린더 연동도 같은 주소를 써요).'); return; }
  const label = btnEl ? btnEl.textContent : '';
  if(btnEl){ btnEl.textContent = '보내는 중...'; btnEl.disabled = true; }
  for(const p of ensurePromotion().proposals){
    await pushCalendarEvent('propose', p.id);
    await pushCalendarEvent('selected', p.id);
  }
  for(const s of ensureLive().schedule){
    await pushCalendarEvent('live', s.id);
  }
  if(btnEl){ btnEl.textContent = label; btnEl.disabled = false; }
  alert('구글 캘린더로 전체 전송했어요. 각 캘린더에서 확인해주세요.');
}

function updateProposalField(id, field, value){
  const promo = ensurePromotion();
  const row = promo.proposals.find(p=>p.id===id);
  if(!row) return;
  row[field] = value;
  touch(row);
  saveState(); render();
  scheduleSheetSync(id);
  scheduleCalendarSync('propose', id);
  scheduleCalendarSync('selected', id);
}
/* 하나의 제안에 브랜드를 여러 개 추가할 수 있다 */
function addProposalBrand(id, brand){
  if(!brand) return;
  const promo = ensurePromotion();
  const row = promo.proposals.find(p=>p.id===id);
  if(!row) return;
  if(!Array.isArray(row.brands)) row.brands = [];
  if(!row.brands.includes(brand)) row.brands.push(brand);
  touch(row);
  saveState(); render();
  scheduleSheetSync(id);
  scheduleCalendarSync('selected', id);
}
function removeProposalBrand(id, brand){
  const promo = ensurePromotion();
  const row = promo.proposals.find(p=>p.id===id);
  if(!row) return;
  row.brands = (row.brands||[]).filter(b=>b!==brand);
  touch(row);
  saveState(); render();
  scheduleSheetSync(id);
  scheduleCalendarSync('selected', id);
}
/* 브랜드별 선정완료: 브랜드마다 따로 체크하고, 체크되는 순간 셋팅 체크리스트·선정리스트에 각각 자동으로 한 줄씩 생긴다 */
function selectedBrandsOf(p){
  if(!p.selectedBrands) return [];
  return Object.keys(p.selectedBrands).filter(b=>p.selectedBrands[b]);
}
function isProposalBrandSelected(p, brand){
  return !!(p.selectedBrands && p.selectedBrands[brand]);
}
function toggleProposalBrandSelected(id, brand){
  const promo = ensurePromotion();
  const row = promo.proposals.find(p=>p.id===id);
  if(!row) return;
  if(!row.selectedBrands) row.selectedBrands = {};
  if(!row.selectedBrandsTs) row.selectedBrandsTs = {};
  const nowSelected = !row.selectedBrands[brand];
  row.selectedBrands[brand] = nowSelected;
  row.selectedBrandsTs[brand] = Date.now(); // 이 브랜드의 선정 여부만 따로 시각을 기록 (다른 칸 수정과 무관하게 병합하기 위함)
  touch(row);
  if(nowSelected){
    addChecklistFromProposalBrand(row, brand);
    addSelectionFromProposalBrand(row, brand);
  }
  // 체크를 해제해도 이미 만들어진 셋팅·선정리스트 항목은 더 이상 자동으로 지우지 않는다.
  // 한 번 입력된 데이터는 각 리스트 화면의 삭제(🗑) 버튼으로 직접 지우지 않는 한 절대 자동으로
  // 사라지지 않아야 하기 때문 — "선정완료 체크"는 그저 새 항목을 만들어주는 트리거일 뿐, 그 뒤로
  // 두 데이터는 서로 독립적으로 관리된다.
  saveState(); render();
  scheduleSheetSync(id);
  scheduleCalendarSync('selected', id);
}
/* 선정완료는 한 번 체크되면 실수로(혹은 다른 이유로) 풀리지 않도록 잠가두고,
   해제하고 싶을 때만 "수정" 버튼으로 확인창을 한 번 거쳐서 풀 수 있게 한다. */
function requestUnselectProposalBrand(id, brand){
  if(!confirm(`"${brand}" 선정완료를 해제할까요?\n(이미 만들어진 셋팅·선정리스트 항목은 지워지지 않고 그대로 남아있어요. 지우려면 각 리스트에서 직접 삭제해주세요.)`)) return;
  toggleProposalBrandSelected(id, brand);
}
function toggleProposalField(id, field){
  const promo = ensurePromotion();
  const row = promo.proposals.find(p=>p.id===id);
  if(!row) return;
  row[field] = !row[field];
  touch(row);
  saveState(); render();
  scheduleSheetSync(id);
}
function deleteProposal(id){
  const promo = ensurePromotion();
  promo.proposals = promo.proposals.filter(p=>p.id!==id);
  recordDeleted('proposals', id);
  saveState(); render();
  pushCalendarEvent('propose', id);
  pushCalendarEvent('selected', id);
}

/* ---- 선정리스트 (제안리스트와 무관한 독립 데이터, 프로모션 1건당 상품코드 여러 개 등록 가능) ---- */
function calcDiscountRate(regPrice, finalPrice){
  const reg = Number(regPrice), fin = Number(finalPrice);
  if(!reg || reg<=0 || finalPrice===''||finalPrice===null||finalPrice===undefined) return null;
  return Math.floor((1 - fin/reg) * 100); // ROUNDDOWN((1-최종혜택가/등록가)*100,0)/100 과 동일한 정수 % 값
}

   나중에 날짜 채우면 그제서야 자리를 찾아가서 화면이 갑자기 움직이는 게 불편했다. */

/* 엑셀/구글 스프레드시트에서 여러 셀을 복사해 붙여넣으면(탭=열 구분, 줄바꿈=행 구분)
   자동으로 부족한 상품 행을 추가하면서 각 칸에 채워 넣는다.
   가격 칸(등록가/즉시할인가/최종혜택가)은 number 입력이라 "10,000"처럼 콤마가 섞이면
   그대로는 절대 들어가지 않으므로, 붙여넣을 때 숫자만 남기고 자동으로 정리한다. */
const PROMO_PRODUCT_FIELD_ORDER = ['code','name','regPrice','instantDiscountPrice','finalBenefitPrice'];
const PROMO_PRODUCT_NUMERIC_FIELDS = ['regPrice','instantDiscountPrice','finalBenefitPrice'];
function sanitizePromoNumber(v){
  if(v===undefined || v===null) return '';
  const cleaned = String(v).trim().replace(/[^\d.\-]/g,'');
  if(!/\d/.test(cleaned)) return ''; // 숫자가 하나도 없이 "-"나 "."만 남으면(예: 엑셀의 "데이터 없음" 표시) 빈 값으로 처리
  return cleaned;
}
function handlePastePromoProduct(e, entryId, productId, field){
  const text = (e.clipboardData || window.clipboardData).getData('text');
  if(!text) return;
  const isMultiCell = text.includes('\t') || text.includes('\n');
  const isNumericField = PROMO_PRODUCT_NUMERIC_FIELDS.includes(field);
  // 여러 칸을 붙여넣는 경우, 그리고 가격 칸에 단일 값(콤마 포함 가능)을 붙여넣는 경우 모두 직접 처리
  if(!isMultiCell && !isNumericField) return; // 그 외 단일 값 붙여넣기는 브라우저 기본 동작 사용
  e.preventDefault();
  const promo = ensurePromotion();
  const row = promo.selections.find(s=>s.id===entryId);
  if(!row) return;
  const startRowIdx = row.products.findIndex(p=>p.id===productId);
  if(startRowIdx===-1) return;
  const startColIdx = PROMO_PRODUCT_FIELD_ORDER.indexOf(field);
  const lines = text.replace(/\r/g,'').split('\n').filter((line,i,arr)=> !(i===arr.length-1 && line===''));
  lines.forEach((line, li)=>{
    const cells = line.split('\t');
    const rowIdx = startRowIdx + li;
    while(row.products.length <= rowIdx){
      row.products.push({id:uid(), code:'', name:'', regPrice:'', instantDiscountPrice:'', finalBenefitPrice:''});
    }
    cells.forEach((val, ci)=>{
      const colIdx = startColIdx + ci;
      if(colIdx>=0 && colIdx<PROMO_PRODUCT_FIELD_ORDER.length){
        const fname = PROMO_PRODUCT_FIELD_ORDER[colIdx];
        row.products[rowIdx][fname] = PROMO_PRODUCT_NUMERIC_FIELDS.includes(fname) ? sanitizePromoNumber(val) : val.trim();
      }
    });
  });
  saveState(); render();
  scheduleSelectionSheetSync(entryId);
}

const SELECTIONS_COL_DEFAULTS = [30,22,100,100,130,84,100,104,96,110,86,86,86,58,26,30];
const SELECTIONS_COL_LABELS = ['','시작일','종료일','프로모션명','노출구좌','노출일','브랜드','상품코드','상품명','등록가','즉시할인가','최종혜택가','할인율','',''];
let selectedSelectionIds = new Set(); // 화면 전용 상태 — 선정리스트 체크박스로 선택된 항목 id들

/* 선정리스트: 표의 어느 칸이든 마우스로 드래그하면 사각형 영역이 선택되고, Ctrl+C(맥은 Cmd+C)로
   그 영역을 엑셀에 붙여넣기 좋은 형태(탭/줄바꿈 구분)로 클립보드에 복사할 수 있다.
   시작일·프로모션명처럼 여러 상품에 걸쳐 병합된(rowspan) 칸은, 실제로는 화면에 한 번만 그려지지만
   "이 칸이 몇 번째 행부터 몇 행까지를 덮고 있는지"(data-rspan)를 같이 기록해두고, 그 범위를
   선택/복사할 때는 병합된 값을 각 행에 반복해서 채워 넣는다(스프레드시트에서 병합칸을 복사할 때와 동일).
   렌더링할 때 selectionFlatRowsCache에 "상품 1건 = 1행" 기준의 실제 값들을 함께 저장해두고 복사 시 사용한다. */
let selectionFlatRowsCache = [];
let settingHelperFlatRowsCache = []; // 셋팅도우미 표용 드래그 선택/복사 캐시 (선정리스트와 같은 방식)
let cellSelSource = 'selections'; // 지금 드래그 선택 중인 표가 어느 것인지('selections' | 'settingHelper')
let cellSelStart = null; // {r,c}
let cellSelEnd = null;
let cellSelDragging = false;
function cellSelRange(){
  if(!cellSelStart || !cellSelEnd) return null;
  return {
    r0: Math.min(cellSelStart.r, cellSelEnd.r), r1: Math.max(cellSelStart.r, cellSelEnd.r),
    c0: Math.min(cellSelStart.c, cellSelEnd.c), c1: Math.max(cellSelStart.c, cellSelEnd.c),
  };
}
function isCellInSelRange(r, c, rspan){
  const range = cellSelRange();
  if(!range) return false;
  const r1 = r + (rspan||1) - 1;
  return r1>=range.r0 && r<=range.r1 && c>=range.c0 && c<=range.c1;
}
function applyCellSelectHighlights(){
  document.querySelectorAll('.cell-sel').forEach(td=>{
    const src = td.dataset.source || 'selections';
    if(src !== cellSelSource){ td.classList.remove('cell-sel-active'); return; }
    const r = parseInt(td.dataset.r,10), c = parseInt(td.dataset.c,10), rspan = parseInt(td.dataset.rspan||'1',10);
    td.classList.toggle('cell-sel-active', isCellInSelRange(r,c,rspan));
  });
}
function startCellSelect(r, c, e, source){
  cellSelSource = source || 'selections';
  cellSelDragging = true;
  cellSelStart = {r,c};
  cellSelEnd = {r,c};
  applyCellSelectHighlights();
}
function extendCellSelect(r, c){
  if(!cellSelDragging) return;
  cellSelEnd = {r,c};
  applyCellSelectHighlights();
}
document.addEventListener('mouseup', function(){ cellSelDragging = false; });
document.addEventListener('keydown', function(e){
  if(!(e.ctrlKey || e.metaKey) || e.key.toLowerCase()!=='c') return;
  const range = cellSelRange();
  if(!range) return;
  const active = document.activeElement;
  // 칸 하나만 선택된 상태에서 입력칸 안에 커서가 있으면, 원래 브라우저의 텍스트 복사 동작에 맡긴다
  const singleCell = range.r0===range.r1 && range.c0===range.c1;
  if(singleCell && active && active.tagName==='INPUT' && active.closest('.cell-sel')) return;
  // 여러 칸이 선택된 경우: 지금 포커스가 입력칸 안에 있으면 브라우저가 "그 칸의 텍스트만" 복사해버려서
  // 우리가 만든 여러 칸 복사 결과를 덮어써 버리는 문제가 있었다. 그래서 기본 복사 동작을 막고,
  // 포커스도 잠깐 빼서 브라우저가 끼어들지 않게 한다.
  e.preventDefault();
  if(active && typeof active.blur==='function') active.blur();
  const flatCache = cellSelSource==='settingHelper' ? settingHelperFlatRowsCache : selectionFlatRowsCache;
  const flatCols = cellSelSource==='settingHelper' ? SETTING_HELPER_FLAT_COLS : SELECTION_FLAT_COLS;
  const lines = [];
  for(let r=range.r0; r<=range.r1; r++){
    const row = flatCache[r];
    if(!row) continue;
    const cols = [];
    for(let c=range.c0; c<=range.c1; c++){
      cols.push(String(row[flatCols[c]] ?? ''));
    }
    lines.push(cols.join('\t'));
  }
  if(lines.length===0) return;
  const text = lines.join('\n');
  copyToClipboard(text);
  document.querySelectorAll('.cell-sel.cell-sel-active').forEach(td=>{
    td.classList.add('cell-sel-copied');
    setTimeout(()=>td.classList.remove('cell-sel-copied'), 400);
  });
});
const SELECTION_FLAT_COLS = ['startDate','endDate','promoName','exposureSlot','exposureDate','brand','code','name','regPrice','instantDiscountPrice','finalBenefitPrice','rate'];
const SETTING_HELPER_FLAT_COLS = ['period','code','name','regPrice','reserveDiscount','instant','final','rate','link'];

/* 선정리스트 맨 앞에 체크박스 칼럼을 새로 추가하면서, 예전에 저장해둔 열 너비(인덱스 기준)가
   전부 한 칸씩 밀려버리는 문제가 있어 한 번만 보정해준다(이미 보정했으면 다시 하지 않음). */
function migrateSelectionsColWidthsOnce(){
  if(state.selectionsColWidthsMigrated) return;
  const widths = ensureColWidths('selections');
  const keys = Object.keys(widths).map(k=>parseInt(k,10)).filter(k=>!isNaN(k)).sort((a,b)=>b-a);
  keys.forEach(k=>{ widths[k+1] = widths[k]; });
  delete widths[0];
  state.selectionsColWidthsMigrated = true;
  saveState();
}

  // 드래그 선택/복사용 "평평한" 행 데이터를 미리 만들어둔다 (하나의 상품 = 한 행, 병합칸 값은 그대로 반복 보관)
  selectionFlatRowsCache = [];
  let flatRow = 0;

  return `

let codeLookupResults = null; // 화면 전용 상태(조회 결과), 새로고침하면 초기화됨
function buildProductCodeIndex(){
  const promo = ensurePromotion();
  const rows = [];
  promo.selections.forEach(s=>{
    (s.products||[]).forEach(p=>{
      if(!p.code) return;
      rows.push({
        code: String(p.code).trim(),
        name: p.name||'',
        promoName: s.promoName||'',
        brand: s.brand||'',
        startDate: s.startDate||'',
        endDate: s.endDate||'',
        finalBenefitPrice: p.finalBenefitPrice,
      });
    });
  });
  return rows;
}
function runCodeLookup(){
  const raw = document.getElementById('codeLookupInput').value;
  const codes = Array.from(new Set(raw.split(/[\n,\s]+/).map(s=>s.trim()).filter(Boolean)));
  if(codes.length===0){ codeLookupResults = null; render(); return; }
  const index = buildProductCodeIndex();
  codeLookupResults = codes.map(code=>{
    const matches = index.filter(r=>r.code===code).sort((a,b)=>(b.startDate||'').localeCompare(a.startDate||''));
    const prices = matches.map(m=>Number(m.finalBenefitPrice)).filter(v=>!isNaN(v) && v>0);
    const min = prices.length ? Math.min(...prices) : null;
    const max = prices.length ? Math.max(...prices) : null;
    const avg = prices.length ? Math.round(prices.reduce((s,v)=>s+v,0)/prices.length) : null;
    return {code, matches, min, max, avg};
  });
  render();
}
function clearCodeLookup(){
  codeLookupResults = null;
  const el = document.getElementById('codeLookupInput');
  if(el) el.value = '';
  render();
}

/* =========================================================================
   라이브 (캘린더 / 라이브 일정) — 브랜드는 프로모션의 브랜드 목록을 함께 씁니다
   ========================================================================= */
function ensureLive(){
  if(!state.live || typeof state.live!=='object'){
    state.live = { schedule: [], calendarFilter: {}, liveCalendarId: '', liveCalendarId2: '', liveCalendarId2BrandsText: '', performance: [] };
  }
  if(!Array.isArray(state.live.schedule)) state.live.schedule = [];
  if(!state.live.calendarFilter || typeof state.live.calendarFilter!=='object') state.live.calendarFilter = {};
  if(state.live.liveCalendarId===undefined) state.live.liveCalendarId = '';
  if(state.live.liveCalendarId2===undefined) state.live.liveCalendarId2 = '';
  if(state.live.liveCalendarId2BrandsText===undefined) state.live.liveCalendarId2BrandsText = '';
  if(!Array.isArray(state.live.performance)) state.live.performance = [];
  if(state.live.liveSalesSheetUrl===undefined) state.live.liveSalesSheetUrl = '';
  // 각 회차에 "대표 상품 3개(상품명·판매가)" 칸을 넣을 수 있게, 예전 데이터에도 빈 자리를 채워준다
  state.live.performance.forEach(p=>{
    if(!Array.isArray(p.products) || p.products.length!==3){
      const old = Array.isArray(p.products) ? p.products : [];
      p.products = [0,1,2].map(i=> old[i] || {name:'', price:''});
    }
  });
  return state.live;
}
/* 두 번째 라이브캘린더로 보낼지 여부를 정하는 브랜드 목록 (쉼표로 구분해서 저장) */
function liveCalendarId2Brands(){

/* =========================================================================
   라이브 현황 — 라이브 매출 데이터를 엑셀로 불러와서, 브랜드별로
   날짜별·요일별·시간별·쇼호스트별 매출 추이를 그래프로 보여준다.
   ========================================================================= */
let liveImportModalOpen = false;
let liveImportRows = null; // [{date, weekday, time, brand, host, content, sales}]
let liveImportMapping = {}; // { 원본브랜드명: 우리브랜드명 }
function openLiveImportModal(){ liveImportModalOpen = true; liveImportRows = null; liveImportMapping = {}; render(); }
function closeLiveImportModal(){ liveImportModalOpen = false; render(); }
/* 엑셀에서 읽은 행이든, 구글시트에서 읽은 행이든(둘 다 "헤더이름: 값" 형태의 객체 배열) 똑같은 방식으로
   열을 자동 인식하고 정리한다. 채널이 "네이버"가 아닌 행은 걸러낸다. */
/* 엑셀/구글시트의 "시간" 칸(예: 11:00)은 내부적으로 1899-12-30 기준 날짜+시각으로 저장되곤 해서,
   Date 객체로 오면 그대로 문자열로 바꿨을 때 엉뚱한 값이 나온다. 그래서 항상 "HH:mm"만 뽑아낸다. */
function normalizeExcelTimeToHM(v){
  if(v===undefined || v===null || v==='') return '';
  if(v instanceof Date && !isNaN(v)){
    return `${String(v.getHours()).padStart(2,'0')}:${String(v.getMinutes()).padStart(2,'0')}`;
  }
  const s = String(v).trim();
  const hmMatch = s.match(/(\d{1,2}):(\d{2})/); // "11:00", "2026-08-05 11:00" 등 어디에 있든 시:분만 뽑아낸다
  if(hmMatch) return `${hmMatch[1].padStart(2,'0')}:${hmMatch[2]}`;
  return s;
}
function parseLiveRows(rows){
  if(!rows || rows.length===0) return [];
  const headers = Object.keys(rows[0]);
  const dateCol = headers.find(h=>/날짜/.test(h)) || headers[0];
  const weekdayCol = headers.find(h=>/요일/.test(h)) || '';
  const timeCol = headers.find(h=>/시간/.test(h)) || '';
  const channelCol = headers.find(h=>/채널/.test(h)) || '';
  const brandCol = headers.find(h=>/브랜드/.test(h)) || '';
  const hostCol = headers.find(h=>/쇼호스트|호스트/.test(h)) || '';
  const contentCol = headers.find(h=>/행사내용|내용/.test(h)) || '';
  const salesCol = headers.find(h=>h==='라이브매출') || headers.find(h=>/라이브\s*매출/.test(h)) || headers.find(h=>/매출/.test(h)) || '';

  return rows.map(r=>{
    if(channelCol){
      const channel = String(r[channelCol]||'').trim();
      if(channel && !channel.includes('네이버')) return null;
    }
    const date = normalizeExcelDateToYMD(r[dateCol]) || String(r[dateCol]||'').trim();
    const brand = String(r[brandCol]||'').trim();
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date) || !brand) return null;
    return {
      date,
      weekday: weekdayCol ? String(r[weekdayCol]||'').trim() : '',
      time: timeCol ? normalizeExcelTimeToHM(r[timeCol]) : '',
      brand,
      host: hostCol ? String(r[hostCol]||'').trim() : '',
      content: contentCol ? String(r[contentCol]||'').trim() : '',
      sales: Number(sanitizePromoNumber(String(r[salesCol]||'0')))||0,
    };
  }).filter(Boolean);
}
function applyParsedLiveRows(parsed){
  if(parsed.length===0){ alert('"날짜 · 브랜드 · 라이브매출" 형태의 데이터를 찾지 못했어요. 시트/파일 구조를 확인해주세요.'); return; }
  liveImportRows = parsed;
  const promo = ensurePromotion();
  const uniqueBrands = Array.from(new Set(parsed.map(r=>r.brand)));
  liveImportMapping = {};
  uniqueBrands.forEach(b=>{ liveImportMapping[b] = guessBrandMatch(b, promo.brands); });
  liveImportModalOpen = true;
  render();
}
async function handleLiveImportFile(){
  const fileInput = document.getElementById('liveImportFile');
  const file = fileInput && fileInput.files[0];
  if(!file) return;
  if(typeof XLSX === 'undefined'){ alert('엑셀 처리 기능을 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침 후 다시 시도해주세요.'); return; }
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array', cellDates:false});
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rawRows = XLSX.utils.sheet_to_json(ws, {defval:''});
    if(rawRows.length===0){ alert('엑셀에서 데이터를 찾지 못했어요.'); return; }
    applyParsedLiveRows(parseLiveRows(rawRows));
  }catch(e){
    console.error(e);
    alert('엑셀 파일을 읽는 중 문제가 생겼어요. 파일 형식을 확인해주세요.');
  }
}
function updateLiveImportMapping(brandName, mapped){
  liveImportMapping[brandName] = mapped;
  render();
}
function runLiveImport(){
  if(!liveImportRows) return;
  const unmapped = Object.keys(liveImportMapping).filter(b=>!liveImportMapping[b]);
  if(unmapped.length>0){
    if(!confirm(`"${unmapped.join('", "')}" 브랜드는 매칭이 안 됐어요.\n이 브랜드들은 건너뛰고 나머지만 가져올까요?`)) return;
  }
  const live = ensureLive();
  let importedCount = 0, skippedCount = 0;
  liveImportRows.forEach(r=>{
    const brand = liveImportMapping[r.brand];
    if(!brand){ skippedCount++; return; }
    // 같은 날짜·시간·브랜드·호스트면 같은 라이브로 보고 다시 불러올 때 덮어쓴다(중복 방지)
    const key = `${r.date}_${r.time}_${brand}_${r.host}`;
    let entry = live.performance.find(p=>p._importKey===key);
    if(!entry){
      live.performance.push({id:uid(), _importKey:key, date:r.date, weekday:r.weekday, time:r.time, brand, host:r.host, content:r.content, sales:r.sales, products:[{name:'',price:''},{name:'',price:''},{name:'',price:''}]});
    } else {
      entry.weekday = r.weekday; entry.time = r.time; entry.host = r.host; entry.content = r.content; entry.sales = r.sales;
    }
    importedCount++;
    // 라이브 일정 · 라이브 캘린더는 더 이상 여기서 자동으로 안 만든다 — 날짜/시간 값이
    // 구글시트 쪽 사정으로 계속 어긋나서, 사용자가 라이브 일정은 엑셀로 직접 수기 입력하기로 함.
  });
  saveState();
  liveImportModalOpen = false;
  liveImportRows = null;
  render();
  alert(`${importedCount.toLocaleString('ko-KR')}건을 라이브 현황에 반영했어요.${skippedCount>0 ? `\n(브랜드 매칭이 안 된 ${skippedCount}건은 건너뛰었어요)` : ''}`);
}
function updateLivePerfTopProduct(id, idx, field, value){
  const live = ensureLive();
  const row = live.performance.find(p=>p.id===id);
  if(!row) return;
  if(!Array.isArray(row.products) || row.products.length!==3) row.products = [{name:'',price:''},{name:'',price:''},{name:'',price:''}];
  row.products[idx][field] = field==='price' ? sanitizePromoNumber(value) : value;
  saveState(); render();
}

async function fetchFromLiveSheet(btnEl){
  const url = (ensureLive().liveSalesSheetUrl||'').trim();
  if(!url){ alert('먼저 구글시트 웹앱 주소를 입력해주세요.'); return; }
  const label = btnEl ? btnEl.textContent : '';
  if(btnEl){ btnEl.textContent = '불러오는 중...'; btnEl.disabled = true; }
  try{
    // 브라우저가 예전 응답을 캐시해두고 있을 수 있어서, 매번 확실히 서버에 새로 물어보게 강제한다
    const bustedUrl = url + (url.includes('?') ? '&' : '?') + '_t=' + Date.now();
    const res = await fetch(bustedUrl, {method:'GET', cache:'no-store'});
    const text = await res.text();
    let parsed = null;
    try{ parsed = JSON.parse(text); }catch(e){}
    if(!parsed || !parsed.ok){
      alert('시트에서 데이터를 가져오지 못했어요.\n' + (parsed && parsed.error ? parsed.error : ('응답 이상: ' + text.slice(0,200))));
      return;
    }
    const rawRows = parsed.rows || [];
    if(rawRows.length===0){ alert('시트에서 데이터를 찾지 못했어요.'); return; }
    applyParsedLiveRows(parseLiveRows(rawRows));
  }catch(e){
    console.error('구글시트 불러오기 실패:', e);
    alert('구글시트에 연결하지 못했어요. 웹앱 주소가 맞는지, 배포가 되어있는지 확인해주세요.');
  }finally{
    if(btnEl){ btnEl.textContent = label; btnEl.disabled = false; }
  }
}

function liveProductPriceChart(rows){
  const sorted = rows.slice().sort((a,b)=> a.date.localeCompare(b.date) || (a.time||'').localeCompare(b.time||''));
  const labels = sorted.map(r=> r.date.slice(5) + (r.time?(' '+r.time):''));
  const colors = ['#FF6B9D','#2F6FED','#F0932B'];
  const series = [0,1,2].map(idx=>({
    color: colors[idx],
    name: `대표상품 ${idx+1}`,
    points: sorted.map((r,i)=>({
      i, label:labels[i],
      value: Number((r.products && r.products[idx] && r.products[idx].price) || 0),
      name: (r.products && r.products[idx] && r.products[idx].name) || '',
    })).filter(p=>p.value>0),
  }));
  const allVals = series.flatMap(s=>s.points.map(p=>p.value));
  if(allVals.length===0) return `<div class="empty">입력된 대표 상품 판매가가 없어요. 아래 표에서 회차별로 입력해보세요.</div>`;

  const W = 900, H = 200, padL = 56, padR = 20, padT = 16, padB = 34;
  const maxVal = Math.max(1, ...allVals);
  const ticks = niceAxisTicks(0, maxVal, 4);
  const niceMax = ticks[ticks.length-1] || maxVal;
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const n = sorted.length;
  const stepX = n>1 ? innerW/(n-1) : 0;
  const xOf = i => padL + i*stepX;
  const yOf = v => padT + innerH - (v/niceMax)*innerH;
  const showEveryN = Math.ceil(n/12) || 1;
  return `
    <div style="display:flex;gap:14px;margin-bottom:6px;flex-wrap:wrap">
      ${series.map(s=>`<div style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-secondary)"><span style="width:10px;height:10px;border-radius:50%;background:${s.color};display:inline-block"></span>${s.name}</div>`).join('')}
    </div>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px">
      ${ticks.map(t=>`
        <line x1="${padL}" y1="${yOf(t)}" x2="${W-padR}" y2="${yOf(t)}" stroke="#EEF1EE" stroke-width="1"/>
        <text x="${padL-8}" y="${yOf(t)+3}" font-size="9" fill="#9AA69C" text-anchor="end">${formatMiniAxisNumber(t)}</text>
      `).join('')}
      ${series.map(s=>{
        if(s.points.length===0) return '';
        const linePts = s.points.map(p=>`${xOf(p.i)},${yOf(p.value)}`).join(' ');
        return `
          <polyline points="${linePts}" fill="none" stroke="${s.color}" stroke-width="2"/>
          ${s.points.map(p=>`
            <circle cx="${xOf(p.i)}" cy="${yOf(p.value)}" r="2.6" fill="${s.color}"/>
            <circle cx="${xOf(p.i)}" cy="${yOf(p.value)}" r="10" fill="transparent" style="cursor:pointer"
              onmousemove="showChartTooltip(event,'${s.name}${p.name?(' · '+String(p.name).replace(/'/g,"\\'")):''}: ${formatWon(p.value)}')" onmouseleave="hideChartTooltip()"/>
          `).join('')}
        `;
      }).join('')}
      ${labels.map((l,i)=> i%showEveryN===0 ? `<text x="${xOf(i)}" y="${H-10}" font-size="8.5" fill="#9AA69C" text-anchor="middle">${l}</text>` : '').join('')}
    </svg>
  `;
}

        </div>`;
      }).join('')}
    </div>
  `;
}
/* 차트의 점 위에 마우스를 올리면 값이 뜨는 작은 말풍선. SVG 기본 title은 뜨는 게 느리고 잘 안 보여서,
   직접 마우스 위치를 따라다니는 말풍선을 하나 만들어서 여러 차트가 공용으로 쓴다. */
function showChartTooltip(evt, text){
  let tip = document.getElementById('chartTooltip');
  if(!tip){
    tip = document.createElement('div');
    tip.id = 'chartTooltip';
    document.body.appendChild(tip);
  }
  tip.textContent = text;
  tip.style.display = 'block';
  tip.style.left = (evt.clientX + 12) + 'px';
  tip.style.top = (evt.clientY - 12) + 'px';
}
function hideChartTooltip(){
  const tip = document.getElementById('chartTooltip');
  if(tip) tip.style.display = 'none';
}
function liveDateLineChart(points){
  if(points.length===0) return `<div class="empty">데이터가 없습니다.</div>`;
  const W = 900, H = 200, padL = 56, padR = 20, padT = 16, padB = 34;
  const maxVal = Math.max(1, ...points.map(p=>p.value));
  const ticks = niceAxisTicks(0, maxVal, 4);
  const niceMax = ticks[ticks.length-1] || maxVal;
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const stepX = points.length>1 ? innerW/(points.length-1) : 0;
  const xOf = i => padL + i*stepX;
  const yOf = v => padT + innerH - (v/niceMax)*innerH;
  const linePoints = points.map((p,i)=>`${xOf(i)},${yOf(p.value)}`).join(' ');
  const showEveryN = Math.ceil(points.length/12) || 1;
  return `
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px">
      ${ticks.map(t=>`
        <line x1="${padL}" y1="${yOf(t)}" x2="${W-padR}" y2="${yOf(t)}" stroke="#EEF1EE" stroke-width="1"/>
        <text x="${padL-8}" y="${yOf(t)+3}" font-size="9" fill="#9AA69C" text-anchor="end">${formatMiniAxisNumber(t)}</text>
      `).join('')}
      <polyline points="${linePoints}" fill="none" stroke="#7C4DFF" stroke-width="2"/>
      ${points.map((p,i)=>`
        <circle cx="${xOf(i)}" cy="${yOf(p.value)}" r="2.6" fill="#7C4DFF"/>
        <circle cx="${xOf(i)}" cy="${yOf(p.value)}" r="10" fill="transparent" style="cursor:pointer"
          onmousemove="showChartTooltip(event,'${p.label}: ${formatWon(p.value)}')" onmouseleave="hideChartTooltip()"/>
      `).join('')}
      ${points.map((p,i)=> i%showEveryN===0 ? `<text x="${xOf(i)}" y="${H-10}" font-size="8.5" fill="#9AA69C" text-anchor="middle">${p.label}</text>` : '').join('')}
    </svg>
  `;
}

let liveCalView = null;
function ensureLiveCalView(){
  if(!liveCalView){ const t=new Date(); liveCalView={y:t.getFullYear(), m:t.getMonth()+1}; }
  return liveCalView;
}
function liveCalPrev(){ const v=ensureLiveCalView(); v.m--; if(v.m<1){v.m=12; v.y--;} render(); }
function liveCalNext(){ const v=ensureLiveCalView(); v.m++; if(v.m>12){v.m=1; v.y++;} render(); }
function liveCalToday(){ liveCalView=null; render(); }

  function eventsOnDay(dateStr){
    return live.schedule.filter(s=>{
      if(s.date !== dateStr) return false;
      if(s.brand && !isLiveBrandVisible(s.brand)) return false;
      return true;
    }).sort((a,b)=> (a.time||'').localeCompare(b.time||''));
  }

  let weekRows = '';
  for(let w=0; w<cells.length/7; w++){
    weekRows += '<tr>';

      const day = cells[w*7+c];
      if(day===null){ weekRows += `<td class="promo-cal-cell empty-cell"></td>`; continue; }
      const dateStr = `${y}-${pad2(m)}-${pad2(day)}`;
      const evs = eventsOnDay(dateStr);
      const isToday = dateStr===todayStr2;

              return `
              <div class="promo-cal-chip" style="background:${chipColor}22;color:${chipColor}" title="${label}${ev.content?' · '+ev.content:''}">
                <span class="promo-cal-chip-dot" style="background:${chipColor}"></span>${label}${heart}

          </div>
        </td>`;
    }
    weekRows += '</tr>';
  }

  return `

const AD_DASH_HIDE = ['코어루틴','게이트맨','아사아블로이']; // 대시보드 알람에서 제외하는 항목
function adLowBalanceList(){
  const p = ensureChargePlan(); const out = []; let blank = 0;
  chargePlanRows().forEach(r=>{
    if(r.adType==='brgeom' || AD_DASH_HIDE.includes(r.key)) return;
    const v = p.rows[chargePlanRowId(r)] || {};
    let bal = (v.balance===undefined || v.balance==='') ? null : Number(v.balance);
    if(bal===null && r.adType==='bizwallet'){ // 충전 탭에 잔액을 안 넣었어도 비즈월렛은 충전·소진 기록으로 계산한 잔액이 있다
      const bw = ensureBizwallet();
      if(bw.charges.some(c=>c.brand===r.key) || bw.usages.some(u=>u.brand===r.key) || bw.initialBalance[r.key]) bal = computeBizwalletBalance(r.key);
    }
    if(bal===null || isNaN(bal)){ blank++; return; }
    if(bal < AD_LOW_BALANCE_LIMIT){
      const avg = Number(v.avg)||0;
      out.push({adName:r.adName, name:r.key, bal, daysLeft: avg>0 ? Math.max(0,bal)/avg : null});
    }
  });
  out.sort((a,b)=>a.bal-b.bal);
  return {list:out, blank};
}

    if(c.ended || !c.deadline) return;

    if(Math.round((today-dl)/86400000) >= 2) return; // 기한이 2일 이상 지난 건은 자동으로 숨김
    const bd = businessDaysUntil(c.deadline);
    if(bd===null || bd>3) return;
    if(c.price && c.price!=='진행예정') return; // 기준은 가격 셋팅만 — 가격이 끝났으면 알람에서 뺀다

}

   쇼검 / GFA (공용 렌더 — 월예산 + 이월 로직)

/* 쇼검/GFA 공용: 충전 비용 계산기 — 계정(브랜드)별로 입력값을 기억해둔다 */
function ensureCalcInputs(sectionKey){
  if(!state[sectionKey].calcInputs || typeof state[sectionKey].calcInputs!=='object') state[sectionKey].calcInputs = {};
  return state[sectionKey].calcInputs;
}
function getCalcInput(sectionKey, key){
  const all = ensureCalcInputs(sectionKey);
  if(!all[key]) all[key] = {avgDaily:'', nextDate:''};
  return all[key];
}
function updateCalcInput(sectionKey, key, field, value){
  const rec = getCalcInput(sectionKey, key);
  rec[field] = value;
  saveState(); render();
}
/* 오늘 00시부터 다음 충전일까지(당일 포함) 며칠인지 계산해서 그만큼의 금액을 구한다.
   예) 오늘 7/1, 다음 충전일 7/5 → 5일치(7/1,2,3,4,5) */
function calcChargeNeeded(avgDaily, nextDateStr){
  if(!nextDateStr) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const next = new Date(nextDateStr+'T00:00:00');
  if(isNaN(next.getTime())) return null;
  const days = Math.round((next - today)/86400000) + 1;
  if(days<=0) return {days, amount:0};
  return {days, amount: Math.round(Number(avgDaily||0) * days)};
}
function renderShogeomOrGfa(sectionKey){
  const isShogeom = sectionKey==='shogeom';
  const list = isShogeom ? shogeomAccounts() : gfaBrandsList();
  const keyField = isShogeom ? 'account' : 'brand';
  const picked = currentPick[sectionKey];
  const item = list.find(x=>x.id===picked) || list[0];

  const rows = computeMonthlyBudget(sectionKey, item.id, state[sectionKey].charges, keyField);
  const tm = todayMonth();
  const thisMonthRow = rows[tm-1];
  const color = isShogeom ? 'var(--c-shogeom)' : 'var(--c-gfa)';
  const calcInput = getCalcInput(sectionKey, item.id);

  const mainHtml = `

    <div class="stat-grid" style="margin-top:16px">
      <div class="stat-box"><div class="label">${ymLabel(tm)} 월예산</div><div class="value mono">${formatWon(thisMonthRow.budget)}</div></div>
      <div class="stat-box"><div class="label">이월잔액</div><div class="value mono">${formatWon(thisMonthRow.rollover)}</div></div>
      <div class="stat-box"><div class="label">당월충전액</div><div class="value mono">${formatWon(thisMonthRow.charged)}</div></div>
      <div class="stat-box"><div class="label">예산잔액</div><div class="value mono ${valClass(thisMonthRow.balance)}">${formatWon(thisMonthRow.balance)}</div></div>
    </div>

    <div class="card">
      <h2>충전 내역 — ${item.id}</h2>
      ${renderChargeTable(charges, sectionKey)}
      <div class="add-form">
        <div class="field"><label>날짜</label><input type="date" id="newDate_${sectionKey}" onpaste="handleDatePaste(event)" value="${todayStr()}"></div>
        <div class="field"><label>충전금액</label><input type="number" step="10000" id="newAmount_${sectionKey}" placeholder="0"></div>
        <div class="field"><label>메모</label><input type="text" id="newMemo_${sectionKey}" placeholder="선택 입력"></div>
        <button class="btn" onclick="addCharge('${sectionKey}','${keyField}','${item.id}')">+ 충전 내역 추가</button>
      </div>
    </div>

    <div class="card">
      <h2>🧮 충전 비용 계산기 — ${item.id}</h2>
      <div class="add-form" style="border-top:none;padding-top:0">
        <div class="field"><label>일평균 소진액</label>
          <input type="number" step="1000" value="${calcInput.avgDaily||''}" placeholder="0" onchange="updateCalcInput('${sectionKey}','${item.id}','avgDaily',this.value)">
        </div>
        <div class="field"><label>다음 충전 날짜</label>
          <input type="date" onpaste="handleDatePaste(event)" value="${calcInput.nextDate||''}" onchange="updateCalcInput('${sectionKey}','${item.id}','nextDate',this.value)">
        </div>
      </div>
      ${calcResult ? `
      <div class="stat-grid" style="margin-top:14px">
        <div class="stat-box"><div class="label">오늘부터 ${calcResult.days}일치 필요 금액</div><div class="value mono">${formatWon(calcResult.amount)}</div></div>
      </div>
      <div class="helptext">오늘(${todayStr()}) 00시부터 <b>${calcInput.nextDate}</b>까지 총 <b>${calcResult.days}일</b> 기준으로, 일평균 소진액 × 일수로 계산했어요.</div>
      ` : `<div class="helptext">일평균 소진액과 다음 충전 날짜를 넣으면, 오늘부터 그날까지 필요한 충전 금액이 계산돼요.</div>`}
    </div>

    <div class="card">
      <h2>월별 예산 현황 (${YEAR}년)</h2>
      <table>
        <thead><tr>
          <th>년월</th><th class="num">월예산</th><th class="num">이월잔액</th><th class="num">당월충전액</th><th class="num">예산잔액</th>
        </tr></thead>
        <tbody>
          ${rows.map(r=>`
            <tr class="${r.m===tm?'current-month':''}">
              <td>${ymLabel(r.m)}</td>
              <td class="num">
                <input class="row-input" type="number" step="10000" value="${budgetInputVal(sectionKey,item.id,r.m)}"
                  onchange="updateBudget('${sectionKey}','${item.id}',${r.m},this.value)" placeholder="0">
              </td>
              <td class="num">
                <input class="row-input" type="number" step="10000" value="${rolloverInputVal(sectionKey,item.id,r)}"
                  onchange="updateRollover('${sectionKey}','${item.id}',${r.m},this.value)" placeholder="0">
              </td>
              <td class="num mono">${formatWon(r.charged)}</td>
              <td class="num mono ${valClass(r.balance)}">${formatWon(r.balance)}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
      <div class="helptext"><b>월예산</b>은 매달 직접 입력하세요. <b>이월잔액</b>은 전월 예산잔액을 기준으로 자동 계산되지만, 셀을 클릭해 언제든 직접 수정할 수 있습니다 — 예를 들어 8월부터 이 시트를 사용하기 시작했고 7월에 이미 남은 잔액이 있다면, 8월 이월잔액 칸에 그 실제 잔액을 직접 입력하면 됩니다. (입력한 이월잔액만큼 그 달 예산잔액에서도 차감됩니다)</div>
    </div>
  `;

  const sideHtml = renderBrandList(sectionKey, list, item.id, x=>x.id);
  return `<div class="page-layout"><div class="page-main">${mainHtml}</div>${sideHtml}</div>`;
}

/* 우측 체크박스 리스트 — 클릭하면 바로 해당 계정/브랜드 화면으로 전환 */
function renderBrandList(sectionKey, list, activeId, getLabel){
  return `
    <div class="page-side">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:2px">
        <h3 style="margin:0">계정 · 브랜드</h3>
        <button class="btn-del" style="font-size:13px" onclick="addAdBrand('${sectionKey}')" title="계정/브랜드 추가">➕</button>
      </div>
      ${list.map(item=>{
        const id = typeof item==='string' ? item : item.id;
        const checked = id===activeId;
        const label = getLabel ? getLabel(item) : id;
        return `
        <div class="side-item-row">
          <label class="side-item ${checked?'active':''}" style="flex:1;margin:0">
            <input type="checkbox" ${checked?'checked':''} onclick="event.preventDefault(); pickItem('${sectionKey}','${id.replace(/'/g,"\\'")}')">
            <span class="lbl">${label}</span>
          </label>
          <button class="side-item-del" onclick="event.preventDefault(); deleteAdBrand('${sectionKey}','${id.replace(/'/g,"\\'")}')" title="삭제">✕</button>
        </div>`;
