function updateSelectionField(id, field, value){
  const promo = ensurePromotion();
  const row = promo.selections.find(s=>s.id===id);
  if(!row) return;
  row[field] = value;
  touch(row);
  saveState(); render();
  scheduleSelectionSheetSync(id);
}
function addSelectionProduct(entryId){
  const promo = ensurePromotion();
  const row = promo.selections.find(s=>s.id===entryId);
  if(!row) return;
  row.products.push({id:uid(), code:'', name:'', regPrice:'', instantDiscountPrice:'', finalBenefitPrice:''});
  touch(row);
  saveState(); render();
  scheduleSelectionSheetSync(entryId);
}
function deleteSelectionProduct(entryId, productId){
  const promo = ensurePromotion();
  const row = promo.selections.find(s=>s.id===entryId);
  if(!row) return;
  if(row.products.length<=1){
    // 상품이 1개뿐이면 삭제 대신 값만 비워서 최소 1행 구조를 유지
    row.products = [{id:uid(), code:'', name:'', regPrice:'', instantDiscountPrice:'', finalBenefitPrice:''}];
  } else {
    row.products = row.products.filter(p=>p.id!==productId);
  }
  touch(row);
  saveState(); render();
  scheduleSelectionSheetSync(entryId);
}
function updateSelectionProductField(entryId, productId, field, value){
  const promo = ensurePromotion();
  const row = promo.selections.find(s=>s.id===entryId);
  if(!row) return;
  const p = row.products.find(x=>x.id===productId);
  if(!p) return;
  p[field] = PROMO_PRODUCT_NUMERIC_FIELDS.includes(field) ? sanitizePromoNumber(value) : value;
  touch(row);
  saveState(); render();
  scheduleSelectionSheetSync(entryId);
}
/* 엑셀/구글 스프레드시트에서 여러 셀을 복사해 붙여넣으면(탭=열 구분, 줄바꿈=행 구분)
   자동으로 부족한 상품 행을 추가하면서 각 칸에 채워 넣는다.
   가격 칸(등록가/즉시할인가/최종혜택가)은 number 입력이라 "10,000"처럼 콤마가 섞이면
   그대로는 절대 들어가지 않으므로, 붙여넣을 때 숫자만 남기고 자동으로 정리한다. */
const PROMO_PRODUCT_FIELD_ORDER = ['code','name','regPrice','instantDiscountPrice','finalBenefitPrice'];
const PROMO_PRODUCT_NUMERIC_FIELDS = ['regPrice','instantDiscountPrice','finalBenefitPrice'];
function sanitizePromoNumber(v){
  if(v===undefined || v===null) return '';
  const cleaned = String(v).trim().replace(/[^\d.\-]/g,'');
  return cleaned;
}
function handlePastePromoProduct(e, entryId, productId, field){
  const text = (e.clipboardData || window.clipboardData).getData('text');
  if(!text) return;
  const isMultiCell = text.includes('\t') || text.includes('\n');
  const isNumericField = PROMO_PRODUCT_NUMERIC_FIELDS.includes(field);
  // 여러 칸을 붙여넣는 경우, 그리고 가격 칸에 단일 값(콤마 포함 가능)을 붙여넣는 경우 모두 직접 처리
  if(!isMultiCell && !isNumericField) return; // 그 외 단일 값 붙여넣기는 브라우저 기본 동작 사용
  e.preventDefault();
  const promo = ensurePromotion();
  const row = promo.selections.find(s=>s.id===entryId);
  if(!row) return;
  const startRowIdx = row.products.findIndex(p=>p.id===productId);
  if(startRowIdx===-1) return;
  const startColIdx = PROMO_PRODUCT_FIELD_ORDER.indexOf(field);
  const lines = text.replace(/\r/g,'').split('\n').filter((line,i,arr)=> !(i===arr.length-1 && line===''));
  lines.forEach((line, li)=>{
    const cells = line.split('\t');
    const rowIdx = startRowIdx + li;
    while(row.products.length <= rowIdx){
      row.products.push({id:uid(), code:'', name:'', regPrice:'', instantDiscountPrice:'', finalBenefitPrice:''});
    }
    cells.forEach((val, ci)=>{
      const colIdx = startColIdx + ci;
      if(colIdx>=0 && colIdx<PROMO_PRODUCT_FIELD_ORDER.length){
        const fname = PROMO_PRODUCT_FIELD_ORDER[colIdx];
        row.products[rowIdx][fname] = PROMO_PRODUCT_NUMERIC_FIELDS.includes(fname) ? sanitizePromoNumber(val) : val.trim();
      }
    });
  });
  saveState(); render();
  scheduleSelectionSheetSync(entryId);
}

const SELECTIONS_COL_DEFAULTS = [30,22,100,100,130,84,100,104,96,110,86,86,86,58,26,30];
const SELECTIONS_COL_LABELS = ['','시작일','종료일','프로모션명','노출구좌','노출일','브랜드','상품코드','상품명','등록가','즉시할인가','최종혜택가','할인율','',''];
let selectedSelectionIds = new Set(); // 화면 전용 상태 — 선정리스트 체크박스로 선택된 항목 id들

/* 선정리스트: 표의 어느 칸이든 마우스로 드래그하면 사각형 영역이 선택되고, Ctrl+C(맥은 Cmd+C)로
   그 영역을 엑셀에 붙여넣기 좋은 형태(탭/줄바꿈 구분)로 클립보드에 복사할 수 있다.
   시작일·프로모션명처럼 여러 상품에 걸쳐 병합된(rowspan) 칸은, 실제로는 화면에 한 번만 그려지지만
   "이 칸이 몇 번째 행부터 몇 행까지를 덮고 있는지"(data-rspan)를 같이 기록해두고, 그 범위를
   선택/복사할 때는 병합된 값을 각 행에 반복해서 채워 넣는다(스프레드시트에서 병합칸을 복사할 때와 동일).
   렌더링할 때 selectionFlatRowsCache에 "상품 1건 = 1행" 기준의 실제 값들을 함께 저장해두고 복사 시 사용한다. */
let selectionFlatRowsCache = [];
let cellSelStart = null; // {r,c}
let cellSelEnd = null;
let cellSelDragging = false;
function cellSelRange(){
  if(!cellSelStart || !cellSelEnd) return null;
  return {
    r0: Math.min(cellSelStart.r, cellSelEnd.r), r1: Math.max(cellSelStart.r, cellSelEnd.r),
    c0: Math.min(cellSelStart.c, cellSelEnd.c), c1: Math.max(cellSelStart.c, cellSelEnd.c),
  };
}
function isCellInSelRange(r, c, rspan){
  const range = cellSelRange();
  if(!range) return false;
  const r1 = r + (rspan||1) - 1;
  return r1>=range.r0 && r<=range.r1 && c>=range.c0 && c<=range.c1;
}
function applyCellSelectHighlights(){
  document.querySelectorAll('.cell-sel').forEach(td=>{
    const r = parseInt(td.dataset.r,10), c = parseInt(td.dataset.c,10), rspan = parseInt(td.dataset.rspan||'1',10);
    td.classList.toggle('cell-sel-active', isCellInSelRange(r,c,rspan));
  });
}
function startCellSelect(r, c, e){
  cellSelDragging = true;
  cellSelStart = {r,c};
  cellSelEnd = {r,c};
  applyCellSelectHighlights();
}
function extendCellSelect(r, c){
  if(!cellSelDragging) return;
  cellSelEnd = {r,c};
  applyCellSelectHighlights();
}
document.addEventListener('mouseup', function(){ cellSelDragging = false; });
document.addEventListener('keydown', function(e){
  if(!(e.ctrlKey || e.metaKey) || e.key.toLowerCase()!=='c') return;
  const range = cellSelRange();
  if(!range) return;
  const active = document.activeElement;
  // 칸 하나만 선택된 상태에서 입력칸 안에 커서가 있으면, 원래 브라우저의 텍스트 복사 동작에 맡긴다
  const singleCell = range.r0===range.r1 && range.c0===range.c1;
  if(singleCell && active && active.tagName==='INPUT' && active.closest('.cell-sel')) return;
  // 여러 칸이 선택된 경우: 지금 포커스가 입력칸 안에 있으면 브라우저가 "그 칸의 텍스트만" 복사해버려서
  // 우리가 만든 여러 칸 복사 결과를 덮어써 버리는 문제가 있었다. 그래서 기본 복사 동작을 막고,
  // 포커스도 잠깐 빼서 브라우저가 끼어들지 않게 한다.
  e.preventDefault();
  if(active && typeof active.blur==='function') active.blur();
  const lines = [];
  for(let r=range.r0; r<=range.r1; r++){
    const row = selectionFlatRowsCache[r];
    if(!row) continue;
    const cols = [];
    for(let c=range.c0; c<=range.c1; c++){
      cols.push(String(row[SELECTION_FLAT_COLS[c]] ?? ''));
    }
    lines.push(cols.join('\t'));
  }
  if(lines.length===0) return;
  const text = lines.join('\n');
  copyToClipboard(text);
  document.querySelectorAll('.cell-sel.cell-sel-active').forEach(td=>{
    td.classList.add('cell-sel-copied');
    setTimeout(()=>td.classList.remove('cell-sel-copied'), 400);
  });
});
const SELECTION_FLAT_COLS = ['startDate','endDate','promoName','exposureSlot','exposureDate','brand','code','name','regPrice','instantDiscountPrice','finalBenefitPrice','rate'];

function toggleSelectionCheck(id){
  if(selectedSelectionIds.has(id)) selectedSelectionIds.delete(id);
  else selectedSelectionIds.add(id);
  render();
}
function toggleAllSelectionChecks(visibleIds){
  const allChecked = visibleIds.length>0 && visibleIds.every(id=>selectedSelectionIds.has(id));
  if(allChecked) visibleIds.forEach(id=>selectedSelectionIds.delete(id));
  else visibleIds.forEach(id=>selectedSelectionIds.add(id));
  render();
}
function deleteSelectedSelections(){
  const n = selectedSelectionIds.size;
  if(n===0){ alert('삭제할 항목을 먼저 체크해주세요.'); return; }
  if(!confirm(`선택한 ${n}개 항목을 삭제할까요?\n이 작업은 되돌릴 수 없습니다.`)) return;
  const promo = ensurePromotion();
  promo.selections = promo.selections.filter(s=>!selectedSelectionIds.has(s.id));
  selectedSelectionIds.clear();
  saveState(); render();
}
function formatPriceDisplay(v){
  if(v===undefined || v===null || v==='') return '';
  const n = Number(v);
  if(isNaN(n)) return v;
  return n.toLocaleString('ko-KR');
}
/* 선정리스트 맨 앞에 체크박스 칼럼을 새로 추가하면서, 예전에 저장해둔 열 너비(인덱스 기준)가
   전부 한 칸씩 밀려버리는 문제가 있어 한 번만 보정해준다(이미 보정했으면 다시 하지 않음). */
function migrateSelectionsColWidthsOnce(){
  if(state.selectionsColWidthsMigrated) return;
  const widths = ensureColWidths('selections');
  const keys = Object.keys(widths).map(k=>parseInt(k,10)).filter(k=>!isNaN(k)).sort((a,b)=>b-a);
  keys.forEach(k=>{ widths[k+1] = widths[k]; });
  delete widths[0];
  state.selectionsColWidthsMigrated = true;
  saveState();
}

            const entryStartRow = flatRow;
            const rowsHtml = s.products.map((p, pi)=>{

            return rowsHtml;
          }).join('')}

  `;

/* =========================================================================
   코드 조회 (선정리스트의 상품코드로 과거 선정 이력·최저/최고/평균 선정가 조회)

let codeLookupResults = null; // 화면 전용 상태(조회 결과), 새로고침하면 초기화됨
function buildProductCodeIndex(){
  const promo = ensurePromotion();
  const rows = [];
  promo.selections.forEach(s=>{
    (s.products||[]).forEach(p=>{
      if(!p.code) return;
      rows.push({
        code: String(p.code).trim(),
        name: p.name||'',
        promoName: s.promoName||'',
        brand: s.brand||'',
        startDate: s.startDate||'',
        endDate: s.endDate||'',
        finalBenefitPrice: p.finalBenefitPrice,
      });
    });
  });
  return rows;
}
function runCodeLookup(){
  const raw = document.getElementById('codeLookupInput').value;
  const codes = Array.from(new Set(raw.split(/[\n,\s]+/).map(s=>s.trim()).filter(Boolean)));
  if(codes.length===0){ codeLookupResults = null; render(); return; }
  const index = buildProductCodeIndex();
  codeLookupResults = codes.map(code=>{
    const matches = index.filter(r=>r.code===code).sort((a,b)=>(b.startDate||'').localeCompare(a.startDate||''));
    const prices = matches.map(m=>Number(m.finalBenefitPrice)).filter(v=>!isNaN(v) && v>0);
    const min = prices.length ? Math.min(...prices) : null;
    const max = prices.length ? Math.max(...prices) : null;
    const avg = prices.length ? Math.round(prices.reduce((s,v)=>s+v,0)/prices.length) : null;
    return {code, matches, min, max, avg};
  });
  render();
}
function clearCodeLookup(){
  codeLookupResults = null;
  const el = document.getElementById('codeLookupInput');
  if(el) el.value = '';
  render();
}

function ensureLive(){
  if(!state.live || typeof state.live!=='object'){
    state.live = { schedule: [], calendarFilter: {}, liveCalendarId: '', liveCalendarId2: '', liveCalendarId2BrandsText: '' };
  }
  if(!Array.isArray(state.live.schedule)) state.live.schedule = [];
  if(!state.live.calendarFilter || typeof state.live.calendarFilter!=='object') state.live.calendarFilter = {};
  if(state.live.liveCalendarId===undefined) state.live.liveCalendarId = '';
  if(state.live.liveCalendarId2===undefined) state.live.liveCalendarId2 = '';
  if(state.live.liveCalendarId2BrandsText===undefined) state.live.liveCalendarId2BrandsText = '';
  return state.live;
}
/* 두 번째 라이브캘린더로 보낼지 여부를 정하는 브랜드 목록 (쉼표로 구분해서 저장) */

let liveCalView = null;
function ensureLiveCalView(){
  if(!liveCalView){ const t=new Date(); liveCalView={y:t.getFullYear(), m:t.getMonth()+1}; }
  return liveCalView;
}
function liveCalPrev(){ const v=ensureLiveCalView(); v.m--; if(v.m<1){v.m=12; v.y--;} render(); }
function liveCalNext(){ const v=ensureLiveCalView(); v.m++; if(v.m>12){v.m=1; v.y++;} render(); }
function liveCalToday(){ liveCalView=null; render(); }

function renderLiveCalendar(){
  const promo = ensurePromotion();
  const live = ensureLive();
  const view = ensureLiveCalView();
  const y = view.y, m = view.m;
  const firstWeekday = new Date(y, m-1, 1).getDay();
  const daysInMonth = new Date(y, m, 0).getDate();
  const pad2 = n => String(n).padStart(2,'0');
  const allBrandsInUse = brandsInUseFor(live.schedule);

  const cells = [];
  for(let i=0;i<firstWeekday;i++) cells.push(null);
  for(let d=1; d<=daysInMonth; d++) cells.push(d);
  while(cells.length % 7 !== 0) cells.push(null);

  const todayStr2 = todayStr();

  function eventsOnDay(dateStr){
    return live.schedule.filter(s=>{
      if(s.date !== dateStr) return false;
      if(s.brand && !isLiveBrandVisible(s.brand)) return false;
      return true;
    }).sort((a,b)=> (a.time||'').localeCompare(b.time||''));
  }

  let weekRows = '';
  for(let w=0; w<cells.length/7; w++){
    weekRows += '<tr>';
    for(let c=0; c<7; c++){
      const day = cells[w*7+c];
      if(day===null){ weekRows += `<td class="promo-cal-cell empty-cell"></td>`; continue; }
      const dateStr = `${y}-${pad2(m)}-${pad2(day)}`;
      const evs = eventsOnDay(dateStr);
      const isToday = dateStr===todayStr2;
      const wd = new Date(y,m-1,day).getDay();
      weekRows += `
        <td class="promo-cal-cell ${isToday?'is-today':''}">
          <div class="promo-cal-daynum ${wd===0?'sun':''} ${wd===6?'sat':''}">${day}</div>
          <div class="promo-cal-events">
            ${evs.map(ev=>{
              const label = `${ev.brand||'(브랜드 미정)'}(${ev.time||'-'})`;
              const chipColor = promoBrandColor(ev.brand||'');
              const heart = ev.content ? ' <span style="color:#2F6FED">💙</span>' : '';
              return `
              <div class="promo-cal-chip" style="background:${chipColor}22;color:${chipColor}" title="${label}${ev.content?' · '+ev.content:''}">
                <span class="promo-cal-chip-dot" style="background:${chipColor}"></span>${label}${heart}
              </div>
            `;}).join('')}
          </div>
        </td>`;
    }
    weekRows += '</tr>';
  }

  return `
    <div class="page-header">
      <div>
        <span class="eyebrow" style="background:#00B8A922;color:#00B8A9">라이브</span>
        <h1>캘린더</h1>
        <div class="sub">라이브 일정에 등록한 내용이 "브랜드(시간)" 형태로 자동 표시돼요 · 행사내용을 채우면 💙 표시가 붙어요</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <button class="btn ghost" onclick="liveCalPrev()" style="color:var(--text-primary)">◀</button>
        <div style="font-weight:800;font-size:15px;min-width:96px;text-align:center">${y}년 ${m}월</div>
        <button class="btn ghost" onclick="liveCalNext()" style="color:var(--text-primary)">▶</button>
        <button class="btn ghost" onclick="liveCalToday()" style="color:var(--text-primary)">오늘</button>
      </div>
    </div>

    ${renderLiveBrandFilterBar(allBrandsInUse)}

    <div class="card">
      <table class="promo-cal-table">
        <thead><tr>${PROMO_WEEKDAY_KR.map((w,i)=>`<th class="${i===0?'sun':''} ${i===6?'sat':''}">${w}</th>`).join('')}</tr></thead>
        <tbody>${weekRows}</tbody>
      </table>
    </div>
  `;
}

    const sums = monthlyCharged(state.seosea.charges,'brand',b);
    seoseaCharged += sums[tm]||0;
  });
  // 브검 - 이번달 시작된 일정의 충전액 합계

  brgeomBrandsList().forEach(item=>{
    const c = brgCurrentForDash[item.id];

  });
  // 브검 - 종료 임박(7일 이내, 만료 포함) 목록
  const brgToday = new Date(); brgToday.setHours(0,0,0,0);
  const brgeomImminent = [];

      const end = new Date(endStr); end.setHours(0,0,0,0);

      if(days<=7) brgeomImminent.push({brand:item.id, type, end:endStr, days});

/* =========================================================================
   쇼검 / GFA (공용 렌더 — 월예산 + 이월 로직)

/* 쇼검/GFA 공용: 충전 비용 계산기 — 계정(브랜드)별로 입력값을 기억해둔다 */
function ensureCalcInputs(sectionKey){
  if(!state[sectionKey].calcInputs || typeof state[sectionKey].calcInputs!=='object') state[sectionKey].calcInputs = {};
  return state[sectionKey].calcInputs;
}
function getCalcInput(sectionKey, key){
  const all = ensureCalcInputs(sectionKey);
  if(!all[key]) all[key] = {avgDaily:'', nextDate:''};
  return all[key];
}
function updateCalcInput(sectionKey, key, field, value){
  const rec = getCalcInput(sectionKey, key);
  rec[field] = value;
  saveState(); render();
}
/* 오늘 00시부터 다음 충전일까지(당일 포함) 며칠인지 계산해서 그만큼의 금액을 구한다.
   예) 오늘 7/1, 다음 충전일 7/5 → 5일치(7/1,2,3,4,5) */
function calcChargeNeeded(avgDaily, nextDateStr){
  if(!nextDateStr) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const next = new Date(nextDateStr+'T00:00:00');
  if(isNaN(next.getTime())) return null;
  const days = Math.round((next - today)/86400000) + 1;
  if(days<=0) return {days, amount:0};
  return {days, amount: Math.round(Number(avgDaily||0) * days)};
}
function renderShogeomOrGfa(sectionKey){
  const isShogeom = sectionKey==='shogeom';
  const list = isShogeom ? shogeomAccounts() : gfaBrandsList();
  const keyField = isShogeom ? 'account' : 'brand';
  const picked = currentPick[sectionKey];
  const item = list.find(x=>x.id===picked) || list[0];

  const rows = computeMonthlyBudget(sectionKey, item.id, state[sectionKey].charges, keyField);
  const tm = todayMonth();

  const calcInput = getCalcInput(sectionKey, item.id);

      <div class="stat-box"><div class="label">${ymLabel(tm)} 월예산</div><div class="value mono">${formatWon(thisMonthRow.budget)}</div></div>
      <div class="stat-box"><div class="label">이월잔액</div><div class="value mono">${formatWon(thisMonthRow.rollover)}</div></div>
      <div class="stat-box"><div class="label">당월충전액</div><div class="value mono">${formatWon(thisMonthRow.charged)}</div></div>
      <div class="stat-box"><div class="label">예산잔액</div><div class="value mono ${valClass(thisMonthRow.balance)}">${formatWon(thisMonthRow.balance)}</div></div>
    </div>

    <div class="card">
      <h2>충전 내역 — ${item.id}</h2>
      ${renderChargeTable(charges, sectionKey)}
      <div class="add-form">
        <div class="field"><label>날짜</label><input type="date" id="newDate_${sectionKey}" onpaste="handleDatePaste(event)" value="${todayStr()}"></div>
        <div class="field"><label>충전금액</label><input type="number" step="10000" id="newAmount_${sectionKey}" placeholder="0"></div>
        <div class="field"><label>메모</label><input type="text" id="newMemo_${sectionKey}" placeholder="선택 입력"></div>
        <button class="btn" onclick="addCharge('${sectionKey}','${keyField}','${item.id}')">+ 충전 내역 추가</button>
      </div>
    </div>

    <div class="card">
      <h2>🧮 충전 비용 계산기 — ${item.id}</h2>
      <div class="add-form" style="border-top:none;padding-top:0">
        <div class="field"><label>일평균 소진액</label>
          <input type="number" step="1000" value="${calcInput.avgDaily||''}" placeholder="0" onchange="updateCalcInput('${sectionKey}','${item.id}','avgDaily',this.value)">
        </div>
        <div class="field"><label>다음 충전 날짜</label>
          <input type="date" onpaste="handleDatePaste(event)" value="${calcInput.nextDate||''}" onchange="updateCalcInput('${sectionKey}','${item.id}','nextDate',this.value)">
        </div>
      </div>
      ${calcResult ? `
      <div class="stat-grid" style="margin-top:14px">
        <div class="stat-box"><div class="label">오늘부터 ${calcResult.days}일치 필요 금액</div><div class="value mono">${formatWon(calcResult.amount)}</div></div>
      </div>
      <div class="helptext">오늘(${todayStr()}) 00시부터 <b>${calcInput.nextDate}</b>까지 총 <b>${calcResult.days}일</b> 기준으로, 일평균 소진액 × 일수로 계산했어요.</div>
      ` : `<div class="helptext">일평균 소진액과 다음 충전 날짜를 넣으면, 오늘부터 그날까지 필요한 충전 금액이 계산돼요.</div>`}
    </div>

    <div class="card">
      <h2>월별 예산 현황 (${YEAR}년)</h2>
      <table>
        <thead><tr>
          <th>년월</th><th class="num">월예산</th><th class="num">이월잔액</th><th class="num">당월충전액</th><th class="num">예산잔액</th>
        </tr></thead>
        <tbody>
          ${rows.map(r=>`
            <tr class="${r.m===tm?'current-month':''}">
              <td>${ymLabel(r.m)}</td>
              <td class="num">
                <input class="row-input" type="number" step="10000" value="${budgetInputVal(sectionKey,item.id,r.m)}"
                  onchange="updateBudget('${sectionKey}','${item.id}',${r.m},this.value)" placeholder="0">
              </td>
              <td class="num">
                <input class="row-input" type="number" step="10000" value="${rolloverInputVal(sectionKey,item.id,r)}"
                  onchange="updateRollover('${sectionKey}','${item.id}',${r.m},this.value)" placeholder="0">
              </td>
              <td class="num mono">${formatWon(r.charged)}</td>
              <td class="num mono ${valClass(r.balance)}">${formatWon(r.balance)}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
      <div class="helptext"><b>월예산</b>은 매달 직접 입력하세요. <b>이월잔액</b>은 전월 예산잔액을 기준으로 자동 계산되지만, 셀을 클릭해 언제든 직접 수정할 수 있습니다 — 예를 들어 8월부터 이 시트를 사용하기 시작했고 7월에 이미 남은 잔액이 있다면, 8월 이월잔액 칸에 그 실제 잔액을 직접 입력하면 됩니다. (입력한 이월잔액만큼 그 달 예산잔액에서도 차감됩니다)</div>
    </div>
  `;

  const sideHtml = renderBrandList(sectionKey, list, item.id, x=>x.id);
  return `<div class="page-layout"><div class="page-main">${mainHtml}</div>${sideHtml}</div>`;
}

/* 우측 체크박스 리스트 — 클릭하면 바로 해당 계정/브랜드 화면으로 전환 */
function renderBrandList(sectionKey, list, activeId, getLabel){
  return `
    <div class="page-side">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:2px">
        <h3 style="margin:0">계정 · 브랜드</h3>
        <button class="btn-del" style="font-size:13px" onclick="addAdBrand('${sectionKey}')" title="계정/브랜드 추가">➕</button>
      </div>
      ${list.map(item=>{
        const id = typeof item==='string' ? item : item.id;
        const checked = id===activeId;
        const label = getLabel ? getLabel(item) : id;
        return `
        <div class="side-item-row">
          <label class="side-item ${checked?'active':''}" style="flex:1;margin:0">
            <input type="checkbox" ${checked?'checked':''} onclick="event.preventDefault(); pickItem('${sectionKey}','${id.replace(/'/g,"\\'")}')">
            <span class="lbl">${label}</span>
          </label>
          <button class="side-item-del" onclick="event.preventDefault(); deleteAdBrand('${sectionKey}','${id.replace(/'/g,"\\'")}')" title="삭제">✕</button>
        </div>`;

  `;
}

function budgetInputVal(sectionKey,key,m){
  const md = (state[sectionKey].months[key]||{})[m];
  return md && md.budget ? md.budget : '';
}
function rolloverInputVal(sectionKey,key,row){
  // 사용자가 직접 입력한 값이 있으면 그 값을, 없으면 자동계산된 값을 표시(수정 시 수기 입력으로 전환)
  return row.rollover ? row.rollover : '';
}
function updateBudget(sectionKey,key,m,val){
  const entry = ensureMonthEntry(sectionKey,key,m);
  entry.budget = Number(val)||0;
  saveState(); render();
}
function updateRollover(sectionKey,key,m,val){
  const entry = ensureMonthEntry(sectionKey,key,m);
  entry.rolloverManual = (val==='' ? null : Number(val));
  saveState(); render();
}
function pickItem(sectionKey,val){
  currentPick[sectionKey]=val;
  render();
}
function todayStr(){ return new Date().toISOString().slice(0,10); }

function renderChargeTable(charges, sectionKey){
  if(charges.length===0) return `<div class="empty">등록된 충전 내역이 없습니다. 아래에서 추가해보세요.</div>`;
  const sorted = sortByDateDesc(charges);
  return `
    <table>
      <thead><tr><th>날짜</th><th class="num">충전금액</th><th>메모</th><th></th></tr></thead>
      <tbody>
        ${sorted.map(c=>`
          <tr>
            <td>${c.date}</td>
            <td class="num mono">${formatWon(c.amount)}</td>
            <td>${c.memo||''}</td>
            <td><button class="btn-del" onclick="deleteCharge('${sectionKey}','${c.id}')" title="삭제">✕</button></td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

function addCharge(sectionKey, keyField, keyValue){
  const date = document.getElementById(`newDate_${sectionKey}`).value;
  const amount = Number(document.getElementById(`newAmount_${sectionKey}`).value)||0;
  const memo = document.getElementById(`newMemo_${sectionKey}`).value;
  if(!date || amount<=0){ alert('날짜와 충전금액을 입력해주세요.'); return; }
  const charge = {id:uid(), date, amount, memo};
  charge[keyField] = keyValue;
  state[sectionKey].charges.push(charge);
  saveState(); render();
}
function deleteCharge(sectionKey, id){
  state[sectionKey].charges = state[sectionKey].charges.filter(c=>c.id!==id);
  saveState(); render();
}

/* ---- 비즈월렛: 소진 내역 + 시작 잔액 (기존 데이터에 없을 수 있어 안전하게 보완) ---- */
function ensureBizwallet(){
  if(!state.bizwallet || typeof state.bizwallet!=='object') state.bizwallet = {charges:[], usages:[], initialBalance:{}};
  if(!Array.isArray(state.bizwallet.charges)) state.bizwallet.charges = [];
  if(!Array.isArray(state.bizwallet.usages)) state.bizwallet.usages = [];
  if(!state.bizwallet.initialBalance || typeof state.bizwallet.initialBalance!=='object') state.bizwallet.initialBalance = {};
  return state.bizwallet;
}
function renderUsageTable(usages, sectionKey){
  if(usages.length===0) return `<div class="empty">등록된 소진 내역이 없습니다.</div>`;
  const sorted = sortByDateDesc(usages);
  return `
    <table>
      <thead><tr><th>날짜</th><th class="num">소진금액</th><th>메모</th><th></th></tr></thead>
      <tbody>
        ${sorted.map(u=>`
          <tr>
            <td>${u.date}</td>
            <td class="num mono">${formatWon(u.amount)}</td>
            <td>${u.memo||''}</td>
            <td><button class="btn-del" onclick="deleteUsage('${sectionKey}','${u.id}')" title="삭제">✕</button></td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}
function addUsage(sectionKey, keyField, keyValue){
  const date = document.getElementById(`newUsageDate_${sectionKey}`).value;
  const amount = Number(document.getElementById(`newUsageAmount_${sectionKey}`).value)||0;
  const memo = document.getElementById(`newUsageMemo_${sectionKey}`).value;
  if(!date || amount<=0){ alert('날짜와 소진금액을 입력해주세요.'); return; }
  const usage = {id:uid(), date, amount, memo};
  usage[keyField] = keyValue;
  ensureBizwallet().usages.push(usage);
  saveState(); render();
}

/* =========================================================================
   브검 (브랜드별 현재 일정 1건을 직접 수정하는 방식)
   ========================================================================= */
function brgeomDdayInfo(endStr){
  const today = new Date(); today.setHours(0,0,0,0);
  if(!endStr) return {days:null, badge:'<span class="badge muted">종료일 미입력</span>'};
  const end = new Date(endStr); end.setHours(0,0,0,0);
  const days = Math.round((end-today)/86400000);
  let badge;
  if(days < 0) badge = `<span class="badge danger">만료 ${Math.abs(days)}일 경과</span>`;
  else if(days <= 7) badge = `<span class="badge warn">진행중 D-${days}</span>`;
  else badge = `<span class="badge ok">진행중 D-${days}</span>`;
  return {days, badge};
}
/* 예전에는 사이클을 계속 "추가"하는 방식이었는데, 브랜드당 현재 값 1세트만 직접 고쳐 쓰는 방식으로 변경.
   기존에 쌓여있던 사이클 이력(state.brgeom.cycles)은 지우지 않고 그대로 두고(데이터 보존),
   그중 가장 최근 것을 꺼내와 새 구조(state.brgeom.current)의 초기값으로 딱 한 번만 옮겨 쓴다. */
function ensureBrgeomCurrentAll(){
  if(!state.brgeom.current || typeof state.brgeom.current!=='object') state.brgeom.current = {};
  brgeomBrandsList().forEach(item=>{
    if(!state.brgeom.current[item.id]){
      const brandCycles = (state.brgeom.cycles||[]).filter(c=>c.brand===item.id)
        .slice()
        .sort((a,b)=> (b.pcStart||b.start||'').localeCompare(a.pcStart||a.start||''));
      const latest = brandCycles[0];
      state.brgeom.current[item.id] = latest ? {
        pcStart: latest.pcStart || latest.start || '',
        pcEnd: latest.pcEnd || latest.end || '',
        pcAmount: latest.pcAmount!=null ? latest.pcAmount : (latest.amount || ''),
        mobileStart: latest.mobileStart || '',
        mobileEnd: latest.mobileEnd || '',
        mobileAmount: latest.mobileAmount || '',
      } : {pcStart:'', pcEnd:'', pcAmount:'', mobileStart:'', mobileEnd:'', mobileAmount:''};
    }
  });
  return state.brgeom.current;
}
function updateBrgeomCurrentField(brand, field, value){
  const current = ensureBrgeomCurrentAll();
  if(!current[brand]) current[brand] = {pcStart:'', pcEnd:'', pcAmount:'', mobileStart:'', mobileEnd:'', mobileAmount:''};
  if(field==='pcAmount' || field==='mobileAmount') value = sanitizePromoNumber(value);
  current[brand][field] = value;
  saveState(); render();
}

  const bw = ensureBizwallet();

  const totalUsed = bw.usages.filter(u=>u.brand===brand).reduce((s,u)=>s+Number(u.amount||0),0);
  const initial = Number(bw.initialBalance[brand]||0);
  return initial + totalCharged - totalUsed;

const AD_TYPE_OPTIONS = [
  {key:'shogeom',   label:'쇼핑 검색 광고 (쇼검)',       chargeSection:'shogeom',   keyField:'account'},
  {key:'gfa',       label:'성과형 디스플레이 광고 (GFA)', chargeSection:'gfa',       keyField:'brand'},
  {key:'seosea',    label:'스스광고',                    chargeSection:'seosea',    keyField:'brand'},
  {key:'brgeom',    label:'브검',                        chargeSection:'brgeom',    keyField:'brand', isCycle:true},
  {key:'bizwallet', label:'비즈월렛',                    chargeSection:'bizwallet', keyField:'brand'},
];
const DRAFT_HEAD_COLOR = {shogeom:'#DCEFE1', gfa:'#FBE7CE', seosea:'#DCEAF0', brgeom:'#FBEBD2', bizwallet:'#FBE1EC'};

function getAdTypeConfig(key){
  return AD_TYPE_OPTIONS.find(a=>a.key===key) || AD_TYPE_OPTIONS[0];
}

function copyToClipboard(text, btnEl){
  function fallback(){
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.left = '-9999px';
    document.body.appendChild(ta); ta.focus(); ta.select();
    try{ document.execCommand('copy'); }catch(e){}
    document.body.removeChild(ta);
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).catch(fallback);
  } else {
    fallback();
  }
  if(btnEl){
    const orig = btnEl.textContent;
    btnEl.textContent = '복사됨 ✓';
    setTimeout(()=>{ btnEl.textContent = orig; }, 1400);
  }
}

/* 오늘 날짜 기준으로 해당 항목의 충전 내역(들)을 합산해서 반환. 없으면 null */
function getTodayChargeSum(entry){
  const cfg = getAdTypeConfig(entry.adType);
  const today = todayStr();
  if(cfg.isCycle){
    const c = ensureBrgeomCurrentAll()[entry.accountKey];
    let amount = 0, count = 0;
    if(c){
      if(c.pcStart && c.pcStart===today){ amount += Number(c.pcAmount||0); count++; }
      if(c.mobileStart && c.mobileStart===today){ amount += Number(c.mobileAmount||0); count++; }
    }
    if(count===0) return null;
    return {amount, count};
  }
  const matches = state[cfg.chargeSection].charges.filter(c=>c[cfg.keyField]===entry.accountKey && c.date===today);
  if(matches.length===0) return null;
  const amount = matches.reduce((s,c)=>s+Number(c.amount||0),0);
  return {amount, count:matches.length};
}

  const t = ensureDraftTemplates();
  t[field] = DRAFT_TEMPLATE_DEFAULTS[field];
  saveState(); render();
}
function todayYYMMDD(){
  const d = new Date();
  return String(d.getFullYear()).slice(-2) + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
}
/* 문구 안의 {날짜} 자리에 오늘 날짜(YYMMDD)를 넣어서 실제로 복사될 최종 텍스트를 만든다 */
function resolveDraftTemplate(text){
  return String(text||'').split('{날짜}').join(todayYYMMDD());
}
function copyDraftTemplate(field, btnEl){
  const t = ensureDraftTemplates();
  copyToClipboard(resolveDraftTemplate(t[field]), btnEl);
}

function renderDraft(){
  const today = todayStr();
  const entries = ensureDraftEntries();
  const ready = entries.map(e=>({entry:e, today:getTodayChargeSum(e)})).filter(x=>x.today);

  return `
    <div class="page-header">
      <div>
        <h1>충전기안</h1>
        <div class="sub">아래에 등록해둔 계정/브랜드 중 <b>오늘(${today}) 충전 내역이 있는 항목만</b> 자동으로 표시되어 바로 복사할 수 있습니다</div>
      </div>
      ${ready.length>0 ? `<button class="copy-btn-main" onclick="copyAllToday(this)">오늘 항목 전체 복사 (${ready.length}건)</button>` : ''}
    </div>

    <div class="card">
      <h2>📋 바로 복사해서 쓰는 문구</h2>
      <div class="helptext" style="margin-top:0">문구는 직접 자유롭게 수정할 수 있어요. 제목의 <span class="mono">{날짜}</span> 자리는 복사할 때 자동으로 오늘 날짜(예: 260730)로 바뀌어요.</div>
      ${['title','body','slack'].map(field=>{
        const t = ensureDraftTemplates();
        const labelMap = {title:'제목', body:'본문', slack:'슬랙'};
        const resolved = resolveDraftTemplate(t[field]);
        const isMultiline = field!=='title';
        return `
        <div class="draft-template-block">
          <div class="dt-head">
            <b>${labelMap[field]}</b>
            <div style="display:flex;gap:6px">
              <button class="copy-btn" onclick="resetDraftTemplate('${field}')" title="기본 문구로 되돌리기" style="background:none;border:none;color:var(--text-secondary);text-decoration:underline;padding:5px 4px">기본값</button>
              <button class="copy-btn" onclick="copyDraftTemplate('${field}', this)">복사</button>
            </div>
          </div>
          ${isMultiline
            ? `<textarea class="sheet-input" style="text-align:left;width:100%;min-height:64px;resize:vertical;padding:8px 10px" onchange="updateDraftTemplate('${field}',this.value)">${t[field]}</textarea>`
            : `<input class="sheet-input" style="text-align:left;width:100%;padding:8px 10px" value="${t[field]}" onchange="updateDraftTemplate('${field}',this.value)">`
          }
          ${field==='title' ? `<div class="dt-preview">미리보기: ${resolved}</div>` : ''}
        </div>`;
      }).join('')}
    </div>

    <div class="card">
      <h2>오늘 충전 내역 — 바로 복사</h2>
      ${ready.length===0
        ? `<div class="empty">오늘 날짜로 등록된 충전 내역이 아직 없습니다.<br>쇼검·GFA·스스광고·브검·비즈월렛 탭에서 오늘 날짜로 충전 내역을 추가하면 여기에 자동으로 나타납니다.</div>`
        : `<div class="draft-grid">
            ${ready.map(({entry,today:t})=>{
              const cfg = getAdTypeConfig(entry.adType);
              return `
              <div class="draft-card">
                <div class="dc-head" style="background:${DRAFT_HEAD_COLOR[entry.adType]||'#EEF0F3'}">
                  <span>${cfg.label} · ${entry.accountKey}</span>
                  <button class="copy-btn" onclick="copyEntryCard('${entry.id}', this)">복사</button>
                </div>
                <div class="draft-row"><div class="lbl">사업자</div><div class="val">${entry.biz||''}</div></div>
                <div class="draft-row"><div class="lbl">스토어</div><div class="val">${entry.store||''}</div></div>
                <div class="draft-row"><div class="lbl">계좌</div><div class="val">${entry.bank||'(계좌 미입력)'}</div></div>
                <div class="draft-row"><div class="lbl">금액</div><div class="val amount">${formatWon(t.amount)} (VAT 포함)${t.count>1?`<span class="dt">(오늘 ${t.count}건 합계)</span>`:''}</div></div>
              </div>`;
            }).join('')}
          </div>`
      }
    </div>

    <div class="card">
      <h2>계정 · 브랜드 등록 관리</h2>
      <div class="helptext">광고 종류 / 계정(브랜드) / 사업자 / 스토어 / 계좌정보를 한 번 등록해두면, 해당 계정·브랜드로 오늘 충전 내역을 추가할 때마다 금액이 자동으로 매칭됩니다. <b>계정(브랜드)명은 각 광고 탭에서 충전 내역을 등록할 때 쓰는 이름과 정확히 같아야</b> 합니다. 브랜드가 추가/삭제될 때는 아래에서 직접 관리하세요.</div>
      ${entries.length===0 ? `<div class="empty">등록된 계정·브랜드가 없습니다. 아래에서 추가해주세요.</div>` : `
      <table>
        <thead><tr><th>광고 종류</th><th>계정(브랜드)</th><th>사업자</th><th>스토어</th><th>계좌정보</th><th></th></tr></thead>
        <tbody>
          ${entries.map(e=>`
            <tr>
              <td style="min-width:170px">
                <select class="row-input" style="text-align:left" onchange="updateDraftEntryField('${e.id}','adType',this.value)">
                  ${AD_TYPE_OPTIONS.map(o=>`<option value="${o.key}" ${o.key===e.adType?'selected':''}>${o.label}</option>`).join('')}
                </select>
              </td>
              <td><input class="row-input" style="text-align:left" value="${e.accountKey}" onchange="updateDraftEntryField('${e.id}','accountKey',this.value)"></td>
              <td><input class="row-input" style="text-align:left" value="${e.biz||''}" onchange="updateDraftEntryField('${e.id}','biz',this.value)"></td>
              <td><input class="row-input" style="text-align:left" value="${e.store||''}" onchange="updateDraftEntryField('${e.id}','store',this.value)"></td>
              <td><input class="row-input" style="text-align:left" placeholder="은행명 계좌번호" value="${e.bank||''}" onchange="updateDraftEntryField('${e.id}','bank',this.value)"></td>
              <td><button class="btn-del" onclick="deleteDraftEntry('${e.id}')" title="삭제">✕</button></td>
            </tr>
          `).join('')}
        </tbody>
      </table>`}
      <div class="add-form">
        <div class="field"><label>광고 종류</label>
          <select id="draftAdType">${AD_TYPE_OPTIONS.map(o=>`<option value="${o.key}">${o.label}</option>`).join('')}</select>
        </div>
        <div class="field"><label>계정(브랜드)</label><input type="text" id="draftAccountKey" placeholder="예: best3327"></div>
        <div class="field"><label>사업자</label><input type="text" id="draftBiz" placeholder="예: 서정커머스"></div>
        <div class="field"><label>스토어</label><input type="text" id="draftStore" placeholder="예: VSL3, 갸스비"></div>
        <div class="field"><label>계좌정보</label><input type="text" id="draftBank" placeholder="예: 기업은행 48101707597258"></div>
        <button class="btn" onclick="addDraftEntry()">+ 등록</button>
      </div>
    </div>
  `;
}

/* =========================================================================
   초기화
   ========================================================================= */
try{
  render();
  updateSyncBadge();
  if(getAccessCode()){
    // 새로고침 직전에 저장이 서버까지 못 갔을 수 있으니, 서버에서 받아오기 전에
    // 지금 이 브라우저에 있는 내용을 한 번 먼저 밀어넣어 둔다(그래야 그다음 받아올 때 안전하게 합쳐짐).
    pushToServer().catch(()=>{}).finally(()=>{ loadFromServer(false); });
  }
  // 60초마다 서버 데이터를 자동으로 확인 (입력 중일 때는 건너뜀)
  setInterval(()=>{
    const active = document.activeElement;
    const isEditing = active && (active.tagName==='INPUT' || active.tagName==='SELECT' || active.tagName==='TEXTAREA');
    if(!isEditing) loadFromServer(false);
  }, 60000);
}catch(e){
  console.error('초기 렌더링 실패:', e);
  document.getElementById('main').innerHTML = `
    <div class="card" style="border-color:#F3B3B3;margin:24px">
      <h2 style="color:var(--negative)">⚠ 앱을 불러오는 중 오류가 발생했습니다</h2>
      <pre style="background:#FAFAFB;border:1px solid var(--border);border-radius:8px;padding:12px;font-size:12px;white-space:pre-wrap;color:var(--negative)">${(e && e.message ? e.message : String(e)).replace(/</g,'&lt;')}</pre>
      <button class="btn ghost" style="margin-top:10px" onclick="if(confirm('저장된 모든 데이터를 초기화할까요? 이 작업은 되돌릴 수 없습니다.')){ localStorage.removeItem('naver_ad_budget_v1'); location.reload(); }">데이터 초기화 후 새로고침</button>
    </div>`;
}
</script>
</body>
</html>
